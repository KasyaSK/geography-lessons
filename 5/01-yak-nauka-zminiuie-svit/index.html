<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="author" content="Скринченко К.А. — Василівський ліцей «Сузір’я»">
  <meta name="description" content="Інтерактивний урок 1 курсу «Пізнаємо природу», 5 клас: Як наука змінює світ.">
  <title>5 клас • Урок 1 • Як наука змінює світ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lessonChrome"></div>
  <main id="lessonMain"></main>
  <div id="lessonFooter"></div>
  <noscript><div style="padding:2rem;font-family:system-ui">Для інтерактивного уроку потрібно увімкнути JavaScript.</div></noscript>
  <script>
    Promise.all([
      fetch('parts/chrome.html').then(r=>r.text()),
      fetch('parts/part1.html').then(r=>r.text()),
      fetch('parts/part2.html').then(r=>r.text()),
      fetch('parts/part3.html').then(r=>r.text()),
      fetch('parts/footer.html').then(r=>r.text())
    ]).then(([chrome,p1,p2,p3,footer])=>{
      document.getElementById('lessonChrome').outerHTML=chrome;
      document.getElementById('lessonMain').innerHTML=p1+p2+p3;
      document.getElementById('lessonFooter').outerHTML=footer;
      const s=document.createElement('script'); s.src='script.js'; document.body.appendChild(s);
    }).catch(err=>{
      document.getElementById('lessonMain').innerHTML='<section class="wrap" style="padding:3rem"><h1>Не вдалося завантажити матеріали уроку</h1><p>Оновіть сторінку.</p></section>';
      console.error(err);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Скринченко К.А. — Василівський ліцей «Сузір’я»">
<title>5 клас • Урок 3 • Як шукати відповіді на запитання</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#f6fbfd;color:#17364a;display:grid;place-items:center;min-height:100vh}.box{max-width:720px;margin:24px;padding:28px;border-radius:24px;background:#fff;border:1px solid #d9e9f1;box-shadow:0 18px 46px rgba(26,71,96,.12)}.muted{color:#60798a}</style>
</head>
<body><div class="box" id="loader"><h1>Завантажуємо урок…</h1><p class="muted">Розгортаємо повну інтерактивну сторінку.</p></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Браузер не підтримує розпакування gzip. Оновіть браузер.');
    const b64=(await (await fetch('payload.b64',{cache:'no-store'})).text()).trim();
    const raw=atob(b64);
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const textbookTag='<scr'+'ipt src="https://kasyask.github.io/geography-lessons/assets/textbook-access.js?v=20260911" data-textbook-access="global" data-textbook-rehydrate="1"></scr'+'ipt>';
    const hydrated=/<\/body\s*>/i.test(html)?html.replace(/<\/body\s*>/i,textbookTag+'</body>'):html+textbookTag;
    document.open();document.write(hydrated);document.close();
  }catch(e){document.getElementById('loader').innerHTML='<h1>Не вдалося відкрити урок</h1><p>'+String(e.message||e)+'</p>'}
})();
</script><script src="https://kasyask.github.io/geography-lessons/assets/textbook-access.js?v=20260911" data-textbook-access="global"></script>
</body></html>

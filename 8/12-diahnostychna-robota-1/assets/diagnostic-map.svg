<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Діагностична картографічна схема</title><desc id="d">Схема для завдань з годинних поясів, масштабу, горизонталей і прямокутної сітки</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#fff8df"/></linearGradient><pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#7fa7bd" stroke-width="1.2" opacity=".65"/></pattern></defs><rect width="900" height="560" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" fill="#17364d"><text x="40" y="52" font-size="28" font-weight="800">Діагностична схема: карта читається шарами</text><text x="40" y="82" font-size="16" fill="#60798c">Використовуйте підписи, сітку, горизонталі й масштаб як докази.</text></g><g transform="translate(40 120)"><rect width="500" height="390" rx="20" fill="#fff" stroke="#bdd6e3" stroke-width="2"/><rect x="25" y="25" width="450" height="315" fill="url(#grid)" stroke="#91b3c4"/><g fill="none" stroke="#b56d43" stroke-width="3" opacity=".9"><ellipse cx="260" cy="185" rx="155" ry="105"/><ellipse cx="260" cy="185" rx="125" ry="82"/><ellipse cx="260" cy="185" rx="95" ry="60"/><ellipse cx="260" cy="185" rx="65" ry="39"/></g><path d="M35 285 C120 250 180 300 245 260 S370 210 460 245" fill="none" stroke="#2f89c8" stroke-width="8"/><path d="M40 330 C125 270 170 245 235 230 S345 190 455 95" fill="none" stroke="#555" stroke-width="6" stroke-dasharray="12 8"/><rect x="300" y="214" width="34" height="16" rx="4" fill="#fff" stroke="#16364f" stroke-width="3"/><circle cx="260" cy="185" r="7" fill="#17364d"/><text x="272" y="180" font-family="Inter,Arial" font-size="16" fill="#17364d">248 м</text><circle cx="100" cy="310" r="7" fill="#17364d"/><text x="112" y="306" font-family="Inter,Arial" font-size="16" fill="#17364d">156 м</text><text x="34" y="370" font-family="Inter,Arial" font-size="15" fill="#60798c">1 клітинка = 1 км • переріз горизонталей = 20 м</text></g><g transform="translate(575 120)" font-family="Inter,Arial,sans-serif"><rect width="285" height="170" rx="20" fill="#fff" stroke="#bdd6e3" stroke-width="2"/><text x="20" y="34" font-size="18" font-weight="800" fill="#17364d">Годинні пояси</text><g transform="translate(20 55)"><rect width="70" height="60" fill="#dff3ff"/><rect x="70" width="70" height="60" fill="#cdeee4"/><rect x="140" width="70" height="60" fill="#fff0c7"/><text x="14" y="36" font-size="18" font-weight="700">UTC+1</text><text x="84" y="36" font-size="18" font-weight="700">UTC+2</text><text x="154" y="36" font-size="18" font-weight="700">UTC+3</text></g><text x="20" y="140" font-size="14" fill="#60798c">15° довготи ≈ 1 година</text></g><g transform="translate(575 315)" font-family="Inter,Arial,sans-serif"><rect width="285" height="195" rx="20" fill="#fff" stroke="#bdd6e3" stroke-width="2"/><text x="20" y="34" font-size="18" font-weight="800" fill="#17364d">Картографічний контроль</text><text x="20" y="68" font-size="15" fill="#17364d">• проекція впливає на спотворення;</text><text x="20" y="98" font-size="15" fill="#17364d">• масштаб визначає деталізацію;</text><text x="20" y="128" font-size="15" fill="#17364d">• координати працюють лише</text><text x="35" y="150" font-size="15" fill="#17364d">у відомій системі координат;</text><text x="20" y="178" font-size="15" fill="#17364d">• карта — доказ, а не декор.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Польовий протокол біорізноманіття</title><desc id="d">Схема: маршрут, спостереження, оселища, антропогенний тиск, рішення, висновок</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#edf9df"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient><style>.h{font:700 42px system-ui,sans-serif;fill:#1f4738}.s{font:600 23px system-ui,sans-serif;fill:#31594a}.q{font:600 18px system-ui,sans-serif;fill:#61776d}.b{fill:white;stroke:#cee1d4;stroke-width:3}.n{fill:#2f7d59}.num{font:900 27px system-ui,sans-serif;fill:white}.l{stroke:#7ca08d;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7ca08d"/></marker></defs><rect width="1200" height="650" rx="38" fill="url(#bg)"/><text x="55" y="75" class="h">Екскурсія: як зібрати докази про екосистему?</text><text x="55" y="112" class="q">Однаковий метод у кількох точках важливіший за довгий список випадкових знахідок</text><g transform="translate(45 175)"><g><rect class="b" width="160" height="210" rx="26"/><circle class="n" cx="80" cy="48" r="28"/><text class="num" x="72" y="58">1</text><text class="s" x="26" y="110">Маршрут</text><text class="q" x="22" y="150">3 точки</text><text class="q" x="22" y="178">однаковий час</text></g><path class="l" d="M168 105 H208"/><g transform="translate(215)"><rect class="b" width="160" height="210" rx="26"/><circle class="n" cx="80" cy="48" r="28"/><text class="num" x="72" y="58">2</text><text class="s" x="18" y="110">Спостереження</text><text class="q" x="22" y="150">види / групи</text><text class="q" x="22" y="178">сліди / голоси</text></g><path class="l" d="M383 105 H423"/><g transform="translate(430)"><rect class="b" width="160" height="210" rx="26"/><circle class="n" cx="80" cy="48" r="28"/><text class="num" x="72" y="58">3</text><text class="s" x="28" y="110">Оселища</text><text class="q" x="22" y="150">яруси</text><text class="q" x="22" y="178">мікрооселища</text></g><path class="l" d="M598 105 H638"/><g transform="translate(645)"><rect class="b" width="160" height="210" rx="26"/><circle class="n" cx="80" cy="48" r="28"/><text class="num" x="72" y="58">4</text><text class="s" x="29" y="110">Тиск</text><text class="q" x="22" y="150">сміття</text><text class="q" x="22" y="178">витоптування</text></g><path class="l" d="M813 105 H853"/><g transform="translate(860)"><rect class="b" width="160" height="210" rx="26"/><circle class="n" cx="80" cy="48" r="28"/><text class="num" x="72" y="58">5</text><text class="s" x="27" y="110">Рішення</text><text class="q" x="22" y="150">механізм</text><text class="q" x="22" y="178">міра успіху</text></g><path class="l" d="M1028 105 H1060"/><g transform="translate(1068)"><rect class="b" width="90" height="210" rx="26"/><circle class="n" cx="45" cy="48" r="28"/><text class="num" x="37" y="58">6</text><text class="s" x="19" y="110">CER</text><text class="q" x="14" y="150">доказ</text><text class="q" x="14" y="178">межі</text></g></g><rect x="70" y="470" width="1060" height="110" rx="26" fill="#ffffffcc" stroke="#d5e3d8" stroke-width="3"/><text x="105" y="520" class="s">Сильний висновок = спостереження + карта/відкриті дані + причинний механізм + чесна межа впевненості</text><text x="105" y="558" class="q">Не визначили вид точно? Запишіть групу. Не маєте доступу до польового маршруту? Виконайте віртуальний варіант.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Спрощена модель висотної поясності Українських Карпат</title><desc id="d">Схема зміни рослинності з висотою від передгір'їв до альпійського поясу</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff3ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#sky)"/><path d="M70 650 L250 520 L390 430 L525 315 L650 205 L770 315 L875 405 L1010 515 L1130 650 Z" fill="#9ccf9e"/><path d="M345 650 L470 520 L575 385 L650 205 L730 390 L850 525 L960 650 Z" fill="#6aa77d"/><path d="M500 650 L565 535 L610 430 L650 205 L690 430 L740 535 L805 650 Z" fill="#407a59"/><path d="M608 430 L650 205 L692 430 Z" fill="#c9d9d2"/><path d="M626 315 L650 205 L676 315 Z" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#173d2d"><text x="55" y="70" font-size="40" font-weight="800">Українські Карпати: висота змінює природний комплекс</text><text x="55" y="110" font-size="22">Межі поясів умовні: вони залежать від експозиції схилу, зволоження та місцевих умов.</text><g font-size="25" font-weight="700"><text x="78" y="610">≈500–700 м • передгір'я, широколисті ліси</text><text x="90" y="505">≈700–1200 м • буково-ялицеві ліси</text><text x="95" y="400">≈1200–1500 м • хвойні ліси</text><text x="760" y="315">≈1500–1800 м • субальпійський пояс</text><text x="760" y="225">понад ≈1800 м • альпійські луки</text></g><g stroke="#244d3a" stroke-width="3" stroke-dasharray="10 8"><line x1="60" y1="570" x2="1140" y2="570"/><line x1="60" y1="475" x2="1140" y2="475"/><line x1="60" y1="370" x2="1140" y2="370"/><line x1="60" y1="285" x2="1140" y2="285"/></g><text x="930" y="675" font-size="18">Навчальна схема • не топографічний профіль</text></g></svg>
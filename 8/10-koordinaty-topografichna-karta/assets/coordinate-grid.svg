<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Координатна лабораторія</title><desc id="d">Навчальна схема з кілометровою сіткою, точками A, B, C та підписами X і Y.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#fff7dd"/></linearGradient></defs><rect width="900" height="560" rx="30" fill="url(#bg)"/><g stroke="#8fb7c9" stroke-width="2"><path d="M120 70v410M240 70v410M360 70v410M480 70v410M600 70v410M720 70v410M840 70v410"/><path d="M70 120h770M70 220h770M70 320h770M70 420h770"/></g><g font-family="system-ui,sans-serif" font-size="22" fill="#24485e" font-weight="700"><text x="95" y="105">4312</text><text x="215" y="105">4313</text><text x="335" y="105">4314</text><text x="455" y="105">4315</text><text x="575" y="105">4316</text><text x="695" y="105">4317</text><text x="815" y="105">4318</text><text x="20" y="130">5524</text><text x="20" y="230">5523</text><text x="20" y="330">5522</text><text x="20" y="430">5521</text></g><g fill="#0c7c92" stroke="#fff" stroke-width="5"><circle cx="315" cy="285" r="14"/><circle cx="665" cy="165" r="14"/><circle cx="520" cy="390" r="14"/></g><g font-family="system-ui,sans-serif" font-size="26" fill="#153a50" font-weight="900"><text x="332" y="278">A</text><text x="682" y="158">B</text><text x="537" y="383">C</text></g><g font-family="system-ui,sans-serif" font-size="18" fill="#486d7e"><text x="95" y="525">Y → східні координати за підписами вертикальних ліній</text><text transform="translate(885 450) rotate(-90)">X → північні координати за підписами горизонтальних ліній</text></g><rect x="585" y="445" width="255" height="70" rx="18" fill="#fff" stroke="#b7d2dd"/><text x="607" y="474" font-family="system-ui,sans-serif" font-size="17" fill="#24485e" font-weight="700">Правило читання:</text><text x="607" y="500" font-family="system-ui,sans-serif" font-size="16" fill="#486d7e">спочатку лінія → потім частка км</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff9df"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6ec7e8"/><stop offset="1" stop-color="#216b9b"/></linearGradient></defs><rect width="1200" height="700" fill="url(#sky)"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17364c">Діагностична панель: природні комплекси України</text><text x="60" y="94" font-family="Arial,sans-serif" font-size="18" fill="#516f82">Використовуйте схему як джерело даних, а не як готову відповідь.</text><path d="M0 390 Q170 320 330 355 T620 320 T900 350 T1200 300 L1200 700 L0 700Z" fill="#c7d999"/><path d="M700 390 L790 180 L850 300 L930 145 L1035 390Z" fill="#8aa7a6"/><path d="M752 285 L790 180 L815 244Z" fill="#eef7fb"/><path d="M885 220 L930 145 L970 255Z" fill="#eef7fb"/><path d="M85 500 C190 420 290 420 400 500 C500 575 595 540 680 470" fill="none" stroke="#3f9bd0" stroke-width="18" stroke-linecap="round"/><rect x="0" y="560" width="1200" height="140" fill="url(#sea)"/><path d="M70 392 Q120 335 175 390 Q225 332 280 392Z" fill="#3f7e4f"/><path d="M300 410 Q350 350 405 410 Q455 350 510 410Z" fill="#5b984f"/><rect x="505" y="410" width="170" height="120" fill="#d9bd68" opacity=".8"/><path d="M505 435 H675 M505 465 H675 M505 495 H675" stroke="#b28b39" stroke-width="4" opacity=".7"/><g font-family="Arial,sans-serif" fill="#17364c"><rect x="55" y="120" rx="20" width="300" height="150" fill="#fff" stroke="#c9dfe9"/><text x="80" y="158" font-size="22" font-weight="700">Води</text><text x="80" y="193" font-size="18">Річка → басейн → море</text><text x="80" y="225" font-size="18">Заплава = природний буфер</text><text x="80" y="255" font-size="18">Ґрунтові води залежать від опадів</text><rect x="395" y="120" rx="20" width="310" height="150" fill="#fff" stroke="#c9dfe9"/><text x="420" y="158" font-size="22" font-weight="700">Ґрунти й зони</text><text x="420" y="193" font-size="18">Полісся: більше вологи</text><text x="420" y="225" font-size="18">Лісостеп: мозаїка ліс + поле</text><text x="420" y="255" font-size="18">Степ: дефіцит вологи, чорноземи</text><rect x="745" y="120" rx="20" width="390" height="150" fill="#fff" stroke="#c9dfe9"/><text x="770" y="158" font-size="22" font-weight="700">Гори й моря</text><text x="770" y="193" font-size="18">Висота ↑ → температура ↓</text><text x="770" y="225" font-size="18">Чорне море: глибше, солоніше</text><text x="770" y="255" font-size="18">Азовське: мілкіше, менш солоне</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#17364c" font-weight="700"><text x="110" y="445">ліс</text><text x="355" y="455">лісостеп</text><text x="555" y="455">степ / рілля</text><text x="840" y="420">висотна поясність</text><text x="480" y="610" fill="#fff">морські екосистеми</text></g></svg>
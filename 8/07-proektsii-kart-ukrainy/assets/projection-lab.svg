<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Лабораторія картографічних проекцій</title><desc id="d">Порівняння циліндричної, конічної та рівновеликої проекцій і типових спотворень.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fff4d8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324a">Проекція — це вибір компромісу</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="20" fill="#567386">Сфера не розгортається на площину без спотворень.</text><g filter="url(#s)"><rect x="55" y="145" width="335" height="420" rx="25" fill="#fff"/><rect x="432" y="145" width="335" height="420" rx="25" fill="#fff"/><rect x="809" y="145" width="335" height="420" rx="25" fill="#fff"/></g><text x="82" y="188" font-family="Arial" font-size="24" font-weight="700" fill="#0b78aa">Циліндрична</text><text x="459" y="188" font-family="Arial" font-size="24" font-weight="700" fill="#0b866b">Конічна</text><text x="836" y="188" font-family="Arial" font-size="24" font-weight="700" fill="#9a6411">Рівновелика</text><g stroke="#90b8cc" fill="none" stroke-width="2"><rect x="90" y="220" width="265" height="180" rx="4"/><path d="M90 265h265M90 310h265M90 355h265M143 220v180M196 220v180M249 220v180M302 220v180"/></g><path d="M181 292c26-22 61-22 84-6 18 12 31 37 19 55-9 15-32 16-49 11-19-6-40-3-53-17-12-13-14-31-1-43z" fill="#ffd166" stroke="#a87514" stroke-width="3"/><text x="90" y="438" font-family="Arial" font-size="18" fill="#17324a">Меридіани й паралелі — прямі.</text><text x="90" y="468" font-family="Arial" font-size="18" fill="#17324a">Спотворення площ зростає</text><text x="90" y="495" font-family="Arial" font-size="18" fill="#17324a">до високих широт.</text><g stroke="#83bca9" fill="none" stroke-width="2"><path d="M480 225 Q600 180 720 225M490 270Q600 230 710 270M500 315Q600 280 700 315M510 360Q600 330 690 360"/><path d="M515 205Q565 300 535 395M560 195Q590 300 575 400M605 190v215M650 195Q620 300 635 400M695 205Q645 300 675 395"/></g><path d="M565 285c27-18 62-14 82 5 16 15 23 40 7 55-13 12-34 9-49 3-18-7-38-6-48-21-9-14-6-31 8-42z" fill="#7bdcb5" stroke="#14765b" stroke-width="3"/><text x="467" y="438" font-family="Arial" font-size="18" fill="#17324a">Добра для територій середніх широт,</text><text x="467" y="468" font-family="Arial" font-size="18" fill="#17324a">витягнутих із заходу на схід.</text><text x="467" y="495" font-family="Arial" font-size="18" fill="#17324a">Спотворення можна зменшити</text><text x="467" y="522" font-family="Arial" font-size="18" fill="#17324a">біля стандартних паралелей.</text><path d="M858 250c45-48 151-56 230-9 42 25 45 91 8 123-50 44-174 45-225 7-44-33-50-82-13-121z" fill="#eff6f7" stroke="#9db9c5" stroke-width="2"/><g stroke="#9db9c5" fill="none" stroke-width="2"><path d="M853 290c70 20 166 20 244 0M848 330c76 22 174 22 254 0"/><path d="M900 238c-15 55-10 99 8 145M950 225c-7 62-3 114 5 166M1000 223c3 62 2 116 0 170M1050 230c10 55 7 104-7 153"/></g><path d="M955 295c25-16 56-11 73 7 13 14 16 34 3 47-12 11-30 7-43 2-15-6-31-4-40-17-8-12-5-27 7-39z" fill="#ffd98d" stroke="#a87514" stroke-width="3"/><text x="844" y="438" font-family="Arial" font-size="18" fill="#17324a">Площі зберігаються коректно,</text><text x="844" y="468" font-family="Arial" font-size="18" fill="#17324a">але форма й кути можуть</text><text x="844" y="495" font-family="Arial" font-size="18" fill="#17324a">спотворюватися.</text><text x="60" y="620" font-family="Arial" font-size="22" font-weight="700" fill="#17324a">Питання не «яка проекція найкраща?», а «яка найкраща для конкретної задачі?»</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Як формується річкова мережа</title><desc id="d">Навчальна схема: опади і сніготанення утворюють стік, притоки формують річкову систему, вододіли розмежовують басейни.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff7d9"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38a9df"/><stop offset="1" stop-color="#126fa8"/></linearGradient></defs><rect width="1200" height="620" rx="34" fill="url(#sky)"/><path d="M40 390 L210 210 L350 345 L515 145 L680 330 L855 190 L1160 390 L1160 560 L40 560Z" fill="#d8e6c2" stroke="#8bb06c" stroke-width="3"/><path d="M515 145 L545 199 L584 245" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".95"/><path d="M527 218 C540 260 552 286 568 312 C598 358 632 385 670 407 C720 437 780 459 842 485 C900 509 962 525 1050 548" fill="none" stroke="url(#water)" stroke-width="24" stroke-linecap="round"/><path d="M248 292 C330 312 420 345 568 385" fill="none" stroke="#4db8e6" stroke-width="13" stroke-linecap="round"/><path d="M855 252 C820 310 770 350 686 420" fill="none" stroke="#4db8e6" stroke-width="13" stroke-linecap="round"/><path d="M420 278 C450 315 505 350 595 400" fill="none" stroke="#77c9eb" stroke-width="8" stroke-linecap="round"/><path d="M945 330 C890 365 845 412 786 463" fill="none" stroke="#77c9eb" stroke-width="8" stroke-linecap="round"/><path d="M340 345 C435 260 516 226 610 242 C705 258 798 243 855 190" fill="none" stroke="#c48643" stroke-width="5" stroke-dasharray="14 12"/><g font-family="system-ui,sans-serif" fill="#163b4c"><text x="62" y="82" font-size="34" font-weight="800">Річкова мережа — не «синя павутина навмання»</text><text x="62" y="120" font-size="22">Вона виникає там, де вода збирається зі схилів у русла й притоки.</text><text x="785" y="172" font-size="23" font-weight="800">вододіл</text><text x="790" y="202" font-size="18">межа сусідніх басейнів</text><text x="604" y="340" font-size="22" font-weight="800">витік</text><text x="300" y="320" font-size="22" font-weight="800">притока</text><text x="705" y="445" font-size="22" font-weight="800">головна річка</text><text x="980" y="515" font-size="22" font-weight="800">гирло →</text><text x="62" y="586" font-size="18">Навчальна причинна схема, не географічна карта. Для розміщення річок використовуйте реальну карту в уроці.</text></g><g fill="#fff" stroke="#126fa8" stroke-width="3"><circle cx="527" cy="218" r="9"/><circle cx="568" cy="385" r="9"/><circle cx="686" cy="420" r="9"/><circle cx="1050" cy="548" r="9"/></g></svg>
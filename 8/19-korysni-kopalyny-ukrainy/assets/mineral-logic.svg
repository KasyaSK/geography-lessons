<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Навчальна схема: тектонічна основа і корисні копалини України</title><desc id="d">Узагальнена схема для пошуку закономірностей, не точна карта родовищ.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="60" y="70" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#17384a">Від геологічної будови — до ресурсів</text><text x="60" y="107" font-family="system-ui,sans-serif" font-size="18" fill="#607887">Навчальна модель для формулювання гіпотез. Точні родовища перевіряйте на офіційній карті.</text><g filter="url(#sh)"><rect x="60" y="150" width="300" height="430" rx="28" fill="#fff" stroke="#d4e6ee"/><rect x="450" y="150" width="300" height="430" rx="28" fill="#fff" stroke="#d4e6ee"/><rect x="840" y="150" width="300" height="430" rx="28" fill="#fff" stroke="#d4e6ee"/></g><circle cx="210" cy="220" r="42" fill="#e86b5a"/><text x="210" y="230" text-anchor="middle" font-size="34" font-family="system-ui" fill="#fff">⚒</text><text x="90" y="295" font-family="system-ui" font-size="26" font-weight="800" fill="#17384a">Кристалічний щит</text><text x="90" y="335" font-family="system-ui" font-size="18" fill="#536d7b">Давні магматичні й</text><text x="90" y="363" font-family="system-ui" font-size="18" fill="#536d7b">метаморфічні породи</text><text x="90" y="410" font-family="system-ui" font-size="18" font-weight="700" fill="#a0473b">Гіпотеза:</text><text x="90" y="442" font-family="system-ui" font-size="18" fill="#536d7b">частіше рудні копалини</text><text x="90" y="478" font-family="system-ui" font-size="17" fill="#536d7b">Fe • Ti • U • графіт*</text><text x="90" y="535" font-family="system-ui" font-size="14" fill="#7f939e">*не універсальне правило</text><circle cx="600" cy="220" r="42" fill="#c98a35"/><text x="600" y="230" text-anchor="middle" font-size="34" font-family="system-ui" fill="#fff">⛏</text><text x="480" y="295" font-family="system-ui" font-size="26" font-weight="800" fill="#17384a">Осадові басейни</text><text x="480" y="335" font-family="system-ui" font-size="18" fill="#536d7b">Товщі осадових порід,</text><text x="480" y="363" font-family="system-ui" font-size="18" fill="#536d7b">прогини й западини</text><text x="480" y="410" font-family="system-ui" font-size="18" font-weight="700" fill="#8a5a1e">Гіпотеза:</text><text x="480" y="442" font-family="system-ui" font-size="18" fill="#536d7b">частіше паливні ресурси</text><text x="480" y="478" font-family="system-ui" font-size="17" fill="#536d7b">вугілля • нафта • газ</text><text x="480" y="535" font-family="system-ui" font-size="14" fill="#7f939e">перевіряйте конкретний басейн</text><circle cx="990" cy="220" r="42" fill="#3d9a78"/><text x="990" y="230" text-anchor="middle" font-size="34" font-family="system-ui" fill="#fff">◈</text><text x="870" y="295" font-family="system-ui" font-size="26" font-weight="800" fill="#17384a">Осадові товщі</text><text x="870" y="335" font-family="system-ui" font-size="18" fill="#536d7b">Випаровування, хімічне</text><text x="870" y="363" font-family="system-ui" font-size="18" fill="#536d7b">та біогенне накопичення</text><text x="870" y="410" font-family="system-ui" font-size="18" font-weight="700" fill="#287259">Гіпотеза:</text><text x="870" y="442" font-family="system-ui" font-size="18" fill="#536d7b">частина нерудних ресурсів</text><text x="870" y="478" font-family="system-ui" font-size="17" fill="#536d7b">сіль • сірка • вапняк</text><text x="870" y="535" font-family="system-ui" font-size="14" fill="#7f939e">походження ресурсів різне</text><path d="M360 365H430" stroke="#7ba6b7" stroke-width="6" stroke-linecap="round"/><path d="M750 365H820" stroke="#7ba6b7" stroke-width="6" stroke-linecap="round"/><path d="M418 352l18 13-18 13M808 352l18 13-18 13" fill="none" stroke="#7ba6b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="620" width="1080" height="58" rx="18" fill="#17384a"/><text x="600" y="657" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="700" fill="#fff">Схема дає ГІПОТЕЗУ → карта родовищ дає ПЕРЕВІРКУ → джерела дають ДОКАЗ</text></svg>
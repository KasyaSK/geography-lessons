<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Рівні адміністративно-територіального устрою України</title><desc id="d">Навчальна схема: держава, області та Автономна Республіка Крим, райони, територіальні громади, населені пункти.</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e3f6ff"/><stop offset="1" stop-color="#fff1c8"/></linearGradient></defs><rect width="1200" height="620" rx="38" fill="#f6fbff"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#18364c">Як «вкладена» територія України?</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="17" fill="#61798b">Не плутайте рівень управління з розміром населеного пункту: громада може об’єднувати місто, селища й села.</text><g filter="url(#s)" font-family="Arial,sans-serif"><rect x="70" y="150" width="1060" height="380" rx="34" fill="url(#g)" stroke="#94c7dc" stroke-width="3"/><text x="105" y="195" font-size="24" font-weight="800" fill="#126f9d">Україна</text><rect x="150" y="220" width="900" height="260" rx="28" fill="#fff" stroke="#f0c96f" stroke-width="3"/><text x="185" y="260" font-size="21" font-weight="800" fill="#9a6a00">Області / АР Крим / міста зі спеціальним статусом</text><rect x="250" y="292" width="700" height="145" rx="24" fill="#eaf9f4" stroke="#73baa3" stroke-width="3"/><text x="285" y="334" font-size="21" font-weight="800" fill="#16755f">Райони — 136</text><rect x="430" y="350" width="340" height="60" rx="20" fill="#fff" stroke="#79aeca" stroke-width="3"/><text x="600" y="388" text-anchor="middle" font-size="20" font-weight="800" fill="#176987">Територіальні громади — 1469</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#536f80"><text x="90" y="575">Практичне питання: на якому рівні вирішують ремонт місцевої дороги, а на якому — зміну меж району?</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Модель рекреаційної системи</title><desc id="d">Схема: ресурс плюс доступність плюс безпека плюс інфраструктура плюс правила дають сталу рекреацію.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8fbff"/><stop offset=".55" stop-color="#f2ffe9"/><stop offset="1" stop-color="#fff1cf"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="34" fill="url(#bg)"/><text x="600" y="64" text-anchor="middle" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#17445b">Рекреаційний ресурс ≠ готовий туристичний продукт</text><g font-family="Inter,Arial" font-weight="700" fill="#173f54" filter="url(#s)"><g transform="translate(58 128)"><rect width="190" height="116" rx="24" fill="#fff" stroke="#7dcddd"/><text x="95" y="46" text-anchor="middle" font-size="25">🌿 РЕСУРС</text><text x="95" y="80" text-anchor="middle" font-size="18" font-weight="500">ландшафт, вода,</text><text x="95" y="104" text-anchor="middle" font-size="18" font-weight="500">культура, клімат</text></g><text x="277" y="198" font-size="40">+</text><g transform="translate(314 128)"><rect width="190" height="116" rx="24" fill="#fff" stroke="#8fc8a6"/><text x="95" y="46" text-anchor="middle" font-size="24">🚌 ДОСТУП</text><text x="95" y="80" text-anchor="middle" font-size="18" font-weight="500">дорога, транспорт,</text><text x="95" y="104" text-anchor="middle" font-size="18" font-weight="500">навігація</text></g><text x="533" y="198" font-size="40">+</text><g transform="translate(570 128)"><rect width="190" height="116" rx="24" fill="#fff" stroke="#efbe6f"/><text x="95" y="46" text-anchor="middle" font-size="24">🛡 БЕЗПЕКА</text><text x="95" y="80" text-anchor="middle" font-size="18" font-weight="500">ризики, укриття,</text><text x="95" y="104" text-anchor="middle" font-size="18" font-weight="500">обмеження доступу</text></g><text x="789" y="198" font-size="40">+</text><g transform="translate(826 128)"><rect width="190" height="116" rx="24" fill="#fff" stroke="#a89fd8"/><text x="95" y="46" text-anchor="middle" font-size="23">🏡 СЕРВІС</text><text x="95" y="80" text-anchor="middle" font-size="18" font-weight="500">ночівля, харчування,</text><text x="95" y="104" text-anchor="middle" font-size="18" font-weight="500">інклюзивність</text></g><text x="1045" y="198" font-size="40">+</text><g transform="translate(1065 128)"><rect width="92" height="116" rx="24" fill="#fff" stroke="#e29db6"/><text x="46" y="45" text-anchor="middle" font-size="25">⚖</text><text x="46" y="75" text-anchor="middle" font-size="15">правила</text><text x="46" y="98" text-anchor="middle" font-size="15">й ліміти</text></g></g><path d="M600 270v62" stroke="#238aa0" stroke-width="7" stroke-linecap="round"/><path d="M600 350l-14-22h28z" fill="#238aa0"/><g filter="url(#s)"><rect x="300" y="356" width="600" height="108" rx="28" fill="#fff" stroke="#55b893" stroke-width="3"/><text x="600" y="405" text-anchor="middle" font-family="Inter,Arial" font-size="30" font-weight="900" fill="#147050">СТАЛА РЕКРЕАЦІЯ</text><text x="600" y="438" text-anchor="middle" font-family="Inter,Arial" font-size="19" fill="#4f6d72">дохід для громади + відновлення людини + збереження місця</text></g></svg>
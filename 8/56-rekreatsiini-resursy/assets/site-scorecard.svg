<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Матриця оцінювання рекреаційної локації</title><desc id="d">Шість критеріїв: ресурсність, доступність, безпека, екологічна місткість, локальна економіка, унікальність.</desc><rect width="1000" height="600" rx="34" fill="#f6fbff"/><text x="500" y="60" text-anchor="middle" font-family="Inter,Arial" font-size="34" font-weight="900" fill="#183f55">Чи варто створювати осередок рекреації?</text><text x="500" y="96" text-anchor="middle" font-family="Inter,Arial" font-size="19" fill="#607884">Оцінюйте не «подобається / не подобається», а систему критеріїв</text><g font-family="Inter,Arial"><g transform="translate(85 150)"><rect width="250" height="118" rx="24" fill="#e8f8ee" stroke="#67b68a"/><text x="125" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#176b48">🌿 Ресурсність</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#49685b">природа, культура,</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#49685b">оздоровчий потенціал</text></g><g transform="translate(375 150)"><rect width="250" height="118" rx="24" fill="#e7f7ff" stroke="#67acc8"/><text x="125" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#17607e">🚌 Доступність</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#4e6874">дорога, транспорт,</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#4e6874">час доїзду</text></g><g transform="translate(665 150)"><rect width="250" height="118" rx="24" fill="#fff3df" stroke="#d4a354"/><text x="125" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#8a5d13">🛡 Безпека</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#725f40">ризики, правила,</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#725f40">доступні укриття</text></g><g transform="translate(85 320)"><rect width="250" height="118" rx="24" fill="#edf4ff" stroke="#7b9dd0"/><text x="125" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#345c92">🐾 Екомісткість</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#566b86">скільки відвідувачів</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#566b86">витримує локація</text></g><g transform="translate(375 320)"><rect width="250" height="118" rx="24" fill="#fff0f4" stroke="#d98ca5"/><text x="125" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#8c405b">🏡 Місцева вигода</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#735762">робочі місця, малий</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#735762">бізнес, податки</text></g><g transform="translate(665 320)"><rect width="250" height="118" rx="24" fill="#f3edff" stroke="#9d8ac7"/><text x="125" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#604d8a">✨ Унікальність</text><text x="125" y="78" text-anchor="middle" font-size="17" fill="#665b79">що тут не можна</text><text x="125" y="101" text-anchor="middle" font-size="17" fill="#665b79">скопіювати деінде</text></g><rect x="170" y="493" width="660" height="66" rx="20" fill="#fff" stroke="#c9dce7"/><text x="500" y="532" text-anchor="middle" font-size="22" font-weight="800" fill="#234c60">Рішення = не сума балів, а аргументований компроміс</text></g></svg>
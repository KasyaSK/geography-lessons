<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Канва навчального проєкту про природний комплекс України</title><desc id="d">Етапи: об’єкт, проблема, джерела, карта, рішення, продукт, захист</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e7f8ee"/><stop offset="1" stop-color="#e8f5ff"/></linearGradient><style>.h{font:700 42px system-ui,sans-serif;fill:#193e37}.s{font:700 23px system-ui,sans-serif;fill:#244f48}.q{font:500 19px system-ui,sans-serif;fill:#58736d}.b{fill:#fff;stroke:#cde0d8;stroke-width:3}.n{fill:#fff;font:800 24px system-ui,sans-serif}.c{fill:#2e806a}</style></defs><rect width="1200" height="620" rx="36" fill="url(#g)"/><text x="55" y="70" class="h">Проєкт: від природного комплексу до рішення</text><text x="55" y="108" class="q">Не реферат. Потрібні карта, докази, проблема, рішення й оцінка меж висновку.</text><g transform="translate(50 165)"><g><rect class="b" width="230" height="150" rx="24"/><circle class="c" cx="45" cy="43" r="26"/><text class="n" x="37" y="51">1</text><text class="s" x="82" y="49">Об’єкт</text><text class="q" x="25" y="92">Полісся / степ / Карпати /</text><text class="q" x="25" y="120">узбережжя / локальний ПТК</text></g><g transform="translate(260)"><rect class="b" width="230" height="150" rx="24"/><circle class="c" cx="45" cy="43" r="26"/><text class="n" x="37" y="51">2</text><text class="s" x="82" y="49">Проблема</text><text class="q" x="25" y="92">Що змінюється?</text><text class="q" x="25" y="120">Чому це важливо?</text></g><g transform="translate(520)"><rect class="b" width="230" height="150" rx="24"/><circle class="c" cx="45" cy="43" r="26"/><text class="n" x="37" y="51">3</text><text class="s" x="82" y="49">Докази</text><text class="q" x="25" y="92">Карта + дані + фото</text><text class="q" x="25" y="120">мінімум 3 джерела</text></g><g transform="translate(780)"><rect class="b" width="230" height="150" rx="24"/><circle class="c" cx="45" cy="43" r="26"/><text class="n" x="37" y="51">4</text><text class="s" x="82" y="49">Рішення</text><text class="q" x="25" y="92">Що реально зберегти?</text><text class="q" x="25" y="120">Хто має діяти?</text></g></g><g transform="translate(180 360)"><g><rect class="b" width="360" height="150" rx="24"/><circle class="c" cx="48" cy="43" r="26"/><text class="n" x="40" y="51">5</text><text class="s" x="85" y="49">Продукт</text><text class="q" x="28" y="92">Постер / презентація / цифрова карта</text><text class="q" x="28" y="120">із джерелами та висновком</text></g><g transform="translate(410)"><rect class="b" width="360" height="150" rx="24"/><circle class="c" cx="48" cy="43" r="26"/><text class="n" x="40" y="51">6</text><text class="s" x="85" y="49">Захист</text><text class="q" x="28" y="92">3 хвилини: теза → докази → рішення</text><text class="q" x="28" y="120">→ межі впевненості</text></g></g></svg>
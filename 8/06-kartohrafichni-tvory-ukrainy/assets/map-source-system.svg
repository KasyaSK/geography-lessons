<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Від території до рішення: як працюють картографічні джерела</title><desc id="d">Схема порівняння паперової карти, електронної карти, супутникового знімка і геоінформаційної системи.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#fff4d8"/></linearGradient></defs><rect width="1200" height="640" rx="36" fill="url(#g)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#15364d">Одна територія — різні картографічні «лінзи»</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="22" fill="#557185">Джерело обирають під запитання, а не «бо ця карта красивіша».</text><g font-family="Arial,sans-serif"><g transform="translate(60 165)"><rect width="250" height="330" rx="28" fill="#fff" stroke="#a8d7ef" stroke-width="3"/><circle cx="55" cy="60" r="32" fill="#dff3ff"/><text x="55" y="69" text-anchor="middle" font-size="30">🗺</text><text x="28" y="125" font-size="26" font-weight="700" fill="#15364d">Карта / атлас</text><text x="28" y="166" font-size="19" fill="#557185">• узагальнює</text><text x="28" y="198" font-size="19" fill="#557185">• має легенду</text><text x="28" y="230" font-size="19" fill="#557185">• показує тему</text><text x="28" y="280" font-size="18" font-weight="700" fill="#0b8067">Добре для:</text><text x="28" y="310" font-size="18" fill="#557185">структури й порівняння</text></g><g transform="translate(335 165)"><rect width="250" height="330" rx="28" fill="#fff" stroke="#b8e0c9" stroke-width="3"/><circle cx="55" cy="60" r="32" fill="#e7f8ee"/><text x="55" y="69" text-anchor="middle" font-size="30">📍</text><text x="28" y="125" font-size="26" font-weight="700" fill="#15364d">Онлайн-карта</text><text x="28" y="166" font-size="19" fill="#557185">• масштабування</text><text x="28" y="198" font-size="19" fill="#557185">• пошук і маршрут</text><text x="28" y="230" font-size="19" fill="#557185">• часті оновлення</text><text x="28" y="280" font-size="18" font-weight="700" fill="#0b8067">Добре для:</text><text x="28" y="310" font-size="18" fill="#557185">орієнтування</text></g><g transform="translate(610 165)"><rect width="250" height="330" rx="28" fill="#fff" stroke="#efd59b" stroke-width="3"/><circle cx="55" cy="60" r="32" fill="#fff1cf"/><text x="55" y="69" text-anchor="middle" font-size="30">🛰</text><text x="28" y="125" font-size="26" font-weight="700" fill="#15364d">Знімок</text><text x="28" y="166" font-size="19" fill="#557185">• реальна поверхня</text><text x="28" y="198" font-size="19" fill="#557185">• дата зйомки</text><text x="28" y="230" font-size="19" fill="#557185">• спектральні дані</text><text x="28" y="280" font-size="18" font-weight="700" fill="#0b8067">Добре для:</text><text x="28" y="310" font-size="18" fill="#557185">змін у часі</text></g><g transform="translate(885 165)"><rect width="250" height="330" rx="28" fill="#fff" stroke="#d6c6ef" stroke-width="3"/><circle cx="55" cy="60" r="32" fill="#f0eaff"/><text x="55" y="69" text-anchor="middle" font-size="30">◫</text><text x="28" y="125" font-size="26" font-weight="700" fill="#15364d">ГІС</text><text x="28" y="166" font-size="19" fill="#557185">• шари даних</text><text x="28" y="198" font-size="19" fill="#557185">• аналіз об’єктів</text><text x="28" y="230" font-size="19" fill="#557185">• запити й моделі</text><text x="28" y="280" font-size="18" font-weight="700" fill="#0b8067">Добре для:</text><text x="28" y="310" font-size="18" fill="#557185">рішень і прогнозів</text></g><path d="M165 535 H1035" stroke="#5a7890" stroke-width="4" stroke-linecap="round"/><path d="M1020 520 L1045 535 L1020 550" fill="none" stroke="#5a7890" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="590" text-anchor="middle" font-size="22" font-weight="700" fill="#15364d">Запитання → вибір джерела → перевірка метаданих → доказ → висновок</text></g></svg>
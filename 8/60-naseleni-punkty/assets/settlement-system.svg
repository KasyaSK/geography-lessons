<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#fff5d9"/></linearGradient></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<text x="60" y="75" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#17384d">Населений пункт ≠ громада ≠ район</text>
<text x="60" y="118" font-family="Arial,sans-serif" font-size="24" fill="#607988">Статус перевіряємо за офіційними даними, функції — досліджуємо географічно</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="190" width="300" height="170" rx="28" fill="#ffffff" stroke="#cbdfe8" stroke-width="3"/>
<text x="220" y="245" font-size="34" font-weight="700" fill="#1679aa">МІСТО</text><text x="220" y="292" font-size="22" fill="#355a6d">Василівка</text><text x="220" y="325" font-size="22" fill="#355a6d">Дніпрорудне • Енергодар</text>
<rect x="450" y="190" width="300" height="170" rx="28" fill="#ffffff" stroke="#cbdfe8" stroke-width="3"/>
<text x="600" y="245" font-size="34" font-weight="700" fill="#13836c">СЕЛИЩЕ</text><text x="600" y="292" font-size="22" fill="#355a6d">Михайлівка</text><text x="600" y="325" font-size="22" fill="#355a6d">Степногірськ</text>
<rect x="830" y="190" width="300" height="170" rx="28" fill="#ffffff" stroke="#cbdfe8" stroke-width="3"/>
<text x="980" y="245" font-size="34" font-weight="700" fill="#c8861d">СЕЛО</text><text x="980" y="292" font-size="22" fill="#355a6d">Водяне</text><text x="980" y="325" font-size="22" fill="#355a6d">Кам’янське • Балки</text>
<path d="M220 390v70M600 390v70M980 390v70" stroke="#6a8999" stroke-width="5"/>
<path d="M220 460H980" stroke="#6a8999" stroke-width="5"/>
<path d="M600 460v55" stroke="#6a8999" stroke-width="5"/>
<rect x="350" y="515" width="500" height="90" rx="26" fill="#e9f8f3" stroke="#8acdb8" stroke-width="3"/>
<text x="600" y="568" font-size="32" font-weight="700" fill="#156f5c">ТЕРИТОРІАЛЬНА ГРОМАДА</text>
<text x="600" y="640" font-size="25" fill="#355a6d">може включати багато міст, селищ і сіл → входить до району</text>

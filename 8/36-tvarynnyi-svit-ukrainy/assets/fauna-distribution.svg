<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Чинники поширення тварин України</title><desc id="d">Схема: середовище існування, ресурси, бар’єри та діяльність людини впливають на ареал виду.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef8ff"/><stop offset=".52" stop-color="#f2fae9"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#64866c"/></marker><style>.h{font:800 42px system-ui,sans-serif;fill:#203c31}.s{font:700 25px system-ui,sans-serif;fill:#315242}.q{font:600 20px system-ui,sans-serif;fill:#647267}.b{fill:white;stroke:#d1dfd5;stroke-width:3}.arr{stroke:#64866c;stroke-width:6;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="42" fill="url(#bg)"/><text x="60" y="78" class="h">Чому вид живе саме тут?</text><text x="60" y="118" class="q">Ареал — результат кількох чинників, а не одна «улюблена» умова</text><g transform="translate(55 185)"><g><rect class="b" width="220" height="190" rx="28"/><text x="32" y="62" class="s">Середовище</text><text x="32" y="102" class="q">ліс • степ • вода</text><text x="32" y="136" class="q">висота • укриття</text></g><path class="arr" d="M230 95H310"/><g transform="translate(320)"><rect class="b" width="220" height="190" rx="28"/><text x="35" y="62" class="s">Ресурси</text><text x="35" y="102" class="q">їжа • вода</text><text x="35" y="136" class="q">місця розмноження</text></g><path class="arr" d="M550 95H630"/><g transform="translate(640)"><rect class="b" width="220" height="190" rx="28"/><text x="35" y="62" class="s">Бар’єри</text><text x="35" y="102" class="q">гори • річки</text><text x="35" y="136" class="q">дороги • міста</text></g><path class="arr" d="M870 95H950"/><g transform="translate(960)"><rect class="b" width="180" height="190" rx="28"/><text x="24" y="62" class="s">Ареал</text><text x="24" y="102" class="q">де вид</text><text x="24" y="136" class="q">реально трапляється</text></g></g><rect x="90" y="455" width="1020" height="130" rx="28" fill="#ffffffc9" stroke="#d4ded0" stroke-width="3"/><text x="130" y="510" class="s">Людина змінює всі ланки системи</text><text x="130" y="552" class="q">фрагментація оселищ • забруднення • полювання • охорона • відновлення екосистем</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Територія і земельні ресурси як система</title><desc id="d">Навчальна схема: територія, земельні угіддя, родючість, рішення громади та наслідки.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f7ff"/><stop offset=".5" stop-color="#fff6dc"/><stop offset="1" stop-color="#eaf8e8"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17384d">Територія — не просто площа на карті</text><text x="600" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#567286">Це простір рішень, де природні властивості землі зустрічаються з потребами людей</text><g filter="url(#sh)" font-family="Arial,sans-serif"><rect x="60" y="160" width="245" height="150" rx="24" fill="#fff"/><text x="182" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#176f98">ТЕРИТОРІЯ</text><text x="182" y="240" text-anchor="middle" font-size="18" fill="#345b70">положення • площа</text><text x="182" y="270" text-anchor="middle" font-size="18" fill="#345b70">рельєф • доступність</text><rect x="355" y="160" width="245" height="150" rx="24" fill="#fff"/><text x="477" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#187a61">УГІДДЯ</text><text x="477" y="240" text-anchor="middle" font-size="18" fill="#345b70">рілля • сади • луки</text><text x="477" y="270" text-anchor="middle" font-size="18" fill="#345b70">ліси • забудова • води</text><rect x="650" y="160" width="245" height="150" rx="24" fill="#fff"/><text x="772" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#b56a12">ЯКІСТЬ ЗЕМЛІ</text><text x="772" y="240" text-anchor="middle" font-size="18" fill="#345b70">родючість • волога</text><text x="772" y="270" text-anchor="middle" font-size="18" fill="#345b70">ерозія • забруднення</text><rect x="945" y="160" width="195" height="150" rx="24" fill="#fff"/><text x="1042" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#8a4b97">ЛЮДИ</text><text x="1042" y="240" text-anchor="middle" font-size="18" fill="#345b70">власники</text><text x="1042" y="270" text-anchor="middle" font-size="18" fill="#345b70">громада • держава</text></g><g stroke="#5f8398" stroke-width="4" fill="none"><path d="M305 235h42"/><path d="M600 235h42"/><path d="M895 235h42"/></g><g fill="#5f8398"><path d="M347 235l-14-9v18z"/><path d="M642 235l-14-9v18z"/><path d="M937 235l-14-9v18z"/></g><rect x="130" y="385" width="940" height="150" rx="28" fill="#17384d"/><text x="600" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Управлінське рішення: що тут робити і як не втратити ресурс?</text><text x="600" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#dff4ff">вирощувати • будувати • зберігати • відновлювати • обмежувати навантаження</text><text x="600" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffe9b7">Критерій якості: користь сьогодні + збережена продуктивність і екосистемні функції завтра</text><path d="M1042 310v50H600v24" stroke="#8a4b97" stroke-width="4" fill="none"/><path d="M600 384l-10-16h20z" fill="#8a4b97"/></svg>
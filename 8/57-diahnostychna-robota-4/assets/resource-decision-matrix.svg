<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="t d">
<title id="t">Матриця рішення щодо природних ресурсів</title>
<desc id="d">Схема: природний ресурс проходить перевірку доступності, економіки, безпеки та екологічних меж перед господарським рішенням.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fff5d8"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24485d" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="660" rx="38" fill="url(#bg)"/>
<text x="550" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#17364a">Ресурс ≠ автоматична вигода</text>
<text x="550" y="98" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#587487">Перед рішенням перевіряємо кілька незалежних умов</text>
<g filter="url(#s)"><rect x="65" y="185" width="190" height="110" rx="24" fill="#ffffff" stroke="#bcdbe8"/><rect x="323" y="185" width="190" height="110" rx="24" fill="#ffffff" stroke="#bcdbe8"/><rect x="581" y="185" width="190" height="110" rx="24" fill="#ffffff" stroke="#bcdbe8"/><rect x="839" y="185" width="190" height="110" rx="24" fill="#ffffff" stroke="#bcdbe8"/></g>
<text x="160" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0b7fab">1. Доступність</text><text x="160" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">де? скільки? якої</text><text x="160" y="280" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">якості?</text>
<text x="418" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#168068">2. Економіка</text><text x="418" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">видобування, транспорт,</text><text x="418" y="280" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">мережі, окупність</text>
<text x="676" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#a06715">3. Безпека</text><text x="676" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">люди, інфраструктура,</text><text x="676" y="280" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">воєнні ризики</text>
<text x="934" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#8257a6">4. Екомежі</text><text x="934" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">відтворення, вода, ґрунт,</text><text x="934" y="280" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#587487">оселища, забруднення</text>
<path d="M160 315v58M418 315v58M676 315v58M934 315v58" stroke="#8cb3c4" stroke-width="4" stroke-linecap="round"/><path d="M160 373H934" stroke="#8cb3c4" stroke-width="4" stroke-linecap="round"/><path d="M550 373v58" stroke="#8cb3c4" stroke-width="4" stroke-linecap="round"/>
<rect x="310" y="431" width="480" height="120" rx="30" fill="#17364a" filter="url(#s)"/><text x="550" y="476" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="850" fill="#fff">Господарське рішення</text><text x="550" y="510" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#d7edf6">користь зараз + стійкість у майбутньому</text><text x="550" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#d7edf6">+ доказовий прогноз наслідків</text>
<text x="550" y="616" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#17364a">Географія питає не «чи є ресурс?», а «де, для кого, якою ціною і з якими наслідками?»</text>
</svg>
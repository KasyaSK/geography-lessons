<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Геологічний паспорт відслонення</title><desc id="d">Навчальна схема гранітного відслонення: тріщини, блоки, вивітрювання, рослинність і берег Дніпра</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cceeff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6b795"/><stop offset=".55" stop-color="#b97a62"/><stop offset="1" stop-color="#785b5b"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#73c8d6"/><stop offset="1" stop-color="#247b97"/></linearGradient></defs><rect width="1200" height="760" fill="url(#sky)"/><path d="M0 575 C220 525 395 560 610 535 C820 510 1010 530 1200 500 L1200 760 0 760Z" fill="url(#water)"/><path d="M0 580 L0 370 115 330 190 255 295 280 370 205 455 248 525 155 600 215 700 180 770 260 860 235 930 325 1030 300 1200 370 1200 575Z" fill="url(#rock)" stroke="#644e50" stroke-width="4"/><g stroke="#5b4548" stroke-width="7" opacity=".75" fill="none"><path d="M185 260 L215 565"/><path d="M365 215 L330 560"/><path d="M525 160 L575 560"/><path d="M700 185 L670 560"/><path d="M930 330 L875 560"/><path d="M85 380 L1130 420"/><path d="M110 470 L1050 500"/></g><g fill="#dce8b0"><circle cx="145" cy="335" r="24"/><circle cx="280" cy="285" r="18"/><circle cx="470" cy="245" r="25"/><circle cx="735" cy="225" r="21"/><circle cx="1015" cy="315" r="26"/></g><g font-family="system-ui,Segoe UI,sans-serif" font-size="29" font-weight="800" fill="#17384c"><rect x="30" y="25" width="535" height="115" rx="22" fill="#fff" opacity=".94"/><text x="58" y="72">ГЕОЛОГІЧНИЙ ПАСПОРТ</text><text x="58" y="110" font-size="22" font-weight="600">Що можна довести спостереженням?</text></g><g font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#17384c"><g><line x1="225" y1="325" x2="105" y2="205" stroke="#17384c" stroke-width="3"/><rect x="30" y="150" width="250" height="78" rx="16" fill="#fff"/><text x="50" y="180" font-weight="800">1. Порода</text><text x="50" y="210">зернистість, колір</text></g><g><line x1="550" y1="330" x2="585" y2="105" stroke="#17384c" stroke-width="3"/><rect x="575" y="28" width="290" height="95" rx="16" fill="#fff"/><text x="595" y="63" font-weight="800">2. Тріщини</text><text x="595" y="95">напрям і густота</text></g><g><line x1="830" y1="430" x2="960" y2="220" stroke="#17384c" stroke-width="3"/><rect x="900" y="130" width="270" height="100" rx="16" fill="#fff"/><text x="920" y="165" font-weight="800">3. Вивітрювання</text><text x="920" y="198">округлення блоків</text></g><g><line x1="705" y1="560" x2="815" y2="655" stroke="#fff" stroke-width="3"/><rect x="760" y="635" width="390" height="93" rx="16" fill="#fff"/><text x="785" y="670" font-weight="800">4. Рельєф + вода</text><text x="785" y="703">як оголюється порода</text></g></g><rect x="30" y="620" width="560" height="108" rx="18" fill="#fff" opacity=".95"/><text x="55" y="660" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#17384c">Не збираємо зразки у заповідній зоні.</text><text x="55" y="696" font-family="system-ui,Segoe UI,sans-serif" font-size="20" fill="#49697d">Фото + нотатки + карта = достатній польовий доказ.</text></svg>
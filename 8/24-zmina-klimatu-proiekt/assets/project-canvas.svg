<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Проєктний канвас зміни клімату</title><desc id="d">Навчальна схема: питання, докази, причинний ланцюг, рішення і висновок.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f8ff"/><stop offset=".52" stop-color="#fff4d9"/><stop offset="1" stop-color="#eaf9ee"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".12"/></filter></defs><rect width="1200" height="720" rx="38" fill="url(#bg)"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#16394b">КЛІМАТИЧНИЙ ПРОЄКТ: від питання до доказу</text><text x="70" y="122" font-family="Arial,sans-serif" font-size="20" fill="#567482">Навчальна причинна схема • не карта і не набір виміряних даних</text><g filter="url(#s)" font-family="Arial,sans-serif"><rect x="70" y="178" width="300" height="190" rx="26" fill="#fff" stroke="#b9dce8"/><text x="98" y="224" font-size="23" font-weight="700" fill="#1a789e">1. ПИТАННЯ</text><text x="98" y="263" font-size="18" fill="#264957"><tspan x="98" dy="0">Що саме Ви доводите?</tspan><tspan x="98" dy="29">Який масштаб: світ /</tspan><tspan x="98" dy="29">Україна / область?</tspan><tspan x="98" dy="29">Який період?</tspan></text><rect x="450" y="178" width="300" height="190" rx="26" fill="#fff" stroke="#b9dce8"/><text x="478" y="224" font-size="23" font-weight="700" fill="#188163">2. ДОКАЗИ</text><text x="478" y="263" font-size="18" fill="#264957"><tspan x="478" dy="0">≥ 2 надійні джерела</tspan><tspan x="478" dy="29">+ число / карта / графік</tspan><tspan x="478" dy="29">+ пояснення, що саме</tspan><tspan x="478" dy="29">вони підтверджують</tspan></text><rect x="830" y="178" width="300" height="190" rx="26" fill="#fff" stroke="#b9dce8"/><text x="858" y="224" font-size="23" font-weight="700" fill="#b06b22">3. МЕХАНІЗМ</text><text x="858" y="263" font-size="18" fill="#264957"><tspan x="858" dy="0">Причина → процес →</tspan><tspan x="858" dy="29">наслідок. Не просто</tspan><tspan x="858" dy="29">«разом змінилося»,</tspan><tspan x="858" dy="29">а чому це пов’язано.</tspan></text><rect x="260" y="438" width="300" height="190" rx="26" fill="#fff" stroke="#b9dce8"/><text x="288" y="484" font-size="23" font-weight="700" fill="#7658ad">4. РІШЕННЯ</text><text x="288" y="523" font-size="18" fill="#264957"><tspan x="288" dy="0">Пом’якшення чи адаптація?</tspan><tspan x="288" dy="29">Хто діє? Яка ціна?</tspan><tspan x="288" dy="29">Які побічні ефекти?</tspan><tspan x="288" dy="29">Як перевірити результат?</tspan></text><rect x="640" y="438" width="300" height="190" rx="26" fill="#fff" stroke="#b9dce8"/><text x="668" y="484" font-size="23" font-weight="700" fill="#c24f4f">5. ВИСНОВОК</text><text x="668" y="523" font-size="18" fill="#264957"><tspan x="668" dy="0">Claim + Evidence + Reasoning</tspan><tspan x="668" dy="29">Що доведено?</tspan><tspan x="668" dy="29">Що лишилося невідомим?</tspan><tspan x="668" dy="29">Яка дія випливає з даних?</tspan></text></g><path d="M370 273h65" stroke="#6a98aa" stroke-width="5" stroke-linecap="round"/><path d="m430 263 15 10-15 10" fill="none" stroke="#6a98aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 273h65" stroke="#6a98aa" stroke-width="5" stroke-linecap="round"/><path d="m810 263 15 10-15 10" fill="none" stroke="#6a98aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M980 382c0 70-75 70-75 70" fill="none" stroke="#6a98aa" stroke-width="5" stroke-linecap="round"/><path d="m916 442-11 10 11 10" fill="none" stroke="#6a98aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 533h-65" stroke="#6a98aa" stroke-width="5" stroke-linecap="round"/><path d="m580 523-15 10 15 10" fill="none" stroke="#6a98aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
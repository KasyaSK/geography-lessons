<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Модель кліматотвірних чинників України</title><desc id="d">Навчальна схема впливу широти, Атлантики, повітряних мас, рельєфу та підстильної поверхні на клімат України.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#fff8dc"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#277aa5"/></marker></defs><rect width="1200" height="680" rx="34" fill="url(#sky)"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#17384a"><text x="60" y="70" font-size="38" font-weight="800">Чому клімат України неоднаковий?</text><text x="60" y="108" font-size="21">Навчальна модель: причинні зв’язки, а не точна кліматична карта</text><circle cx="1015" cy="105" r="53" fill="#ffd45d"/><g stroke="#f0b83d" stroke-width="7"><path d="M1015 22v-18M1015 206v18M932 105h-18M1098 105h18M956 46l-14-14M1074 164l14 14M1074 46l14-14M956 164l-14 14"/></g><text x="895" y="190" font-size="18" font-weight="700">сонячна радіація</text><path d="M70 325 C210 225 345 245 430 300 C500 345 600 350 690 315 C800 270 920 295 1045 365 L1015 470 C880 490 760 465 660 500 C540 540 420 500 320 510 C220 520 135 475 70 420 Z" fill="#d9efc7" stroke="#5f9b63" stroke-width="4"/><path d="M160 366 C270 320 380 342 470 380" fill="none" stroke="#277aa5" stroke-width="13" stroke-linecap="round" marker-end="url(#arr)"/><text x="85" y="300" font-size="24" font-weight="800">Атлантика</text><text x="85" y="330" font-size="18">вологіші західні потоки</text><path d="M1060 285 C950 260 875 275 800 325" fill="none" stroke="#d76a4c" stroke-width="11" stroke-linecap="round" marker-end="url(#arr)"/><text x="890" y="245" font-size="20" font-weight="800">континентальні</text><text x="910" y="270" font-size="18">повітряні маси</text><path d="M690 410 L735 330 L780 410 Z" fill="#8aa7b3"/><path d="M730 410 L785 300 L845 410 Z" fill="#6f8d9a"/><path d="M745 355l38-55 26 50" fill="#fff" opacity=".9"/><text x="694" y="448" font-size="19" font-weight="800">Карпати</text><text x="674" y="472" font-size="17">бар’єр + висота</text><rect x="82" y="545" width="1030" height="82" rx="22" fill="#fff" opacity=".93" stroke="#c8dde5"/><text x="110" y="580" font-size="20" font-weight="800">Результат формується разом:</text><text x="110" y="610" font-size="18">широта • циркуляція атмосфери • віддаленість від океану • рельєф і висота • моря • характер поверхні</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Практична робота: мішані та широколисті ліси України</title><desc id="d">Схема порівняння природних комплексів за положенням, умовами, компонентами, використанням і охороною</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e9f7e7"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#214635}.s{font:700 24px system-ui,sans-serif;fill:#335a45}.q{font:600 19px system-ui,sans-serif;fill:#627466}.box{fill:#fff;stroke:#cfe0d3;stroke-width:3}.a{fill:#3d835c}.b{fill:#4b7ea3}.n{font:900 27px system-ui,sans-serif;fill:white}.line{stroke:#89a695;stroke-width:5;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#89a695"/></marker></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="55" y="75" class="h">Як виконати практичну роботу?</text><text x="55" y="112" class="q">Не переписати підручник, а побудувати доказову характеристику природного комплексу</text><g transform="translate(48 175)"><g><rect class="box" width="190" height="230" rx="25"/><circle class="a" cx="95" cy="52" r="30"/><text class="n" x="86" y="62">1</text><text class="s" x="28" y="116">Положення</text><text class="q" x="25" y="155">де зона?</text><text class="q" x="25" y="185">сусіди</text></g><path class="line" d="M200 115 H245"/><g transform="translate(255)"><rect class="box" width="190" height="230" rx="25"/><circle class="a" cx="95" cy="52" r="30"/><text class="n" x="86" y="62">2</text><text class="s" x="40" y="116">Умови</text><text class="q" x="25" y="155">клімат</text><text class="q" x="25" y="185">ґрунти</text></g><path class="line" d="M455 115 H500"/><g transform="translate(510)"><rect class="box" width="190" height="230" rx="25"/><circle class="a" cx="95" cy="52" r="30"/><text class="n" x="86" y="62">3</text><text class="s" x="25" y="116">Компоненти</text><text class="q" x="25" y="155">рослини</text><text class="q" x="25" y="185">води / болота</text></g><path class="line" d="M710 115 H755"/><g transform="translate(765)"><rect class="box" width="190" height="230" rx="25"/><circle class="b" cx="95" cy="52" r="30"/><text class="n" x="86" y="62">4</text><text class="s" x="26" y="116">Людина</text><text class="q" x="25" y="155">використання</text><text class="q" x="25" y="185">антропогенне</text></g><path class="line" d="M965 115 H1010"/><g transform="translate(1020)"><rect class="box" width="135" height="230" rx="25"/><circle class="b" cx="68" cy="52" r="30"/><text class="n" x="59" y="62">5</text><text class="s" x="19" y="116">Висновок</text><text class="q" x="16" y="155">докази</text><text class="q" x="16" y="185">охорона</text></g></g><rect x="68" y="500" width="1065" height="125" rx="26" fill="#ffffffd9" stroke="#cfddd1" stroke-width="3"/><text x="100" y="552" class="s">Сильна відповідь = карта + 2 природні компоненти + антропогенний вплив + причинний зв’язок</text><text x="100" y="590" class="q">Карта показує «де», таблиця — «що», а висновок має пояснити «чому саме так».</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Навчальна модель контрастів клімату України</title><desc id="d">Схема показує зменшення зволоження із північного заходу на південний схід та вплив Карпат.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3a9f8e"/><stop offset=".48" stop-color="#8fcf83"/><stop offset="1" stop-color="#efb857"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="560" rx="34" fill="#f7fbff"/><text x="70" y="72" font-family="system-ui" font-size="32" font-weight="800" fill="#173a4c">Контрасти клімату: від вологішого заходу до сухішого південного сходу</text><rect x="70" y="115" width="1060" height="145" rx="28" fill="url(#g)" filter="url(#s)"/><text x="105" y="170" font-family="system-ui" font-size="26" font-weight="800" fill="white">Північний захід / Карпати</text><text x="105" y="210" font-family="system-ui" font-size="20" fill="white">більше опадів • менша випаровуваність • Kз ≳ 1</text><text x="745" y="170" font-family="system-ui" font-size="26" font-weight="800" fill="#65471f">Південь і південний схід</text><text x="745" y="210" font-family="system-ui" font-size="20" fill="#65471f">менше опадів • більша випаровуваність • Kз &lt; 1</text><path d="M165 420 L235 325 L290 390 L355 285 L440 420 Z" fill="#6e9b72"/><path d="M220 345 L235 325 L252 354 L270 340 L290 390" fill="none" stroke="#fff" stroke-width="7"/><text x="175" y="470" font-family="system-ui" font-size="22" font-weight="800" fill="#355b4b">Карпати</text><text x="165" y="500" font-family="system-ui" font-size="18" fill="#55727d">орографічне посилення опадів</text><circle cx="610" cy="355" r="62" fill="#f3cf66"/><path d="M610 275v-34M610 469v-34M530 355h-34M724 355h-34M554 299l-24-24M690 435l-24-24M666 299l24-24M554 411l-24 24" stroke="#e2a536" stroke-width="10" stroke-linecap="round"/><text x="520" y="472" font-family="system-ui" font-size="22" font-weight="800" fill="#75551f">Випаровуваність</text><text x="520" y="501" font-family="system-ui" font-size="18" fill="#55727d">зростає за тепліших і сухіших умов</text><path d="M820 315c35-60 85-52 105 0 45-35 95 0 75 48 55 6 59 78-2 84H807c-66 0-70-83 13-87-16-14-12-32 0-45Z" fill="#8ec6e8"/><path d="M840 460l-15 35M890 460l-15 35M940 460l-15 35M990 460l-15 35" stroke="#3f87bd" stroke-width="8" stroke-linecap="round"/><text x="820" y="532" font-family="system-ui" font-size="18" fill="#55727d">Опади ≠ зволоження: потрібне співвідношення P/E</text><text x="70" y="540" font-family="system-ui" font-size="15" fill="#78909c">Навчальна причинна модель, не карта. Точні значення перевіряйте за кліматичними даними УкрГМІ.</text></svg>
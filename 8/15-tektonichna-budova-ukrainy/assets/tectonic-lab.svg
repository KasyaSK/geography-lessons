<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Навчальна модель тектонічної будови України</title><desc id="d">Схематична карта для практичної роботи: Український щит, Волино-Подільська плита, Дніпровсько-Донецька западина, Донецька складчаста споруда, Карпати, Кримська складчаста система, Причорноморська западина.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><clipPath id="ua"><path d="M157 231 219 190 286 188 326 155 390 177 440 156 492 187 566 176 620 211 694 203 753 232 813 232 852 267 926 281 945 324 915 359 928 398 880 427 828 431 787 467 709 456 653 481 600 463 532 496 475 477 428 500 377 470 318 477 285 445 232 446 198 411 148 398 128 353 146 318 121 281Z"/></clipPath></defs><rect width="1100" height="720" fill="#f5fbff"/><text x="60" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18384b">Тектонічна лабораторія: читаємо фундамент України</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="17" fill="#5f788a">Схема навчальна — межі узагальнені. Для точного аналізу звіряйтеся з тектонічною картою.</text><g filter="url(#s)"><path d="M157 231 219 190 286 188 326 155 390 177 440 156 492 187 566 176 620 211 694 203 753 232 813 232 852 267 926 281 945 324 915 359 928 398 880 427 828 431 787 467 709 456 653 481 600 463 532 496 475 477 428 500 377 470 318 477 285 445 232 446 198 411 148 398 128 353 146 318 121 281Z" fill="#fff" stroke="#294f62" stroke-width="6"/></g><g clip-path="url(#ua)"><rect x="110" y="145" width="850" height="370" fill="#f4e9c9"/><path d="M315 188 C345 240 348 330 420 469 L575 478 C515 410 508 323 484 180Z" fill="#f5b568"/><path d="M145 178 H335 L356 348 250 445 120 401Z" fill="#b9d8f1"/><path d="M460 175 C565 207 608 245 700 245 L748 347 C638 358 568 337 500 302Z" fill="#b7e4cf"/><path d="M748 235 C805 239 866 252 944 295 L925 401 C858 385 807 350 755 333Z" fill="#e9b3c1"/><path d="M145 366 C220 390 265 432 334 477 L244 478 168 420Z" fill="#b8a1d9"/><path d="M520 430 C650 436 762 422 925 394 L915 458 770 477 604 475Z" fill="#f3d39b"/><path d="M718 447 C770 470 837 480 881 512 L777 540 690 489Z" fill="#d6addf"/></g><g font-family="Arial,sans-serif" fill="#17384b" font-size="17" font-weight="700"><text x="335" y="304">Український щит</text><text x="166" y="282">Волино-Подільська</text><text x="197" y="305">плита</text><text x="514" y="253">Дніпровсько-Донецька</text><text x="565" y="276">западина</text><text x="785" y="310">Донецька</text><text x="770" y="333">складчаста споруда</text><text x="160" y="424">Карпатська</text><text x="170" y="446">система</text><text x="586" y="456">Причорноморська западина</text><text x="735" y="499">Кримська складчаста</text><text x="774" y="521">система</text></g><g transform="translate(60 570)" font-family="Arial,sans-serif"><text x="0" y="0" font-size="21" font-weight="700" fill="#18384b">Легенда для практичної роботи</text><g font-size="16" fill="#35596b"><rect x="0" y="24" width="24" height="18" rx="4" fill="#f5b568"/><text x="34" y="39">щит</text><rect x="125" y="24" width="24" height="18" rx="4" fill="#b9d8f1"/><text x="159" y="39">плита</text><rect x="250" y="24" width="24" height="18" rx="4" fill="#b7e4cf"/><text x="284" y="39">западина</text><rect x="405" y="24" width="24" height="18" rx="4" fill="#e9b3c1"/><text x="439" y="39">складчаста споруда</text><rect x="635" y="24" width="24" height="18" rx="4" fill="#b8a1d9"/><text x="669" y="39">молода складчаста область</text></g><text x="0" y="84" font-size="15" fill="#5f788a">Питання: де фундамент платформи виходить найближче до поверхні, а де занурений під потужний осадовий чохол?</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Протокол польового дослідження ґрунту</title><desc id="d">Схема: точка спостереження, проба, текстура, pH, карта, висновок</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef8ea"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><style>.h{font:700 42px system-ui,sans-serif;fill:#254332}.s{font:600 24px system-ui,sans-serif;fill:#365545}.n{font:900 30px system-ui,sans-serif;fill:white}.b{fill:white;stroke:#cfded0;stroke-width:3}.a{fill:#3d805d}.l{stroke:#7b9d84;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}.q{font:700 20px system-ui,sans-serif;fill:#6a745f}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7b9d84"/></marker></defs><rect width="1200" height="650" rx="40" fill="url(#bg)"/><text x="60" y="78" class="h">Як дослідити ґрунт своєї місцевості?</text><text x="60" y="118" class="q">Не «вгадати», а зібрати кілька незалежних доказів</text><g transform="translate(55 180)"><g><rect class="b" width="180" height="220" rx="28"/><circle class="a" cx="90" cy="52" r="30"/><text class="n" x="81" y="62">1</text><text class="s" x="30" y="116">Точка</text><text class="q" x="25" y="154">рельєф</text><text class="q" x="25" y="184">рослинність</text></g><path class="l" d="M190 110 H240"/><g transform="translate(250)"><rect class="b" width="180" height="220" rx="28"/><circle class="a" cx="90" cy="52" r="30"/><text class="n" x="81" y="62">2</text><text class="s" x="29" y="116">Проба</text><text class="q" x="25" y="154">колір</text><text class="q" x="25" y="184">структура</text></g><path class="l" d="M440 110 H490"/><g transform="translate(500)"><rect class="b" width="180" height="220" rx="28"/><circle class="a" cx="90" cy="52" r="30"/><text class="n" x="81" y="62">3</text><text class="s" x="25" y="116">Тести</text><text class="q" x="25" y="154">текстура</text><text class="q" x="25" y="184">pH</text></g><path class="l" d="M690 110 H740"/><g transform="translate(750)"><rect class="b" width="180" height="220" rx="28"/><circle class="a" cx="90" cy="52" r="30"/><text class="n" x="81" y="62">4</text><text class="s" x="27" y="116">Карта</text><text class="q" x="25" y="154">SoilGrids</text><text class="q" x="25" y="184">масштаб</text></g><path class="l" d="M940 110 H990"/><g transform="translate(1000)"><rect class="b" width="145" height="220" rx="28"/><circle class="a" cx="72" cy="52" r="30"/><text class="n" x="63" y="62">5</text><text class="s" x="18" y="116">CER</text><text class="q" x="16" y="154">докази</text><text class="q" x="16" y="184">межі</text></g></g><rect x="70" y="475" width="1060" height="110" rx="28" fill="#ffffffc7" stroke="#d8dfca" stroke-width="3"/><text x="105" y="525" class="s">Сильний висновок = польове спостереження + вимірювання + геодані + чесна межа впевненості</text><text x="105" y="562" class="q">Цифрова карта не замінює пробу, а одна проба не описує весь район.</text></svg>
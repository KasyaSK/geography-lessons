<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#fff3d5"/></linearGradient><style>.h{font:800 42px system-ui;fill:#17384b}.t{font:700 25px system-ui;fill:#254d62}.s{font:600 19px system-ui;fill:#5b7280}.b{fill:white;stroke:#cfe0e8;stroke-width:3}.n{font:900 31px system-ui;fill:white}</style></defs><rect width="1200" height="650" rx="36" fill="url(#g)"/><text x="60" y="74" class="h">Фінальна карта компетентностей • 8 клас</text><text x="60" y="112" class="s">Не «скільки параграфів пам’ятаю», а що вмію робити з географічною інформацією</text><g transform="translate(55 175)"><g><rect class="b" width="330" height="330" rx="30"/><circle cx="72" cy="70" r="37" fill="#1382a8"/><text x="50" y="81" class="n">ГР1</text><text x="36" y="138" class="t">Досліджую</text><text x="36" y="184" class="s">• формулюю проблему</text><text x="36" y="220" class="s">• висуваю гіпотезу</text><text x="36" y="256" class="s">• збираю дані</text><text x="36" y="292" class="s">• роблю висновок</text></g><g transform="translate(380)"><rect class="b" width="330" height="330" rx="30"/><circle cx="72" cy="70" r="37" fill="#c2871a"/><text x="50" y="81" class="n">ГР2</text><text x="36" y="138" class="t">Працюю з джерелами</text><text x="36" y="184" class="s">• читаю карти</text><text x="36" y="220" class="s">• аналізую таблиці</text><text x="36" y="256" class="s">• перевіряю джерела</text><text x="36" y="292" class="s">• зіставляю дані</text></g><g transform="translate(760)"><rect class="b" width="330" height="330" rx="30"/><circle cx="72" cy="70" r="37" fill="#2d8b63"/><text x="50" y="81" class="n">ГР3</text><text x="36" y="138" class="t">Пояснюю</text><text x="36" y="184" class="s">• бачу закономірності</text><text x="36" y="220" class="s">• будую причинні зв’язки</text><text x="36" y="256" class="s">• аргументую</text><text x="36" y="292" class="s">• оцінюю наслідки</text></g></g><rect x="120" y="550" width="960" height="58" rx="22" fill="#ffffffcc" stroke="#d5e4ea" stroke-width="2"/><text x="180" y="587" class="t">Фінальний результат = дані + карта + пояснення + чесна самооцінка</text></svg>
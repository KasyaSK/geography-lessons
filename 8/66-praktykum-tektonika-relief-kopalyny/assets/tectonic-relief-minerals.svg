<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Тектоніка — рельєф — корисні копалини</title><desc id="d">Навчальна причинна схема трьох типових геологічних ситуацій України</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef8ff"/><stop offset=".5" stop-color="#fff5dc"/><stop offset="1" stop-color="#eef8ee"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#173b4d}.s{font:700 24px system-ui,sans-serif;fill:#294b5b}.q{font:600 20px system-ui,sans-serif;fill:#5f6f77}.box{fill:white;stroke:#cddfe6;stroke-width:3}.a{stroke:#5a8ea5;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}.n{font:900 27px system-ui,sans-serif;fill:white}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#5a8ea5"/></marker></defs><rect width="1200" height="660" rx="38" fill="url(#bg)"/><text x="55" y="74" class="h">Шукаємо не збіг, а причинний ланцюг</text><text x="55" y="112" class="q">Тектонічна структура → геологічна історія → форма рельєфу → типові ресурси</text><g transform="translate(55 165)"><rect class="box" width="320" height="360" rx="28"/><circle cx="55" cy="55" r="30" fill="#3a7895"/><text x="47" y="65" class="n">1</text><text x="100" y="62" class="s">Український щит</text><text x="30" y="125" class="q">давній кристалічний фундамент</text><text x="30" y="165" class="q">→ виходи твердих порід</text><text x="30" y="205" class="q">→ височини, пороги, скелі</text><text x="30" y="245" class="q">→ рудні копалини, граніт</text><text x="30" y="305" class="s">Ключ: фундамент близько</text><text x="30" y="337" class="s">до поверхні</text></g><path class="a" d="M390 345H435"/><g transform="translate(445 165)"><rect class="box" width="320" height="360" rx="28"/><circle cx="55" cy="55" r="30" fill="#d7973f"/><text x="47" y="65" class="n">2</text><text x="100" y="62" class="s">Западина</text><text x="30" y="125" class="q">прогин земної кори</text><text x="30" y="165" class="q">→ потужний шар осадів</text><text x="30" y="205" class="q">→ переважно нижчий рельєф</text><text x="30" y="245" class="q">→ нафта, газ, солі</text><text x="30" y="305" class="s">Ключ: осадовий</text><text x="30" y="337" class="s">чохол великої товщини</text></g><path class="a" d="M780 345H825"/><g transform="translate(835 165)"><rect class="box" width="310" height="360" rx="28"/><circle cx="55" cy="55" r="30" fill="#4c8b5b"/><text x="47" y="65" class="n">3</text><text x="100" y="62" class="s">Складчаста область</text><text x="30" y="125" class="q">молоді деформації порід</text><text x="30" y="165" class="q">→ підняття й складчастість</text><text x="30" y="205" class="q">→ гірський рельєф</text><text x="30" y="245" class="q">→ різні ресурси в поясах</text><text x="30" y="305" class="s">Ключ: активна</text><text x="30" y="337" class="s">геологічна історія</text></g><rect x="70" y="565" width="1060" height="60" rx="20" fill="#ffffffc9" stroke="#d6e2e6" stroke-width="2"/><text x="105" y="604" class="s">Не правило «одна структура = одна копалина», а перевірювана просторова закономірність.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Клімат — людина — господарство</title><desc id="d">Навчальна причинна модель впливу температури, вологості, опадів і вітру на здоров’я та господарську діяльність.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f7ff"/><stop offset="1" stop-color="#fff4cf"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="640" rx="34" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#173b4d">КЛІМАТ → ЕКСПОЗИЦІЯ → НАСЛІДОК → АДАПТАЦІЯ</text><g font-family="Arial,sans-serif" fill="#173b4d" filter="url(#s)"><g transform="translate(55 120)"><rect width="245" height="170" rx="24" fill="#fff" stroke="#9bc9dd"/><text x="122" y="44" text-anchor="middle" font-size="24" font-weight="700">🌡 Температура</text><text x="24" y="82" font-size="18">спека / мороз</text><text x="24" y="112" font-size="18">тривалі хвилі</text><text x="24" y="142" font-size="18">добові контрасти</text></g><g transform="translate(330 120)"><rect width="245" height="170" rx="24" fill="#fff" stroke="#9bc9dd"/><text x="122" y="44" text-anchor="middle" font-size="24" font-weight="700">💧 Вологість</text><text x="24" y="82" font-size="18">випаровування</text><text x="24" y="112" font-size="18">тепловіддача</text><text x="24" y="142" font-size="18">комфорт у приміщенні</text></g><g transform="translate(605 120)"><rect width="245" height="170" rx="24" fill="#fff" stroke="#9bc9dd"/><text x="122" y="44" text-anchor="middle" font-size="24" font-weight="700">🌧 Опади</text><text x="24" y="82" font-size="18">врожайність</text><text x="24" y="112" font-size="18">водозабезпечення</text><text x="24" y="142" font-size="18">паводки / посуха</text></g><g transform="translate(880 120)"><rect width="245" height="170" rx="24" fill="#fff" stroke="#9bc9dd"/><text x="122" y="44" text-anchor="middle" font-size="24" font-weight="700">💨 Вітер</text><text x="24" y="82" font-size="18">охолодження</text><text x="24" y="112" font-size="18">випаровування</text><text x="24" y="142" font-size="18">енергія / ризики</text></g></g><g stroke="#4b879e" stroke-width="4" fill="none"><path d="M175 302v58h220"/><path d="M452 302v58h-57"/><path d="M727 302v58h78"/><path d="M1002 302v58H805"/></g><g font-family="Arial,sans-serif"><g transform="translate(245 380)"><rect width="320" height="160" rx="25" fill="#eef9f5" stroke="#75baa8"/><text x="160" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#126b59">ЛЮДИНА</text><text x="25" y="80" font-size="18" fill="#173b4d">• терморегуляція і самопочуття</text><text x="25" y="110" font-size="18" fill="#173b4d">• працездатність і безпека</text><text x="25" y="140" font-size="18" fill="#173b4d">• адаптація поведінки</text></g><g transform="translate(635 380)"><rect width="320" height="160" rx="25" fill="#fff7df" stroke="#d8ad4e"/><text x="160" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#8d6615">ГОСПОДАРСТВО</text><text x="25" y="80" font-size="18" fill="#173b4d">• сільське господарство</text><text x="25" y="110" font-size="18" fill="#173b4d">• транспорт і будівництво</text><text x="25" y="140" font-size="18" fill="#173b4d">• енергетика й туризм</text></g></g><path d="M565 460h70" stroke="#d36d42" stroke-width="5" stroke-dasharray="10 8"/><text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#607986">Навчальна причинна модель — не карта і не медична діагностика. Висновки перевіряємо даними.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Проєктний канвас: степова зона України</title><desc id="d">Схема від питання і просторових доказів до рішення та захисту проєкту</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fff4c9"/><stop offset=".5" stop-color="#eef7d8"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#3a452e}.s{font:700 23px system-ui,sans-serif;fill:#4c5d3a}.q{font:600 18px system-ui,sans-serif;fill:#6c735f}.b{fill:white;stroke:#d8dfc7;stroke-width:3}.a{fill:#728f3f}.n{font:900 28px system-ui,sans-serif;fill:white}.l{stroke:#9aab74;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#9aab74"/></marker></defs><rect width="1200" height="650" rx="40" fill="url(#bg)"/><text x="55" y="75" class="h">Степ: від красивої картинки до доказового проєкту</text><text x="55" y="112" class="q">Не «степ сухий і трав'янистий», а питання → просторові докази → механізм → рішення → перевірка</text><g transform="translate(45 175)"><g><rect class="b" width="190" height="235" rx="28"/><circle class="a" cx="95" cy="50" r="30"/><text class="n" x="86" y="60">1</text><text class="s" x="28" y="116">Проблема</text><text class="q" x="24" y="156">що змінилося?</text><text class="q" x="24" y="187">де саме?</text></g><path class="l" d="M200 117 H238"/><g transform="translate(250)"><rect class="b" width="190" height="235" rx="28"/><circle class="a" cx="95" cy="50" r="30"/><text class="n" x="86" y="60">2</text><text class="s" x="28" y="116">Докази</text><text class="q" x="24" y="156">карта + фото</text><text class="q" x="24" y="187">дані + джерело</text></g><path class="l" d="M450 117 H488"/><g transform="translate(500)"><rect class="b" width="190" height="235" rx="28"/><circle class="a" cx="95" cy="50" r="30"/><text class="n" x="86" y="60">3</text><text class="s" x="22" y="116">Механізм</text><text class="q" x="24" y="156">клімат → ґрунт</text><text class="q" x="24" y="187">людина → зміни</text></g><path class="l" d="M700 117 H738"/><g transform="translate(750)"><rect class="b" width="190" height="235" rx="28"/><circle class="a" cx="95" cy="50" r="30"/><text class="n" x="86" y="60">4</text><text class="s" x="34" y="116">Рішення</text><text class="q" x="24" y="156">що робимо?</text><text class="q" x="24" y="187">для кого?</text></g><path class="l" d="M950 117 H988"/><g transform="translate(1000)"><rect class="b" width="155" height="235" rx="28"/><circle class="a" cx="77" cy="50" r="30"/><text class="n" x="68" y="60">5</text><text class="s" x="25" y="116">Захист</text><text class="q" x="19" y="156">висновок</text><text class="q" x="19" y="187">критерій</text></g></g><rect x="65" y="485" width="1070" height="105" rx="26" fill="#ffffffc9" stroke="#d8dfc7" stroke-width="3"/><text x="100" y="530" class="s">Сильний проєкт: 2+ незалежні джерела, карта, причинний зв'язок, реалістичне рішення й спосіб перевірити результат.</text><text x="100" y="565" class="q">Карта земного покриву не є картою природних зон; поле не дорівнює степу, навіть якщо обидва виглядають «відкритими».</text></svg>
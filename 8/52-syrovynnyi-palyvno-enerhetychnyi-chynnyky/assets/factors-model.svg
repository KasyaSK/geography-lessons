<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Сировинний і паливно-енергетичний чинники</title><desc id="d">Навчальна схема вибору місця виробництва між сировиною, енергією, транспортом та споживачем.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".52" stop-color="#fff4d8"/><stop offset="1" stop-color="#eaf9ef"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="34" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" fill="#17394c"><text x="600" y="58" text-anchor="middle" font-size="32" font-weight="800">Де розмістити виробництво?</text><text x="600" y="92" text-anchor="middle" font-size="18" fill="#587488">Не «біля чогось» взагалі, а біля того ресурсу, переміщення якого найдорожче або найскладніше.</text></g><g filter="url(#sh)" font-family="Inter,Arial,sans-serif"><rect x="55" y="160" width="240" height="170" rx="26" fill="#fff" stroke="#badfee"/><circle cx="175" cy="205" r="34" fill="#dff3ff"/><text x="175" y="216" text-anchor="middle" font-size="34">⛏</text><text x="175" y="265" text-anchor="middle" font-size="24" font-weight="800" fill="#176f98">Сировина</text><text x="175" y="297" text-anchor="middle" font-size="16" fill="#587488">маса • втрата ваги</text><text x="175" y="320" text-anchor="middle" font-size="16" fill="#587488">родовище • кар’єр • шахта</text><rect x="335" y="160" width="240" height="170" rx="26" fill="#fff" stroke="#f2d69c"/><circle cx="455" cy="205" r="34" fill="#fff1c9"/><text x="455" y="216" text-anchor="middle" font-size="34">⚡</text><text x="455" y="265" text-anchor="middle" font-size="24" font-weight="800" fill="#9d6818">Енергія</text><text x="455" y="297" text-anchor="middle" font-size="16" fill="#587488">енергоємність • надійність</text><text x="455" y="320" text-anchor="middle" font-size="16" fill="#587488">ТЕС • ГЕС • АЕС • ВДЕ</text><rect x="625" y="160" width="240" height="170" rx="26" fill="#fff" stroke="#bfe4cf"/><circle cx="745" cy="205" r="34" fill="#e2f7e9"/><text x="745" y="216" text-anchor="middle" font-size="34">🚆</text><text x="745" y="265" text-anchor="middle" font-size="24" font-weight="800" fill="#187a61">Транспорт</text><text x="745" y="297" text-anchor="middle" font-size="16" fill="#587488">відстань • тоннаж</text><text x="745" y="320" text-anchor="middle" font-size="16" fill="#587488">залізниця • авто • мережа</text><rect x="905" y="160" width="240" height="170" rx="26" fill="#fff" stroke="#d9cced"/><circle cx="1025" cy="205" r="34" fill="#f0e9fa"/><text x="1025" y="216" text-anchor="middle" font-size="34">🏙</text><text x="1025" y="265" text-anchor="middle" font-size="24" font-weight="800" fill="#7957ad">Споживач</text><text x="1025" y="297" text-anchor="middle" font-size="16" fill="#587488">ринок • кадри • мережі</text><text x="1025" y="320" text-anchor="middle" font-size="16" fill="#587488">місто • промвузол • експорт</text></g><g stroke="#42677c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M175 350 C230 420 330 420 455 350"/><path d="M455 350 C535 445 660 445 745 350"/><path d="M745 350 C825 420 940 420 1025 350"/></g><g font-family="Inter,Arial,sans-serif"><rect x="360" y="420" width="480" height="64" rx="22" fill="#17394c"/><text x="600" y="449" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">Ключове питання</text><text x="600" y="474" text-anchor="middle" fill="#d9edf6" font-size="17">Що дорожче переміщувати: сировину, паливо / енергію чи готовий продукт?</text></g></svg>
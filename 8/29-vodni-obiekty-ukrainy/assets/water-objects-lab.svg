<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Як утворюються й працюють водні об’єкти</title><desc id="d">Навчальна причинна модель озера, болота, водосховища, каналу та підземних вод. Це схема, не карта.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff8df"/></linearGradient><linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5b985"/><stop offset="1" stop-color="#92704f"/></linearGradient><style>.h{font:800 28px system-ui;fill:#16384b}.t{font:600 20px system-ui;fill:#244a5d}.s{font:500 16px system-ui;fill:#4d6774}.box{fill:#fff;stroke:#c8e0e8;stroke-width:2}.water{fill:#61c5ea}.wet{fill:#81c59b}.arrow{stroke:#167e9d;stroke-width:5;fill:none;marker-end:url(#a)}.dash{stroke:#496f7f;stroke-width:3;stroke-dasharray:8 8;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#167e9d"/></marker></defs><rect width="1200" height="720" rx="28" fill="url(#sky)"/><text x="48" y="58" class="h">ВОДНІ ОБ’ЄКТИ: ПРИРОДНІ ПРОЦЕСИ Й ЛЮДСЬКІ РІШЕННЯ</text><text x="48" y="88" class="s">Навчальна причинна модель — не карта і не масштабне зображення.</text><g transform="translate(45 120)"><rect class="box" width="535" height="245" rx="22"/><text x="24" y="40" class="h">1. Озеро</text><path d="M40 145 Q130 70 220 150 Q320 235 470 125 L495 205 L40 205Z" fill="#b8d59d"/><path class="water" d="M135 154 Q225 125 325 158 Q385 177 452 146 L452 194 L135 194Z"/><path class="arrow" d="M88 90 Q130 105 159 139"/><text x="24" y="225" class="s">Улоговина + надходження води → озеро</text><text x="305" y="78" class="t">Походження улоговини:</text><text x="305" y="105" class="s">зсувне • карстове</text><text x="305" y="130" class="s">льодовикове • заплавне</text></g><g transform="translate(620 120)"><rect class="box" width="535" height="245" rx="22"/><text x="24" y="40" class="h">2. Болото</text><rect x="34" y="142" width="465" height="62" rx="16" fill="#715642"/><rect x="34" y="107" width="465" height="43" rx="16" class="wet"/><path d="M50 112 Q95 68 135 112M170 112Q215 62 260 112M300 112Q350 70 400 112M420 112Q455 80 490 112" stroke="#3d875a" stroke-width="10" fill="none"/><path class="arrow" d="M75 62v42M205 62v42M342 62v42"/><text x="24" y="225" class="s">Надлишок вологи + слабкий стік → накопичення органіки/торфу</text></g><g transform="translate(45 395)"><rect class="box" width="535" height="250" rx="22"/><text x="24" y="40" class="h">3. Водосховище й канал</text><path d="M35 180 Q120 120 220 170 Q300 210 465 135 L500 205 L35 205Z" fill="#b8d59d"/><path class="water" d="M85 166 Q205 138 360 168 L360 202 L85 202Z"/><rect x="355" y="112" width="22" height="96" rx="5" fill="#66727a"/><path d="M377 170 C420 170 445 150 500 150" class="arrow"/><text x="25" y="75" class="t">гребля → штучна водойма</text><text x="25" y="102" class="s">канал → штучне русло для переміщення води</text><text x="24" y="232" class="s">Користь і наслідки оцінюємо разом, а не окремо.</text></g><g transform="translate(620 395)"><rect class="box" width="535" height="250" rx="22"/><text x="24" y="40" class="h">4. Підземні води</text><rect x="28" y="82" width="478" height="42" rx="12" fill="#cfae77"/><rect x="28" y="124" width="478" height="55" rx="12" fill="#8fd4eb"/><rect x="28" y="179" width="478" height="38" rx="12" fill="#8a6c51"/><path class="arrow" d="M80 58v54M160 58v54M240 58v54"/><path d="M390 58v124" stroke="#425a66" stroke-width="10"/><circle cx="390" cy="150" r="10" fill="#fff"/><text x="270" y="102" class="s">водопроникний шар</text><text x="46" y="158" class="t">водоносний горизонт</text><text x="46" y="205" class="s">водотривкий шар</text><text x="405" y="75" class="s">свердловина</text><text x="24" y="238" class="s">Інфільтрація → накопичення в порах/тріщинах → джерело або свердловина</text></g></svg>
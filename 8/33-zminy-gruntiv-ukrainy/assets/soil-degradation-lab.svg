<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Причинна модель деградації ґрунту</title><desc id="d">Навчальна схема: чинники тиску, процеси деградації, наслідки та способи відновлення ґрунту.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#edf9ee"/><stop offset=".52" stop-color="#fff7db"/><stop offset="1" stop-color="#eef6ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="650" rx="36" fill="url(#bg)"/><text x="60" y="66" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#254132">Не «ґрунт став гіршим», а причинний ланцюг</text><text x="60" y="100" font-family="Arial,sans-serif" font-size="17" fill="#607266">Навчальна модель • не карта і не вимірювання</text><g filter="url(#s)" font-family="Arial,sans-serif"><rect x="55" y="145" width="250" height="350" rx="28" fill="#fff" stroke="#d7e4d9"/><text x="85" y="188" font-size="22" font-weight="700" fill="#84452f">ТИСК</text><text x="85" y="230" font-size="18" fill="#354a3c">• оголений ґрунт</text><text x="85" y="267" font-size="18" fill="#354a3c">• надмірний обробіток</text><text x="85" y="304" font-size="18" fill="#354a3c">• знищення лісосмуг</text><text x="85" y="341" font-size="18" fill="#354a3c">• важка техніка</text><text x="85" y="378" font-size="18" fill="#354a3c">• хибне зрошення</text><text x="85" y="415" font-size="18" fill="#354a3c">• забруднення</text><text x="85" y="452" font-size="18" fill="#354a3c">• посуха / зливи</text><rect x="345" y="145" width="250" height="350" rx="28" fill="#fff" stroke="#d7e4d9"/><text x="375" y="188" font-size="22" font-weight="700" fill="#9a6a1d">ПРОЦЕС</text><text x="375" y="230" font-size="18" fill="#354a3c">→ водна ерозія</text><text x="375" y="267" font-size="18" fill="#354a3c">→ дефляція</text><text x="375" y="304" font-size="18" fill="#354a3c">→ ущільнення</text><text x="375" y="341" font-size="18" fill="#354a3c">→ дегуміфікація</text><text x="375" y="378" font-size="18" fill="#354a3c">→ засолення</text><text x="375" y="415" font-size="18" fill="#354a3c">→ забруднення</text><text x="375" y="452" font-size="18" fill="#354a3c">→ опустелювання</text><rect x="635" y="145" width="250" height="350" rx="28" fill="#fff" stroke="#d7e4d9"/><text x="665" y="188" font-size="22" font-weight="700" fill="#356b91">НАСЛІДОК</text><text x="665" y="230" font-size="18" fill="#354a3c">↓ гумус</text><text x="665" y="267" font-size="18" fill="#354a3c">↓ інфільтрація води</text><text x="665" y="304" font-size="18" fill="#354a3c">↓ родючість</text><text x="665" y="341" font-size="18" fill="#354a3c">↑ поверхневий стік</text><text x="665" y="378" font-size="18" fill="#354a3c">↑ пил / замулення</text><text x="665" y="415" font-size="18" fill="#354a3c">↑ ризик неврожаю</text><text x="665" y="452" font-size="18" fill="#354a3c">↓ стійкість екосистем</text><rect x="925" y="145" width="220" height="350" rx="28" fill="#fff" stroke="#d7e4d9"/><text x="955" y="188" font-size="22" font-weight="700" fill="#267452">ВІДНОВЛЕННЯ</text><text x="955" y="230" font-size="18" fill="#354a3c">✓ покривні культури</text><text x="955" y="267" font-size="18" fill="#354a3c">✓ сівозміна</text><text x="955" y="304" font-size="18" fill="#354a3c">✓ лісосмуги</text><text x="955" y="341" font-size="18" fill="#354a3c">✓ мінімальний обробіток</text><text x="955" y="378" font-size="18" fill="#354a3c">✓ контурне землеробство</text><text x="955" y="415" font-size="18" fill="#354a3c">✓ точне зрошення</text><text x="955" y="452" font-size="18" fill="#354a3c">✓ моніторинг</text></g><g fill="none" stroke="#4f7a61" stroke-width="6" stroke-linecap="round"><path d="M310 320h28"/><path d="M600 320h28"/><path d="M890 320h28"/></g><g fill="#4f7a61"><path d="M338 310l18 10-18 10z"/><path d="M628 310l18 10-18 10z"/><path d="M918 310l18 10-18 10z"/></g><rect x="185" y="535" width="830" height="70" rx="22" fill="#2e7b58"/><text x="600" y="567" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Головне питання: який механізм пояснює спостережений симптом?</text><text x="600" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#eafff3">Доказ → причина → процес → наслідок → відповідне рішення</text></svg>
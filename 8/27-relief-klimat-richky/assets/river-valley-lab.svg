<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Як рельєф і клімат впливають на річку</title><desc id="d">Навчальна причинна схема: крутий схил утворює швидшу течію і вузьку долину, пологий схил — повільнішу течію, широку заплаву й меандри; опади й сніготанення впливають на водність.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff8df"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7fb585"/><stop offset="1" stop-color="#477c65"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54c5f1"/><stop offset="1" stop-color="#167db8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".14"/></filter></defs><rect width="1200" height="620" rx="28" fill="url(#sky)"/><text x="55" y="62" font-family="system-ui,sans-serif" font-size="31" font-weight="800" fill="#17394d">РЕЛЬЄФ + КЛІМАТ → ХАРАКТЕР РІЧКИ</text><text x="55" y="96" font-family="system-ui,sans-serif" font-size="18" fill="#557483">Навчальна причинна модель, не топографічна карта</text><g transform="translate(45 135)" filter="url(#s)"><rect width="530" height="405" rx="24" fill="#fff"/><text x="28" y="43" font-family="system-ui" font-size="23" font-weight="800" fill="#17394d">Гірська ділянка</text><path d="M20 290 L110 185 L170 230 L255 95 L338 190 L420 125 L510 285 Z" fill="url(#m)"/><path d="M260 118 C262 165 240 190 235 223 C230 255 250 285 275 318 C295 345 296 365 294 388" fill="none" stroke="url(#w)" stroke-width="25" stroke-linecap="round"/><path d="M255 147 l-15 27 28-7z M245 218 l-18 25 30-5z M264 291 l-10 28 27-12z" fill="#fff" opacity=".85"/><text x="30" y="333" font-family="system-ui" font-size="17" fill="#17394d">великий похил → швидка течія</text><text x="30" y="360" font-family="system-ui" font-size="17" fill="#17394d">глибинна ерозія → вузька V-подібна долина</text><text x="30" y="387" font-family="system-ui" font-size="17" fill="#17394d">пороги / водоспади можливі на стійких породах</text></g><g transform="translate(625 135)" filter="url(#s)"><rect width="530" height="405" rx="24" fill="#fff"/><text x="28" y="43" font-family="system-ui" font-size="23" font-weight="800" fill="#17394d">Рівнинна ділянка</text><path d="M20 250 Q160 215 270 238 T510 230 L510 315 Q350 300 20 322Z" fill="#97c68b"/><path d="M35 264 C110 220 155 310 230 265 S345 222 410 270 S490 305 505 250" fill="none" stroke="url(#w)" stroke-width="31" stroke-linecap="round"/><path d="M36 290 C135 330 205 325 285 300 S435 315 505 292" fill="none" stroke="#caeebf" stroke-width="6" stroke-dasharray="12 10"/><text x="30" y="333" font-family="system-ui" font-size="17" fill="#17394d">малий похил → повільніша течія</text><text x="30" y="360" font-family="system-ui" font-size="17" fill="#17394d">бічна ерозія → широка долина й заплава</text><text x="30" y="387" font-family="system-ui" font-size="17" fill="#17394d">меандри зміщуються, русло стає звивистим</text></g><g transform="translate(90 563)"><circle cx="0" cy="0" r="11" fill="#4aa8d8"/><text x="20" y="7" font-family="system-ui" font-size="17" fill="#17394d">більше опадів / сніготанення → більший стік і водність; посуха → менша водність</text></g></svg>
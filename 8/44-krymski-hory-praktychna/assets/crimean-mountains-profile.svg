<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Кримські гори: пасма і висотна поясність</title><desc id="d">Навчальна схема трьох пасом і вертикальної зміни природних комплексів</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff6df"/></linearGradient><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#d8b47a"/><stop offset=".45" stop-color="#7db275"/><stop offset="1" stop-color="#9aa5a2"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#sky)"/><text x="60" y="72" font-family="system-ui" font-size="42" font-weight="800" fill="#17384f">Кримські гори: читаємо рельєф як систему</text><path d="M0 570 L150 500 L300 520 L470 410 L610 470 L790 260 L920 300 L1060 180 L1200 260 L1200 680 L0 680 Z" fill="url(#g)" opacity=".95"/><path d="M0 570 L150 500 L300 520" fill="none" stroke="#7a633b" stroke-width="8"/><path d="M300 520 L470 410 L610 470" fill="none" stroke="#6d5a40" stroke-width="8"/><path d="M610 470 L790 260 L920 300 L1060 180 L1200 260" fill="none" stroke="#4c5a50" stroke-width="10"/><g font-family="system-ui" fill="#16384d"><text x="115" y="480" font-size="28" font-weight="800">Зовнішнє пасмо</text><text x="400" y="390" font-size="28" font-weight="800">Внутрішнє пасмо</text><text x="790" y="220" font-size="30" font-weight="900">Головне пасмо</text><text x="985" y="145" font-size="24" font-weight="800">Роман-Кош 1545 м</text></g><g font-family="system-ui" font-size="22" font-weight="700"><rect x="770" y="490" width="360" height="48" rx="18" fill="#f2d6a2"/><text x="792" y="522" fill="#5e482c">передгір'я / сухі ліси й чагарники</text><rect x="770" y="430" width="360" height="48" rx="18" fill="#b8d6a3"/><text x="792" y="462" fill="#315635">дубові та букові ліси</text><rect x="770" y="370" width="360" height="48" rx="18" fill="#dce6df"/><text x="792" y="402" fill="#40534a">яйли, гірські луки, карст</text></g><path d="M720 540 V340" stroke="#29566e" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#29566e"/></marker></defs><text x="615" y="575" font-family="system-ui" font-size="21" font-weight="700" fill="#29566e">з висотою ↓T, змінюються ґрунти й рослинність</text><rect x="55" y="595" width="1090" height="56" rx="22" fill="#ffffffd9" stroke="#cfdde2"/><text x="85" y="630" font-family="system-ui" font-size="21" font-weight="700" fill="#415466">Схема навчальна: межі поясів умовні; реальна висотна поясність залежить від експозиції схилів, висоти та близькості моря.</text></svg>
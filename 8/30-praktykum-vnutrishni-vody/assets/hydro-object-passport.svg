<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Паспорт гідрографічного об’єкта</title><desc id="d">Навчальна схема для практичної роботи: місце, тип об’єкта, басейн, живлення, режим, використання, ризики та висновок.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#e8fff2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="36" fill="url(#g)"/><text x="60" y="74" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123c52">Паспорт гідрографічного об’єкта</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#4c6b7a">Навчальна схема — не карта і не набір виміряних даних</text><g font-family="Arial,sans-serif" font-size="22" fill="#123c52"><g filter="url(#s)"><rect x="60" y="160" width="245" height="118" rx="22" fill="#fff"/><text x="82" y="202" font-weight="700">1. ДЕ?</text><text x="82" y="237">назва • координати</text><text x="82" y="266">населений пункт</text></g><g filter="url(#s)"><rect x="337" y="160" width="245" height="118" rx="22" fill="#fff"/><text x="359" y="202" font-weight="700">2. ЩО?</text><text x="359" y="237">річка • озеро</text><text x="359" y="266">ставок • канал...</text></g><g filter="url(#s)"><rect x="614" y="160" width="245" height="118" rx="22" fill="#fff"/><text x="636" y="202" font-weight="700">3. ЯК ПРАЦЮЄ?</text><text x="636" y="237">басейн • живлення</text><text x="636" y="266">режим • стік</text></g><g filter="url(#s)"><rect x="891" y="160" width="245" height="118" rx="22" fill="#fff"/><text x="913" y="202" font-weight="700">4. ДЛЯ ЧОГО?</text><text x="913" y="237">водопостачання</text><text x="913" y="266">природа • господарство</text></g><g filter="url(#s)"><rect x="198" y="330" width="330" height="122" rx="22" fill="#fff"/><text x="220" y="372" font-weight="700">5. ЯКІ РИЗИКИ?</text><text x="220" y="408">забруднення • маловоддя</text><text x="220" y="437">підтоплення • зарегулювання</text></g><g filter="url(#s)"><rect x="670" y="330" width="330" height="122" rx="22" fill="#fff"/><text x="692" y="372" font-weight="700">6. ЩО ДОВЕДЕНО?</text><text x="692" y="408">факт → доказ → пояснення</text><text x="692" y="437">аргументований висновок</text></g></g><path d="M305 219h32m245 0h32m245 0h32M528 391h142" stroke="#2c95b5" stroke-width="8" stroke-linecap="round"/><path d="M325 207l16 12-16 12M602 207l16 12-16 12M879 207l16 12-16 12M652 379l16 12-16 12" fill="none" stroke="#2c95b5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
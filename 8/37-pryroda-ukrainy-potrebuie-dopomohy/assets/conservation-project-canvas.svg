<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Канва природоохоронного проєкту</title><desc id="d">Схема від проблеми біорізноманіття через докази і карту до природоохоронного рішення та показника успіху</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e9f8ee"/><stop offset=".55" stop-color="#fff5d9"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#193c32}.s{font:700 23px system-ui,sans-serif;fill:#244b40}.q{font:600 18px system-ui,sans-serif;fill:#5d7068}.n{font:900 27px system-ui,sans-serif;fill:white}.b{fill:white;stroke:#cfe1d5;stroke-width:3}.a{fill:#2f7d5b}.l{stroke:#74a28b;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#74a28b"/></marker></defs><rect width="1200" height="680" rx="38" fill="url(#bg)"/><text x="55" y="72" class="h">Проєкт: від проблеми до рішення</text><text x="55" y="108" class="q">Не «врятуємо природу», а покажемо: що саме, де, чому і як перевіримо результат</text><g transform="translate(45 175)"><g><rect class="b" width="190" height="235" rx="26"/><circle class="a" cx="95" cy="50" r="29"/><text class="n" x="87" y="60">1</text><text class="s" x="31" y="112">Проблема</text><text class="q" x="26" y="153">вид / угруповання</text><text class="q" x="26" y="182">оселище / ліс</text><text class="q" x="26" y="211">конкретна загроза</text></g><path class="l" d="M200 117 H245"/><g transform="translate(255)"><rect class="b" width="190" height="235" rx="26"/><circle class="a" cx="95" cy="50" r="29"/><text class="n" x="87" y="60">2</text><text class="s" x="43" y="112">Докази</text><text class="q" x="25" y="153">Червона / Зелена</text><text class="q" x="25" y="182">офіційне джерело</text><text class="q" x="25" y="211">карта / фото</text></g><path class="l" d="M455 117 H500"/><g transform="translate(510)"><rect class="b" width="190" height="235" rx="26"/><circle class="a" cx="95" cy="50" r="29"/><text class="n" x="87" y="60">3</text><text class="s" x="47" y="112">Простір</text><text class="q" x="25" y="153">де проблема?</text><text class="q" x="25" y="182">що поруч?</text><text class="q" x="25" y="211">який масштаб?</text></g><path class="l" d="M710 117 H755"/><g transform="translate(765)"><rect class="b" width="190" height="235" rx="26"/><circle class="a" cx="95" cy="50" r="29"/><text class="n" x="87" y="60">4</text><text class="s" x="41" y="112">Рішення</text><text class="q" x="25" y="153">дія + виконавець</text><text class="q" x="25" y="182">ресурси / правила</text><text class="q" x="25" y="211">ризики рішення</text></g><path class="l" d="M965 117 H1010"/><g transform="translate(1020)"><rect class="b" width="140" height="235" rx="26"/><circle class="a" cx="70" cy="50" r="29"/><text class="n" x="62" y="60">5</text><text class="s" x="24" y="112">Міра</text><text class="q" x="17" y="153">як зрозуміти,</text><text class="q" x="17" y="182">що стало</text><text class="q" x="17" y="211">краще?</text></g></g><rect x="70" y="500" width="1060" height="115" rx="28" fill="#ffffffcc" stroke="#cfdfd3" stroke-width="3"/><text x="105" y="548" class="s">Сильний проєкт = 3 незалежні докази + карта + реалістичне рішення + показник успіху</text><text x="105" y="585" class="q">Охорона виду без охорони його оселища часто працює приблизно так само добре, як парасоля без тканини.</text></svg>
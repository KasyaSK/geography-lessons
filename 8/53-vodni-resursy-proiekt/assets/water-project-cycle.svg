<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">Проєктний цикл дослідження водних ресурсів</title><desc id="d">Проблема, карта і дані, водокористувачі, конфлікт інтересів, рішення, доказовий висновок.</desc><rect width="1100" height="430" rx="34" fill="#f7fcff"/><text x="55" y="62" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850" fill="#17384d">Проєкт: не «розкажіть про воду», а доведіть рішення</text><g font-family="Inter,Arial,sans-serif" font-weight="800" text-anchor="middle"><g transform="translate(55 120)"><rect width="145" height="110" rx="24" fill="#e2f4ff" stroke="#9ccce8"/><text x="72.5" y="48" font-size="20" fill="#176f98">1. Проблема</text><text x="72.5" y="78" font-size="15" fill="#49677a">Що саме</text><text x="72.5" y="98" font-size="15" fill="#49677a">треба вирішити?</text></g><g transform="translate(230 120)"><rect width="145" height="110" rx="24" fill="#e9f8f1" stroke="#a8d9c5"/><text x="72.5" y="48" font-size="20" fill="#187a61">2. Карта</text><text x="72.5" y="78" font-size="15" fill="#49677a">Де ресурс і</text><text x="72.5" y="98" font-size="15" fill="#49677a">хто від нього залежить?</text></g><g transform="translate(405 120)"><rect width="145" height="110" rx="24" fill="#fff5da" stroke="#e7ca7b"/><text x="72.5" y="48" font-size="20" fill="#9b6715">3. Дані</text><text x="72.5" y="78" font-size="15" fill="#49677a">Скільки води?</text><text x="72.5" y="98" font-size="15" fill="#49677a">Яка динаміка?</text></g><g transform="translate(580 120)"><rect width="145" height="110" rx="24" fill="#f3ecff" stroke="#cab4eb"/><text x="72.5" y="48" font-size="20" fill="#7750b0">4. Конфлікт</text><text x="72.5" y="78" font-size="15" fill="#49677a">Чиї інтереси</text><text x="72.5" y="98" font-size="15" fill="#49677a">не збігаються?</text></g><g transform="translate(755 120)"><rect width="145" height="110" rx="24" fill="#fff0ef" stroke="#e7b2ae"/><text x="72.5" y="48" font-size="20" fill="#b5544e">5. Рішення</text><text x="72.5" y="78" font-size="15" fill="#49677a">Що робити і</text><text x="72.5" y="98" font-size="15" fill="#49677a">якою ціною?</text></g><g transform="translate(930 120)"><rect width="115" height="110" rx="24" fill="#eaf2f7" stroke="#b5cbd9"/><text x="57.5" y="43" font-size="19" fill="#38586c">6. CER</text><text x="57.5" y="72" font-size="14" fill="#49677a">Теза</text><text x="57.5" y="91" font-size="14" fill="#49677a">+ докази</text></g></g><g stroke="#7895a7" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M202 175h24"/><path d="M377 175h24"/><path d="M552 175h24"/><path d="M727 175h24"/><path d="M902 175h24"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7895a7"/></marker></defs><rect x="90" y="285" width="920" height="85" rx="24" fill="#ffffff" stroke="#d5e5ee"/><text x="550" y="320" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="850" fill="#17384d">Фінальний продукт: 1 сторінка / 1 слайд / цифрова карта + 3 джерела + конкретний висновок</text><text x="550" y="350" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#648093">Критерій якості: рішення має випливати з карти й даних, а не з фрази «воду треба берегти».</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Водокористування України у 2025 році</title><desc id="d">Стовпчикова діаграма за даними Держводагентства: ЖКГ 40%, енергетика 32%, сільське лісове і рибне господарство 18%, переробна промисловість 5,5%, інші 4,5%.</desc><rect width="1000" height="560" rx="34" fill="#f5fbff"/><text x="55" y="66" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#17384d">Хто використовує воду в Україні?</text><text x="55" y="102" font-family="Inter,Arial,sans-serif" font-size="18" fill="#648093">Частка основних водоспоживачів за видами економічної діяльності, 2025</text><g transform="translate(70 145)" font-family="Inter,Arial,sans-serif"><line x1="0" y1="320" x2="855" y2="320" stroke="#bcd1df" stroke-width="2"/><g fill="#176f98"><rect x="20" y="40" width="125" height="280" rx="16"/><rect x="190" y="96" width="125" height="224" rx="16" fill="#20a184"/><rect x="360" y="194" width="125" height="126" rx="16" fill="#e5a22f"/><rect x="530" y="281.5" width="125" height="38.5" rx="12" fill="#8864c3"/><rect x="700" y="288.5" width="125" height="31.5" rx="12" fill="#6b8da1"/></g><g text-anchor="middle" font-size="24" font-weight="900" fill="#17384d"><text x="82.5" y="30">40%</text><text x="252.5" y="86">32%</text><text x="422.5" y="184">18%</text><text x="592.5" y="271">5,5%</text><text x="762.5" y="278">4,5%</text></g><g text-anchor="middle" font-size="16" font-weight="700" fill="#38586c"><text x="82.5" y="350"><tspan x="82.5">ЖКГ</tspan></text><text x="252.5" y="350"><tspan x="252.5">Енергетика</tspan></text><text x="422.5" y="350"><tspan x="422.5">С/г, лісове,</tspan><tspan x="422.5" dy="20">рибне</tspan></text><text x="592.5" y="350"><tspan x="592.5">Переробна</tspan><tspan x="592.5" dy="20">промисловість</tspan></text><text x="762.5" y="350">Інші</text></g></g><text x="55" y="520" font-family="Inter,Arial,sans-serif" font-size="16" fill="#648093">Джерело: Державне агентство водних ресурсів України, державний облік водокористування за 2025 рік.</text></svg>
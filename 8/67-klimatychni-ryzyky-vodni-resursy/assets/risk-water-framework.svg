<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Схема кліматичного ризику і водних ресурсів</title><desc id="d">Навчальна схема: небезпека, експозиція, вразливість, водні ресурси, рішення</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#fff4ce"/><stop offset="1" stop-color="#eaf8ee"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#17384b}.s{font:700 25px system-ui,sans-serif;fill:#244c63}.q{font:600 20px system-ui,sans-serif;fill:#627887}.box{fill:#fff;stroke:#cfdee7;stroke-width:3}.n{font:900 30px system-ui,sans-serif;fill:#fff}.c1{fill:#d46b59}.c2{fill:#e2aa36}.c3{fill:#478cb2}.c4{fill:#3e8b66}.l{stroke:#7798aa;stroke-width:5;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7798aa"/></marker></defs><rect width="1200" height="650" rx="42" fill="url(#bg)"/><text x="55" y="75" class="h">Як дослідити кліматично-водний ризик?</text><text x="55" y="114" class="q">Не вгадуємо — збираємо незалежні докази й пояснюємо механізм</text><g transform="translate(50 180)"><g><rect class="box" width="220" height="220" rx="28"/><circle class="c1" cx="110" cy="55" r="31"/><text x="101" y="66" class="n">1</text><text x="45" y="120" class="s">Небезпека</text><text x="35" y="158" class="q">спека • посуха</text><text x="35" y="190" class="q">злива • дефіцит</text></g><path class="l" d="M230 110 H280"/><g transform="translate(290)"><rect class="box" width="220" height="220" rx="28"/><circle class="c2" cx="110" cy="55" r="31"/><text x="101" y="66" class="n">2</text><text x="48" y="120" class="s">Експозиція</text><text x="38" y="158" class="q">люди • житло</text><text x="38" y="190" class="q">дороги • поля</text></g><path class="l" d="M520 110 H570"/><g transform="translate(580)"><rect class="box" width="220" height="220" rx="28"/><circle class="c3" cx="110" cy="55" r="31"/><text x="101" y="66" class="n">3</text><text x="39" y="120" class="s">Вразливість</text><text x="30" y="158" class="q">дренаж • запас</text><text x="30" y="190" class="q">якість • доступ</text></g><path class="l" d="M810 110 H860"/><g transform="translate(870)"><rect class="box" width="220" height="220" rx="28"/><circle class="c4" cx="110" cy="55" r="31"/><text x="101" y="66" class="n">4</text><text x="60" y="120" class="s">Рішення</text><text x="35" y="158" class="q">зменшити ризик</text><text x="35" y="190" class="q">і перевірити ефект</text></g></g><rect x="80" y="485" width="1040" height="105" rx="28" fill="#ffffffd9" stroke="#cfdee7" stroke-width="3"/><text x="115" y="532" class="s">Ризик ≠ лише погода. Вода може бути ресурсом, обмеженням або каналом небезпеки.</text><text x="115" y="570" class="q">Сильний висновок = локальні дані + карта + причинне пояснення + межі впевненості.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Карта курсу географії України</title><desc id="d">Шість пов'язаних блоків: карта, рельєф, клімат і води, ґрунти і біота, ресурси, держава</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8f6ff"/><stop offset=".5" stop-color="#fff5d8"/><stop offset="1" stop-color="#e9f8ef"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#173b4d}.s{font:700 24px system-ui,sans-serif;fill:#21485b}.q{font:600 19px system-ui,sans-serif;fill:#54707d}.n{font:900 30px system-ui,sans-serif;fill:white}.b{fill:white;stroke:#cfe0e8;stroke-width:3}.c1{fill:#2584b8}.c2{fill:#7a5fb3}.c3{fill:#278f76}.c4{fill:#8c7441}.c5{fill:#d2793f}.c6{fill:#b84f68}.l{stroke:#8daab6;stroke-width:5;fill:none;stroke-linecap:round}</style></defs><rect width="1200" height="760" rx="44" fill="url(#bg)"/><text x="60" y="78" class="h">Україна у світі: як складається географічна картина?</text><text x="60" y="118" class="q">Сильний географічний висновок поєднує карти, процеси, ресурси й діяльність людей</text><path class="l" d="M210 265 C390 190 470 195 600 260 S845 335 1010 255"/><path class="l" d="M210 500 C390 570 470 565 600 500 S845 425 1010 505"/><g transform="translate(95 185)"><rect class="b" width="250" height="160" rx="28"/><circle class="c1" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">1</text><text x="92" y="48" class="s">Карта</text><text x="28" y="91" class="q">положення • час</text><text x="28" y="121" class="q">координати • масштаб</text></g><g transform="translate(475 180)"><rect class="b" width="250" height="160" rx="28"/><circle class="c2" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">2</text><text x="92" y="48" class="s">Надра</text><text x="28" y="91" class="q">тектоніка • рельєф</text><text x="28" y="121" class="q">корисні копалини</text></g><g transform="translate(855 185)"><rect class="b" width="250" height="160" rx="28"/><circle class="c3" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">3</text><text x="92" y="48" class="s">Вода й клімат</text><text x="28" y="91" class="q">ризики • річки</text><text x="28" y="121" class="q">ресурси • режим</text></g><g transform="translate(95 430)"><rect class="b" width="250" height="160" rx="28"/><circle class="c4" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">4</text><text x="92" y="48" class="s">Ґрунти й біота</text><text x="28" y="91" class="q">зональність</text><text x="28" y="121" class="q">біорізноманіття</text></g><g transform="translate(475 435)"><rect class="b" width="250" height="160" rx="28"/><circle class="c5" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">5</text><text x="92" y="48" class="s">Ресурси</text><text x="28" y="91" class="q">використання</text><text x="28" y="121" class="q">наслідки • рішення</text></g><g transform="translate(855 430)"><rect class="b" width="250" height="160" rx="28"/><circle class="c6" cx="52" cy="50" r="28"/><text x="43" y="60" class="n">6</text><text x="92" y="48" class="s">Держава</text><text x="28" y="91" class="q">кордони • громади</text><text x="28" y="121" class="q">Україна у світі</text></g><rect x="230" y="645" width="740" height="70" rx="24" fill="#ffffffd9" stroke="#cfe0e8" stroke-width="3"/><text x="275" y="688" class="s">Фінальна навичка: доказовий висновок за картою й даними</text></svg>
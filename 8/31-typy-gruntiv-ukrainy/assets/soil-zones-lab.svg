<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fffaf0"/></linearGradient></defs><rect width="1200" height="640" rx="36" fill="url(#sky)"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183b4d">Чому ґрунти України змінюються з півночі на південь?</text><text x="60" y="102" font-family="Arial,sans-serif" font-size="19" fill="#557384">Навчальна причинна модель — не точна карта і не заміна атласу</text><g font-family="Arial,sans-serif"><rect x="60" y="155" width="250" height="360" rx="26" fill="#dcefcf"/><rect x="60" y="338" width="250" height="177" rx="0" fill="#8c6f52"/><rect x="60" y="338" width="250" height="45" fill="#3d3028"/><text x="85" y="205" font-size="25" font-weight="700" fill="#244b38">Полісся</text><text x="85" y="240" font-size="18" fill="#244b38">вологіше • промивний режим</text><text x="85" y="275" font-size="21" font-weight="700" fill="#244b38">дерново-підзолисті</text><text x="85" y="307" font-size="17" fill="#244b38">менше гумусу • кисліші</text><rect x="345" y="155" width="250" height="360" rx="26" fill="#e9e6ba"/><rect x="345" y="315" width="250" height="200" fill="#6d513b"/><rect x="345" y="315" width="250" height="85" fill="#2b211c"/><text x="370" y="205" font-size="25" font-weight="700" fill="#51461e">Лісостеп</text><text x="370" y="240" font-size="18" fill="#51461e">тепліше • опадів достатньо</text><text x="370" y="275" font-size="21" font-weight="700" fill="#51461e">сірі лісові + чорноземи</text><text x="370" y="307" font-size="17" fill="#51461e">гумусовий горизонт товстіший</text><rect x="630" y="155" width="250" height="360" rx="26" fill="#f5d9a8"/><rect x="630" y="290" width="250" height="225" fill="#7a5937"/><rect x="630" y="290" width="250" height="115" fill="#241b16"/><text x="655" y="205" font-size="25" font-weight="700" fill="#633b12">Степ</text><text x="655" y="240" font-size="18" fill="#633b12">тепло • вологи менше</text><text x="655" y="275" font-size="21" font-weight="700" fill="#633b12">чорноземи</text><text x="655" y="440" font-size="17" fill="#fff">потужний гумусовий горизонт</text><rect x="915" y="155" width="225" height="360" rx="26" fill="#f6c58d"/><rect x="915" y="300" width="225" height="215" fill="#9b7448"/><rect x="915" y="300" width="225" height="70" fill="#5a4029"/><text x="940" y="205" font-size="25" font-weight="700" fill="#714112">Південний степ</text><text x="940" y="240" font-size="18" fill="#714112">сухіше • випаровування ↑</text><text x="940" y="275" font-size="21" font-weight="700" fill="#714112">південні чорноземи</text><text x="940" y="407" font-size="19" font-weight="700" fill="#fff">+ каштанові</text><path d="M100 555 H1090" stroke="#2c7bb6" stroke-width="8" stroke-linecap="round"/><path d="M1090 555 l-24 -14 v28z" fill="#2c7bb6"/><text x="95" y="605" font-size="20" font-weight="700" fill="#315d72">вологіше</text><text x="972" y="605" font-size="20" font-weight="700" fill="#9b551c">сухіше</text><text x="430" y="595" font-size="19" fill="#557384">змінюються клімат, рослинність, водний режим → змінюється ґрунтоутворення</text></g></svg>
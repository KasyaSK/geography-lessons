<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Класифікація країн</title><desc id="d">Навчальна схема: площа і географічне положення — різні ознаки класифікації.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e6f8ff"/><stop offset="1" stop-color="#fff4d7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="650" rx="40" fill="url(#bg)"/><text x="60" y="82" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#15394f">Країну можна класифікувати за різними ознаками</text><g filter="url(#s)"><rect x="60" y="125" width="510" height="430" rx="30" fill="#fff"/><rect x="630" y="125" width="510" height="430" rx="30" fill="#fff"/></g><text x="100" y="185" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1679a7">1. За площею</text><text x="100" y="240" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• дуже великі / великі</text><text x="100" y="285" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• середні</text><text x="100" y="330" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• малі / дуже малі</text><text x="100" y="398" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">Площа — кількісна ознака.</text><text x="100" y="435" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">Одна країна може бути великою,</text><text x="100" y="470" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">але не мати виходу до океану.</text><text x="670" y="185" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#128064">2. За географічним положенням</text><text x="670" y="240" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• приморська / внутрішньоконтинентальна</text><text x="670" y="285" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• острівна / архіпелажна</text><text x="670" y="330" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• півострівна</text><text x="670" y="375" font-family="Arial,sans-serif" font-size="24" fill="#29485b">• трансконтинентальна</text><text x="670" y="435" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">Положення — просторове відношення.</text><text x="670" y="470" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">Воно впливає на транспорт, сусідів,</text><text x="670" y="505" font-family="Arial,sans-serif" font-size="20" fill="#5d7180">торгівлю та стратегічні можливості.</text><rect x="265" y="585" width="670" height="44" rx="22" fill="#18364c"/><text x="600" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Не плутайте ознаку класифікації з оцінкою «краща / гірша»</text></svg>
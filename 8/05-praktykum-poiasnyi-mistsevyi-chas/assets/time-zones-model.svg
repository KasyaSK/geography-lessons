<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Модель часових поясів Землі</title><desc id="d">Схематична модель 24 часових поясів по 15 градусів з меридіанами 0, 30 східної довготи та 180 градусів.</desc><defs><linearGradient id="sky" x1="0" x2="1"><stop stop-color="#e9f8ff"/><stop offset=".5" stop-color="#fff5cf"/><stop offset="1" stop-color="#eef9ed"/></linearGradient></defs><rect width="1200" height="520" rx="36" fill="url(#sky)"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324a">24 пояси × 15° = 360°</text><text x="60" y="102" font-family="Arial,sans-serif" font-size="18" fill="#526b7c">Схема для обчислень: географічна модель ≠ політична карта цивільного часу</text><g transform="translate(60 150)"><rect width="1080" height="210" rx="22" fill="#fff" stroke="#bcd4e1"/><g font-family="Arial,sans-serif" font-size="13" fill="#35556a"><path d="M45 0v210M90 0v210M135 0v210M180 0v210M225 0v210M270 0v210M315 0v210M360 0v210M405 0v210M450 0v210M495 0v210M540 0v210M585 0v210M630 0v210M675 0v210M720 0v210M765 0v210M810 0v210M855 0v210M900 0v210M945 0v210M990 0v210M1035 0v210" stroke="#d6e5ed"/><path d="M540 0v210" stroke="#1675aa" stroke-width="5"/><path d="M630 0v210" stroke="#12906f" stroke-width="5"/><path d="M0 0v210M1080 0v210" stroke="#d45c62" stroke-width="5"/><text x="515" y="-16" fill="#1675aa" font-weight="700">0°</text><text x="594" y="-16" fill="#12906f" font-weight="700">30° сх. д.</text><text x="0" y="238" fill="#d45c62" font-weight="700">180°</text><text x="1030" y="238" fill="#d45c62" font-weight="700">180°</text></g><g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="90" y="110">UTC−10</text><text x="270" y="110">UTC−6</text><text x="450" y="110">UTC−2</text><text x="540" y="110" fill="#1675aa">UTC±0</text><text x="630" y="110" fill="#12906f">UTC+2</text><text x="810" y="110">UTC+6</text><text x="990" y="110">UTC+10</text></g></g><g font-family="Arial,sans-serif"><rect x="60" y="410" width="330" height="64" rx="18" fill="#eef8fd"/><text x="80" y="437" font-size="17" font-weight="700" fill="#1675aa">1° довготи ≈ 4 хв часу</text><text x="80" y="462" font-size="14" fill="#526b7c">15° = 60 хв = 1 година</text><rect x="435" y="410" width="330" height="64" rx="18" fill="#eefaf5"/><text x="455" y="437" font-size="17" font-weight="700" fill="#12906f">На схід → додаємо час</text><text x="455" y="462" font-size="14" fill="#526b7c">На захід → віднімаємо</text><rect x="810" y="410" width="330" height="64" rx="18" fill="#fff3e7"/><text x="830" y="437" font-size="17" font-weight="700" fill="#9a5d00">Цивільний час перевіряємо</text><text x="830" y="462" font-size="14" fill="#526b7c">Правила держав можуть змінюватися</text></g></svg>
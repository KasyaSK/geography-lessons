<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Порівняння Чорного й Азовського морів</title><desc id="d">Навчальна схема порівнює глибину, солоність, водообмін і берегові форми двох морів України.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62b8e8"/><stop offset="1" stop-color="#153a78"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#80d7d0"/><stop offset="1" stop-color="#2b8f92"/></linearGradient></defs><rect width="1200" height="650" rx="38" fill="url(#bg)"/><text x="60" y="70" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#173b55">Два моря — дві різні системи</text><text x="60" y="108" font-family="system-ui,sans-serif" font-size="19" fill="#536f80">Схема не в масштабі: порівнюємо процеси, а не малюємо «гарну синю пляму».</text><rect x="55" y="145" width="515" height="430" rx="28" fill="#fff" stroke="#c9e2ee"/><rect x="630" y="145" width="515" height="430" rx="28" fill="#fff" stroke="#c9e2ee"/><text x="90" y="195" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#173b55">Чорне море</text><text x="665" y="195" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#173b55">Азовське море</text><rect x="90" y="230" width="445" height="210" rx="20" fill="url(#b)"/><path d="M90 270 Q180 235 265 270 T440 270 T535 260" fill="none" stroke="#dff5ff" stroke-width="8" opacity=".9"/><line x1="110" y1="315" x2="515" y2="315" stroke="#fff" stroke-dasharray="10 10" opacity=".75"/><text x="120" y="300" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">кисневий верхній шар</text><text x="120" y="355" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">глибокі води: дуже слабкий обмін,</text><text x="120" y="382" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">сірководень / аноксія</text><text x="120" y="420" font-family="system-ui,sans-serif" font-size="17" fill="#dff5ff">макс. ≈ 2212 м • 18–22‰</text><rect x="665" y="230" width="445" height="210" rx="20" fill="url(#a)"/><path d="M665 270 Q750 235 835 270 T1005 270 T1110 258" fill="none" stroke="#efffff" stroke-width="8" opacity=".95"/><path d="M690 398 Q785 365 880 398 T1078 392" fill="none" stroke="#d4b98b" stroke-width="18" opacity=".8"/><text x="695" y="305" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">майже все море — мілководдя</text><text x="695" y="340" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">швидше прогрівається й охолоджується</text><text x="695" y="420" font-family="system-ui,sans-serif" font-size="17" fill="#efffff">середня 7,4 м • макс. 14 м • ≈11,4‰</text><g font-family="system-ui,sans-serif" font-size="18" fill="#294c60"><text x="92" y="485">• Глибока улоговина + вузький Босфор → шаруватість вод.</text><text x="92" y="518">• Великий річковий стік знижує поверхневу солоність.</text><text x="92" y="551">• Шельф особливо широкий на північному заході.</text><text x="667" y="485">• Дуже мала глибина → сильна реакція на погоду.</text><text x="667" y="518">• Дон, Кубань і водообмін через Керченську протоку</text><text x="684" y="545">сильно впливають на солоність.</text><text x="667" y="575">• Коси, лимани, лагуни — ключові форми берегів.</text></g><path d="M545 365 C605 330 620 330 655 365" fill="none" stroke="#df9f44" stroke-width="7" marker-end="url(#m)"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#df9f44"/></marker></defs><text x="562" y="322" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#986221">Керченська протока</text><text x="60" y="625" font-family="system-ui,sans-serif" font-size="15" fill="#617988">Локальна навчальна схема • Скринченко К.А. • дані: Black Sea Commission, ЕСУ</text></svg>
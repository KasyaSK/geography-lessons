<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Причинна модель природних зон України</title><desc id="d">Схема зв’язку тепла, вологи, континентальності, рельєфу, ґрунтів, рослинності й природних зон</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8f7de"/><stop offset="1" stop-color="#fff1d6"/></linearGradient><style>.h{font:700 42px system-ui,sans-serif;fill:#214737}.s{font:700 24px system-ui,sans-serif;fill:#315646}.q{font:600 19px system-ui,sans-serif;fill:#647264}.b{fill:white;stroke:#cfe0d3;stroke-width:3}.a{fill:#3b825f}.n{font:900 26px system-ui,sans-serif;fill:white}.l{stroke:#7ca188;stroke-width:6;stroke-linecap:round;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7ca188"/></marker></defs><rect width="1200" height="700" rx="42" fill="url(#bg)"/><text x="60" y="78" class="h">Чому змінюються природні зони України?</text><text x="60" y="118" class="q">Не один чинник, а система взаємопов’язаних умов</text><g transform="translate(70 175)"><rect class="b" width="250" height="185" rx="26"/><circle class="a" cx="48" cy="45" r="28"/><text class="n" x="39" y="55">1</text><text class="s" x="95" y="52">Клімат</text><text class="q" x="28" y="102">тепло • волога</text><text class="q" x="28" y="138">континентальність</text><path class="l" d="M260 92H330"/><g transform="translate(340)"><rect class="b" width="250" height="185" rx="26"/><circle class="a" cx="48" cy="45" r="28"/><text class="n" x="39" y="55">2</text><text class="s" x="95" y="52">Рельєф і води</text><text class="q" x="28" y="102">висота • схили</text><text class="q" x="28" y="138">дренаж • долини</text></g><path class="l" d="M600 92H670"/><g transform="translate(680)"><rect class="b" width="250" height="185" rx="26"/><circle class="a" cx="48" cy="45" r="28"/><text class="n" x="39" y="55">3</text><text class="s" x="95" y="52">Ґрунти</text><text class="q" x="28" y="102">волога • гумус</text><text class="q" x="28" y="138">кислотність • текстура</text></g><path class="l" d="M930 92H995"/><g transform="translate(1005)"><rect class="b" width="130" height="185" rx="26"/><circle class="a" cx="65" cy="45" r="28"/><text class="n" x="56" y="55">4</text><text class="s" x="20" y="105">Біота</text><text class="q" x="15" y="140">рослини</text><text class="q" x="15" y="168">тварини</text></g></g><path class="l" d="M600 390V455"/><rect x="240" y="465" width="720" height="155" rx="30" fill="#fff" stroke="#cfe0d3" stroke-width="3"/><text x="300" y="520" class="s">Результат: природна зона / природний комплекс</text><text x="300" y="558" class="q">Полісся → широколисті ліси → лісостеп → степ</text><text x="300" y="590" class="q">+ висотна поясність у Карпатах і Кримських горах</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Як вода з території України потрапляє до морів</title><desc id="d">Навчальна причинна схема річкових систем і морів-приймачів. Не є картою та не показує точні межі басейнів.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fff4d5"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#167fb8"/></marker></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#17394d">Куди прямує вода? — логіка річкових систем</text><text x="60" y="108" font-family="system-ui,sans-serif" font-size="19" fill="#607987">Навчальна схема: напрямки правильні за системами, але це НЕ точна карта меж басейнів.</text><g font-family="system-ui,sans-serif"><rect x="70" y="160" width="300" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="220" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#17394d">Західний Буг</text><text x="220" y="228" text-anchor="middle" font-size="18" fill="#607987">→ Вісла</text><path d="M370 206H520" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="540" y="160" width="290" height="92" rx="22" fill="#edf7ff" stroke="#8fc3df"/><text x="685" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#126b9c">Балтійське море</text><rect x="70" y="295" width="300" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="220" y="333" text-anchor="middle" font-size="24" font-weight="800" fill="#17394d">Тиса / Прут</text><text x="220" y="363" text-anchor="middle" font-size="18" fill="#607987">→ Дунай</text><path d="M370 341H520" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="540" y="295" width="290" height="92" rx="22" fill="#e7f9ff" stroke="#8fc3df"/><text x="685" y="350" text-anchor="middle" font-size="24" font-weight="800" fill="#126b9c">Чорне море</text><rect x="70" y="430" width="300" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="220" y="468" text-anchor="middle" font-size="24" font-weight="800" fill="#17394d">Дністер / Пд. Буг</text><text x="220" y="498" text-anchor="middle" font-size="18" fill="#607987">безпосередньо</text><path d="M370 476H520" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><path d="M685 430v-33" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="70" y="565" width="300" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="220" y="603" text-anchor="middle" font-size="24" font-weight="800" fill="#17394d">Десна / Прип’ять</text><text x="220" y="633" text-anchor="middle" font-size="18" fill="#607987">→ Дніпро</text><path d="M370 611H520" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="540" y="565" width="290" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="685" y="620" text-anchor="middle" font-size="24" font-weight="800" fill="#17394d">Дніпро → Чорне</text><path d="M830 611c105 0 105-260 0-260" fill="none" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="885" y="295" width="250" height="92" rx="22" fill="#fff" stroke="#b9d9e6"/><text x="1010" y="333" text-anchor="middle" font-size="22" font-weight="800" fill="#17394d">Сіверський Донець</text><text x="1010" y="363" text-anchor="middle" font-size="18" fill="#607987">→ Дон</text><path d="M1010 387v75" stroke="#167fb8" stroke-width="6" marker-end="url(#a)"/><rect x="885" y="480" width="250" height="92" rx="22" fill="#fff4df" stroke="#e2bc6d"/><text x="1010" y="535" text-anchor="middle" font-size="24" font-weight="800" fill="#8b5b15">Азовське море</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Держава, країна і залежна територія</title><desc id="d">Навчальна схема для розрізнення понять за суверенітетом, територією та політико-правовим статусом.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e8f8ff"/><stop offset=".5" stop-color="#fff4d8"/><stop offset="1" stop-color="#ecfbf2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18364c">Не кожна «країна» = суверенна держава</text><g filter="url(#s)"><rect x="60" y="125" width="330" height="365" rx="28" fill="#fff"/><rect x="435" y="125" width="330" height="365" rx="28" fill="#fff"/><rect x="810" y="125" width="330" height="365" rx="28" fill="#fff"/></g><circle cx="225" cy="190" r="38" fill="#dff3ff"/><text x="225" y="202" text-anchor="middle" font-size="32" font-family="Arial" font-weight="700" fill="#147aa6">1</text><text x="100" y="262" font-family="Arial" font-size="31" font-weight="700" fill="#18364c">ДЕРЖАВА</text><text x="100" y="307" font-family="Arial" font-size="23" fill="#526d80">суверенітет • влада</text><text x="100" y="342" font-family="Arial" font-size="23" fill="#526d80">територія • населення</text><text x="100" y="377" font-family="Arial" font-size="23" fill="#526d80">міжнародна правосуб’єктність</text><text x="100" y="440" font-family="Arial" font-size="22" font-weight="700" fill="#178269">Приклад: Україна</text><circle cx="600" cy="190" r="38" fill="#fff0c6"/><text x="600" y="202" text-anchor="middle" font-size="32" font-family="Arial" font-weight="700" fill="#b57b12">2</text><text x="475" y="262" font-family="Arial" font-size="31" font-weight="700" fill="#18364c">КРАЇНА</text><text x="475" y="307" font-family="Arial" font-size="23" fill="#526d80">географічне / суспільне</text><text x="475" y="342" font-family="Arial" font-size="23" fill="#526d80">поняття про територію</text><text x="475" y="377" font-family="Arial" font-size="23" fill="#526d80">та спільноту людей</text><text x="475" y="425" font-family="Arial" font-size="21" fill="#8b5d0a">Не завжди точний</text><text x="475" y="455" font-family="Arial" font-size="21" fill="#8b5d0a">юридичний статус</text><circle cx="975" cy="190" r="38" fill="#e6f8ef"/><text x="975" y="202" text-anchor="middle" font-size="32" font-family="Arial" font-weight="700" fill="#178269">3</text><text x="850" y="262" font-family="Arial" font-size="28" font-weight="700" fill="#18364c">ЗАЛЕЖНА</text><text x="850" y="299" font-family="Arial" font-size="28" font-weight="700" fill="#18364c">ТЕРИТОРІЯ</text><text x="850" y="345" font-family="Arial" font-size="23" fill="#526d80">не має повного</text><text x="850" y="380" font-family="Arial" font-size="23" fill="#526d80">суверенітету</text><text x="850" y="415" font-family="Arial" font-size="23" fill="#526d80">статус визначений</text><text x="850" y="450" font-family="Arial" font-size="23" fill="#526d80">зв’язком з іншою державою</text><path d="M390 307h45M765 307h45" stroke="#6ca8c6" stroke-width="5" stroke-linecap="round"/><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#18364c">Ключове питання: хто має остаточну політичну владу і міжнародну відповідальність?</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#60798a">Навчальна схема • не замінює перевірку юридичного статусу в офіційних джерелах</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#f9fdff"/></linearGradient><linearGradient id="sed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4c86a"/><stop offset="1" stop-color="#e6a85f"/></linearGradient></defs><rect width="1200" height="720" rx="30" fill="#fff"/><rect x="30" y="30" width="1140" height="300" rx="24" fill="url(#sky)"/><text x="60" y="78" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173a52">Навчальна модель геологічного розрізу</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="16" fill="#55758a">Не карта України. Схема для тренування читання віку, шарів і процесів.</text><path d="M30 245 C180 210 260 260 390 235 C520 210 640 270 760 235 C900 195 1010 255 1170 220 L1170 330 L30 330Z" fill="#a9d98c"/><path d="M30 330 L1170 330 L1170 410 C980 430 830 390 650 420 C470 450 260 400 30 425Z" fill="url(#sed)"/><path d="M30 425 C230 400 430 475 620 445 C830 410 970 470 1170 445 L1170 525 C950 545 790 505 610 535 C430 565 210 510 30 545Z" fill="#d98d73"/><path d="M30 545 C250 510 420 590 620 555 C850 515 990 580 1170 550 L1170 690 L30 690Z" fill="#8c739d"/><path d="M630 330 L720 690 L815 690 L720 330Z" fill="#6a5c7b" opacity=".92"/><path d="M915 230 C930 300 942 356 947 420" fill="none" stroke="#3a93c9" stroke-width="8"/><circle cx="945" cy="415" r="7" fill="#3a93c9"/><g font-family="Arial,sans-serif" fill="#173a52"><text x="70" y="380" font-size="21" font-weight="700">A — молодші осадові відклади</text><text x="70" y="485" font-size="21" font-weight="700">B — давніші осадові породи</text><text x="70" y="610" font-size="21" font-weight="700" fill="#fff">C — кристалічний фундамент</text><text x="760" y="530" font-size="19" font-weight="700">D — магматичне тіло</text><text x="860" y="190" font-size="19" font-weight="700">E — долина річки</text></g><g stroke="#173a52" stroke-width="2" fill="none"><path d="M830 515 L760 470"/><path d="M920 205 L930 240"/></g><rect x="60" y="135" width="425" height="76" rx="18" fill="#fff" stroke="#cfe3ee"/><text x="82" y="166" font-family="Arial,sans-serif" font-size="16" fill="#55758a">Питання до розрізу</text><text x="82" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173a52">Що старіше: шар A чи магматичне тіло D?</text></svg>
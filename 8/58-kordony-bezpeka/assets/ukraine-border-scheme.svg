<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Схема державного кордону України</title><desc id="d">Навчальна схема для практичної роботи: Україна з Кримом, країни-сусіди та морський напрямок. Не призначена для вимірювання відстаней.</desc><defs><linearGradient id="u" x1="0" x2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff3c7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".13"/></filter></defs><rect width="1100" height="700" rx="34" fill="#f5fbff"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#18364c">Навчальна схема кордонів України</text><text x="54" y="90" font-family="Arial,sans-serif" font-size="16" fill="#61798b">Схема для орієнтування; для точного просторового аналізу використовуйте реальну карту в уроці.</text><g filter="url(#s)"><path d="M338 215 L413 183 L492 192 L545 165 L627 184 L694 174 L748 212 L828 235 L807 285 L838 322 L801 360 L827 408 L768 431 L730 471 L652 461 L602 490 L541 471 L489 495 L431 472 L371 488 L333 452 L280 446 L256 401 L218 380 L241 337 L222 298 L268 275 L281 235 Z" fill="url(#u)" stroke="#147aa6" stroke-width="7"/><path d="M635 466 C656 498 660 529 641 553 C625 573 632 596 665 606 C691 614 712 597 706 574 C699 548 681 525 690 493" fill="#fff3c7" stroke="#147aa6" stroke-width="7"/><text x="490" y="340" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#135d7e">УКРАЇНА</text><text x="617" y="571" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#9c6a00">АР Крим — Україна</text></g><g font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#18364c"><text x="95" y="240">Польща</text><text x="130" y="341">Словаччина</text><text x="182" y="428">Угорщина</text><text x="310" y="571">Румунія</text><text x="480" y="612">Молдова</text><text x="805" y="170">Білорусь</text><text x="883" y="325">Росія</text><text x="715" y="646" fill="#147aa6">Чорне море</text></g><g stroke="#8298a6" stroke-width="2" stroke-dasharray="7 7"><path d="M185 235 L281 260"/><path d="M235 335 L256 350"/><path d="M252 420 L303 438"/><path d="M374 548 L411 485"/><path d="M529 584 L558 483"/><path d="M829 185 L745 219"/><path d="M890 320 L816 320"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#60798a"><text x="54" y="665">Ключ: суцільна синя лінія — державний кордон України на навчальній схемі. Тимчасова окупація не змінює міжнародно визнану територіальну належність Криму Україні.</text></g></svg>
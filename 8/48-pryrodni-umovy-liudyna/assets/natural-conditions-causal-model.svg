<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Як природні умови впливають на життя і господарство</title><desc id="d">Схема причинних зв'язків між рельєфом, кліматом, водами, рішеннями людей і наслідками для розселення та господарства.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".5" stop-color="#fff6d8"/><stop offset="1" stop-color="#e9faef"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="36" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173b53">Природні умови → людські рішення → просторові наслідки</text><g font-family="Arial,sans-serif" filter="url(#s)"><g><rect x="55" y="115" width="260" height="120" rx="24" fill="#fff"/><text x="185" y="158" text-anchor="middle" font-size="25" font-weight="700" fill="#126b93">Рельєф</text><text x="185" y="193" text-anchor="middle" font-size="18" fill="#35596e">схил • висота • долина</text></g><g><rect x="55" y="280" width="260" height="120" rx="24" fill="#fff"/><text x="185" y="323" text-anchor="middle" font-size="25" font-weight="700" fill="#b56a12">Клімат</text><text x="185" y="358" text-anchor="middle" font-size="18" fill="#35596e">тепло • опади • ризики</text></g><g><rect x="355" y="197" width="260" height="120" rx="24" fill="#fff"/><text x="485" y="240" text-anchor="middle" font-size="25" font-weight="700" fill="#14765f">Води</text><text x="485" y="275" text-anchor="middle" font-size="18" fill="#35596e">доступ • сезонність • якість</text></g><g><rect x="675" y="197" width="220" height="120" rx="24" fill="#fff"/><text x="785" y="240" text-anchor="middle" font-size="25" font-weight="700" fill="#7b4aa8">Рішення</text><text x="785" y="275" text-anchor="middle" font-size="18" fill="#35596e">де жити? що будувати?</text></g><g><rect x="950" y="115" width="200" height="120" rx="24" fill="#fff"/><text x="1050" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#b23b55">Розселення</text><text x="1050" y="193" text-anchor="middle" font-size="17" fill="#35596e">міста • дороги</text></g><g><rect x="950" y="280" width="200" height="120" rx="24" fill="#fff"/><text x="1050" y="323" text-anchor="middle" font-size="24" font-weight="700" fill="#246d38">Господарство</text><text x="1050" y="358" text-anchor="middle" font-size="17" fill="#35596e">землеробство • енергія</text></g></g><g stroke="#5a7d90" stroke-width="5" fill="none" stroke-linecap="round"><path d="M315 175 C360 175 365 230 355 245"/><path d="M315 340 C360 340 365 285 355 270"/><path d="M615 257 H675"/><path d="M895 240 C925 220 925 190 950 180"/><path d="M895 275 C925 295 925 330 950 340"/></g><g fill="#5a7d90"><path d="M350 234 l18 10 -18 10z"/><path d="M350 260 l18 10 -18 10z"/><path d="M665 247 l18 10 -18 10z"/><path d="M940 171 l18 7 -16 13z"/><path d="M940 331 l18 9 -17 11z"/></g><text x="600" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#35596e">Не плутай вплив із приреченістю: технології, транспорт, історія й суспільні рішення можуть посилювати або послаблювати природні обмеження.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Типи рельєфу за походженням</title><desc id="d">Навчальна схема шести процесів рельєфоутворення: річкового, карстового, еолового, льодовикового, гравітаційного та морського.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff"/></linearGradient><style>.h{font:800 26px system-ui;fill:#17384c}.s{font:700 18px system-ui;fill:#17384c}.p{font:500 15px system-ui;fill:#4f6d7c}.box{fill:white;stroke:#cfe1e8;stroke-width:2}.tag{font:800 14px system-ui;fill:#0e6f66}</style></defs><rect width="1200" height="680" fill="url(#sky)"/><text x="60" y="54" class="h">Хто «ліпить» рельєф? Читайте сліди процесу, а не форму навмання</text><g transform="translate(45 90)"><rect class="box" rx="22" width="350" height="240"/><path d="M25 170 C100 115 150 220 220 145 S300 90 330 115" fill="none" stroke="#2d92c4" stroke-width="18"/><path d="M30 195 Q120 145 185 205 Q260 160 325 180" fill="#c4a66b" opacity=".45"/><text x="24" y="36" class="s">🌊 Річковий</text><text x="24" y="62" class="p">ерозія + перенесення + акумуляція</text><text x="24" y="220" class="tag">долина • тераса • заплава • яр</text></g><g transform="translate(425 90)"><rect class="box" rx="22" width="350" height="240"/><path d="M28 160 Q100 90 175 155 Q255 100 325 150 L325 205 L28 205Z" fill="#d8cfad"/><path d="M120 160 q10 42 42 15 q18-20 35 4 q30 32 55-5" fill="none" stroke="#7b6854" stroke-width="10"/><circle cx="175" cy="183" r="28" fill="#fff8e9"/><text x="24" y="36" class="s">🕳️ Карстовий</text><text x="24" y="62" class="p">розчинення водою розчинних порід</text><text x="24" y="220" class="tag">печера • лійка • понор • провал</text></g><g transform="translate(805 90)"><rect class="box" rx="22" width="350" height="240"/><path d="M20 195 Q95 95 170 180 Q250 95 330 190 Z" fill="#f2cf74"/><path d="M70 125 q45-35 95 0M190 105 q50-30 95 5" stroke="#c09336" stroke-width="5" fill="none" stroke-linecap="round"/><text x="24" y="36" class="s">💨 Еоловий</text><text x="24" y="62" class="p">вітер видуває, переносить і відкладає</text><text x="24" y="220" class="tag">дюна • кучугура • дефляційна западина</text></g><g transform="translate(45 365)"><rect class="box" rx="22" width="350" height="240"/><path d="M30 178 Q105 80 170 165 Q230 120 320 178 L320 205 L30 205Z" fill="#e6edf0"/><path d="M50 170 l35-45 30 22 30-55 40 55 33-30 30 50" fill="#eefaff" stroke="#a5c9d7" stroke-width="4"/><g fill="#7b8792"><circle cx="86" cy="190" r="8"/><circle cx="132" cy="176" r="6"/><circle cx="220" cy="190" r="7"/><circle cx="285" cy="180" r="9"/></g><text x="24" y="36" class="s">🧊 Льодовиковий</text><text x="24" y="62" class="p">лід руйнує, переносить і відкладає</text><text x="24" y="220" class="tag">морена • валуни • зандрові рівнини</text></g><g transform="translate(425 365)"><rect class="box" rx="22" width="350" height="240"/><path d="M35 205 L125 72 L190 95 L235 148 L325 205Z" fill="#b98b67"/><path d="M145 94 L210 160" stroke="#7a4c35" stroke-width="6" stroke-dasharray="8 8"/><g fill="#8c634d"><circle cx="222" cy="170" r="10"/><circle cx="245" cy="186" r="8"/><circle cx="270" cy="195" r="6"/></g><text x="24" y="36" class="s">⛰️ Гравітаційний</text><text x="24" y="62" class="p">маса рухається вниз під дією тяжіння</text><text x="24" y="220" class="tag">зсув • обвал • осип</text></g><g transform="translate(805 365)"><rect class="box" rx="22" width="350" height="240"/><rect x="20" y="145" width="310" height="60" rx="8" fill="#6dc3df"/><path d="M20 145 Q70 125 120 145 T220 145 T330 145" fill="none" stroke="#fff" stroke-width="8"/><path d="M40 145 L90 80 L135 145" fill="#bfa680"/><path d="M90 80 L110 130" stroke="#815e43" stroke-width="5"/><text x="24" y="36" class="s">🌊 Морський</text><text x="24" y="62" class="p">абразія + перенесення + акумуляція</text><text x="24" y="220" class="tag">кліф • пляж • коса • тераса</text></g><text x="60" y="654" class="p">Навчальна схема. Реальні форми перевіряйте за геоморфологічною картою, фото та геологічною основою.</text></svg>
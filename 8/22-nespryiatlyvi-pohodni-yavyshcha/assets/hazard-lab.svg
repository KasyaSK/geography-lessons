<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Навчальна модель небезпечних погодних явищ</title><desc id="d">Причинна схема: атмосферний процес, небезпечне явище, ризик і дія людини</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff4cf"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="36" fill="url(#sky)"/><text x="600" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#173b4d">Від процесу до ризику: читаємо погоду як систему</text><g font-family="system-ui,sans-serif" filter="url(#s)"><rect x="55" y="115" width="245" height="175" rx="25" fill="#fff" stroke="#b9dfe9"/><text x="177" y="154" text-anchor="middle" font-size="23" font-weight="800" fill="#247fa9">1. ПРОЦЕС</text><text x="82" y="197" font-size="20" fill="#173b4d">• фронт / циклон</text><text x="82" y="231" font-size="20" fill="#173b4d">• конвекція</text><text x="82" y="265" font-size="20" fill="#173b4d">• вторгнення холоду</text><path d="M310 203h70" stroke="#247fa9" stroke-width="8" stroke-linecap="round"/><path d="m365 185 28 18-28 18" fill="none" stroke="#247fa9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="405" y="115" width="260" height="175" rx="25" fill="#fff" stroke="#f2d395"/><text x="535" y="154" text-anchor="middle" font-size="23" font-weight="800" fill="#c58b2b">2. ЯВИЩЕ</text><text x="433" y="197" font-size="20" fill="#173b4d">• гроза / град / шквал</text><text x="433" y="231" font-size="20" fill="#173b4d">• туман / хуртовина</text><text x="433" y="265" font-size="20" fill="#173b4d">• ожеледь / спека</text><path d="M675 203h70" stroke="#c58b2b" stroke-width="8" stroke-linecap="round"/><path d="m730 185 28 18-28 18" fill="none" stroke="#c58b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="770" y="115" width="375" height="175" rx="25" fill="#fff" stroke="#efb6a1"/><text x="957" y="154" text-anchor="middle" font-size="23" font-weight="800" fill="#d36d42">3. РИЗИК</text><text x="802" y="197" font-size="20" fill="#173b4d">• транспорт / електромережі</text><text x="802" y="231" font-size="20" fill="#173b4d">• урожай / ліси / вода</text><text x="802" y="265" font-size="20" fill="#173b4d">• здоров’я і безпека людей</text></g><g font-family="system-ui,sans-serif"><rect x="120" y="365" width="960" height="170" rx="30" fill="#ffffffdd" stroke="#b9dfcc" stroke-width="2"/><text x="600" y="408" text-anchor="middle" font-size="25" font-weight="850" fill="#16856c">ДОКАЗОВИЙ АЛГОРИТМ</text><text x="165" y="454" font-size="21" fill="#173b4d">① Знайди сигнал на синоптичній карті / у попередженні</text><text x="165" y="491" font-size="21" fill="#173b4d">② Назви механізм виникнення явища</text><text x="650" y="454" font-size="21" fill="#173b4d">③ Оціни, хто й що вразливі</text><text x="650" y="491" font-size="21" fill="#173b4d">④ Запропонуй дію, що зменшує ризик</text></g><text x="600" y="584" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#607986">Навчальна причинна модель • не синоптична карта і не прогноз</text></svg>
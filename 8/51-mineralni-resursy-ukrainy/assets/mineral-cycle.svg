<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Модель життєвого циклу мінеральних ресурсів</title><desc id="d">Геологічне вивчення, видобування, збагачення, виробництво, використання, повторне використання і перероблення</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#fff2d9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="36" fill="url(#g)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17384d">Мінеральний ресурс — це не просто «щось у землі»</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="20" fill="#587387">Цінність виникає лише тоді, коли ресурс геологічно підтверджений, доступний, економічно доцільний і має ланцюг переробки.</text><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" filter="url(#s)"><g transform="translate(70 170)"><rect width="180" height="110" rx="22" fill="#fff" stroke="#92c9e8"/><text x="90" y="48" font-size="20" fill="#176f98">1. Розвідка</text><text x="90" y="78" font-size="15" font-weight="400" fill="#647d8e">дані, запаси, якість</text></g><g transform="translate(290 170)"><rect width="180" height="110" rx="22" fill="#fff" stroke="#e1b768"/><text x="90" y="48" font-size="20" fill="#a76b13">2. Видобування</text><text x="90" y="78" font-size="15" font-weight="400" fill="#647d8e">кар’єр / шахта / свердловина</text></g><g transform="translate(510 170)"><rect width="180" height="110" rx="22" fill="#fff" stroke="#8dc6a9"/><text x="90" y="48" font-size="20" fill="#1b7c5f">3. Збагачення</text><text x="90" y="78" font-size="15" font-weight="400" fill="#647d8e">відокремити корисний компонент</text></g><g transform="translate(730 170)"><rect width="180" height="110" rx="22" fill="#fff" stroke="#b49adb"/><text x="90" y="48" font-size="20" fill="#7858aa">4. Переробка</text><text x="90" y="78" font-size="15" font-weight="400" fill="#647d8e">метал, матеріал, продукт</text></g><g transform="translate(950 170)"><rect width="180" height="110" rx="22" fill="#fff" stroke="#e6a1a1"/><text x="90" y="48" font-size="20" fill="#a74b4b">5. Використання</text><text x="90" y="78" font-size="15" font-weight="400" fill="#647d8e">енергія, техніка, будівництво</text></g></g><g stroke="#5c7c90" stroke-width="4" fill="none" marker-end="url(#a)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5c7c90"/></marker></defs><path d="M250 225H285"/><path d="M470 225H505"/><path d="M690 225H725"/><path d="M910 225H945"/></g><path d="M1040 300 C1040 410 760 440 600 440 C420 440 160 420 160 315" fill="none" stroke="#25a17d" stroke-width="7" stroke-dasharray="12 10" marker-end="url(#a)"/><text x="600" y="406" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1b7c5f">Повторне використання • ремонт • перероблення • «міське добування»</text><text x="600" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#587387">Чим більше матеріалу повертається в цикл, тим менший тиск на новий видобуток — але повністю замінити первинну сировину поки неможливо.</text></svg>
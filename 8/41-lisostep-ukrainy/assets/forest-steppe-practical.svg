<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Практикум: як дослідити лісостеп</title><desc id="d">Схема переходу від карти та природних компонентів до землекористування, ризиків і рішення</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef9e9"/><stop offset=".55" stop-color="#fff4d8"/><stop offset="1" stop-color="#edf7ff"/></linearGradient><style>.h{font:700 42px system-ui,sans-serif;fill:#24442f}.s{font:700 24px system-ui,sans-serif;fill:#355b42}.q{font:600 19px system-ui,sans-serif;fill:#60705f}.box{fill:#fff;stroke:#cfdfd0;stroke-width:3}.n{font:900 28px system-ui,sans-serif;fill:white}.c{fill:#3f8559}.a{stroke:#7ca287;stroke-width:6;stroke-linecap:round;marker-end:url(#m)} </style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7ca287"/></marker></defs><rect width="1200" height="650" rx="42" fill="url(#bg)"/><text x="60" y="78" class="h">Лісостеп: практикум доказів</text><text x="60" y="118" class="q">Не перелік фактів, а причинний ланцюг «умови → ландшафт → використання → ризик → рішення»</text><g transform="translate(55 190)"><g><rect class="box" width="180" height="220" rx="26"/><circle class="c" cx="90" cy="50" r="30"/><text class="n" x="81" y="60">1</text><text class="s" x="35" y="118">Карта</text><text class="q" x="24" y="155">положення</text><text class="q" x="24" y="185">межі</text></g><path class="a" d="M190 110 H240"/><g transform="translate(250)"><rect class="box" width="180" height="220" rx="26"/><circle class="c" cx="90" cy="50" r="30"/><text class="n" x="81" y="60">2</text><text class="s" x="18" y="118">Компоненти</text><text class="q" x="24" y="155">клімат · ґрунти</text><text class="q" x="24" y="185">води · біота</text></g><path class="a" d="M440 110 H490"/><g transform="translate(500)"><rect class="box" width="180" height="220" rx="26"/><circle class="c" cx="90" cy="50" r="30"/><text class="n" x="81" y="60">3</text><text class="s" x="16" y="118">Мозаїка</text><text class="q" x="22" y="155">ліс + поле</text><text class="q" x="22" y="185">яри + долини</text></g><path class="a" d="M690 110 H740"/><g transform="translate(750)"><rect class="box" width="180" height="220" rx="26"/><circle class="c" cx="90" cy="50" r="30"/><text class="n" x="81" y="60">4</text><text class="s" x="38" y="118">Ризик</text><text class="q" x="24" y="155">ерозія</text><text class="q" x="24" y="185">всихання лісів</text></g><path class="a" d="M940 110 H990"/><g transform="translate(1000)"><rect class="box" width="145" height="220" rx="26"/><circle class="c" cx="72" cy="50" r="30"/><text class="n" x="63" y="60">5</text><text class="s" x="16" y="118">Рішення</text><text class="q" x="16" y="155">охорона</text><text class="q" x="16" y="185">моніторинг</text></g></g><rect x="70" y="485" width="1060" height="105" rx="26" fill="#ffffffcc" stroke="#d7dfcb" stroke-width="3"/><text x="105" y="532" class="s">Сильний висновок = щонайменше 2 просторові докази + причинне пояснення + реалістичне рішення</text><text x="105" y="567" class="q">Лісостеп — не «смуга посередині карти», а мозаїчний природно-антропогенний комплекс.</text></svg>
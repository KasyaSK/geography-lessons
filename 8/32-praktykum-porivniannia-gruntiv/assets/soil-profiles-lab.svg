<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Порівняння трьох навчальних ґрунтових профілів</title><desc id="d">Навчальна схема дерново-підзолистого, чорноземного та каштанового профілів для порівняння горизонтів. Не є картою або результатом лабораторного аналізу.</desc><rect width="1200" height="620" rx="34" fill="#f7fbf5"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#25452f">Порівняйте профілі: не колір, а процес</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="20" fill="#5d7464">Навчальна модель • межі горизонтів умовні</text><g font-family="Arial,sans-serif"><g transform="translate(70 150)"><text x="130" y="0" text-anchor="middle" font-size="25" font-weight="700" fill="#24442e">Дерново-підзолистий</text><rect x="20" y="28" width="220" height="52" rx="10" fill="#382f27"/><rect x="20" y="80" width="220" height="95" fill="#d8d4c7"/><rect x="20" y="175" width="220" height="130" fill="#a88361"/><rect x="20" y="305" width="220" height="120" rx="0 0 14 14" fill="#d9c5a1"/><text x="260" y="62" font-size="18" fill="#263b2b">тонкий гумусовий</text><text x="260" y="130" font-size="18" fill="#263b2b">вимивання</text><text x="260" y="230" font-size="18" fill="#263b2b">накопичення сполук</text><text x="130" y="465" text-anchor="middle" font-size="18" fill="#526859">вологіші умови</text></g><g transform="translate(470 150)"><text x="130" y="0" text-anchor="middle" font-size="25" font-weight="700" fill="#24442e">Чорнозем</text><rect x="20" y="28" width="220" height="220" rx="10 10 0 0" fill="#302720"/><rect x="20" y="248" width="220" height="92" fill="#70533c"/><rect x="20" y="340" width="220" height="85" rx="0 0 14 14" fill="#caa979"/><text x="260" y="90" font-size="18" fill="#263b2b">потужний гумусовий</text><text x="260" y="286" font-size="18" fill="#263b2b">перехідний</text><text x="260" y="382" font-size="18" fill="#263b2b">материнська порода</text><text x="130" y="465" text-anchor="middle" font-size="18" fill="#526859">трав’яниста рослинність</text></g><g transform="translate(870 150)"><text x="130" y="0" text-anchor="middle" font-size="25" font-weight="700" fill="#24442e">Каштановий</text><rect x="20" y="28" width="220" height="115" rx="10 10 0 0" fill="#665042"/><rect x="20" y="143" width="220" height="110" fill="#9b7354"/><rect x="20" y="253" width="220" height="92" fill="#c4a47b"/><rect x="20" y="345" width="220" height="80" rx="0 0 14 14" fill="#e0cba5"/><text x="-15" y="83" text-anchor="end" font-size="18" fill="#263b2b">гумусовий</text><text x="-15" y="205" text-anchor="end" font-size="18" fill="#263b2b">карбонати</text><text x="-15" y="302" text-anchor="end" font-size="18" fill="#263b2b">сухіші умови</text><text x="130" y="465" text-anchor="middle" font-size="18" fill="#526859">менше зволоження</text></g></g><path d="M85 570 H1115" stroke="#aac8b0" stroke-width="2"/><text x="600" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d7464">Підказка: порівнюйте потужність горизонтів, промивний режим, гумус і зв’язок із природною зоною.</text></svg>
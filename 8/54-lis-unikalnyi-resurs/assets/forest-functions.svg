<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Ліс як багатофункціональний ресурс</title><desc id="d">Схема екосистемних, ресурсних, захисних і суспільних функцій лісу</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eafff2"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".10"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><text x="600" y="72" text-anchor="middle" font-family="Inter,Arial" font-size="38" font-weight="800" fill="#173d36">ЛІС ≠ «БАГАТО ДЕРЕВ». ЛІС = СИСТЕМА ФУНКЦІЙ</text><g filter="url(#s)" font-family="Inter,Arial"><rect x="420" y="200" width="360" height="220" rx="38" fill="#176c4e"/><text x="600" y="282" text-anchor="middle" font-size="42" font-weight="900" fill="white">ЛІС</text><text x="600" y="330" text-anchor="middle" font-size="24" fill="#dff8ed">біота + ґрунт + вода</text><text x="600" y="364" text-anchor="middle" font-size="24" fill="#dff8ed">мікроклімат + взаємодії</text><rect x="50" y="125" width="290" height="150" rx="26" fill="white"/><text x="195" y="177" text-anchor="middle" font-size="26" font-weight="800" fill="#1d5b8a">💧 Вода</text><text x="195" y="215" text-anchor="middle" font-size="20" fill="#496b78">перехоплення опадів</text><text x="195" y="244" text-anchor="middle" font-size="20" fill="#496b78">інфільтрація • стік</text><rect x="50" y="345" width="290" height="150" rx="26" fill="white"/><text x="195" y="397" text-anchor="middle" font-size="26" font-weight="800" fill="#8a5c1d">🪨 Ґрунт</text><text x="195" y="435" text-anchor="middle" font-size="20" fill="#496b78">захист від ерозії</text><text x="195" y="464" text-anchor="middle" font-size="20" fill="#496b78">органічна речовина</text><rect x="860" y="125" width="290" height="150" rx="26" fill="white"/><text x="1005" y="177" text-anchor="middle" font-size="26" font-weight="800" fill="#5b4a91">🦉 Біорізноманіття</text><text x="1005" y="215" text-anchor="middle" font-size="20" fill="#496b78">оселища • корм</text><text x="1005" y="244" text-anchor="middle" font-size="20" fill="#496b78">генетичні ресурси</text><rect x="860" y="345" width="290" height="150" rx="26" fill="white"/><text x="1005" y="397" text-anchor="middle" font-size="26" font-weight="800" fill="#8a3f58">🌲 Людина</text><text x="1005" y="435" text-anchor="middle" font-size="20" fill="#496b78">деревина • їжа</text><text x="1005" y="464" text-anchor="middle" font-size="20" fill="#496b78">рекреація • праця</text><rect x="420" y="480" width="360" height="90" rx="26" fill="#fff8dd"/><text x="600" y="520" text-anchor="middle" font-size="24" font-weight="800" fill="#745718">🌡️ Клімат</text><text x="600" y="550" text-anchor="middle" font-size="19" fill="#655f42">вуглець • затінення • транспірація</text></g><g stroke="#62a68f" stroke-width="5" fill="none" stroke-linecap="round"><path d="M340 200 C380 200 385 245 420 260"/><path d="M340 420 C380 420 390 365 420 350"/><path d="M860 200 C820 200 815 245 780 260"/><path d="M860 420 C820 420 810 365 780 350"/><path d="M600 420 V480"/></g><text x="600" y="603" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#55746a">Висновок: цінність лісу не зводиться до кубометрів деревини — і «посадити дерева» не завжди означає відновити природу.</text></svg>
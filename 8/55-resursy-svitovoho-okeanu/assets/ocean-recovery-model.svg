<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f7ff"/><stop offset="1" stop-color="#effff5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="40" fill="url(#bg)"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#123f59">Ресурси Світового океану → відновлення України</text><g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)"><g><rect x="60" y="140" width="245" height="135" rx="26" fill="#fff"/><text x="182" y="190" font-size="25" font-weight="700" fill="#087e9b">Біологічні</text><text x="182" y="228" font-size="18" fill="#395c6d">риба • молюски</text><text x="182" y="254" font-size="18" fill="#395c6d">водорості • аквакультура</text></g><g><rect x="335" y="140" width="245" height="135" rx="26" fill="#fff"/><text x="457" y="190" font-size="25" font-weight="700" fill="#087e9b">Енергетичні</text><text x="457" y="228" font-size="18" fill="#395c6d">офшорний вітер</text><text x="457" y="254" font-size="18" fill="#395c6d">хвилі • припливи</text></g><g><rect x="610" y="140" width="245" height="135" rx="26" fill="#fff"/><text x="732" y="190" font-size="25" font-weight="700" fill="#087e9b">Транспортні</text><text x="732" y="228" font-size="18" fill="#395c6d">порти • коридори</text><text x="732" y="254" font-size="18" fill="#395c6d">логістика • експорт</text></g><g><rect x="885" y="140" width="245" height="135" rx="26" fill="#fff"/><text x="1007" y="190" font-size="25" font-weight="700" fill="#087e9b">Екосистемні</text><text x="1007" y="228" font-size="18" fill="#395c6d">узбережжя • туризм</text><text x="1007" y="254" font-size="18" fill="#395c6d">біорізноманіття</text></g></g><path d="M183 295v70M458 295v70M733 295v70M1008 295v70" stroke="#35a6b6" stroke-width="8" stroke-linecap="round"/><path d="M183 360h825" stroke="#35a6b
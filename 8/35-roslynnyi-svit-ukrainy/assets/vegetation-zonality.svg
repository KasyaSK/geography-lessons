<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Закономірності рослинного покриву України</title><desc id="d">Навчальна схема переходу від Полісся через лісостеп до степу та висотної поясності Карпат</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset=".5" stop-color="#f1f9e7"/><stop offset="1" stop-color="#fff0c9"/></linearGradient><style>.h{font:800 42px system-ui,sans-serif;fill:#173b2b}.s{font:700 25px system-ui,sans-serif;fill:#28543d}.q{font:600 19px system-ui,sans-serif;fill:#52685a}.box{stroke:#cbdccd;stroke-width:3}.arr{stroke:#5e8a70;stroke-width:6;marker-end:url(#m)}.w{font:800 22px system-ui,sans-serif;fill:#fff}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5e8a70"/></marker></defs><rect width="1200" height="680" rx="38" fill="url(#bg)"/><text x="55" y="75" class="h">Рослинність України: не список, а система</text><text x="55" y="115" class="q">Тепло + волога + ґрунт + рельєф → тип рослинного покриву</text><g transform="translate(55 175)"><rect class="box" x="0" y="0" width="300" height="250" rx="28" fill="#d9f0d9"/><text x="30" y="55" class="s">ПОЛІССЯ</text><text x="30" y="95" class="q">вологи більше</text><text x="30" y="128" class="q">дерново-підзолисті ґрунти</text><text x="30" y="161" class="q">сосна, береза, вільха</text><text x="30" y="194" class="q">ліси + болота + луки</text><path class="arr" d="M310 125 H390"/><rect class="box" x="405" y="0" width="300" height="250" rx="28" fill="#e9efb8"/><text x="435" y="55" class="s">ЛІСОСТЕП</text><text x="435" y="95" class="q">баланс тепла й вологи</text><text x="435" y="128" class="q">сірі лісові + чорноземи</text><text x="435" y="161" class="q">дуб, граб, лучні степи</text><text x="435" y="194" class="q">мозаїка лісу й степу</text><path class="arr" d="M715 125 H795"/><rect class="box" x="810" y="0" width="300" height="250" rx="28" fill="#f8dda3"/><text x="840" y="55" class="s">СТЕП</text><text x="840" y="95" class="q">тепліше й сухіше</text><text x="840" y="128" class="q">чорноземи + каштанові</text><text x="840" y="161" class="q">ковила, типчак, полин</text><text x="840" y="194" class="q">дернинні трави</text></g><g transform="translate(110 500)"><rect x="0" y="0" width="980" height="120" rx="26" fill="#ffffffcc" stroke="#cbdccd" stroke-width="3"/><text x="35" y="43" class="s">КАРПАТИ: інша вісь закономірності — висота</text><text x="35" y="80" class="q">передгірні широколисті ліси → буково-ялицево-смерекові ліси → субальпійські криволісся → полонини</text><text x="35" y="108" class="q">З висотою змінюються температура, зволоження, ґрунти й тривалість вегетаційного періоду.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fff8e8"/></linearGradient></defs><rect width="1200" height="620" rx="36" fill="url(#bg)"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#17364c">Діагностична опора: природа України</text><text x="60" y="100" font-family="Arial" font-size="18" fill="#61798b">Навчальна схема для аналізу зв’язків. Не замінює атлас або офіційні геодані.</text><g transform="translate(60 145)"><rect width="1080" height="170" rx="24" fill="#fff" stroke="#cfe2ee"/><text x="25" y="36" font-family="Arial" font-size="21" font-weight="700" fill="#0b7db7">1. Тектоніка → рельєф → ресурси</text><path d="M45 128 C130 68 190 92 250 108 S360 152 430 112 S530 56 620 100 S770 152 850 104 S970 70 1030 116" fill="none" stroke="#94714d" stroke-width="8"/><rect x="90" y="108" width="170" height="28" rx="14" fill="#ffd27f"/><text x="112" y="128" font-family="Arial" font-size="16" fill="#584522">Український щит</text><rect x="430" y="118" width="220" height="28" rx="14" fill="#b9dff6"/><text x="448" y="138" font-family="Arial" font-size="16" fill="#184b6b">Дніпровсько-Донецька западина</text><circle cx="190" cy="80" r="10" fill="#b44d3c"/><text x="208" y="86" font-family="Arial" font-size="15" fill="#6b3c34">рудні копалини</text><circle cx="550" cy="80" r="10" fill="#2d6c8f"/><text x="568" y="86" font-family="Arial" font-size="15" fill="#315367">нафта й газ</text></g><g transform="translate(60 340)"><rect width="1080" height="210" rx="24" fill="#fff" stroke="#cfe2ee"/><text x="25" y="36" font-family="Arial" font-size="21" font-weight="700" fill="#168567">2. Кліматичні контрасти: тренувальні дані</text><text x="40" y="82" font-family="Arial" font-size="17" fill="#17364c">Регіон</text><text x="270" y="82" font-family="Arial" font-size="17" fill="#17364c">Січень</text><text x="430" y="82" font-family="Arial" font-size="17" fill="#17364c">Липень</text><text x="590" y="82" font-family="Arial" font-size="17" fill="#17364c">Опади/рік</text><text x="770" y="82" font-family="Arial" font-size="17" fill="#17364c">Випаровуваність</text><text x="950" y="82" font-family="Arial" font-size="17" fill="#17364c">Kз=P/E</text><line x1="30" y1="96" x2="1045" y2="96" stroke="#d7e6ef"/><text x="40" y="128" font-family="Arial" font-size="17" fill="#17364c">Полісся</text><text x="270" y="128" font-family="Arial" font-size="17" fill="#17364c">−5 °C</text><text x="430" y="128" font-family="Arial" font-size="17" fill="#17364c">+19 °C</text><text x="590" y="128" font-family="Arial" font-size="17" fill="#17364c">650 мм</text><text x="770" y="128" font-family="Arial" font-size="17" fill="#17364c">550 мм</text><text x="950" y="128" font-family="Arial" font-size="17" fill="#17364c">?</text><text x="40" y="170" font-family="Arial" font-size="17" fill="#17364c">Південний степ</text><text x="270" y="170" font-family="Arial" font-size="17" fill="#17364c">−1 °C</text><text x="430" y="170" font-family="Arial" font-size="17" fill="#17364c">+23 °C</text><text x="590" y="170" font-family="Arial" font-size="17" fill="#17364c">380 мм</text><text x="770" y="170" font-family="Arial" font-size="17" fill="#17364c">850 мм</text><text x="950" y="170" font-family="Arial" font-size="17" fill="#17364c">?</text><text x="40" y="200" font-family="Arial" font-size="14" fill="#7a6a3d">Числа округлені для діагностичної задачі; обчисліть і порівняйте, а не вчіть напам’ять.</text></g></svg>
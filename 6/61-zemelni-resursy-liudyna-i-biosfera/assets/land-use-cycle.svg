<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Земельні ресурси як система</title><desc id="d">Схема зв’язків між ґрунтом, рослинністю, водою, людиною та відновленням земель</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbea"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient></defs><rect width="900" height="520" rx="34" fill="url(#bg)"/><circle cx="450" cy="260" r="92" fill="#fff" stroke="#7bb36b" stroke-width="5"/><text x="450" y="246" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="800" fill="#24533e">ЗЕМЕЛЬНІ</text><text x="450" y="282" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="800" fill="#24533e">РЕСУРСИ</text><g font-family="system-ui" font-size="22" font-weight="700" fill="#24485c"><rect x="72" y="70" width="220" height="82" rx="22" fill="#fff"/><text x="182" y="120" text-anchor="middle">🌱 Ґрунт і родючість</text><rect x="608" y="70" width="220" height="82" rx="22" fill="#fff"/><text x="718" y="120" text-anchor="middle">🌳 Рослинність</text><rect x="72" y="368" width="220" height="82" rx="22" fill="#fff"/><text x="182" y="418" text-anchor="middle">💧 Вода і стік</text><rect x="608" y="368" width="220" height="82" rx="22" fill="#fff"/><text x="718" y="418" text-anchor="middle">🏘️ Використання</text></g><g stroke="#6f9d79" stroke-width="5" fill="none" stroke-linecap="round"><path d="M292 112 C360 130 380 170 400 200"/><path d="M608 112 C540 130 520 170 500 200"/><path d="M292 410 C360 390 380 350 400 320"/><path d="M608 410 C540 390 520 350 500 320"/></g><text x="450" y="494" text-anchor="middle" font-family="system-ui" font-size="19" fill="#4c6b62">Стійке використання = користь для людей + збереження здатності землі відновлюватися</text></svg>
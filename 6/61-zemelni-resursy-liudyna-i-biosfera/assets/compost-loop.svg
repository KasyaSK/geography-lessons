<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Цикл компостування</title><desc id="d">Органічні рештки перетворюються на компост і повертають органічну речовину в ґрунт</desc><rect width="900" height="500" rx="34" fill="#fff9e9"/><g font-family="system-ui" text-anchor="middle"><circle cx="160" cy="250" r="92" fill="#fff" stroke="#e8b95f" stroke-width="5"/><text x="160" y="232" font-size="45">🥕🍂</text><text x="160" y="276" font-size="22" font-weight="800" fill="#765b26">органічні рештки</text><circle cx="450" cy="250" r="92" fill="#fff" stroke="#8ebc6a" stroke-width="5"/><text x="450" y="232" font-size="45">🪱♻️</text><text x="450" y="276" font-size="22" font-weight="800" fill="#456a38">розкладання</text><circle cx="740" cy="250" r="92" fill="#fff" stroke="#8c6d4f" stroke-width="5"/><text x="740" y="232" font-size="45">🌱</text><text x="740" y="276" font-size="22" font-weight="800" fill="#5c4634">компост у ґрунт</text></g><g fill="none" stroke="#8e9d6d" stroke-width="8" stroke-linecap="round"><path d="M255 250H350"/><path d="M545 250H640"/><path d="M720 340C650 430 250 430 180 340"/></g><g fill="#8e9d6d"><path d="M350 250l-22-14v28z"/><path d="M640 250l-22-14v28z"/><path d="M180 340l6 27 20-19z"/></g><text x="450" y="70" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="900" fill="#4d5938">ОРГАНІЧНА РЕЧОВИНА НЕ «ЗНИКАЄ» — ВОНА ПОВЕРТАЄТЬСЯ В ЦИКЛ</text><text x="450" y="468" text-anchor="middle" font-family="system-ui" font-size="18" fill="#746d54">Компостування зменшує частку органіки у змішаних відходах і може покращувати структуру ґрунту</text></svg>
ML=`<span class="num">${String(n).padStart(2,'0')}</span><div><span class="tag">6 клас • урок ${n}</span><h2>Завантаження теми…</h2><p>Стабільна сторінка уроку GitHub Pages.</p></div><span class="go">Відкрити →</span>`;g.appendChild(a);try{const t=await fetch(s+'/index.html').then(r=>r.text());const m=t.match(/<title>(.*?)<\/title>/i);if(m)a.querySelector('h2').textContent=m[1].replace(/^Урок\s*\d+\s*[—-]\s*/,'');else a.querySelector('h2').textContent=pretty(s)}catch(e){a.querySelector('h2').textContent=pretty(s)}});</script></body></html>

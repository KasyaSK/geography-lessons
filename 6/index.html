<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Скринченко К.А. — Василівський ліцей «Сузір’я»"><title>6 клас — інтерактивні уроки географії</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6fbfe;color:#17344c}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.hero{padding:60px 0 28px;background:linear-gradient(135deg,#dff5ff,#fff0df)}h1{font-size:clamp(2.4rem,6vw,4.7rem);margin:.3rem 0}.lead{color:#60798a}.summary{font-weight:800}.grid{display:grid;gap:12px;padding:24px 0 60px}.card{display:grid;grid-template-columns:58px 1fr auto;gap:16px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid #d8e8f1;border-radius:20px;padding:16px;box-shadow:0 12px 32px rgba(38,83,110,.09)}.num{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:#e7f6fd;color:#0874b5;font-size:1.35rem;font-weight:950}.tag{font-size:.78rem;font-weight:900;color:#13826d}.card h2{font-size:1.08rem;margin:.2rem 0}.card p{margin:0;color:#60798a;font-size:.9rem}.go{font-weight:900;color:#096aa6}@media(max-width:650px){.card{grid-template-columns:58px 1fr}.go{grid-column:1/-1;text-align:right}}</style></head><body><header class="hero"><div class="wrap"><b>🌍 ГЕОГРАФІЯ • 6 КЛАС</b><h1>Інтерактивні уроки</h1><p class="lead">Актуальний каталог за КТП 2026–2027. Автор — Скринченко К.А.</p><p class="summary">Опубліковано 26 уроків: №2–27.</p></div></header><main class="wrap"><div class="grid" id="g"></div></main><script>const L=[[2,'02-metody-geografichnyh-doslidzhen','Методи географічних досліджень'],[3,'03-dzherela-geografichnoi-informatsii-sposterezhennia','Джерела географічної інформації та власні спостереження'],[4,'04-forma-rozmiry-zemli-magellan','Форма і розміри Землі. Подорож Ф. Магеллана'],[5,'05-rukhy-zemli-ta-ikh-naslidky','Рухи Землі та їх наслідки'],[6,'06-globus-vydy-umovni-znaky-napriamy','Глобус, умовні знаки та напрями'],[7,'07-zobrazhennia-zemnoi-poverkhni','Зображення земної поверхні'],[8,'08-vyznachennia-napriamkiv-na-kartakh-ta-mistsevosti','Визначення напрямків на картах та місцевості'],[9,'09-oriientuvannia-na-mistsevosti-azymuty','Орієнтування на місцевості й азимути'],[10,'10-masshtab-ta-ioho-vydy','Масштаб та його види'],[11,'11-vyznachennia-vidstanei','Визначення відстаней'],[12,'12-karty-atlasy-onlain-resursy','Карти, атласи та картографічні онлайн-ресурси'],[13,'13-zahalnoheohrafichni-ta-tematychni-karty','Загальногеографічні та тематичні карти. Легенди карт'],[14,'14-heohrafichna-karta-v-zhytti-liudyny','Географічна карта в житті людини'],[15,'15-pidsumkovyi-urok-dtr-1','Підсумковий урок. ДТР‑1'],[16,'16-korektsiia-dtr-1','Корекція. Аналіз ДТР‑1'],[17,'17-budova-litosfery','Будова літосфери'],[18,'18-litosferni-plyty-rukh','Літосферні плити, механізм та наслідки їх переміщення'],[19,'19-zemletrusy','Землетруси'],[20,'20-vulkanizm-seismichni-poiasy','Вулканізм. Сейсмічні пояси світу'],[21,'21-zovnishni-protsesy','Зовнішні процеси на земній поверхні'],[22,'22-vysoty-horyzontali','Абсолютна і відносна висота. Горизонталі'],[23,'23-formy-reliefu-rivnyny','Форми рельєфу Землі. Рівнини'],[24,'24-relef-suhodolu-hory','Рельєф суходолу. Гори'],[25,'25-relief-dna-okeanu','Рельєф дна океану'],[26,'26-mineraly-hirski-porody-korysni-kopalyny','Мінерали і гірські породи. Корисні копалини'],[27,'27-pidsumkovyi-litosfera-dtr-2','Підсумковий урок із теми «Літосфера». ДТР‑2']];document.querySelector('#g').innerHTML=L.map(([n,s,t])=>`<a class="card" href="${s}/"><span class="num">${String(n).padStart(2,'0')}</span><div><span class="tag">6 клас • урок ${n}</span><h2>${t}</h2><p>Відкрити стабільну сторінку уроку GitHub Pages.</p></div><span class="go">Відкрити →</span></a>`).join('')</script></body></html>

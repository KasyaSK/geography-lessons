<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Скринченко К.А. — Василівський ліцей «Сузір’я»"><title>6 клас — інтерактивні уроки географії</title><style>:root{--ink:#17344c;--muted:#60798a;--line:#d8e8f1;--bg:#f6fbfe;--shadow:0 16px 42px rgba(38,83,110,.11)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#dcf4ff,transparent 29rem),radial-gradient(circle at 96% 8%,#fff0df,transparent 28rem),var(--bg);line-height:1.58}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.hero{padding:72px 0 34px}.eyebrow{display:inline-block;padding:.35rem .65rem;border-radius:999px;background:#e3f5ff;color:#0872b4;font-size:.82rem;font-weight:900}h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.02;letter-spacing:-.045em;margin:.75rem 0}.lead{color:var(--muted);max-width:760px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:.5rem .72rem;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800}.grid{display:grid;gap:14px;padding:10px 0 60px}.card{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.num{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#dff5ff,#fff1dd);font-size:1.5rem;font-weight:950;color:#0874b5}.tag{font-size:.78rem;font-weight:900;color:#13826d}.card h2{font-size:1.18rem;line-height:1.25;margin:.25rem 0}.card p{margin:0;color:var(--muted);font-size:.93rem}.go{white-space:nowrap;padding:.65rem .8rem;border-radius:13px;background:#edf8fd;color:#096aa6;font-weight:900}.note{border:1px solid #d6e7ef;border-radius:18px;padding:15px;background:#fffdf3;color:#685824;margin-bottom:30px}footer{border-top:1px solid var(--line);padding:24px 0 42px;color:var(--muted)}@media(max-width:680px){.card{grid-template-columns:auto 1fr}.go{grid-column:1/-1;text-align:center}}</style></head><body><header class="hero"><div class="wrap"><span class="eyebrow">🌍 ГЕОГРАФІЯ • 6 КЛАС</span><h1>Інтерактивні уроки</h1><p class="lead">Актуальний перелік опублікованих HTML-уроків за КТП 2026–2027.</p><div class="summary"><span class="pill">Опубліковано: 24 уроки</span><span class="pill">№2–25</span><span class="pill">Автор: Скринченко К.А.</span></div></div></header><main class="wrap"><div class="note"><b>Список оновлюється після кожного нового уроку.</b> Уроки впорядковано за номером без дублювання.</div><div class="grid" id="lessonGrid"></div></main><footer><div class="wrap">Скринченко К.А. • Василівський ліцей «Сузір’я»</div></footer><script>const lessons=[
[2,'02-metody-geografichnyh-doslidzhen','§2','Методи географічних досліджень','Сучасні методи, карти, супутникові дані та CER.'],
[3,'03-dzherela-geografichnoi-informatsii-sposterezhennia','§3','Джерела географічної інформації та власні спостереження','Джерела, спостереження, жива карта й перевірка надійності.'],
[4,'04-forma-rozmiry-zemli-magellan','§4','Форма і розміри Землі. Подорож Ф. Магеллана','Докази кулястості й навколосвітня подорож.'],
[5,'05-rukhy-zemli-ta-ikh-naslidky','§5','Рухи Землі та їх наслідки','Добове й річне обертання, нахил осі та сезони.'],
[6,'06-globus-vydy-umovni-znaky-napriamy','§6','Глобус, умовні знаки та напрями','Модель Землі, види глобусів і напрями.'],
[7,'07-zobrazhennia-zemnoi-poverkhni','§7','Зображення земної поверхні','Космознімок, глобус, карта і план місцевості.'],
[8,'08-vyznachennia-napriamkiv-na-kartakh-ta-mistsevosti','§8','Визначення напрямків на картах та місцевості','Роза напрямків і робота з картою.'],
[9,'09-oriientuvannia-na-mistsevosti-azymuty','Практика','Орієнтування на місцевості й азимути','Компас, азимути та польова робота.'],
[10,'10-masshtab-ta-ioho-vydy','§9','Масштаб та його види','Числовий, іменований і лінійний масштаб.'],
[11,'11-vyznachennia-vidstanei','§10','Визначення відстаней','Лінійка, нитка, курвіметр і похибка.'],
[12,'12-karty-atlasy-onlain-resursy','§11','Карти, атласи та картографічні онлайн-ресурси','OSM, Google Earth, Copernicus і перевірка джерел.'],
[13,'13-zahalnoheohrafichni-ta-tematychni-karty','§12','Загальногеографічні та тематичні карти. Легенди карт','Типи карт, умовні знаки й тематичні дані.'],
[14,'14-heohrafichna-karta-v-zhytti-liudyny','§13','Географічна карта в житті людини','Навігація, господарство, безпека, GIS та геодані.'],
[15,'15-pidsumkovyi-urok-dtr-1','ДТР‑1','Підсумковий урок: «Вступ. Земля на глобусі й карті»','Комплексна діагностика, CER і тест /10.'],
[16,'16-korektsiia-dtr-1','Корекція','Корекція досягнення результатів. Аналіз ДТР‑1','Адаптивні корекційні станції й повторний тест.'],
[17,'17-budova-litosfery','§14','Будова літосфери','Кора, мантія, літосфера, астеносфера й сейсмічні докази.'],
[18,'18-litosferni-plyty-rukh','§15','Літосферні плити, механізм та наслідки їх переміщення','Межі плит, GPS-докази, субдукція й спрединг.'],
[19,'19-zemletrusy','§16','Землетруси','USGS, осередок і епіцентр, магнітуда, інтенсивність і безпека.'],
[20,'20-vulkanizm-seismichni-poiasy','§17','Вулканізм. Сейсмічні пояси світу','Вогняне кільце, моніторинг, CER і експрес-тест.'],
[21,'21-zovnishni-protsesy','§18','Зовнішні процеси на земній поверхні','Вивітрювання, ерозія, зсуви, NASA/USGS і CER.'],
[22,'22-vysoty-horyzontali','§19','Абсолютна і відносна висота. Горизонталі. Шкала висот і глибин','Топографічні моделі, висоти й крутість схилів.'],
[23,'23-formy-reliefu-rivnyny','§20','Форми рельєфу поверхні Землі. Рельєф суходолу. Рівнини','Фізичні карти, класифікація рівнин, CER і тест /10.'],
[24,'24-relef-suhodolu-hory','§21 • ГР3','Рельєф суходолу. Гори','Гірські системи, морфометричні ознаки, NASA, OSM, походження гір, CER і тест /10.'],
[25,'25-relief-dna-okeanu','§22 • ГР1 + ГР2','Рельєф дна океану','Батиметрія, шельф, ложе, хребти, жолоби, Маріанська западина, практична робота, CER і тест /10.']
];document.getElementById('lessonGrid').innerHTML=lessons.map(([n,slug,tag,title,desc])=>`<a class="card" href="${slug}/"><span class="num">${String(n).padStart(2,'0')}</span><div><span class="tag">${tag}</span><h2>${title}</h2><p>${desc}</p></div><span class="go">Відкрити →</span></a>`).join('');</script></body></html>

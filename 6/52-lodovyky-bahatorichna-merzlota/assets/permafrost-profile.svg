<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><rect width="900" height="500" fill="#eaf8ff"/><rect y="0" width="900" height="70" fill="#bce79b"/><path d="M0 70 H900 V210 H0Z" fill="#9a6c4f"/><path d="M0 210 H900 V500 H0Z" fill="#7bbad2"/><path d="M70 105 C160 135 250 80 335 135 S510 150 620 115 S790 140 860 100" fill="none" stroke="#d8f4ff" stroke-width="18" opacity=".8"/><text x="60" y="45" font-family="sans-serif" font-size="26" font-weight="700" fill="#38603e">рослинність</text><text x="60" y="152" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">АКТИВНИЙ ШАР</text><text x="60" y="188" font-family="sans-serif" font-size="21" fill="#fff">відтає влітку • промерзає взимку</text><text x="60" y="315" font-family="sans-serif" font-size="40" font-weight="800" fill="#fff">БАГАТОРІЧНА МЕРЗЛОТА</text><text x="60" y="355" font-family="sans-serif" font-size="22" fill="#e9fbff">ґрунт / породи ≤ 0 °C щонайменше 2 роки</text><circle cx="690" cy="322" r="54" fill="#dff8ff" opacity=".8"/><path d="M665 322 h50 M690 297 v50" stroke="#5597b5" stroke-width="8"/><text x="625" y="410" font-family="sans-serif" font-size="20" fill="#e9fbff">лід може бути в порах і лінзах, але це не «підземний льодовик»</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#f7fbfe"/><text x="60" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#17364b">Шкала висот і великі форми рельєфу</text><g font-family="Arial" fill="#17364b"><rect x="70" y="110" width="250" height="180" rx="20" fill="#bade78"/><text x="105" y="165" font-size="26" font-weight="700">Низовини</text><text x="105" y="210" font-size="42" font-weight="700">0–200 м</text><text x="105" y="255" font-size="20">переважно зелені</text><rect x="350" y="110" width="250" height="180" rx="20" fill="#f1d879"/><text x="385" y="165" font-size="26" font-weight="700">Височини</text><text x="385" y="210" font-size="42" font-weight="700">200–500 м</text><text x="385" y="255" font-size="20">жовто-зелені</text><rect x="630" y="110" width="250" height="180" rx="20" fill="#d3a56a"/><text x="665" y="165" font-size="26" font-weight="700">Плоскогір’я</text><text x="665" y="210" font-size="42" font-weight="700">&gt;500 м</text><text x="665" y="255" font-size="20">вирівняна поверхня</text><rect x="910" y="110" width="220" height="180" rx="20" fill="#9b6c4b"/><text x="950" y="165" font-size="26" font-weight="700">Гори</text><path d="M950 255 L1005 170 L1040 220 L1075 155 L1110 255 Z" fill="#fff" opacity=".8"/><text x="70" y="350" font-size="21">Важливо: межі класів читають за легендою конкретної фізичної карти; висота сама по собі не визначає гори.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fbfeff"/><g font-family="Arial,sans-serif" fill="#16394f"><text x="600" y="65" text-anchor="middle" font-size="40" font-weight="700">Як господарська діяльність створює тиск на океан</text><g font-size="23"><rect x="70" y="145" width="250" height="100" rx="22" fill="#e9f8ff" stroke="#77bfe2"/><text x="195" y="185" text-anchor="middle" font-weight="700">Рибальство</text><text x="195" y="217" text-anchor="middle">перелов • прилов • снасті</text><rect x="475" y="145" width="250" height="100" rx="22" fill="#fff7df" stroke="#e0b959"/><text x="600" y="185" text-anchor="middle" font-weight="700">Судноплавство</text><text x="600" y="217" text-anchor="middle">паливо • шум • сміття</text><rect x="880" y="145" width="250" height="100" rx="22" fill="#f4ecff" stroke="#aa8adc"/><text x="1005" y="185" text-anchor="middle" font-weight="700">Видобування</text><text x="1005" y="217" text-anchor="middle">аварії • буріння • дно</text><rect x="70" y="485" width="250" height="100" rx="22" fill="#eefce9" stroke="#84c66e"/><text x="195" y="525" text-anchor="middle" font-weight="700">Туризм</text><text x="195" y="557" text-anchor="middle">сміття • забудова • шум</text><rect x="475" y="485" width="250" height="100" rx="22" fill="#fff0ee" stroke="#e68a7b"/><text x="600" y="525" text-anchor="middle" font-weight="700">Суходіл</text><text x="600" y="557" text-anchor="middle">стоки • пластик • добрива</text><rect x="880" y="485" width="250" height="100" rx="22" fill="#e9fbf6" stroke="#69c5ac"/><text x="1005" y="525" text-anchor="middle" font-weight="700">Енергетика</text><text x="1005" y="557" text-anchor="middle">простір • кабелі • шум</text></g><g stroke="#4a8098" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M195 245 C240 330 390 330 520 355"/><path d="M600 245 L600 340"/><path d="M1005 245 C950 330 820 330 680 355"/><path d="M195 485 C240 410 390 400 520 375"/><path d="M600 485 L600 390"/><path d="M1005 485 C950 410 820 400 680 375"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a8098"/></marker></defs><ellipse cx="600" cy="365" rx="180" ry="78" fill="#dff5ff" stroke="#2b9bd0" stroke-width="5"/><text x="600" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15435e">Екосистема океану</text><text x="600" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#15435e">ресурси • види • якість води • узбережжя</text><text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4c6d80">Сильний висновок показує не лише «шкоду», а шлях: діяльність → тиск → наслідок → спосіб зменшення.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#78c9e8"/></linearGradient></defs><rect width="1200" height="700" fill="#f8fdff"/><circle cx="600" cy="350" r="250" fill="url(#g)" stroke="#1988bd" stroke-width="10"/><path d="M370 330c100-70 150 55 245 5 85-45 135-20 220 28 70 40 118 9 168-22v150H340z" fill="#2d9ed3" opacity=".65"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#173d54"><text x="600" y="75" font-size="42" font-weight="700">Ресурси Світового океану</text><g font-size="24" font-weight="700"><rect x="65" y="150" width="250" height="105" rx="24" fill="#e9fff2" stroke="#6bc99b"/><text x="190" y="195">Біологічні</text><text x="190" y="226" font-size="19" font-weight="400">риба • молюски • водорості</text><rect x="885" y="150" width="250" height="105" rx="24" fill="#fff6df" stroke="#e3b856"/><text x="1010" y="195">Мінеральні</text><text x="1010" y="226" font-size="19" font-weight="400">нафта • газ • солі</text><rect x="65" y="480" width="250" height="105" rx="24" fill="#f3edff" stroke="#a68be0"/><text x="190" y="525">Енергетичні</text><text x="190" y="556" font-size="19" font-weight="400">вітер • припливи • хвилі</text><rect x="885" y="480" width="250" height="105" rx="24" fill="#fff0ed" stroke="#e88975"/><text x="1010" y="525">Просторові</text><text x="1010" y="556" font-size="19" font-weight="400">транспорт • туризм • зв’язок</text></g><text x="600" y="635" font-size="22">Ресурс стає корисним лише тоді, коли його використання не руйнує систему швидше, ніж вона відновлюється.</text></g></svg>
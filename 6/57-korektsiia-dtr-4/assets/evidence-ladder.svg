<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"><rect width="900" height="620" rx="36" fill="#f8fcff"/><text x="65" y="78" font-family="Arial" font-size="40" font-weight="700" fill="#16465f">Сила доказу</text><g font-family="Arial" text-anchor="middle"><path d="M145 510H755L665 405H235Z" fill="#d9f6ec"/><path d="M235 400H665L595 295H305Z" fill="#dff2ff"/><path d="M305 290H595L545 185H355Z" fill="#fff0d6"/><text x="450" y="465" font-size="26" fill="#176a58">серія вимірювань + контроль</text><text x="450" y="355" font-size="26" fill="#17607f">повторювані спостереження</text><text x="450" y="245" font-size="26" fill="#8a6418">одне спостереження</text><text x="450" y="555" font-size="20" fill="#60798a">Сила залежить від того, наскільки дані прямо перевіряють твердження.</text></g></svg>
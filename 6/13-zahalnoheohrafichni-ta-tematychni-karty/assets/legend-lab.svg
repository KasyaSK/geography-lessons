<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Точкові, лінійні та площинні умовні знаки</title><desc id="d">Навчальна схема трьох основних типів картографічних знаків</desc><rect width="1200" height="620" rx="40" fill="#f7fcff"/><text x="70" y="90" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#16364c">Як легенда стискає реальність у знаки</text><g transform="translate(70 150)"><rect width="320" height="370" rx="28" fill="#fff" stroke="#d7e8f1" stroke-width="4"/><circle cx="160" cy="125" r="34" fill="#222"/><text x="160" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#16364c">ТОЧКА</text><text x="160" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#627a8b">місто • вершина</text><text x="160" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#627a8b">маяк • колодязь</text></g><g transform="translate(440 150)"><rect width="320" height="370" rx="28" fill="#fff" stroke="#d7e8f1" stroke-width="4"/><path d="M55 120 C120 60 205 185 270 105" fill="none" stroke="#168fd8" stroke-width="18" stroke-linecap="round"/><text x="160" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#16364c">ЛІНІЯ</text><text x="160" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#627a8b">річка • дорога</text><text x="160" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#627a8b">кордон • горизонталь</text></g><g transform="translate(810 150)"><rect width="320" height="370" rx="28" fill="#fff" stroke="#d7e8f1" stroke-width="4"/><path d="M72 75 H250 Q280 75 267 118 L238 160 Q220 185 180 166 L113 180 Q75 185 65 148 Z" fill="#81c784" stroke="#4d9c5c" stroke-width="5"/><text x="160" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" f
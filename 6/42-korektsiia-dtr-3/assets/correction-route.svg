<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Маршрут корекції після ДТР-3</title><desc id="d">Схема: помилка, визначення типу труднощів, потрібна станція, нова спроба, повторна перевірка.</desc><rect width="1200" height="360" rx="32" fill="#f3fbff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="45" y="110" width="190" height="120" rx="24" fill="#fff1e8" stroke="#e0a880" stroke-width="3"/><text x="140" y="158" font-size="28" font-weight="700" fill="#734934">1. Помилка</text><text x="140" y="194" font-size="20" fill="#734934">не вгадуємо —</text><text x="140" y="220" font-size="20" fill="#734934">називаємо тип</text></g><g><rect x="280" y="110" width="190" height="120" rx="24" fill="#fff8cf" stroke="#d7c15b" stroke-width="3"/><text x="375" y="158" font-size="28" font-weight="700" fill="#665a20">2. Діагностика</text><text x="375" y="194" font-size="20" fill="#665a20">що саме</text><text x="375" y="220" font-size="20" fill="#665a20">не працює?</text></g><g><rect x="515" y="110" width="190" height="120" rx="24" fill="#e8f7ff" stroke="#69b7df" stroke-width="3"/><text x="610" y="158" font-size="28" font-weight="700" fill="#1c6488">3. Станція</text><text x="610" y="194" font-size="20" fill="#1c6488">алгоритм після</text><text x="610" y="220" font-size="20" fill="#1c6488">власної спроби</text></g><g><rect x="750" y="110" width="190" height="120" rx="24" fill="#eafaf2" stroke="#78c7a4" stroke-width="3"/><text x="845" y="158" font-size="28" font-weight="700" fill="#24674f">4. Нова спроба</text><text x="845" y="194" font-size="20" fill="#24674f">інший приклад,</text><text x="845" y="220" font-size="20" fill="#24674f">без копіювання</text></g><g><rect x="985" y="110" width="170" height="120" rx="24" fill="#eef0ff" stroke="#888fd7" stroke-width="3"/><text x="1070" y="158" font-size="27" font-weight="700" fill="#454d8b">5. /10</text><text x="1070" y="194" font-size="20" fill="#454d8b">повторна</text><text x="1070" y="220" font-size="20" fill="#454d8b">перевірка</text></g><g stroke="#5e7b8d" stroke-width="5" fill="none"><path d="M235 170h35"/><path d="M470 170h35"/><path d="M705 170h35"/><path d="M940 170h35"/></g><g fill="#5e7b8d"><path d="M270 170l-14-9v18z"/><path d="M505 170l-14-9v18z"/><path d="M740 170l-14-9v18z"/><path d="M975 170l-14-9v18z"/></g><text x="600" y="55" font-size="31" font-weight="700" fill="#17384d">Корекція — це відновлення алгоритму, а не повторення всієї теми</text><text x="600" y="305" font-size="22" fill="#5e7685">Якщо результат не покращився — повертаємося лише до слабкої станції, а не починаємо весь урок спочатку.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="34" fill="#f4fbff"/><g font-family="Arial" fill="#17364c" font-weight="700"><rect x="45" y="115" width="190" height="120" rx="25" fill="#e7f6fd"/><text x="140" y="165" text-anchor="middle" font-size="25">СПОСТЕРЕЖЕННЯ</text><text x="140" y="198" text-anchor="middle" font-size="18" font-weight="400">що бачимо / вимірюємо</text><rect x="285" y="115" width="190" height="120" rx="25" fill="#edfff3"/><text x="380" y="165" text-anchor="middle" font-size="25">ДАНІ</text><text x="380" y="198" text-anchor="middle" font-size="18" font-weight="400">карта • таблиця • знімок</text><rect x="525" y="115" width="190" height="120" rx="25" fill="#fff6e8"/><text x="620" y="165" text-anchor="middle" font-size="25">МЕХАНІЗМ</text><text x="620" y="198" text-anchor="middle" font-size="18" font-weight="400">чому це пов’язано</text><rect x="765" y="115" width="190" height="120" rx="25" fill="#f2edff"/><text x="860" y="165" text-anchor="middle" font-size="25">ВИСНОВОК</text><text x="860" y="198" text-anchor="middle" font-size="18" font-weight="400">не сильніший за доказ</text></g><g stroke="#1686af" stroke-width="7" fill="none"><path d="M235 175h40"/><path d="M475 175h40"/><path d="M715 175h40"/></g><g fill="#1686af"><path d="M275 175l-16-10v20z"/><path d="M515 175l-16-10v20z"/><path d="M755 175l-16-10v20z"/></g><text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#17364c">Ланцюг географічного доказу</text><text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="20" fill="#5d7484">Сильна відповідь відділяє факт від припущення і пояснює причинний зв’язок.</text></svg>
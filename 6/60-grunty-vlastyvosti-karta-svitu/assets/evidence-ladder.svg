<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t"><title id="t">Сходи доказів для дослідження ґрунту</title><rect width="900" height="520" rx="36" fill="#f8fbf2"/><g font-family="Inter,Arial"><text x="450" y="68" text-anchor="middle" font-size="36" font-weight="950" fill="#314126">Сила доказу: від спостереження до аналізу</text><g><rect x="90" y="385" width="720" height="78" rx="20" fill="#e9f2d4"/><text x="125" y="432" font-size="25" font-weight="850" fill="#43552c">1 • Фото / видима ознака — сигнал, а не діагноз</text></g><g><rect x="150" y="292" width="600" height="78" rx="20" fill="#dce9bd"/><text x="185" y="339" font-size="25" font-weight="850" fill="#405128">2 • Карта / супутниковий шар — просторовий контекст</text></g><g><rect x="210" y="199" width="480" height="78" rx="20" fill="#cadc98"/><text x="245" y="246" font-size="25" font-weight="850" fill="#3b4b24">3 • Польове вимірювання — pH, текстура, вологість</text></g><g><rect x="270" y="106" width="360" height="78" rx="20" fill="#adc96e"/><text x="450" y="153" text-anchor="middle" font-size="25" font-weight="900" fill="#29351e">4 • Лабораторний аналіз</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">Профіль ґрунту</title><desc id="d">Навчальна схема ґрунтового профілю з горизонтами та корінням</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#f8fbef"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".12"/></filter></defs><rect width="900" height="650" rx="40" fill="url(#sky)"/><g filter="url(#s)"><rect x="90" y="170" width="720" height="390" rx="28" fill="#fff"/><path d="M90 235H810V170H90Z" fill="#79a94d"/><path d="M90 300H810V235H90Z" fill="#493c2e"/><path d="M90 405H810V300H90Z" fill="#775b3e"/><path d="M90 500H810V405H90Z" fill="#b88d62"/><path d="M90 560H810V500H90Z" fill="#d7bd91"/><g stroke="#e7d09d" stroke-width="5" fill="none"><path d="M280 210c0 80-40 105-35 200"/><path d="M420 205c8 70 58 120 40 215"/><path d="M590 210c-5 85-54 120-45 215"/></g></g><g font-family="Inter,Arial" fill="#243125"><text x="118" y="218" font-size="30" font-weight="800">Рослинність і рештки</text><text x="118" y="279" font-size="28" font-weight="900" fill="#fff">A • гумусовий горизонт</text><text x="118" y="356" font-size="28" font-weight="900" fill="#fff">B • перехідний горизонт</text><text x="118" y="463" font-size="28" font-weight="900">C • материнська порода</text><text x="118" y="543" font-size="26" font-weight="800">Породи, що слабко змінені</text><text x="450" y="92" text-anchor="middle" font-size="38" font-weight="950">Ґрунтовий профіль — історія процесів</text><text x="450" y="130" text-anchor="middle" font-size="22">Колір, структура й товщина горизонтів — це докази, але не вся відповідь</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="36" fill="#f4fbf6"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#174c39">NDVI: від сигналу до висновку</text><g font-family="Arial"><rect x="70" y="130" width="210" height="230" rx="28" fill="#fff" stroke="#b8dbc4" stroke-width="3"/><circle cx="175" cy="220" r="62" fill="#79bd72"/><text x="175" y="318" text-anchor="middle" font-size="25" font-weight="700" fill="#245543">Супутниковий</text><text x="175" y="348" text-anchor="middle" font-size="25" font-weight="700" fill="#245543">сигнал</text><path d="M300 245h95" stroke="#68a87e" stroke-width="8"/><path d="M390 225l35 20-35 20" fill="#68a87e"/><rect x="425" y="130" width="210" height="230" rx="28" fill="#fff" stroke="#b8dbc4" stroke-width="3"/><text x="530" y="210" text-anchor="middle" font-size="54">🌿</text><text x="530" y="278" text-anchor="middle" font-size="25" font-weight="700" fill="#245543">Інтенсивність</text><text x="530" y="308" text-anchor="middle" font-size="25" font-weight="700" fill="#245543">зеленої</text><text x="530" y="338" text-anchor="middle" font-size="25" font-weight="700" fill="#245543">рослинності</text><path d="M655 245h70" stroke="#68a87e" stroke-width="8"/><path d="M720 225l35 20-35 20" fill="#68a87e"/><rect x="755" y="130" width="110" height="230" rx="28" fill="#fff2e3" stroke="#e4b367" stroke-width="3"/><text x="810" y="210" text-anchor="middle" font-size="46">?</text><text x="810" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#7a5322">вид?</text><text x="810" y="303" text-anchor="middle" font-size="20" font-weight="700" fill="#7a5322">запас?</text><text x="810" y="336" text-anchor="middle" font-size="20" font-weight="700" fill="#7a5322">сталість?</text><text x="450" y="435" text-anchor="middle" font-size="24" fill="#566d62">Сильний зелений сигнал — це доказ рослинності, але не автоматичний доказ виду, біорізноманіття чи допустимого вилучення.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="32" fill="#fbfdff"/><g font-family="system-ui" fill="#17344c"><text x="450" y="55" text-anchor="middle" font-size="32" font-weight="900">Оцінювання швидкості вітру за місцевими ознаками</text><g transform="translate(80 110)"><circle cx="55" cy="55" r="45" fill="#dff5ff"/><path d="M50 85V30M50 55C25 42 15 24 8 8M50 55C75 42 85 24 92 8" stroke="#537b55" stroke-width="8" fill="none"/><text x="140" y="45" font-size="25" font-weight="800">0–2 м/с</text><text x="140" y="78" font-size="20">дим майже вертикальний, листя ледве рухається</text></g><g transform="translate(80 230)"><circle cx="55" cy="55" r="45" fill="#e9f8ee"/><path d="M52 88V30M52 56C20 42 12 18 5 2M52 56C85 46 102 28 112 10" stroke="#537b55" stroke-width="8" fill="none"/><text x="140" y="45" font-size="25" font-weight="800">3–8 м/с</text><text x="140" y="78" font-size="20">листя й тонкі гілки рухаються, може підійматись пил</text></g><g transform="translate(80 350)"><circle cx="55" cy="55" r="45" fill="#fff1d8"/><path d="M55 90V28M55 58C10 45 0 16 -8 -8M55 58C110 48 125 20 135 -6" stroke="#537b55" stroke-width="9" fill="none"/><text x="140" y="45" font-size="25" font-weight="800">11–21 м/с</text><text x="140" y="78" font-size="20">рухаються великі гілки або цілі дерева, важко йти проти вітру</text></g></g></svg>
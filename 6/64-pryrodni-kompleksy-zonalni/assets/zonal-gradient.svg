<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Широтна зміна зональних природних комплексів</title><desc id="d">Навчальна схема від екватора до полюса: вологий тропічний ліс, савана, пустеля, степ, мішані ліси, тайга, тундра.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#dff4ff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="url(#sky)"/><text x="54" y="56" font-family="system-ui" font-size="28" font-weight="800" fill="#17364c">Від екватора до полюса: змінюються тепло + волога → змінюється природний комплекс</text><g font-family="system-ui" font-weight="800" text-anchor="middle"><g transform="translate(80 110)"><rect width="140" height="220" rx="22" fill="#49b96f"/><text x="70" y="52" font-size="42">🌴</text><text x="70" y="108" font-size="19" fill="white">Вологі</text><text x="70" y="132" font-size="19" fill="white">ліси</text></g><g transform="translate(240 110)"><rect width="140" height="220" rx="22" fill="#c7ae46"/><text x="70" y="52" font-size="42">🌾</text><text x="70" y="118" font-size="19" fill="white">Савана</text></g><g transform="translate(400 110)"><rect width="140" height="220" rx="22" fill="#e1a24b"/><text x="70" y="52" font-size="42">🏜️</text><text x="70" y="118" font-size="19" fill="white">Пустеля</text></g><g transform="translate(560 110)"><rect width="140" height="220" rx="22" fill="#9dbb58"/><text x="70" y="52" font-size="42">🌱</text><text x="70" y="118" font-size="19" fill="white">Степ</text></g><g transform="translate(720 110)"><rect width="140" height="220" rx="22" fill="#57995f"/><text x="70" y="52" font-size="42">🍂</text><text x="70" y="108" font-size="18" fill="white">Мішані /</text><text x="70" y="132" font-size="18" fill="white">широколисті</text></g><g transform="translate(880 110)"><rect width="140" height="220" rx="22" fill="#3f7c69"/><text x="70" y="52" font-size="42">🌲</text><text x="70" y="118" font-size="19" fill="white">Тайга</text></g><g transform="translate(1040 110)"><rect width="110" height="220" rx="22" fill="#86a9a8"/><text x="55" y="52" font-size="42">❄️</text><text x="55" y="118" font-size="18" fill="white">Тундра</text></g></g><path d="M70 370H1130" stroke="#17364c" stroke-width="4" stroke-linecap="round"/><path d="M1120 360l20 10-20 10" fill="none" stroke="#17364c" stroke-width="4"/><text x="70" y="401" font-family="system-ui" font-size="18" font-weight="800" fill="#17364c">більше сонячної енергії</text><text x="930" y="401" font-family="system-ui" font-size="18" font-weight="800" fill="#17364c">менше сонячної енергії</text></svg>
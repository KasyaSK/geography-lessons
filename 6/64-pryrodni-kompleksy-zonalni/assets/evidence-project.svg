<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Сходи доказів для характеристики природного комплексу</title><desc id="d">Схема: спостереження, карта, кліматичні дані, супутникові дані, узгоджений висновок.</desc><rect width="1000" height="520" rx="30" fill="#f4fbff"/><text x="60" y="58" font-family="system-ui" font-size="30" font-weight="900" fill="#17364c">Сильна характеристика природного комплексу = кілька незалежних доказів</text><g font-family="system-ui" font-weight="800"><rect x="80" y="380" width="250" height="72" rx="18" fill="#d9f7e8"/><text x="105" y="424" font-size="22" fill="#17694f">1. Спостереження / фото</text><rect x="210" y="295" width="300" height="72" rx="18" fill="#dff1ff"/><text x="238" y="339" font-size="22" fill="#17608f">2. Карта + розташування</text><rect x="340" y="210" width="330" height="72" rx="18" fill="#fff0cd"/><text x="368" y="254" font-size="22" fill="#8c6014">3. Температура + опади</text><rect x="470" y="125" width="360" height="72" rx="18" fill="#efe6ff"/><text x="498" y="169" font-size="22" fill="#68459b">4. Супутникове покриття</text><rect x="600" y="40" width="330" height="72" rx="18" fill="#e0fff6"/><text x="630" y="84" font-size="22" fill="#087863">5. Узгоджений висновок</text></g><path d="M80 470H920" stroke="#17364c" stroke-width="3" stroke-dasharray="9 8"/><text x="80" y="505" font-family="system-ui" font-size="18" fill="#61798a">Один знімок показує вигляд місцевості, але не доводить клімат, ґрунт чи причину її стану.</text></svg>
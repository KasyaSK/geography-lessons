<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="t d"><title id="t">Матриця доказів для оцінки стану довкілля</title><desc id="d">Схема показує, які джерела потрібні екологу, біологу, географу і хіміку</desc><rect width="1040" height="520" rx="34" fill="#f7fbff"/><text x="520" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173f59">Експертна оцінка: один висновок — кілька незалежних доказів</text><g font-family="Arial,sans-serif"><g transform="translate(60 105)"><rect width="420" height="145" rx="24" fill="#eaf8ef" stroke="#65b984" stroke-width="3"/><text x="28" y="40" font-size="24" font-weight="700" fill="#22643d">🌿 Біолог</text><text x="28" y="77" font-size="18" fill="#315d45">• видовий склад і рослинний покрив</text><text x="28" y="105" font-size="18" fill="#315d45">• індикаторні види, стан біоти</text><text x="28" y="133" font-size="18" fill="#315d45">• фото + повторні спостереження</text></g><g transform="translate(560 105)"><rect width="420" height="145" rx="24" fill="#e9f5ff" stroke="#6eaee0" stroke-width="3"/><text x="28" y="40" font-size="24" font-weight="700" fill="#245e86">🗺️ Географ</text><text x="28" y="77" font-size="18" fill="#385f76">• карта землекористування</text><text x="28" y="105" font-size="18" fill="#385f76">• супутникові зміни в часі</text><text x="28" y="133" font-size="18" fill="#385f76">• просторові зв’язки й масштаби</text></g><g transform="translate(60 290)"><rect width="420" height="145" rx="24" fill="#fff5e5" stroke="#e2ac55" stroke-width="3"/><text x="28" y="40" font-size="24" font-weight="700" fill="#815719">🧪 Хімік</text><text x="28" y="77" font-size="18" fill="#6e5b3d">• pH, нітрати, завислі речовини</text><text x="28" y="105" font-size="18" fill="#6e5b3d">• проби води / ґрунту / повітря</text><text x="28" y="133" font-size="18" fill="#6e5b3d">• контроль і повторність вимірювань</text></g><g transform="translate(560 290)"><rect width="420" height="145" rx="24" fill="#f4edff" stroke="#aa86d5" stroke-width="3"/><text x="28" y="40" font-size="24" font-weight="700" fill="#634082">♻️ Еколог</text><text x="28" y="77" font-size="18" fill="#685878">• джерело навантаження</text><text x="28" y="105" font-size="18" fill="#685878">• шлях впливу й ризик</text><text x="28" y="133" font-size="18" fill="#685878">• рішення та його побічні ефекти</text></g></g><text x="520" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4b687b">Фото показує «що видно», вимірювання — «скільки», карта — «де», часовий ряд — «як змінюється», а причинний висновок потребує поєднання доказів.</text></svg>
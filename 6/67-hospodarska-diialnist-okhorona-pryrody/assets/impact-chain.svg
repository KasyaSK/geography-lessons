<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">Ланцюг впливу господарської діяльності</title><desc id="d">Схема: потреба людини — господарська дія — зміна компонента природи — наслідок — рішення</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e7f7ff"/><stop offset="1" stop-color="#edfff2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".12"/></filter></defs><rect width="1100" height="360" rx="36" fill="url(#g)"/><g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)"><g><rect x="35" y="112" width="175" height="130" rx="24" fill="#fff" stroke="#86c8e8" stroke-width="3"/><text x="122" y="157" font-size="22" font-weight="700" fill="#174b68">ПОТРЕБА</text><text x="122" y="190" font-size="18" fill="#3f667a">їжа • енергія</text><text x="122" y="216" font-size="18" fill="#3f667a">житло • транспорт</text></g><g><rect x="250" y="112" width="175" height="130" rx="24" fill="#fff" stroke="#f1bd63" stroke-width="3"/><text x="337" y="157" font-size="22" font-weight="700" fill="#7d5310">ДІЯ</text><text x="337" y="190" font-size="18" fill="#6d634e">видобуток</text><text x="337" y="216" font-size="18" fill="#6d634e">виробництво</text></g><g><rect x="465" y="112" width="175" height="130" rx="24" fill="#fff" stroke="#ef8c83" stroke-width="3"/><text x="552" y="157" font-size="22" font-weight="700" fill="#7b302b">ЗМІНА</text><text x="552" y="190" font-size="18" fill="#76514f">вода • ґрунт</text><text x="552" y="216" font-size="18" fill="#76514f">повітря • біота</text></g><g><rect x="680" y="112" width="175" height="130" rx="24" fill="#fff" stroke="#b894df" stroke-width="3"/><text x="767" y="157" font-size="22" font-weight="700" fill="#56357a">НАСЛІДОК</text><text x="767" y="190" font-size="18" fill="#695679">для людей</text><text x="767" y="216" font-size="18" fill="#695679">і екосистем</text></g><g><rect x="895" y="112" width="170" height="130" rx="24" fill="#fff" stroke="#60c490" stroke-width="3"/><text x="980" y="157" font-size="22" font-weight="700" fill="#17643b">РІШЕННЯ</text><text x="980" y="190" font-size="18" fill="#3e6f57">менше ресурсів</text><text x="980" y="216" font-size="18" fill="#3e6f57">менше відходів</text></g></g><g stroke="#557f91" stroke-width="5" fill="none" stroke-linecap="round"><path d="M212 177h30"/><path d="M427 177h30"/><path d="M642 177h30"/><path d="M857 177h30"/></g><g fill="#557f91"><path d="M241 177l-13-10v20z"/><path d="M456 177l-13-10v20z"/><path d="M671 177l-13-10v20z"/><path d="M886 177l-13-10v20z"/></g><text x="550" y="315" font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#496b7b">Сильний географічний висновок показує не лише проблему, а й механізм зв’язку та реалістичний спосіб зменшення впливу.</text></svg>
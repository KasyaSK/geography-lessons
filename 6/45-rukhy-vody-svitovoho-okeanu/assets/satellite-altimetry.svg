<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="30" fill="#eef9ff"/><path d="M0 360 Q180 320 360 355 T720 350 T900 360 V520 H0Z" fill="#8ed0e8"/><path d="M0 380 Q180 340 360 375 T720 370 T900 380" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/><g transform="translate(430 90)"><rect x="-55" y="-20" width="110" height="65" rx="12" fill="#d8e2ea" stroke="#6b8798" stroke-width="4"/><rect x="-145" y="-5" width="82" height="35" fill="#355b9b"/><rect x="63" y="-5" width="82" height="35" fill="#355b9b"/><circle cx="0" cy="12" r="17" fill="#f0b64a"/></g><path d="M430 145 L430 340" stroke="#ef7c4d" stroke-width="7" stroke-dasharray="14 10"/><path d="M430 340 L405 300 M430 340 L455 300" stroke="#ef7c4d" stroke-width="7"/><g font-family="system-ui,sans-serif" fill="#17394d"><text x="450" y="48" text-anchor="middle" font-size="32" font-weight="800">Супутникова альтиметрія</text><text x="450" y="205" text-anchor="middle" font-size="22">радарний імпульс</text><text x="450" y="415" text-anchor="middle" font-size="24" font-weight="700">Висота морської поверхні змінюється на сантиметри</text><text x="450" y="450" text-anchor="middle" font-size="20" fill="#587486">За просторовими градієнтами висоти та іншими даними відновлюють циркуляцію й вихори.</text></g></svg>
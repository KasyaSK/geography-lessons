<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" rx="30" fill="#f3fbff"/><g font-family="system-ui,sans-serif"><text x="450" y="54" text-anchor="middle" font-size="34" font-weight="800" fill="#17384d">Що формує океанічні течії?</text><g><rect x="55" y="110" width="230" height="120" rx="24" fill="#fff" stroke="#bcdde9" stroke-width="3"/><text x="170" y="152" text-anchor="middle" font-size="28">💨 Вітер</text><text x="170" y="190" text-anchor="middle" font-size="20" fill="#567487">штовхає поверхневі</text><text x="170" y="216" text-anchor="middle" font-size="20" fill="#567487">водні маси</text></g><g><rect x="335" y="110" width="230" height="120" rx="24" fill="#fff" stroke="#bcdde9" stroke-width="3"/><text x="450" y="152" text-anchor="middle" font-size="28">🌍 Обертання</text><text x="450" y="190" text-anchor="middle" font-size="20" fill="#567487">відхиляє великі</text><text x="450" y="216" text-anchor="middle" font-size="20" fill="#567487">потоки</text></g><g><rect x="615" y="110" width="230" height="120" rx="24" fill="#fff" stroke="#bcdde9" stroke-width="3"/><text x="730" y="152" text-anchor="middle" font-size="28">🧱 Материки</text><text x="730" y="190" text-anchor="middle" font-size="20" fill="#567487">спрямовують і</text><text x="730" y="216" text-anchor="middle" font-size="20" fill="#567487">перегороджують</text></g><g><rect x="195" y="300" width="230" height="120" rx="24" fill="#fff" stroke="#bcdde9" stroke-width="3"/><text x="310" y="342" text-anchor="middle" font-size="28">🌡️ Температура</text><text x="310" y="380" text-anchor="middle" font-size="20" fill="#567487">змінює густину</text><text x="310" y="406" text-anchor="middle" font-size="20" fill="#567487">води</text></g><g><rect x="475" y="300" width="230" height="120" rx="24" fill="#fff" stroke="#bcdde9" stroke-width="3"/><text x="590" y="342" text-anchor="middle" font-size="28">🧂 Солоність</text><text x="590" y="380" text-anchor="middle" font-size="20" fill="#567487">також змінює</text><text x="590" y="406" text-anchor="middle" font-size="20" fill="#567487">густину</text></g><path d="M170 245 C210 285 245 270 285 292 M450 245 V285 M730 245 C690 285 650 270 615 292 M310 430 C350 455 400 462 450 462 M590 430 C550 455 500 462 450 462" fill="none" stroke="#88b9cd" stroke-width="5"/><rect x="300" y="460" width="300" height="70" rx="24" fill="#dff6ff" stroke="#8ccce4" stroke-width="3"/><text x="450" y="505" text-anchor="middle" font-size="30" font-weight="800" fill="#146c93">Система течій</text></g></svg>
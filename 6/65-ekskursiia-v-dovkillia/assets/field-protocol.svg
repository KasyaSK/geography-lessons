<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><rect width="900" height="420" rx="28" fill="#f5fffb"/><text x="50" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#176b5b">Польовий протокол</text><g font-family="Arial" font-size="24" fill="#17364c"><rect x="50" y="95" width="800" height="60" rx="16" fill="#def7ee"/><text x="75" y="134">1. Де? — маршрут, точка, координата / орієнтир</text><rect x="50" y="170" width="800" height="60" rx="16" fill="#e6f3ff"/><text x="75" y="209">2. Що бачу? — рельєф, вода, ґрунт, організми, сліди людини</text><rect x="50" y="245" width="800" height="60" rx="16" fill="#fff1d9"/><text x="75" y="284">3. Що вимірюю / порівнюю? — однаково у всіх точках</text><rect x="50" y="320" width="800" height="60" rx="16" fill="#f1eaff"/><text x="75" y="359">4. Що пояснюю? — окремо від факту, з доказами</text></g></svg>
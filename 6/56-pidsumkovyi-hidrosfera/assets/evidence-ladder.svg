<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650"><rect width="1000" height="650" rx="36" fill="#eef9fd"/><g font-family="Arial,sans-serif"><text x="500" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#173b51">Драбина доказів</text><g font-size="22" font-weight="700"><rect x="90" y="500" width="820" height="72" rx="18" fill="#dff3fb"/><text x="125" y="545" fill="#24546b">1. Спостереження: що реально зафіксовано?</text><rect x="150" y="405" width="760" height="72" rx="18" fill="#d7f3ed"/><text x="185" y="450" fill="#23594d">2. Порівняння: з чим зіставляємо?</text><rect x="210" y="310" width="700" height="72" rx="18" fill="#fff2cf"/><text x="245" y="355" fill="#725b18">3. Повторні вимірювання: чи повторюється сигнал?</text><rect x="270" y="215" width="640" height="72" rx="18" fill="#ffe6d9"/><text x="305" y="260" fill="#70432f">4. Карта й джерела: який просторовий контекст?</text><rect x="330" y="120" width="580" height="72" rx="18" fill="#e7e2ff"/><text x="365" y="165" fill="#504776">5. Висновок: не сильніший за докази</text></g><path d="M120 570V110" stroke="#1591bd" stroke-width="6"/><path d="M120 110l-16 28h32z" fill="#1591bd"/><text x="55" y="350" transform="rotate(-90 55 350)" font-size="21" font-weight="700" fill="#1591bd">зростає надійність</text></g></svg>
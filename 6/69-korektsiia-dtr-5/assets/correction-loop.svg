<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380"><rect width="1000" height="380" rx="32" fill="#f8fcff"/><g font-family="Arial" text-anchor="middle" fill="#17364c"><g><rect x="45" y="120" width="190" height="120" rx="24" fill="#fff0e3" stroke="#e29a50" stroke-width="4"/><text x="140" y="170" font-size="28" font-weight="700">ПОМИЛКА</text><text x="140" y="207" font-size="20">що не спрацювало?</text></g><g><rect x="285" y="120" width="190" height="120" rx="24" fill="#e8f7ff" stroke="#58a7d2" stroke-width="4"/><text x="380" y="170" font-size="28" font-weight="700">ПРИЧИНА</text><text x="380" y="207" font-size="20">де логічний розрив?</text></g><g><rect x="525" y="120" width="190" height="120" rx="24" fill="#efffe8" stroke="#6cb35d" stroke-width="4"/><text x="620" y="170" font-size="28" font-weight="700">ДОКАЗ</text><text x="620" y="207" font-size="20">чим перевірити?</text></g><g><rect x="765" y="120" width="190" height="120" rx="24" fill="#f3ecff" stroke="#9471c8" stroke-width="4"/><text x="860" y="170" font-size="28" font-weight="700">КОРЕКЦІЯ</text><text x="860" y="207" font-size="20">нова відповідь</text></g></g><g stroke="#7894a6" stroke-width="6" fill="none"><path d="M235 180H275"/><path d="M475 180H515"/><path d="M715 180H755"/></g><g fill="#7894a6"><path d="M275 180l-16-10v20z"/><path d="M515 180l-16-10v20z"/><path d="M755 180l-16-10v20z"/></g><text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="24" fill="#567486">Корекція — це не повторення відповіді, а перебудова способу міркування.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"><rect width="900" height="620" rx="36" fill="#f4fbff"/><circle cx="450" cy="300" r="100" fill="#fff" stroke="#2b88c7" stroke-width="8"/><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#17364c">СИЛЬНА</text><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#17364c">ВІДПОВІДЬ</text><g font-family="Arial" font-size="27" font-weight="700" fill="#17364c"><rect x="70" y="75" width="290" height="110" rx="24" fill="#e8f7ff" stroke="#54a8d8" stroke-width="4"/><text x="215" y="122" text-anchor="middle">ПОНЯТТЯ</text><text x="215" y="158" text-anchor="middle" font-size="20" font-weight="400">що саме відбувається?</text><rect x="540" y="75" width="290" height="110" rx="24" fill="#efffe8" stroke="#69b95a" stroke-width="4"/><text x="685" y="122" text-anchor="middle">ДОКАЗ</text><text x="685" y="158" text-anchor="middle" font-size="20" font-weight="400">карта / дані / вимір</text><rect x="70" y="430" width="290" height="110" rx="24" fill="#fff5df" stroke="#dda33c" stroke-width="4"/><text x="215" y="477" text-anchor="middle">МЕХАНІЗМ</text><text x="215" y="513" text-anchor="middle" font-size="20" font-weight="400">чому це пов’язано?</text><rect x="540" y="430" width="290" height="110" rx="24" fill="#f5edff" stroke="#9872cf" stroke-width="4"/><text x="685" y="477" text-anchor="middle">МЕЖІ</text><text x="685" y="513" text-anchor="middle" font-size="20" font-weight="400">чого дані не доводять?</text></g><g stroke="#7b98aa" stroke-width="5" fill="none"><path d="M330 180L405 230"/><path d="M570 180L495 230"/><path d="M330 440L405 370"/><path d="M570 440L495 370"/></g></svg>
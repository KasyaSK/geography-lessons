<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><rect width="900" height="420" rx="28" fill="#f4fbff"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#153f59">Що змінює солоність поверхневих вод?</text><g font-family="Arial" font-size="20" fill="#153f59"><rect x="55" y="95" width="225" height="250" rx="24" fill="#fff4cf" stroke="#e9c45a"/><text x="167" y="135" text-anchor="middle" font-weight="700">Випаровування</text><path d="M105 280 C145 230 185 330 230 270" fill="none" stroke="#1f8fd1" stroke-width="16"/><path d="M120 220 q15-42 30 0 M165 205 q15-42 30 0 M205 225 q15-42 30 0" fill="none" stroke="#e79c2a" stroke-width="7"/><text x="167" y="325" text-anchor="middle">вода йде → сіль лишається</text><rect x="337" y="95" width="225" height="250" rx="24" fill="#eaf8ff" stroke="#78bfe8"/><text x="449" y="135" text-anchor="middle" font-weight="700">Опади / річки</text><path d="M390 185 q58-60 118 0" fill="#cbe7f6" stroke="#78bfe8" stroke-width="5"/><path d="M400 215 l-20 45 M440 215 l-20 45 M480 215 l-20 45" stroke="#1f8fd1" stroke-width="7"/><path d="M370 300 C415 270 470 320 525 285" fill="none" stroke="#1f8fd1" stroke-width="16"/><text x="449" y="325" text-anchor="middle">прісна вода → солоність ↓</text><rect x="619" y="95" width="225" height="250" rx="24" fill="#eefaf5" stroke="#83ceb1"/><text x="731" y="135" text-anchor="middle" font-weight="700">Лід</text><path d="M665 280 C705 235 760 320 805 275" fill="none" stroke="#1f8fd1" stroke-width="16"/><path d="M700 185 l35-35 42 38-18 48-55-7z" fill="#dff7ff" stroke="#8fd4ea" stroke-width="5"/><text x="731" y="315" text-anchor="middle">танення → солоність ↓</text></g><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="18" fill="#617985">Солоність — баланс між втратою й надходженням прісної води.</text></svg>
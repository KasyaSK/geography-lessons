<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Однакова кількість водяної пари за різної температури</title><desc id="d">Дві посудини показують 10 грамів на кубічний метр водяної пари. За 15 градусів це близько 78 відсотків насичення, за 30 градусів — близько 33 відсотків.</desc><rect width="900" height="420" rx="28" fill="#f8fdff"/><text x="450" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#174e68">10 г/м³ водяної пари — але різна RH</text><g transform="translate(130,85)"><text x="155" y="0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#174e68">15°C</text><rect x="35" y="25" width="240" height="260" rx="22" fill="#fff" stroke="#72bfcf" stroke-width="5"/><rect x="35" y="82" width="240" height="203" rx="18" fill="#55c4d6" opacity=".82"/><text x="155" y="190" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="#fff">≈78%</text><text x="155" y="325" text-anchor="middle" font-family="Arial" font-size="18" fill="#4e6f7e">макс. ≈12,8 г/м³</text></g><g transform="translate(490,85)"><text x="155" y="0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#174e68">30°C</text><rect x="35" y="25" width="240" height="260" rx="22" fill="#fff" stroke="#f1b85a" stroke-width="5"/><rect x="35" y="200" width="240" height="85" rx="18" fill="#f7bd58" opacity=".9"/><text x="155" y="258" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="#fff">≈33%</text><text x="155" y="325" text-anchor="middle" font-family="Arial" font-size="18" fill="#4e6f7e">макс. ≈30,4 г/м³</text></g><text x="450" y="398" text-anchor="middle" font-family="Arial" font-size="18" fill="#557786">Відносна вологість залежить і від кількості пари, і від температури.</text></svg>
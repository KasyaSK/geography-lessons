<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Схема психрометра</title><desc id="d">Сухий і вологий термометри. Вологий резервуар охолоджується через випаровування.</desc><rect width="760" height="360" rx="30" fill="#f8fdff"/><text x="380" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#174e68">Психрометр: два термометри — одна підказка про RH</text><g transform="translate(130,75)"><text x="90" y="0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#315e72">СУХИЙ</text><rect x="68" y="25" width="44" height="190" rx="22" fill="#fff" stroke="#7faaba" stroke-width="4"/><rect x="82" y="64" width="16" height="136" rx="8" fill="#ff7c68"/><circle cx="90" cy="218" r="28" fill="#ff7c68"/><text x="90" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#315e72">25°C</text></g><g transform="translate(430,75)"><text x="90" y="0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#315e72">ВОЛОГИЙ</text><rect x="68" y="25" width="44" height="190" rx="22" fill="#fff" stroke="#7faaba" stroke-width="4"/><rect x="82" y="92" width="16" height="108" rx="8" fill="#41a9d0"/><circle cx="90" cy="218" r="28" fill="#41a9d0"/><path d="M45 225 Q90 190 135 225 L135 252 Q90 277 45 252Z" fill="#beeefa" opacity=".85"/><text x="90" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#315e72">21°C</text></g><path d="M340 108 C370 80 390 80 420 108" fill="none" stroke="#1da6b8" stroke-width="4" stroke-dasharray="8 8"/><path d="M340 145 C370 117 390 117 420 145" fill="none" stroke="#1da6b8" stroke-width="4" stroke-dasharray="8 8"/><text x="380" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#557786">Чим сухіше повітря → тим активніше випаровування → тим сильніше охолодження мокрого резервуара.</text></svg>
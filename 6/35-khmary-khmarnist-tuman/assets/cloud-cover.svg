<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" rx="28" fill="#edf9ff"/><g font-family="Arial,sans-serif" fill="#17344c"><text x="40" y="48" font-size="28" font-weight="700">Шкала хмарності</text></g><g transform="translate(55 90)" stroke="#17344c" stroke-width="4"><circle cx="70" cy="70" r="60" fill="#fff"/><circle cx="250" cy="70" r="60" fill="#fff"/><path d="M250 10 A60 60 0 0 1 310 70 L250 70Z" fill="#7f9fb2"/><circle cx="430" cy="70" r="60" fill="#fff"/><path d="M430 10 A60 60 0 0 1 490 70 A60 60 0 0 1 430 130 Z" fill="#7f9fb2"/><circle cx="610" cy="70" r="60" fill="#fff"/><path d="M610 10 A60 60 0 1 1 550 70 L610 70Z" fill="#7f9fb2"/><circle cx="790" cy="70" r="60" fill="#7f9fb2"/></g><g font-family="Arial,sans-serif" fill="#486778" font-size="20" text-anchor="middle"><text x="125" y="250">0% — ясно</text><text x="305" y="250">≈25%</text><text x="485" y="250">≈50%</text><text x="665" y="250">≈75%</text><text x="845" y="250">100% — суцільно</text><text x="450" y="315" font-size="18">Хмарність описує частку неба, закриту хмарами; це не ймовірність опадів.</text></g></svg>
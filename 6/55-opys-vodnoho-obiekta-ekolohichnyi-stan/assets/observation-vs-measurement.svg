<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#fbfeff"/><g font-family="Arial,sans-serif"><text x="70" y="82" font-size="42" font-weight="800" fill="#173c52">Що ми справді знаємо?</text><rect x="70" y="130" width="390" height="390" rx="26" fill="#e7f8ff" stroke="#b8e4f4"/><text x="265" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#0875ad">СПОСТЕРЕЖЕННЯ</text><text x="110" y="245" font-size="24" fill="#31586d">• колір / каламутність</text><text x="110" y="292" font-size="24" fill="#31586d">• піна / плівка</text><text x="110" y="339" font-size="24" fill="#31586d">• сміття</text><text x="110" y="386" font-size="24" fill="#31586d">• стан берега</text><text x="110" y="433" font-size="24" fill="#31586d">• рослинність</text><rect x="540" y="130" width="390" height="390" rx="26" fill="#ecfbf5" stroke="#b8ead7"/><text x="735" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#0b8d73">ВИМІРЮВАННЯ</text><text x="580" y="245" font-size="24" fill="#31586d">• температура</text><text x="580" y="292" font-size="24" fill="#31586d">• pH</text><text x="580" y="339" font-size="24" fill="#31586d">• кисень</text><text x="580" y="386" font-size="24" fill="#31586d">• нітрати / фосфати</text><text x="580" y="433" font-size="24" fill="#31586d">• мікробіологія</text><text x="500" y="585" text-anchor="middle" font-size="24" font-weight="700" fill="#8a5b16">Чим сильніше твердження — тим сильніший доказ потрібен.</text></g></svg>
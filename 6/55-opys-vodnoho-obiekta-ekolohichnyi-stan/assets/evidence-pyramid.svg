<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#f8fdff"/><g font-family="Arial,sans-serif"><text x="500" y="70" text-anchor="middle" font-size="40" font-weight="800" fill="#173c52">Сила доказів</text><polygon points="500,120 180,545 820,545" fill="#e8f7fb" stroke="#b8dce8" stroke-width="4"/><path d="M278 415 H722" stroke="#9bcfdf" stroke-width="4"/><path d="M365 300 H635" stroke="#9bcfdf" stroke-width="4"/><text x="500" y="505" text-anchor="middle" font-size="25" fill="#31586d">карта + фото + одноразове спостереження</text><text x="500" y="374" text-anchor="middle" font-size="25" font-weight="700" fill="#0b789e">повторні польові вимірювання</text><text x="500" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#0a8b70">лабораторні + офіційні дані</text><text x="500" y="170" text-anchor="middle" font-size="24" font-weight="800" fill="#805410">узгоджені серії даних</text><text x="500" y="600" text-anchor="middle" font-size="23" fill="#657d8c">Не всі питання потребують вершини піраміди — але сильні висновки потребують сильних доказів.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><defs><linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9eeaff"/><stop offset=".3" stop-color="#2c9ac7"/><stop offset=".65" stop-color="#145f8b"/><stop offset="1" stop-color="#062b4a"/></linearGradient></defs><rect width="1000" height="700" fill="url(#o)"/><g font-family="sans-serif" fill="#fff"><text x="35" y="55" font-size="34" font-weight="700">ЗОНИ ОКЕАНУ ЗА ГЛИБИНОЮ</text><text x="55" y="130" font-size="27" font-weight="700">0–200 м • евфотична</text><text x="55" y="165" font-size="20">достатньо світла для фотосинтезу</text><text x="55" y="290" font-size="27" font-weight="700">200–1000 м • сутінкова</text><text x="55" y="325" font-size="20">світла мало; фотосинтез майже неможливий</text><text x="55" y="470" font-size="27" font-weight="700">1000–4000 м • темна глибоководна</text><text x="55" y="505" font-size="20">темрява, холод, високий тиск</text><text x="55" y="620" font-size="27" font-weight="700">4000+ м • абісальні глибини</text><text x="55" y="655" font-size="20">життя є, але потрібні спеціальні адаптації</text></g><g fill="#fff" opacity=".65"><circle cx="820" cy="120" r="25"/><circle cx="860" cy="165" r="16"/><circle cx="780" cy="315" r="14"/><circle cx="845" cy="460" r="10"/></g></svg>
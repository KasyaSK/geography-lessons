<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"><rect width="1000" height="620" rx="34" fill="#f8fcff"/><text x="55" y="75" font-family="system-ui" font-size="38" font-weight="800" fill="#17364c">Матриця безпечних рішень</text><g font-family="system-ui"><rect x="55" y="115" width="890" height="90" rx="20" fill="#e5f4ff"/><text x="82" y="152" font-size="25" font-weight="800">⚡ Гроза / блискавка</text><text x="82" y="185" font-size="21">Надійна будівля або закрите авто • подалі від самотніх дерев і металевих конструкцій</text><rect x="55" y="220" width="890" height="90" rx="20" fill="#eef9e9"/><text x="82" y="257" font-size="25" font-weight="800">💨 Шквал / сильний вітер</text><text x="82" y="290" font-size="21">Відійти від дерев, щитів, ліній електропередач • прибрати легкі предмети з балкона</text><rect x="55" y="325" width="890" height="90" rx="20" fill="#fff0e5"/><text x="82" y="362" font-size="25" font-weight="800">🌪️ Смерч</text><text x="82" y="395" font-size="21">Нижчий внутрішній простір без вікон • захистити голову • не спостерігати біля скла</text><rect x="55" y="430" width="890" height="90" rx="20" fill="#fff7d9"/><text x="82" y="467" font-size="25" font-weight="800">🔥 Екстремальна спека</text><text x="82" y="500" font-size="21">Вода регулярно • тінь і перерви • легкий одяг • уникати піку спеки</text><text x="55" y="575" font-size="22" font-weight="700" fill="#0875a5">Алгоритм: офіційне попередження → оцінка місця → безпечна дія → перевірка оновлень</text></g></svg>
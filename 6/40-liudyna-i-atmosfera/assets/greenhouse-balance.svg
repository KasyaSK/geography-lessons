<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bfeaff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ef7c55"/></marker></defs><rect width="900" height="520" rx="30" fill="url(#sky)"/><circle cx="130" cy="110" r="55" fill="#ffd75b"/><path d="M175 140C300 210 335 260 410 330" stroke="#f6bd3d" stroke-width="16" fill="none" marker-end="url(#a)"/><path d="M440 410C500 320 575 260 670 220" stroke="#ef7c55" stroke-width="16" fill="none" marker-end="url(#a)"/><path d="M675 220C635 305 590 350 540 390" stroke="#8d67c5" stroke-width="12" stroke-dasharray="18 12" fill="none" marker-end="url(#a)"/><ellipse cx="450" cy="455" rx="400" ry="90" fill="#5ebc86"/><path d="M115 285Q450 160 785 285" fill="none" stroke="#fff" stroke-width="32" opacity=".8"/><text x="450" y="65" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="800" fill="#24516a">Навчальна схема енергетичного балансу</text><text x="210" y="215" font-family="system-ui" font-size="23" font-weight="700" fill="#765d18">Сонячна енергія</text><text x="545" y="300" font-family="system-ui" font-size="23" font-weight="700" fill="#b34d35">Теплове випромінювання</text><text x="560" y="165" font-family="system-ui" font-size="22" font-weight="700" fill="#684697">Частина тепла взаємодіє</text><text x="560" y="192" font-family="system-ui" font-size="22" font-weight="700" fill="#684697">з парниковими газами</text><text x="450" y="492" text-anchor="middle" font-family="system-ui" font-size="19" fill="#174833">Схема спрощена: вона показує причинний зв’язок, а не реальні пропорції потоків.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="30" fill="#f8fcff"/><text x="450" y="65" text-anchor="middle" font-family="system-ui" font-size="31" font-weight="850" fill="#214d65">Як обирати джерело енергії?</text><g font-family="system-ui"><rect x="70" y="115" width="220" height="120" rx="22" fill="#fff1b9"/><text x="180" y="155" text-anchor="middle" font-size="27">☀️ Сонце</text><text x="180" y="190" text-anchor="middle" font-size="19">інсоляція • площа</text><text x="180" y="218" text-anchor="middle" font-size="19">мережа • зберігання</text><rect x="340" y="115" width="220" height="120" rx="22" fill="#dff6ff"/><text x="450" y="155" text-anchor="middle" font-size="27">🌬️ Вітер</text><text x="450" y="190" text-anchor="middle" font-size="19">швидкість • сталість</text><text x="450" y="218" text-anchor="middle" font-size="19">рельєф • мережа</text><rect x="610" y="115" width="220" height="120" rx="22" fill="#e8f8e8"/><text x="720" y="155" text-anchor="middle" font-size="27">🏠 Потреба</text><text x="720" y="190" text-anchor="middle" font-size="19">тепло • електрика</text><text x="720" y="218" text-anchor="middle" font-size="19">час споживання</text><path d="M180 250V330H720V250" fill="none" stroke="#5d8ca5" stroke-width="6"/><rect x="250" y="330" width="400" height="105" rx="24" fill="#e8f4ff" stroke="#b8d7e7"/><text x="450" y="372" text-anchor="middle" font-size="26" font-weight="800">Рішення після вимірювань</text><text x="450" y="407" text-anchor="middle" font-size="20">дані → порівняння → обмеження → висновок</text><text x="450" y="485" text-anchor="middle" font-size="18" fill="#607986">Не існує одного «найкращого» джерела для всіх місць і всіх потреб.</text></g></svg>
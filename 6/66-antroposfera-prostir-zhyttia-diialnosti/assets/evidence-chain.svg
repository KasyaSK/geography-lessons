<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"><style>text{font-family:Arial,sans-serif;fill:#17364c}.h{font-size:28px;font-weight:700}.s{font-size:19px}.b{fill:#fff;stroke:#b8dce8;stroke-width:3}.a{stroke:#158a75;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#158a75"/></marker></defs><rect width="900" height="440" rx="36" fill="#f0fff9"/><text class="h" x="450" y="52" text-anchor="middle">Від спостереження до доказового висновку</text><rect class="b" x="45" y="135" width="190" height="150" rx="22"/><text class="h" x="140" y="190" text-anchor="middle">1. Дані</text><text class="s" x="140" y="230" text-anchor="middle">карта • фото</text><text class="s" x="140" y="258" text-anchor="middle">супутник • числа</text><line class="a" x1="245" y1="210" x2="330" y2="210"/><rect class="b" x="345" y="135" width="210" height="150" rx="22"/><text class="h" x="450" y="190" text-anchor="middle">2. Зв’язок</text><text class="s" x="450" y="230" text-anchor="middle">що з чим</text><text class="s" x="450" y="258" text-anchor="middle">пов’язане?</text><line class="a" x1="565" y1="210" x2="650" y2="210"/><rect class="b" x="665" y="135" width="190" height="150" rx="22"/><text class="h" x="760" y="190" text-anchor="middle">3. Межі</text><text class="s" x="760" y="230" text-anchor="middle">що НЕ можна</text><text class="s" x="760" y="258" text-anchor="middle">стверджувати?</text><text class="s" x="450" y="355" text-anchor="middle">Сильний висновок = факт + механізм + перевірка альтернатив</text></svg>
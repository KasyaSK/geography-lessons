<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="32" fill="#f4fbff"/><text x="550" y="58" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#153c55">Карта доказів: від спостереження до висновку</text><g font-family="Arial" font-size="22" fill="#17364c"><rect x="55" y="120" width="220" height="220" rx="26" fill="#dff5ff" stroke="#76b8d5"/><text x="165" y="165" text-anchor="middle" font-weight="700">1. Спостерігай</text><text x="165" y="205" text-anchor="middle">Що видно?</text><text x="165" y="240" text-anchor="middle">Що виміряно?</text><text x="165" y="275" text-anchor="middle">Де і коли?</text><rect x="315" y="120" width="220" height="220" rx="26" fill="#e9fbe8" stroke="#80bd7f"/><text x="425" y="165" text-anchor="middle" font-weight="700">2. Порівняй</text><text x="425" y="205" text-anchor="middle">Інша точка</text><text x="425" y="240" text-anchor="middle">Інший час</text><text x="425" y="275" text-anchor="middle">Інше джерело</text><rect x="575" y="120" width="220" height="220" rx="26" fill="#fff4d8" stroke="#d7a94f"/><text x="685" y="165" text-anchor="middle" font-weight="700">3. Поясни</text><text x="685" y="205" text-anchor="middle">Механізм</text><text x="685" y="240" text-anchor="middle">Причина ≠ збіг</text><text x="685" y="275" text-anchor="middle">Є альтернативи?</text><rect x="835" y="120" width="220" height="220" rx="26" fill="#f3e9ff" stroke="#aa84ce"/><text x="945" y="165" text-anchor="middle" font-weight="700">4. Доведи</text><text x="945" y="205" text-anchor="middle">Claim</text><text x="945" y="240" text-anchor="middle">Evidence</text><text x="945" y="275" text-anchor="middle">Reasoning</text></g><path d="M275 230h40M535 230h40M795 230h40" stroke="#54809a" stroke-width="8" stroke-linecap="round"/><path d="M300 215l15 15-15 15M560 215l15 15-15 15M820 215l15 15-15 15" fill="none" stroke="#54809a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="410" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#087f73">Сильний висновок спирається щонайменше на два незалежні типи доказів</text><text x="550" y="454" text-anchor="middle" font-family="Arial" font-size="20" fill="#557182">Карта + вимірювання • супутник + польове спостереження • фото + часовий ряд</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="40" fill="#f7fcf2"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="120" width="250" height="150" rx="28" fill="#ffe39a"/><text x="195" y="178" font-size="30" font-weight="700" fill="#4d452a">ОРГАНІЧНІ</text><text x="195" y="218" font-size="30" font-weight="700" fill="#4d452a">РЕШТКИ</text><rect x="475" y="100" width="250" height="190" rx="28" fill="#f2c6a7"/><text x="600" y="165" font-size="30" font-weight="700" fill="#5a3529">ДОЩОВІ</text><text x="600" y="205" font-size="30" font-weight="700" fill="#5a3529">ЧЕРВ’ЯКИ</text><text x="600" y="245" font-size="21" fill="#5a3529">+ мікроорганізми</text><rect x="880" y="120" width="250" height="150" rx="28" fill="#a7d78d"/><text x="1005" y="178" font-size="30" font-weight="700" fill="#28472a">ВЕРМІКОМПОСТ</text><text x="1005" y="220" font-size="21" fill="#28472a">поживні речовини</text><rect x="475" y="410" width="250" height="135" rx="28" fill="#b7e0a4"/><text x="600" y="462" font-size="29" font-weight="700" fill="#26492a">РОСЛИНИ</text><text x="600" y="500" font-size="21" fill="#26492a">нова органічна речовина</text></g><g stroke="#47764c" stroke-width="10" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#47764c"/></marker></defs><path d="M330 195 H455"/><path d="M735 195 H860"/><path d="M1005 290 C1000 390 825 470 745 475"/><path d="M465 475 C320 470 180 370 190 290"/></g><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#38623e">Речовина не «зникає» — вона переходить між ланками системи</text></svg>
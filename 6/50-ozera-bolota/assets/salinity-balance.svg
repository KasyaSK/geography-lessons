<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="28" fill="#f6fbfe"/><style>text{font-family:Arial,sans-serif;fill:#17384b}.h{font-size:31px;font-weight:700}.s{font-size:21px}</style><text x="42" y="54" class="h">Водний баланс керує накопиченням солей</text><path d="M80 330 Q450 440 820 330 L770 460 H130Z" fill="#9fddf5" stroke="#378fb6" stroke-width="5"/><path d="M145 150 C210 170 245 210 280 310" fill="none" stroke="#3a9bcc" stroke-width="14" stroke-linecap="round"/><polygon points="270,300 302,326 260,330" fill="#3a9bcc"/><text x="110" y="125" class="s">річки + опади</text><path d="M420 305 C420 250 400 205 420 150 M500 305 C500 240 530 210 520 150" fill="none" stroke="#e5a643" stroke-width="8" stroke-dasharray="14 12"/><polygon points="420,140 405,170 435,170" fill="#e5a643"/><polygon points="520,140 505,170 535,170" fill="#e5a643"/><text x="405" y="115" class="s">випаровування</text><path d="M700 345 C770 320 805 285 840 250" fill="none" stroke="#3a9bcc" stroke-width="14" stroke-linecap="round"/><polygon points="845,245 810,250 835,278" fill="#3a9bcc"/><text x="700" y="210" class="s">стік з озера</text><g fill="#fff0a6" stroke="#c58d22"><circle cx="355" cy="390" r="10"/><circle cx="410" cy="420" r="8"/><circle cx="470" cy="380" r="11"/><circle cx="535" cy="412" r="9"/><circle cx="600" cy="385" r="8"/></g><text x="315" y="485" class="s">солі залишаються у воді, коли вода випаровується</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Карта як інструмент рішень</title><desc id="d">Схема сфер застосування карт: навігація, надзвичайні ситуації, сільське господарство, містопланування, природа та освіта.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#effcf5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="36" fill="url(#bg)"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#17344c"><text x="600" y="72" text-anchor="middle" font-size="42" font-weight="800">Карта = модель для рішення</text><text x="600" y="110" text-anchor="middle" font-size="21" fill="#60798a">Одні й ті самі координати можуть відповідати на різні практичні запитання</text></g><g filter="url(#s)" font-family="system-ui,Segoe UI,sans-serif"><g transform="translate(85 170)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#e2f4ff"/><text x="62" y="78" text-anchor="middle" font-size="35">🧭</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Навігація</text><text x="115" y="88" font-size="18" fill="#60798a">маршрут • час • доступ</text></g><g transform="translate(445 170)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#fff0e7"/><text x="62" y="78" text-anchor="middle" font-size="35">🚒</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Безпека</text><text x="115" y="88" font-size="18" fill="#60798a">ризик • евакуація • доступ</text></g><g transform="translate(805 170)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#e8f9ea"/><text x="62" y="78" text-anchor="middle" font-size="35">🌾</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Господарство</text><text x="115" y="88" font-size="18" fill="#60798a">поля • ґрунти • врожай</text></g><g transform="translate(85 350)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#f0ecff"/><text x="62" y="78" text-anchor="middle" font-size="35">🏙️</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Містопланування</text><text x="115" y="88" font-size="18" fill="#60798a">зони • транспорт • забудова</text></g><g transform="translate(445 350)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#e8fbf7"/><text x="62" y="78" text-anchor="middle" font-size="35">🌿</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Довкілля</text><text x="115" y="88" font-size="18" fill="#60798a">зміни • вода • ліси</text></g><g transform="translate(805 350)"><rect width="310" height="130" rx="24" fill="white"/><circle cx="62" cy="65" r="34" fill="#fff7df"/><text x="62" y="78" text-anchor="middle" font-size="35">🎓</text><text x="115" y="55" font-size="24" font-weight="800" fill="#17344c">Освіта й наука</text><text x="115" y="88" font-size="18" fill="#60798a">порівняння • доказ • прогноз</text></g></g><g font-family="system-ui,Segoe UI,sans-serif"><rect x="385" y="525" width="430" height="55" rx="18" fill="#17344c"/><text x="600" y="560" text-anchor="middle" font-size="22" font-weight="800" fill="white">Питання → дані → карта → висновок → дія</text></g></svg>
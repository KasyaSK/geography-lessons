<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Профіль гірської системи</title><desc id="d">Навчальна схема вершини, хребта, перевалу, долини та відносної висоти.</desc><rect width="1200" height="560" fill="#eef9ff"/><path d="M0 470 L110 430 L210 300 L290 365 L390 210 L480 330 L570 250 L660 370 L760 185 L845 300 L940 235 L1040 375 L1200 455 L1200 560 L0 560Z" fill="#9bc89b"/><path d="M0 470 L110 430 L210 300 L290 365 L390 210 L480 330 L570 250 L660 370 L760 185 L845 300 L940 235 L1040 375 L1200 455" fill="none" stroke="#295d50" stroke-width="7"/><line x1="390" y1="210" x2="390" y2="470" stroke="#df6b42" stroke-width="3" stroke-dasharray="8 8"/><line x1="350" y1="470" x2="430" y2="470" stroke="#df6b42" stroke-width="3"/><text x="410" y="350" font-family="Arial" font-size="24" fill="#b3472c">відносна висота</text><circle cx="390" cy="210" r="9" fill="#cf3f2e"/><text x="330" y="175" font-family="Arial" font-size="28" font-weight="700" fill="#17364b">вершина</text><circle cx="660" cy="370" r="9" fill="#146f99"/><text x="605" y="415" font-family="Arial" font-size="28" font-weight="700" fill="#17364b">перевал</text><path d="M520 455 Q610 410 700 455" fill="none" stroke="#3c89b8" stroke-width="6"/><text x="545" y="505" font-family="Arial" font-size="28" font-weight="700" fill="#17364b">долина</text><text x="780" y="145" font-family="Arial" font-size="28" font-weight="700" fill="#17364b">гірський хребет</text><path d="M760 160 Q850 120 940 170" fill="none" stroke="#17364b" stroke-width="3" stroke-dasharray="7 7"/><rect x="42" y="42" width="260" height="92" rx="18" fill="#fff" stroke="#cfe2ec"/><text x="65" y="78" font-family="Arial" font-size="22" font-weight="700" fill="#17364b">Не одна висота, а форма:</text><text x="65" y="110" font-family="Arial" font-size="20" fill="#4f7185">перепади • схили • розчленованість</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf9ff"/><stop offset="1" stop-color="#ecfff5"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1682a7"/></marker></defs><rect width="1200" height="600" rx="28" fill="url(#bg)"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#173d52">Як вода доходить до споживача?</text><g font-family="Arial" text-anchor="middle"><g><rect x="55" y="180" width="180" height="150" rx="22" fill="#bfe8fa"/><text x="145" y="245" font-size="28" font-weight="700">Джерело</text><text x="145" y="282" font-size="20">річка / підземні</text></g><g><rect x="310" y="180" width="180" height="150" rx="22" fill="#d9f5ff"/><text x="400" y="245" font-size="28" font-weight="700">Водозабір</text><text x="400" y="282" font-size="20">забір води</text></g><g><rect x="565" y="180" width="180" height="150" rx="22" fill="#dbf6ea"/><text x="655" y="245" font-size="28" font-weight="700">Очищення</text><text x="655" y="282" font-size="20">до норм якості</text></g><g><rect x="820" y="180" width="180" height="150" rx="22" fill="#fff2c7"/><text x="910" y="245" font-size="28" font-weight="700">Мережа</text><text x="910" y="282" font-size="20">трубопроводи</text></g><g><rect x="980" y="410" width="160" height="115" rx="22" fill="#ffe4d5"/><text x="1060" y="462" font-size="26" font-weight="700">Споживач</text><text x="1060" y="495" font-size="18">дім / школа</text></g></g><g stroke="#1682a7" stroke-width="9" fill="none" marker-end="url(#a)"><path d="M235 255H300"/><path d="M490 255H555"/><path d="M745 255H810"/><path d="M1000 255 C1085 265 1085 330 1060 400"/></g><text x="60" y="505" font-family="Arial" font-size="24" fill="#526f7f">Доказове правило: близька водойма ≠ автоматично джерело водопостачання. Перевіряйте офіційні дані.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Механічна будова верхньої частини Землі</title><desc id="d">Схема показує земну кору, верхню тверду частину мантії, літосферу та пластичнішу астеносферу.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#f9fdff"/></linearGradient><linearGradient id="mantle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d99555"/><stop offset="1" stop-color="#e7ad70"/></linearGradient></defs><rect width="900" height="520" rx="34" fill="url(#sky)"/><path d="M0 120 Q140 95 250 120 T500 115 T900 105 V180 H0Z" fill="#9ecb78"/><path d="M0 180 H900 V245 H0Z" fill="#815b49"/><path d="M0 245 H900 V355 H0Z" fill="url(#mantle)"/><path d="M0 355 Q120 325 240 360 T480 350 T720 360 T900 345 V520 H0Z" fill="#ed7c71" opacity=".88"/><g font-family="Inter,Arial,sans-serif" fill="#17344c"><text x="38" y="72" font-size="30" font-weight="800">Лабораторна схема: літосфера ≠ лише кора</text><text x="38" y="158" font-size="24" font-weight="700">земна кора</text><text x="38" y="222" font-size="24" font-weight="700" fill="#fff">верхня тверда частина мантії</text><text x="38" y="310" font-size="24" font-weight="700">верхня мантія</text><text x="38" y="438" font-size="28" font-weight="800">астеносфера — пластичніша зона</text><path d="M700 180 h110 M810 180 v175 M700 355 h110" fill="none" stroke="#0b719f" stroke-width="7" stroke-linecap="round"/><text x="650" y="286" font-size="30" font-weight="900" fill="#0b719f" transform="rotate(-90 650 286)">ЛІТОСФЕРА</text><text x="38" y="495" font-size="18" fill="#466579">Схема спрощена, не в масштабі. Для навчального порівняння механічних оболонок.</text></g></svg>
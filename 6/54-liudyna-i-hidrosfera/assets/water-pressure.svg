<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4f7ff"/><stop offset="1" stop-color="#fff8df"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d96b52"/></marker></defs><rect width="1100" height="650" rx="34" fill="url(#sky)"/><path d="M0 330 Q180 210 360 330 Q520 230 690 340 Q850 240 1100 335 V650 H0Z" fill="#b8dca3"/><path d="M420 650 C405 555 470 500 545 465 C610 435 610 380 675 350 C740 320 820 335 920 285" fill="none" stroke="#55bedc" stroke-width="95"/><path d="M420 650 C405 555 470 500 545 465 C610 435 610 380 675 350 C740 320 820 335 920 285" fill="none" stroke="#dff9ff" stroke-width="7" opacity=".7"/><g font-family="Arial,sans-serif" fill="#173e55"><text x="50" y="70" font-size="36" font-weight="700">Як тиск із басейну доходить до водойми</text><g transform="translate(80 165)"><rect width="220" height="130" rx="14" fill="#e8cf83"/><path d="M0 35h220M0 75h220M55 0v130M120 0v130M175 0v130" stroke="#aa8e45" stroke-width="4"/><text x="15" y="160" font-size="23" font-weight="700">ПОЛЕ</text><text x="15" y="188" font-size="19">добрива, ґрунтовий змив</text></g><g transform="translate(780 115)"><rect x="0" y="70" width="210" height="120" rx="10" fill="#fff" stroke="#8ea8b5" stroke-width="4"/><polygon points="-15,75 105,0 225,75" fill="#ef9a75"/><rect x="80" y="120" width="45" height="70" fill="#97c6d6"/><text x="20" y="225" font-size="23" font-weight="700">ЗАБУДОВА</text><text x="20" y="252" font-size="19">стоки, дороги, сміття</text></g><path d="M300 310 C365 335 410 365 475 425" fill="none" stroke="#d96b52" stroke-width="8" marker-end="url(#a)"/><text x="265" y="360" font-size="21" fill="#a84e3c">дощовий стік</text><path d="M810 325 C760 350 725 365 670 405" fill="none" stroke="#d96b52" stroke-width="8" marker-end="url(#a)"/><text x="755" y="380" font-size="21" fill="#a84e3c">міський стік</text><rect x="75" y="470" width="285" height="95" rx="18" fill="#fff" opacity=".94"/><text x="95" y="506" font-size="21" font-weight="700" fill="#11866d">Що перевіряти?</text><text x="95" y="538" font-size="19">карта басейну • місця скиду</text><text x="95" y="562" font-size="19">вимірювання • офіційні дані</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"><rect width="1000" height="600" rx="34" fill="#eef9fb"/><text x="60" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#17364c">Як читати кліматичну карту</text><g font-family="Arial"><rect x="70" y="140" width="190" height="300" rx="24" fill="#fff" stroke="#cfe6ef"/><text x="95" y="190" font-size="24" font-weight="700" fill="#0875a5">1. Назва</text><text x="95" y="230" font-size="18" fill="#17364c">Що показує</text><text x="95" y="258" font-size="18" fill="#17364c">карта?</text><rect x="300" y="140" width="190" height="300" rx="24" fill="#fff" stroke="#cfe6ef"/><text x="325" y="190" font-size="24" font-weight="700" fill="#0875a5">2. Легенда</text><text x="325" y="230" font-size="18" fill="#17364c">Показник,</text><text x="325" y="258" font-size="18" fill="#17364c">шкала, одиниці</text><rect x="530" y="140" width="190" height="300" rx="24" fill="#fff" stroke="#cfe6ef"/><text x="555" y="190" font-size="24" font-weight="700" fill="#0875a5">3. Простір</text><text x="555" y="230" font-size="18" fill="#17364c">Де більше?</text><text x="555" y="258" font-size="18" fill="#17364c">Де менше?</text><rect x="760" y="140" width="170" height="300" rx="24" fill="#fff" stroke="#cfe6ef"/><text x="785" y="190" font-size="24" font-weight="700" fill="#0875a5">4. Чому?</text><text x="785" y="230" font-size="18" fill="#17364c">Пояснення</text><text x="785" y="258" font-size="18" fill="#17364c">закономірності</text><path d="M260 290h40M490 290h40M720 290h40" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/></g><text x="70" y="520" font-family="Arial" font-size="22" fill="#5f788a">Правило: спочатку зчитуємо дані, потім пояснюємо їх.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="34" fill="#fff8e9"/><g font-family="Arial" text-anchor="middle"><text x="500" y="68" font-size="34" font-weight="700" fill="#17364c">Від вимірювання до кліматичної карти</text><g fill="#fff" stroke="#d9e8f1" stroke-width="2"><rect x="45" y="150" width="160" height="190" rx="24"/><rect x="235" y="150" width="160" height="190" rx="24"/><rect x="425" y="150" width="160" height="190" rx="24"/><rect x="615" y="150" width="160" height="190" rx="24"/><rect x="805" y="150" width="150" height="190" rx="24"/></g><g fill="#17364c" font-size="20"><text x="125" y="205">Станції</text><text x="125" y="235">і супутники</text><text x="315" y="205">Перевірка</text><text x="315" y="235">якості</text><text x="505" y="205">Довгі ряди</text><text x="505" y="235">даних</text><text x="695" y="205">Середні</text><text x="695" y="235">й норми</text><text x="880" y="205">Карта</text><text x="880" y="235">закономірностей</text></g><g fill="#0b84b6"><circle cx="125" cy="285" r="24"/><circle cx="315" cy="285" r="24"/><circle cx="505" cy="285" r="24"/><circle cx="695" cy="285" r="24"/><circle cx="880" cy="285" r="24"/></g><g stroke="#f5a623" stroke-width="8" stroke-linecap="round"><path d="M205 245h30"/><path d="M395 245h30"/><path d="M585 245h30"/><path d="M775 245h30"/></g><text x="500" y="420" font-size="22" fill="#5f788a">Один вимір — це погода. Тисячі перевірених вимірів за багато років — основа кліматології.</text></g></svg>
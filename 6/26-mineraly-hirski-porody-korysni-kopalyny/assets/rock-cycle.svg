<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Цикл гірських порід</title><desc id="d">Схема перетворення магми, магматичних, осадових і метаморфічних порід</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eefaff"/><stop offset="1" stop-color="#fff8eb"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4e7f97"/></marker></defs><rect width="1100" height="520" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="190" width="205" height="130" rx="24" fill="#ffe3d5" stroke="#df8c64" stroke-width="3"/><text x="157" y="245" font-size="25" font-weight="700" fill="#783f2c">МАГМА</text><text x="157" y="278" font-size="16" fill="#783f2c">розплав</text><rect x="325" y="70" width="220" height="130" rx="24" fill="#e7f4ff" stroke="#6aa7ce" stroke-width="3"/><text x="435" y="123" font-size="23" font-weight="700" fill="#26566f">МАГМАТИЧНІ</text><text x="435" y="155" font-size="16" fill="#26566f">граніт • базальт</text><rect x="625" y="190" width="220" height="130" rx="24" fill="#fff0c7" stroke="#d8ae4f" stroke-width="3"/><text x="735" y="242" font-size="23" font-weight="700" fill="#765c19">ОСАДОВІ</text><text x="735" y="276" font-size="16" fill="#765c19">вапняк • пісковик</text><rect x="325" y="335" width="220" height="130" rx="24" fill="#eadff8" stroke="#9e7ac6" stroke-width="3"/><text x="435" y="385" font-size="22" font-weight="700" fill="#594078">МЕТАМОРФІЧНІ</text><text x="435" y="420" font-size="16" fill="#594078">гнейс • мармур</text><path d="M245 205 C285 150 305 135 325 135" fill="none" stroke="#4e7f97" stroke-width="5" marker-end="url(#a)"/><text x="280" y="143" font-size="15" fill="#46687a">охолодження</text><path d="M545 135 C610 120 680 135 710 190" fill="none" stroke="#4e7f97" stroke-width="5" marker-end="url(#a)"/><text x="635" y="115" font-size="15" fill="#46687a">вивітрювання → осад</text><path d="M710 320 C655 370 590 395 545 400" fill="none" stroke="#4e7f97" stroke-width="5" marker-end="url(#a)"/><text x="640" y="382" font-size="15" fill="#46687a">тиск + температура</text><path d="M325 400 C250 380 195 345 175 320" fill="none" stroke="#4e7f97" stroke-width="5" marker-end="url(#a)"/><text x="235" y="377" font-size="15" fill="#46687a">плавлення</text><path d="M435 200 L435 335" fill="none" stroke="#4e7f97" stroke-width="4" marker-end="url(#a)"/><text x="510" y="270" font-size="15" fill="#46687a">метаморфізм</text><path d="M625 255 C585 255 570 255 545 255" fill="none" stroke="#8aa5b3" stroke-width="3" stroke-dasharray="8 8"/><text x="585" y="245" font-size="14" fill="#657f8c">цикл не має одного старту</text><text x="900" y="92" font-size="20" font-weight="700" fill="#2d5267">Ключова ідея</text><text x="900" y="125" font-size="15" fill="#4d6877">Порода — це не «назавжди».</text><text x="900" y="150" font-size="15" fill="#4d6877">Процеси Землі можуть</text><text x="900" y="175" font-size="15" fill="#4d6877">перетворити один тип на інший.</text></g></svg>
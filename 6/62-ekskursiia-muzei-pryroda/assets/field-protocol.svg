<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><rect width="1000" height="300" rx="36" fill="#f1fbff"/><g font-family="Arial,sans-serif"><text x="50" y="58" font-size="30" font-weight="800" fill="#17344c">Польовий протокол</text><g transform="translate(50 95)"><rect width="210" height="140" rx="22" fill="#ffffff" stroke="#cfe4ec"/><text x="24" y="42" font-size="24" font-weight="700" fill="#0b7f69">1. Питання</text><text x="24" y="76" font-size="18" fill="#5d7585">Що перевіряємо?</text><text x="24" y="108" font-size="18" fill="#5d7585">Який критерій?</text></g><g transform="translate(285 95)"><rect width="210" height="140" rx="22" fill="#ffffff" stroke="#cfe4ec"/><text x="24" y="42" font-size="24" font-weight="700" fill="#0b7f69">2. Маршрут</text><text x="24" y="76" font-size="18" fill="#5d7585">2–3 точки</text><text x="24" y="108" font-size="18" fill="#5d7585">Однаковий метод</text></g><g transform="translate(520 95)"><rect width="210" height="140" rx="22" fill="#ffffff" stroke="#cfe4ec"/><text x="24" y="42" font-size="24" font-weight="700" fill="#0b7f69">3. Дані</text><text x="24" y="76" font-size="18" fill="#5d7585">Фото + підрахунок</text><text x="24" y="108" font-size="18" fill="#5d7585">Час і місце</text></g><g transform="translate(755 95)"><rect width="195" height="140" rx="22" fill="#ffffff" stroke="#cfe4ec"/><text x="22" y="42" font-size="24" font-weight="700" fill="#0b7f69">4. CER</text><text x="22" y="76" font-size="18" fill="#5d7585">Твердження</text><text x="22" y="105" font-size="18" fill="#5d7585">Докази + логіка</text></g></g></svg>
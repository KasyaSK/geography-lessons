<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f7fcff"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#17384d">Південь Євразії: природні зони як система чинників</text><g font-family="Arial" font-size="24" fill="#17384d"><rect x="70" y="130" rx="24" width="240" height="130" fill="#fff0dc" stroke="#dfb46f"/><text x="105" y="180" font-weight="700">Середземномор'я</text><text x="105" y="220">твердолисті ліси</text><text x="105" y="248">і чагарники</text><rect x="355" y="130" rx="24" width="240" height="130" fill="#f4e7c6" stroke="#d3b369"/><text x="395" y="180" font-weight="700">Пд.-Зх. Азія</text><text x="395" y="220">пустелі та</text><text x="395" y="248">напівпустелі</text><rect x="640" y="130" rx="24" width="240" height="130" fill="#dff0bd" stroke="#8fb064"/><text x="684" y="180" font-weight="700">Південна Азія</text><text x="684" y="220">савани, рідколісся</text><text x="684" y="248">мусонні ліси</text><rect x="925" y="130" rx="24" width="210" height="130" fill="#cdebcf" stroke="#6da875"/><text x="963" y="180" font-weight="700">Пд.-Сх. Азія</text><text x="953" y="220">вологі тропічні</text><text x="977" y="248">ліси</text><path d="M310 195H350M595 195H635M880 195H920" stroke="#5c7d8d" stroke-width="6" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5c7d8d"/></marker></defs><rect x="120" y="360" rx="22" width="260" height="120" fill="#e8f5ff" stroke="#7fb2d2"/><text x="165" y="408" font-weight="700">КЛІМАТ</text><text x="150" y="445">опади + сезонність</text><rect x="470" y="360" rx="22" width="260" height="120" fill="#eef7e7" stroke="#8bb37f"/><text x="510" y="408" font-weight="700">РЕЛЬЄФ</text><text x="505" y="445">бар’єри для вологи</text><rect x="820" y="360" rx="22" width="260" height="120" fill="#fff4db" stroke="#d8aa56"/><text x="850" y="408" font-weight="700">ОКЕАНИ</text><text x="848" y="445">мусони + течії</text><path d="M250 490 Q250 575 500 590" stroke="#7b9bac" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M600 490 V585" stroke="#7b9bac" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M950 490 Q950 575 700 590" stroke="#7b9bac" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="395" y="565" rx="28" width="410" height="100" fill="#ffffff" stroke="#86a5b4" stroke-width="3"/><text x="465" y="610" font-weight="700">ПРИРОДНА ЗОНА</text><text x="440" y="645">= не лише широта, а сукупність чинників</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="36" fill="#f6fbff"/><text x="55" y="62" font-family="Arial" font-size="32" font-weight="700" fill="#17384d">Вертикальна поясність Анд: модель</text><path d="M80 545 L320 425 L480 330 L620 215 L760 95 L900 235 L1080 545 Z" fill="#8bb8a0" stroke="#507b69" stroke-width="5"/><path d="M545 275 L620 215 L760 95 L835 190 L760 205 L700 190 L640 260 Z" fill="#eef7ff"/><g font-family="Arial" font-size="22" fill="#17384d"><line x1="120" y1="495" x2="1040" y2="495" stroke="#d8a86c" stroke-width="4"/><text x="90" y="485">≈ 500 м</text><text x="875" y="485">вологі ліси / землеробство</text><line x1="180" y1="390" x2="980" y2="390" stroke="#77a86a" stroke-width="4"/><text x="135" y="380">≈ 1500 м</text><text x="790" y="380">гірські ліси</text><line x1="280" y1="290" x2="900" y2="290" stroke="#95a65f" stroke-width="4"/><text x="235" y="280">≈ 3000 м</text><text x="705" y="280">парамо / пуна</text><line x1="420" y1="180" x2="850" y2="180" stroke="#98a7b4" stroke-width="4"/><text x="375" y="170">≈ 4000 м</text><text x="610" y="170">холодні високогірні луки</text><text x="700" y="125">сніг і льодовики</text></g><text x="65" y="585" font-family="Arial" font-size="20" fill="#587181">Реальні висотні межі різняться за широтою, експозицією схилу та зволоженням.</text></svg>
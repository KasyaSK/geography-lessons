<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcff"/><stop offset="1" stop-color="#f5fff1"/></linearGradient></defs><rect width="1200" height="520" rx="36" fill="url(#bg)"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#17384d">Широтна зональність Південної Америки</text><g font-family="Arial" font-size="25" fill="#17384d"><rect x="70" y="110" width="1060" height="70" rx="20" fill="#5fbd75"/><text x="100" y="154">Екватор: вологі вічнозелені ліси Амазонії</text><rect x="110" y="195" width="980" height="70" rx="20" fill="#b7d66b"/><text x="140" y="239">Субекваторіальні широти: савани й рідколісся</text><rect x="155" y="280" width="890" height="70" rx="20" fill="#e7c56e"/><text x="185" y="324">Тропічні широти: сухі ліси, напівпустелі й пустелі</text><rect x="205" y="365" width="790" height="70" rx="20" fill="#9cc6ad"/><text x="235" y="409">Південь: степи Пампи та помірні комплекси</text></g><text x="65" y="485" font-family="Arial" font-size="21" fill="#537083">Зональність змінюють океанічні течії, рельєф, зволоження й висота.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Антарктида — карта доказів</title><desc id="d">Схематична карта для діагностичної роботи: Південний полюс, Антарктичний півострів, Трансантарктичні гори, шельфові льодовики, Сухі долини та станція Академік Вернадський.</desc><rect width="900" height="620" rx="34" fill="#f4fbff"/><circle cx="450" cy="315" r="245" fill="#dff5ff" stroke="#8bc9e8" stroke-width="4"/><path d="M450 90 C365 102 292 152 248 214 C214 262 203 326 224 383 C245 441 292 485 351 511 C405 535 469 542 526 522 C591 500 638 451 662 394 C684 341 674 276 644 226 C610 170 545 117 450 90Z" fill="#fff" stroke="#759eb5" stroke-width="5"/><path d="M305 195 C260 166 221 134 188 96 C203 145 225 190 266 226Z" fill="#fff" stroke="#759eb5" stroke-width="5"/><path d="M410 132 C425 205 438 278 450 354 C466 424 492 480 528 518" fill="none" stroke="#6b7f8f" stroke-width="8" stroke-linecap="round" opacity=".75"/><path d="M294 403 C342 370 383 340 430 310" fill="none" stroke="#8ec8e8" stroke-width="26" stroke-linecap="round" opacity=".8"/><path d="M564 205 C602 234 625 274 640 316" fill="none" stroke="#8ec8e8" stroke-width="24" stroke-linecap="round" opacity=".8"/><circle cx="450" cy="315" r="7" fill="#d43f5e"/><text x="466" y="320" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243b4b">Південний полюс</text><circle cx="229" cy="175" r="7" fill="#187f68"/><text x="54" y="165" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#187f68">Антарктичний півострів</text><circle cx="250" cy="210" r="7" fill="#b26a16"/><text x="52" y="240" font-family="Arial,sans-serif" font-size="18" fill="#334f60">«Академік Вернадський»</text><text x="52" y="264" font-family="Arial,sans-serif" font-size="16" fill="#607789">65°15′ пд. ш., 64°15′ зх. д.</text><text x="508" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#536c7d">Трансантарктичні гори</text><text x="120" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1476a7">шельфовий лід</text><text x="604" y="355" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1476a7">шельфовий лід</text><circle cx="510" cy="282" r="8" fill="#e8a33f"/><text x="526" y="286" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7b571e">Сухі долини</text><text x="450" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#607789">Схема не є фізичною картою: використовуйте її лише як навігацію до доказів у реальних картах і геоданих.</text></svg>
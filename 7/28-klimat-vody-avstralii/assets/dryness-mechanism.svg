<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b7687"/></marker><style>.h{font:900 34px system-ui;fill:#153b4d}.t{font:700 24px system-ui;fill:#153b4d}.s{font:500 19px system-ui;fill:#557381}</style></defs><rect width="1200" height="560" rx="30" fill="#f5fbfe"/><text x="60" y="62" class="h">Чому внутрішня Австралія така суха?</text><g transform="translate(55 125)"><rect width="235" height="120" rx="22" fill="#fff3d8" stroke="#e7bd61"/><text x="24" y="42" class="t">Широта</text><text x="24" y="76" class="s">тропіки й субтропіки</text></g><path d="M295 185 H380" stroke="#4b7687" stroke-width="5" marker-end="url(#a)"/><g transform="translate(390 125)"><rect width="255" height="120" rx="22" fill="#e7f6fb" stroke="#8fcddd"/><text x="24" y="42" class="t">Високий тиск</text><text x="24" y="76" class="s">низхідне сухе повітря</text></g><path d="M650 185 H735" stroke="#4b7687" stroke-width="5" marker-end="url(#a)"/><g transform="translate(745 125)"><rect width="390" height="120" rx="22" fill="#eef9f3" stroke="#9dd3bb"/><text x="24" y="42" class="t">Мало хмар і опадів</text><text x="24" y="76" class="s">висока випаровуваність</text></g><g transform="translate(115 340)"><rect width="275" height="120" rx="22" fill="#edf7ff" stroke="#9cc7e4"/><text x="24" y="42" class="t">Рельєф сходу</text><text x="24" y="76" class="s">орографічні опади</text></g><g transform="translate(465 340)"><rect width="275" height="120" rx="22" fill="#fff0ef" stroke="#e0aaa4"/><text x="24" y="42" class="t">Внутрішність</text><text x="24" y="76" class="s">слабший морський вплив</text></g><g transform="translate(815 340)"><rect width="275" height="120" rx="22" fill="#f4f0ff" stroke="#c5b4e5"/><text x="24" y="42" class="t">Течії + вітри</text><text x="24" y="76" class="s">модифікують вологість</text></g><path d="M390 400 H460" stroke="#4b7687" stroke-width="5" marker-end="url(#a)"/><path d="M740 400 H810" stroke="#4b7687" stroke-width="5" marker-end="url(#a)"/><text x="60" y="525" class="s">Жоден чинник не працює ізольовано: сухість — результат їхньої взаємодії.</text></svg>
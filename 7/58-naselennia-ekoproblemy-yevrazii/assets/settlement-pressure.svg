<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7fbff"/><text x="60" y="70" font-family="Arial" font-size="40" font-weight="700" fill="#17384c">Чому населення Євразії розміщене нерівномірно?</text><g font-family="Arial" fill="#17384c"><rect x="70" y="130" width="290" height="160" rx="24" fill="#dff6ff"/><text x="105" y="185" font-size="28" font-weight="700">Природні умови</text><text x="105" y="230" font-size="23">вода • рівнини • клімат</text><text x="105" y="265" font-size="23">ґрунти • узбережжя</text><rect x="455" y="130" width="290" height="160" rx="24" fill="#fff0d9"/><text x="490" y="185" font-size="28" font-weight="700">Історія</text><text x="490" y="230" font-size="23">давні осередки</text><text x="490" y="265" font-size="23">землеробства й міст</text><rect x="840" y="130" width="290" height="160" rx="24" fill="#e6fbe9"/><text x="875" y="185" font-size="28" font-weight="700">Економіка</text><text x="875" y="230" font-size="23">робочі місця • транспорт</text><text x="875" y="265" font-size="23">порти • агломерації</text><path d="M360 210h95M745 210h95" stroke="#4082a4" stroke-width="8"/><polygon points="445,196 468,210 445,224" fill="#4082a4"/><polygon points="830,196 853,210 830,224" fill="#4082a4"/><rect x="300" y="365" width="600" height="125" rx="28" fill="#ffffff" stroke="#bcd8e5" stroke-width="4"/><text x="360" y="420" font-size="30" font-weight="700">ГУСТІ ВУЗЛИ Й КОРИДОРИ</text><text x="365" y="462" font-size="24">міста • долини річок • узбережжя • транспорт</text><path d="M600 490v90" stroke="#4082a4" stroke-width="8"/><polygon points="586,570 600,595 614,570" fill="#4082a4"/><rect x="245" y="600" width="710" height="105" rx="26" fill="#fff6f0" stroke="#edb57c" stroke-width="4"/><text x="300" y="650" font-size="29" font-weight="700">Екологічний тиск ≠ просто «багато людей»</text><text x="300" y="687" font-size="22">важливі енергетика, транспорт, виробництво, вода й управління</text></g></svg>
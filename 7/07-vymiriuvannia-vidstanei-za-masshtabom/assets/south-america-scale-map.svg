<text x="70" y="54" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="30" fill="#16384e">Південна Америка</text>
<text x="70" y="79" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#567487">Вимірюйте за лінійною шкалою внизу: вона масштабується разом із картою.</text>

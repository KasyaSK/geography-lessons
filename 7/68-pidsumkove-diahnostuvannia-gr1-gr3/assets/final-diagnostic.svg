<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Підсумкове діагностування ГР1–ГР3</title><desc id="d">Схема трьох груп результатів: дослідження, карта і дані, пояснення закономірностей</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e7f7ff"/><stop offset="1" stop-color="#fff1d8"/></linearGradient></defs><rect width="900" height="420" rx="34" fill="url(#g)"/><circle cx="180" cy="200" r="105" fill="#ffffff" stroke="#3aa6c9" stroke-width="6"/><circle cx="450" cy="200" r="105" fill="#ffffff" stroke="#4d7bd8" stroke-width="6"/><circle cx="720" cy="200" r="105" fill="#ffffff" stroke="#35a46f" stroke-width="6"/><text x="180" y="165" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#126f8b">ГР1</text><text x="180" y="205" text-anchor="middle" font-family="Arial" font-size="21" fill="#17384c">Досліджую</text><text x="180" y="235" text-anchor="middle" font-family="Arial" font-size="18" fill="#5d7583">гіпотеза • джерела</text><text x="450" y="165" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#365fae">ГР2</text><text x="450" y="205" text-anchor="middle" font-family="Arial" font-size="21" fill="#17384c">Карта й дані</text><text x="450" y="235" text-anchor="middle" font-family="Arial" font-size="18" fill="#5d7583">простір • аналіз</text><text x="720" y="165" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#24784f">ГР3</text><text x="720" y="205" text-anchor="middle" font-family="Arial" font-size="21" fill="#17384c">Пояснюю</text><text x="720" y="235" text-anchor="middle" font-family="Arial" font-size="18" fill="#5d7583">доказ • механізм</text><path d="M285 200h55M555 200h55" stroke="#8ca7b4" stroke-width="5" stroke-linecap="round"/><text x="450" y="360" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17384c">Фінал курсу: не вгадати — а довести</text></svg>
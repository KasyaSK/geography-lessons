<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f7fcff"/><text x="50" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#17354d">Як порівнювати фізичну й тектонічну карти</text><g font-family="Arial" font-size="24" fill="#17354d"><rect x="55" y="105" width="250" height="110" rx="20" fill="#dff3ff" stroke="#8acbe9"/><text x="84" y="151">1. Знайди форму</text><text x="84" y="185">рельєфу</text><rect x="375" y="105" width="250" height="110" rx="20" fill="#e9fff5" stroke="#82d7c2"/><text x="401" y="151">2. Знайди під нею</text><text x="401" y="185">тектонічну структуру</text><rect x="695" y="105" width="250" height="110" rx="20" fill="#fff2e7" stroke="#efbd8b"/><text x="729" y="151">3. Назви процес</text><text x="729" y="185">і механізм</text><path d="M305 160 H365" stroke="#4b90b8" stroke-width="8"/><polygon points="365,160 345,147 345,173" fill="#4b90b8"/><path d="M625 160 H685" stroke="#4b90b8" stroke-width="8"/><polygon points="685,160 665,147 665,173" fill="#4b90b8"/><rect x="125" y="285" width="750" height="150" rx="24" fill="#f5f1ff" stroke="#b9afea"/><text x="170" y="333" font-weight="700">Сильний висновок:</text><text x="170" y="374">структура → процес → форма рельєфу</text><text x="170" y="410">+ приклад із карти + обмеження висновку</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540"><rect width="1000" height="540" rx="28" fill="#f8fcff"/><text x="50" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#17354d">Геологічний процес → умови формування родовищ</text><g font-family="Arial" fill="#17354d"><rect x="55" y="105" width="270" height="125" rx="20" fill="#fff0e7" stroke="#e6ae79"/><text x="82" y="148" font-size="25" font-weight="700">Магматизм</text><text x="82" y="184" font-size="21">та гарячі флюїди</text><rect x="365" y="105" width="270" height="125" rx="20" fill="#e9f7ff" stroke="#8fc9e6"/><text x="392" y="148" font-size="25" font-weight="700">Осадонакопичення</text><text x="392" y="184" font-size="21">басейни й товщі осадів</text><rect x="675" y="105" width="270" height="125" rx="20" fill="#ecfff4" stroke="#85d1ad"/><text x="702" y="148" font-size="25" font-weight="700">Метаморфізм</text><text x="702" y="184" font-size="21">тиск + температура</text><path d="M190 240 V300" stroke="#b56b2d" stroke-width="7"/><path d="M500 240 V300" stroke="#4389ad" stroke-width="7"/><path d="M810 240 V300" stroke="#3b9a6d" stroke-width="7"/><rect x="55" y="315" width="270" height="135" rx="20" fill="#fffaf5" stroke="#e6ae79"/><text x="80" y="357" font-size="22" font-weight="700">Рудні концентрації</text><text x="80" y="392" font-size="20">мідь, молібден, золото</text><text x="80" y="422" font-size="18">залежно від типу системи</text><rect x="365" y="315" width="270" height="135" rx="20" fill="#f4fbff" stroke="#8fc9e6"/><text x="392" y="357" font-size="22" font-weight="700">Паливні / хімічні</text><text x="392" y="392" font-size="20">нафта, газ, солі, вугілля</text><text x="392" y="422" font-size="18">за відповідних умов</text><rect x="675" y="315" width="270" height="135" rx="20" fill="#f5fff9" stroke="#85d1ad"/><text x="702" y="357" font-size="22" font-weight="700">Перетворені руди</text><text x="702" y="392" font-size="20">і мінерали</text><text x="702" y="422" font-size="18">конкретний склад різниться</text><text x="160" y="505" font-size="20" font-weight="700">Це модель закономірностей, а не правило «один процес = одна копалина».</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#dff7ff"/><stop offset="1" stop-color="#fff2cf"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="#f7fbff"/><rect x="40" y="40" width="1120" height="110" rx="28" fill="url(#a)"/><text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#173a55">Євразія ↔ Північна Америка</text><text x="600" y="125" text-anchor="middle" font-family="Arial" font-size="22" fill="#476273">Порівнюємо не назви, а причинні ланцюги природних комплексів</text><g font-family="Arial" fill="#173a55"><rect x="60" y="190" width="330" height="160" rx="24" fill="#e9f7ed"/><text x="225" y="230" text-anchor="middle" font-size="25" font-weight="700">ПІВНІЧ</text><text x="90" y="270" font-size="20">тундра → тайга</text><text x="90" y="305" font-size="18">низькі t°, коротке літо, мерзлота</text><rect x="435" y="190" width="330" height="160" rx="24" fill="#fff3d9"/><text x="600" y="230" text-anchor="middle" font-size="25" font-weight="700">ВНУТРІШНІ РІВНИНИ</text><text x="465" y="270" font-size="20">степ ↔ прерія</text><text x="465" y="305" font-size="18">континентальність, трави, чорноземи</text><rect x="810" y="190" width="330" height="160" rx="24" fill="#f3eaff"/><text x="975" y="230" text-anchor="middle" font-size="25" font-weight="700">ГОРИ</text><text x="840" y="270" font-size="20">Гімалаї ↔ Кордильєри</text><text x="840" y="305" font-size="18">висотна поясність, бар’єр опадів</text><rect x="60" y="390" width="330" height="160" rx="24" fill="#e8f2ff"/><text x="225" y="430" text-anchor="middle" font-size="25" font-weight="700">ЗАХІДНІ УЗБЕРЕЖЖЯ</text><text x="90" y="470" font-size="20">океанічний вплив</text><text x="90" y="505" font-size="18">м’якші зими, більше вологи</text><rect x="435" y="390" width="330" height="160" rx="24" fill="#ffece6"/><text x="600" y="430" text-anchor="middle" font-size="25" font-weight="700">ПОСУШЛИВІ ОБЛАСТІ</text><text x="465" y="470" font-size="20">Гобі ↔ Великий Басейн</text><text x="465" y="505" font-size="18">континентальність + тінь опадів</text><rect x="810" y="390" width="330" height="160" rx="24" fill="#e8fbf6"/><text x="975" y="430" text-anchor="middle" font-size="25" font-weight="700">ГОЛОВНИЙ ВИСНОВОК</text><text x="840" y="470" font-size="19">подібний клімат + рельєф</text><text x="840" y="503" font-size="19">→ подібний комплекс</text></g><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0d7a69">Доказ = карта/знімок + спостереження + пояснення механізму</text></svg>
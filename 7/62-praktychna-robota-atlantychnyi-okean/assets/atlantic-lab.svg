<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Практична схема Атлантичного океану</title><desc id="d">Схема Серединно-Атлантичного хребта, океанічних течій, Саргасового моря та шельфових районів</desc><defs><linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff7ff"/><stop offset="1" stop-color="#9ed8f4"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d7a1"/><stop offset="1" stop-color="#c7e3a2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".15"/></filter></defs><rect width="1200" height="620" rx="34" fill="#f8fcff"/><path d="M0 0h260l58 90-38 75 42 74-55 90 40 70-70 80 22 141H0z" fill="url(#l)"/><path d="M1200 0H930l-35 75 42 70-70 86 56 78-42 90 50 83-31 138h300z" fill="url(#l)"/><path d="M260 0h670l-35 75 42 70-70 86 56 78-42 90 50 83-31 138H259l-22-141 70-80-40-70 55-90-42-74 38-75z" fill="url(#o)"/><path d="M610 20c-42 60-8 104-45 157s23 95-14 155 7 100-28 168 17 81-10 106" fill="none" stroke="#f5825f" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 18"/><path d="M468 390c45-70 128-76 184-27 59 51 92 16 137-36" fill="none" stroke="#e85454" stroke-width="10" stroke-linecap="round"/><path d="M783 327l-29-3 16 25z" fill="#e85454"/><path d="M777 196c-42-54-102-65-151-25-51 42-87 28-126-9" fill="none" stroke="#176fd1" stroke-width="10" stroke-linecap="round"/><path d="M497 162l26-9-7 28z" fill="#176fd1"/><ellipse cx="692" cy="250" rx="120" ry="74" fill="#2e9d77" opacity=".14" stroke="#27866a" stroke-width="5" stroke-dasharray="13 10"/><g filter="url(#s)" font-family="Inter,Arial,sans-serif"><g transform="translate(410 36)"><rect width="382" height="74" rx="18" fill="white"/><text x="22" y="30" font-size="17" font-weight="800" fill="#8d4a32">СЕРЕДИННО-АТЛАНТИЧНИЙ ХРЕБЕТ</text><text x="22" y="54" font-size="14" fill="#3c6173">розходження плит → нова океанічна кора</text></g><g transform="translate(730 190)"><rect width="300" height="75" rx="18" fill="white"/><text x="20" y="30" font-size="18" font-weight="800" fill="#27745f">САРГАСОВЕ МОРЕ</text><text x="20" y="55" font-size="14" fill="#3c6173">межі задають течії, а не суходіл</text></g><g transform="translate(338 438)"><rect width="350" height="88" rx="18" fill="white"/><text x="20" y="31" font-size="17" font-weight="800" fill="#ba3f3f">теплі течії</text><text x="20" y="57" font-size="14" fill="#3c6173">переносять тепло до вищих широт</text></g><g transform="translate(687 468)"><rect width="354" height="88" rx="18" fill="white"/><text x="20" y="31" font-size="17" font-weight="800" fill="#235ea9">холодні течії</text><text x="20" y="57" font-size="14" fill="#3c6173">впливають на температуру й продуктивність</text></g></g><text x="30" y="588" font-family="Inter,Arial,sans-serif" font-size="14" fill="#60798a">Схема не замінює фізичну карту. Використовуйте її як модель причинно-наслідкових зв’язків.</text></svg>
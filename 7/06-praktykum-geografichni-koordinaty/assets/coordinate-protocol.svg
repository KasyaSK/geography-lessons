<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="36" fill="#f4fbff"/><g font-family="Arial,sans-serif"><text x="60" y="70" font-size="34" font-weight="700" fill="#17344c">Алгоритм визначення географічних координат</text><g transform="translate(60 125)"><rect width="230" height="260" rx="28" fill="#e4f6ff" stroke="#85c8e9"/><circle cx="55" cy="55" r="28" fill="#168bd2"/><text x="47" y="66" font-size="30" font-weight="700" fill="white">1</text><text x="28" y="118" font-size="23" font-weight="700" fill="#17344c">Знайди екватор</text><text x="28" y="155" font-size="18" fill="#496c82">Визнач північну</text><text x="28" y="182" font-size="18" fill="#496c82">або південну</text><text x="28" y="209" font-size="18" fill="#496c82">півкулю.</text></g><path d="M305 255h55" stroke="#8db9cf" stroke-width="8" stroke-linecap="round"/><polygon points="360,255 340,242 340,268" fill="#8db9cf"/><g transform="translate(375 125)"><rect width="230" height="260" rx="28" fill="#eafff7" stroke="#7bcfb7"/><circle cx="55" cy="55" r="28" fill="#159a7c"/><text x="47" y="66" font-size="30" font-weight="700" fill="white">2</text><text x="28" y="118" font-size="23" font-weight="700" fill="#17344c">Визнач широту</text><text x="28" y="155" font-size="18" fill="#496c82">Відлічи градуси</text><text x="28" y="182" font-size="18" fill="#496c82">від екватора</text><text x="28" y="209" font-size="18" fill="#496c82">до паралелі.</text></g><path d="M620 255h55" stroke="#8db9cf" stroke-width="8" stroke-linecap="round"/><polygon points="675,255 655,242 655,268" fill="#8db9cf"/><g transform="translate(690 125)"><rect width="230" height="260" rx="28" fill="#fff7ea" stroke="#efc481"/><circle cx="55" cy="55" r="28" fill="#f28c48"/><text x="47" y="66" font-size="30" font-weight="700" fill="white">3</text><text x="28" y="118" font-size="23" font-weight="700" fill="#17344c">Знайди 0°</text><text x="28" y="155" font-size="18" fill="#496c82">Визнач східну</text><text x="28" y="182" font-size="18" fill="#496c82">або західну</text><text x="28" y="209" font-size="18" fill="#496c82">півкулю.</text></g><path d="M935 255h55" stroke="#8db9cf" stroke-width="8" stroke-linecap="round"/><polygon points="990,255 970,242 970,268" fill="#8db9cf"/><g transform="translate(1005 125)"><rect width="150" height="260" rx="28" fill="#f3edff" stroke="#baa3e8"/><circle cx="55" cy="55" r="28" fill="#7a5cc7"/><text x="47" y="66" font-size="30" font-weight="700" fill="white">4</text><text x="20" y="118" font-size="21" font-weight="700" fill="#17344c">Довгота</text><text x="20" y="155" font-size="17" fill="#496c82">Відлічи</text><text x="20" y="181" font-size="17" fill="#496c82">градуси</text><text x="20" y="207" font-size="17" fill="#496c82">від 0°.</text></g><text x="60" y="455" font-size="24" font-weight="700" fill="#17344c">Запис: 50°27′ пн. ш., 30°31′ сх. д. — спочатку широта, потім довгота.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="36" fill="#fffdf7"/><g font-family="Arial,sans-serif"><text x="60" y="70" font-size="34" font-weight="700" fill="#17344c">Картка практикуму: доказ → координата → перевірка</text><g transform="translate(60 125)"><rect width="315" height="300" rx="28" fill="#ffffff" stroke="#d8e8f1" stroke-width="3"/><text x="28" y="48" font-size="25" font-weight="700" fill="#168bd2">1. Зчитую</text><text x="28" y="92" font-size="19" fill="#496c82">• паралель</text><text x="28" y="126" font-size="19" fill="#496c82">• меридіан</text><text x="28" y="160" font-size="19" fill="#496c82">• півкулі</text><text x="28" y="208" font-size="19" font-weight="700" fill="#17344c">Чернетка:</text><path d="M28 240h255M28 270h255" stroke="#c4dbe7" stroke-width="3"/></g><g transform="translate(442 125)"><rect width="315" height="300" rx="28" fill="#ffffff" stroke="#d8e8f1" stroke-width="3"/><text x="28" y="48" font-size="25" font-weight="700" fill="#159a7c">2. Записую</text><text x="28" y="92" font-size="19" fill="#496c82">Широта першою</text><text x="28" y="126" font-size="19" fill="#496c82">Довгота другою</text><text x="28" y="160" font-size="19" fill="#496c82">Додаю пн./пд., сх./зх.</text><text x="28" y="208" font-size="19" font-weight="700" fill="#17344c">Координата:</text><path d="M28 240h255M28 270h255" stroke="#c4dbe7" stroke-width="3"/></g><g transform="translate(824 125)"><rect width="315" height="300" rx="28" fill="#ffffff" stroke="#d8e8f1" stroke-width="3"/><text x="28" y="48" font-size="25" font-weight="700" fill="#f28c48">3. Перевіряю</text><text x="28" y="92" font-size="19" fill="#496c82">• електронна карта</text><text x="28" y="126" font-size="19" fill="#496c82">• допустимі межі</text><text x="28" y="160" font-size="19" fill="#496c82">• чи збігається місце</text><text x="28" y="208" font-size="19" font-weight="700" fill="#17344c">Різниця / висновок:</text><path d="M28 240h255M28 270h255" stroke="#c4dbe7" stroke-width="3"/></g></g></svg>
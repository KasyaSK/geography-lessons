<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Система ідеального континенту</title><desc id="d">Причинна схема: природні умови впливають на ресурси, розселення, культурні контакти та стійкість цивілізації.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fff3dc"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0f9f98"/><stop offset="1" stop-color="#2f7fd3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17394a">Ідеальний континент = система компромісів</text><g font-family="Arial,sans-serif" fill="#17394a" filter="url(#s)"><rect x="90" y="150" width="260" height="150" rx="26" fill="#fff"/><text x="220" y="195" text-anchor="middle" font-size="25" font-weight="700">Природні умови</text><text x="120" y="235" font-size="20">• вода • клімат</text><text x="120" y="270" font-size="20">• рельєф • узбережжя</text><rect x="470" y="150" width="260" height="150" rx="26" fill="#fff"/><text x="600" y="195" text-anchor="middle" font-size="25" font-weight="700">Ресурси</text><text x="500" y="235" font-size="20">• їжа • енергія</text><text x="500" y="270" font-size="20">• транспорт • землі</text><rect x="850" y="150" width="260" height="150" rx="26" fill="#fff"/><text x="980" y="195" text-anchor="middle" font-size="25" font-weight="700">Розселення</text><text x="880" y="235" font-size="20">• міста • шляхи</text><text x="880" y="270" font-size="20">• густота • вузли</text><rect x="280" y="440" width="280" height="160" rx="26" fill="#fff"/><text x="420" y="490" text-anchor="middle" font-size="25" font-weight="700">Культурні контакти</text><text x="315" y="530" font-size="20">• обмін • конфлікти</text><text x="315" y="565" font-size="20">• спільні правила</text><rect x="640" y="440" width="280" height="160" rx="26" fill="#fff"/><text x="780" y="490" text-anchor="middle" font-size="25" font-weight="700">Стійкість</text><text x="675" y="530" font-size="20">• адаптація • резерви</text><text x="675" y="565" font-size="20">• менше критичних ризиків</text></g><g stroke="url(#g)" stroke-width="12" fill="none" stroke-linecap="round"><path d="M350 225H465"/><path d="M730 225H845"/><path d="M930 300C900 370 845 400 800 435"/><path d="M600 300C580 360 520 405 480 435"/><path d="M560 520H635"/></g><g fill="#1b7f96"><path d="M465 225l-24-16v32z"/><path d="M845 225l-24-16v32z"/><path d="M800 435l4-29 25 20z"/><path d="M480 435l8-28 22 23z"/><path d="M635 520l-24-16v32z"/></g><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#446575">Немає «найкращого» набору умов: сильна модель має резерви, зв’язність і пояснені компроміси.</text></svg>
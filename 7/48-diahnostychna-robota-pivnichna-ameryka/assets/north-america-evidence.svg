<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Північна Америка — карта доказів</title><desc id="d">Схематична карта ключових об’єктів для діагностичної роботи</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#fff1d8"/></linearGradient></defs><rect width="900" height="560" rx="32" fill="url(#g)"/><path d="M205 70 320 44 455 75 565 115 662 182 735 265 696 345 617 390 548 472 447 510 380 449 331 392 249 355 190 275 155 178Z" fill="#e9f3de" stroke="#3b6f72" stroke-width="5"/><path d="M235 100 274 175 266 255 283 341 323 395" fill="none" stroke="#9a6b49" stroke-width="16" stroke-linecap="round" opacity=".75"/><path d="M402 158 432 197 455 236 466 282" fill="none" stroke="#2779b7" stroke-width="8" stroke-linecap="round"/><ellipse cx="470" cy="215" rx="55" ry="20" fill="#81c7ea" opacity=".9"/><ellipse cx="490" cy="242" rx="48" ry="16" fill="#81c7ea" opacity=".9"/><circle cx="293" cy="333" r="10" fill="#cf4f4f"/><circle cx="448" cy="189" r="10" fill="#cf4f4f"/><circle cx="583" cy="331" r="10" fill="#cf4f4f"/><g font-family="Arial,sans-serif" fill="#17384b"><text x="48" y="52" font-size="30" font-weight="700">Карта доказів</text><text x="48" y="86" font-size="18">Не відповідь, а орієнтир: перевіряйте на реальних картах.</text><text x="98" y="177" font-size="22" font-weight="700">Кордильєри</text><text x="503" y="205" font-size="22" font-weight="700">Великі озера</text><text x="500" y="286" font-size="22" font-weight="700">Міссісіпі</text><text x="168" y="370" font-size="20" font-weight="700">Каліфорнія</text><text x="590" y="365" font-size="20" font-weight="700">Східне узбережжя</text><text x="327" y="532" font-size="20" font-weight="700">Мексиканська затока</text></g><g transform="translate(625 54)" font-family="Arial,sans-serif"><rect width="225" height="110" rx="18" fill="#fff" opacity=".9"/><text x="16" y="30" font-size="17" font-weight="700" fill="#17384b">Шукайте зв’язки:</text><text x="16" y="56" font-size="15" fill="#17384b">рельєф ↔ клімат</text><text x="16" y="78" font-size="15" fill="#17384b">клімат ↔ води</text><text x="16" y="100" font-size="15" fill="#17384b">природа ↔ населення</text></g></svg>
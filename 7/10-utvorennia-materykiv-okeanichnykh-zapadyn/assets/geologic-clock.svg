<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Геологічний годинник Землі</title><desc id="d">Схематична шкала історії Землі від 4,6 млрд років до сучасності з основними еонами та фанерозойськими ерами.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6b6fd8"/><stop offset=".55" stop-color="#2e9fc7"/><stop offset="1" stop-color="#20a678"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="#f7fcff"/><text x="55" y="62" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#17344c">Історія Землі ≈ 4,6 млрд років</text><rect x="55" y="105" width="1090" height="76" rx="18" fill="url(#g)"/><line x1="55" y1="205" x2="1145" y2="205" stroke="#9bb7c7" stroke-width="3"/><g font-family="system-ui,sans-serif" fill="#17344c"><text x="55" y="245" font-size="25" font-weight="800">4,6 млрд р.</text><text x="975" y="245" font-size="25" font-weight="800">541 млн р.</text><text x="1090" y="245" font-size="25" font-weight="800">0</text><text x="85" y="150" font-size="26" font-weight="800" fill="white">Докембрій</text><text x="965" y="150" font-size="22" font-weight="800" fill="white">Фанерозой</text><text x="55" y="305" font-size="23">Гадей → Архей → Протерозой</text><text x="795" y="305" font-size="23">Палеозой → Мезозой → Кайнозой</text><text x="55" y="365" font-size="20" fill="#60798a">Шкала навчальна: межі показані узагальнено. Для точних сучасних меж використовуйте International Chronostratigraphic Chart (ICS).</text></g><circle cx="1015" cy="205" r="9" fill="#ed8743"/><circle cx="1080" cy="205" r="9" fill="#ed8743"/><circle cx="1145" cy="205" r="9" fill="#ed8743"/></svg>
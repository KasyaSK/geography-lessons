<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Цикл утворення та руйнування океанічної кори</title><desc id="d">Схематичний розріз: серединно-океанічний хребет, розходження плит, субдукція та континентальні блоки.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1c7fb2"/></marker></defs><rect width="1200" height="520" rx="28" fill="#f7fcff"/><rect y="315" width="1200" height="205" fill="#f5c98b"/><path d="M0 290 C150 250 230 275 330 285 C430 295 485 245 600 180 C715 245 770 295 870 285 C970 275 1050 250 1200 290 L1200 345 L0 345 Z" fill="#6fc2da"/><path d="M0 300 C150 265 240 290 330 300 C440 310 505 260 600 205 C695 260 760 310 870 300 C960 290 1050 265 1200 300" fill="none" stroke="#1a6f97" stroke-width="10"/><path d="M600 205 L600 410" stroke="#e85f42" stroke-width="13"/><path d="M905 300 C955 315 1000 340 1060 420" fill="none" stroke="#1a6f97" stroke-width="18"/><path d="M295 300 C245 315 200 340 140 420" fill="none" stroke="#1a6f97" stroke-width="18"/><path d="M540 260 L440 260" stroke="#1c7fb2" stroke-width="8" marker-end="url(#a)"/><path d="M660 260 L760 260" stroke="#1c7fb2" stroke-width="8" marker-end="url(#a)"/><path d="M1010 350 L1060 410" stroke="#b94f34" stroke-width="8" marker-end="url(#a)"/><path d="M190 350 L140 410" stroke="#b94f34" stroke-width="8" marker-end="url(#a)"/><g font-family="system-ui,sans-serif" fill="#17344c"><text x="420" y="74" font-size="34" font-weight="850">Океанічна кора не «вічна»</text><text x="440" y="125" font-size="24">вона народжується й переробляється</text><text x="485" y="175" font-size="23" font-weight="800">серединно-океанічний хребет</text><text x="345" y="240" font-size="22">розходження</text><text x="738" y="240" font-size="22">розходження</text><text x="40" y="350" font-size="22" font-weight="800">зона субдукції</text><text x="985" y="350" font-size="22" font-weight="800">зона субдукції</text><text x="500" y="455" font-size="24" font-weight="800">мантія</text><text x="45" y="475" font-size="20" fill="#60798a">Навчальна схема. Реальні межі плит і типи меж перевіряйте за картою USGS.</text></g></svg>
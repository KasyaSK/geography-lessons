<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f7fcff"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#f0b86b"/><stop offset=".45" stop-color="#d7c596"/><stop offset="1" stop-color="#7bbf8a"/></linearGradient></defs><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#17344c">Поперечний профіль Австралії: захід → схід</text><path d="M70 460 C180 420 230 390 320 410 C430 435 540 440 660 422 C755 408 810 390 870 300 C920 230 985 235 1060 360 L1060 520 L70 520 Z" fill="url(#g)" stroke="#295f6b" stroke-width="4"/><line x1="70" y1="520" x2="1060" y2="520" stroke="#6a7d86" stroke-width="2"/><text x="95" y="565" font-family="Arial" font-size="24" fill="#17344c">Західно-Австралійське плоскогір’я</text><text x="495" y="565" font-family="Arial" font-size="24" fill="#17344c">Центральна низовина</text><text x="855" y="565" font-family="Arial" font-size="24" fill="#17344c">Великий Вододільний хребет</text><circle cx="235" cy="355" r="16" fill="#b54f4f"/><text x="260" y="362" font-family="Arial" font-size="22" fill="#17344c">Fe, Au, Ni</text><circle cx="570" cy="400" r="16" fill="#8f6bb3"/><text x="595" y="407" font-family="Arial" font-size="22" fill="#17344c">осадові басейни</text><circle cx="935" cy="255" r="16" fill="#2b8a6e"/><text x="960" y="262" font-family="Arial" font-size="22" fill="#17344c">вугілля, руди</text><text x="80" y="610" font-family="Arial" font-size="18" fill="#60798a">Навчальна схема: зіставляйте її з фізичною й геологічною картами, а не використовуйте як готову відповідь.</text></svg>
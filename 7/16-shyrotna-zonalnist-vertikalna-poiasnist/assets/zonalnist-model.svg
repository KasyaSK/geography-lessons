<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff7dc"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#18354c">Широтна зональність: модель причинного ланцюга</text><g font-family="Arial" fill="#17354d"><rect x="70" y="135" width="230" height="110" rx="24" fill="#fff" stroke="#b8dfe8"/><text x="185" y="180" text-anchor="middle" font-size="26" font-weight="700">Широта</text><text x="185" y="215" text-anchor="middle" font-size="20">кут падіння променів</text><rect x="350" y="135" width="230" height="110" rx="24" fill="#fff" stroke="#b8dfe8"/><text x="465" y="180" text-anchor="middle" font-size="26" font-weight="700">Тепло</text><text x="465" y="215" text-anchor="middle" font-size="20">температурний режим</text><rect x="630" y="135" width="230" height="110" rx="24" fill="#fff" stroke="#b8dfe8"/><text x="745" y="180" text-anchor="middle" font-size="26" font-weight="700">Волога</text><text x="745" y="215" text-anchor="middle" font-size="20">опади + випаровування</text><rect x="910" y="135" width="220" height="110" rx="24" fill="#fff" stroke="#b8dfe8"/><text x="1020" y="180" text-anchor="middle" font-size="26" font-weight="700">Біота</text><text x="1020" y="215" text-anchor="middle" font-size="20">ґрунти й рослинність</text><g stroke="#2690b8" stroke-width="5" fill="none"><path d="M300 190H345"/><path d="M580 190H625"/><path d="M860 190H905"/></g><g fill="#2690b8"><polygon points="345,190 330,180 330,200"/><polygon points="625,190 610,180 610,200"/><polygon points="905,190 890,180 890,200"/></g></g><g font-family="Arial" text-anchor="middle"><rect x="70" y="330" width="1060" height="250" rx="26" fill="#fff" stroke="#c6e3ec"/><text x="600" y="375" font-size="25" font-weight="700" fill="#17354d">Схематичний ряд природних зон від екватора до полюса</text><rect x="110" y="420" width="170" height="90" rx="18" fill="#2f9d58"/><text x="195" y="462" font-size="20" fill="#fff">вологі</text><text x="195" y="488" font-size="20" fill="#fff">екваторіальні ліси</text><rect x="300" y="420" width="150" height="90" rx="18" fill="#d7b64d"/><text x="375" y="476" font-size="20" fill="#17354d">савани</text><rect x="470" y="420" width="150" height="90" rx="18" fill="#e7cc88"/><text x="545" y="476" font-size="20" fill="#17354d">пустелі</text><rect x="640" y="420" width="150" height="90" rx="18" fill="#6ebc63"/><text x="715" y="476" font-size="20" fill="#17354d">ліси</text><rect x="810" y="420" width="130" height="90" rx="18" fill="#94b96f"/><text x="875" y="476" font-size="20" fill="#17354d">тайга</text><rect x="960" y="420" width="120" height="90" rx="18" fill="#d9eef0"/><text x="1020" y="476" font-size="20" fill="#17354d">тундра</text></g><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="20" fill="#60798a">Це модель закономірності, а не точна карта: океани, течії, рельєф і континентальність зміщують межі.</text></svg>
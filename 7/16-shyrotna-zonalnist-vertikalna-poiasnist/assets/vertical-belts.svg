<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="34" fill="#f6fbff"/><text x="60" y="68" font-family="Arial" font-size="34" font-weight="700" fill="#18354c">Вертикальна поясність: чому з висотою змінюються природні комплекси</text><path d="M100 590 L410 220 L610 445 L820 105 L1100 590 Z" fill="#b9ced3"/><path d="M100 590 L1100 590 L1050 520 L145 520 Z" fill="#79b96c"/><path d="M175 520 L1015 520 L955 445 L235 445 Z" fill="#4f9a57"/><path d="M245 445 L935 445 L870 365 L310 365 Z" fill="#6a8d4b"/><path d="M325 365 L855 365 L795 285 L390 285 Z" fill="#a9a56b"/><path d="M435 285 L785 285 L735 210 L500 210 Z" fill="#dfe9ec"/><path d="M585 210 L760 210 L720 145 L640 145 Z" fill="#ffffff" stroke="#cbdbe1"/><g font-family="Arial" font-size="22" fill="#17354d"><text x="95" y="630">підніжжя: тепліше</text><text x="850" y="552">ліс / луки</text><text x="860" y="468">гірські ліси</text><text x="870" y="390">субальпійські луки</text><text x="880" y="310">альпійський пояс</text><text x="855" y="225">сніги й льодовики</text></g><g font-family="Arial" fill="#17354d"><rect x="70" y="95" width="300" height="125" rx="22" fill="#fff" stroke="#c6e3ec"/><text x="220" y="138" text-anchor="middle" font-size="23" font-weight="700">Ключовий чинник</text><text x="220" y="173" text-anchor="middle" font-size="20">температура з висотою</text><text x="220" y="200" text-anchor="middle" font-size="20">зазвичай знижується</text></g><text x="600" y="670" text-anchor="middle" font-family="Arial" font-size="19" fill="#60798a">Пояси відрізняються між горами через широту, експозицію схилів, вологість і абсолютну висоту.</text></svg>
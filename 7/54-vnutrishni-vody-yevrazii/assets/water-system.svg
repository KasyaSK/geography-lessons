<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f8ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17384d">Внутрішні води Євразії: система причин і наслідків</text><g font-family="Arial,sans-serif" fill="#17384d" filter="url(#sh)"><rect x="70" y="130" width="290" height="140" rx="24" fill="#fff" stroke="#9bd4ed"/><text x="100" y="180" font-size="26" font-weight="700">Клімат</text><text x="100" y="220" font-size="20">опади • сніг • мусони</text><text x="100" y="250" font-size="20">температура • випаровування</text><rect x="455" y="130" width="290" height="140" rx="24" fill="#fff" stroke="#9bd4ed"/><text x="485" y="180" font-size="26" font-weight="700">Рельєф</text><text x="485" y="220" font-size="20">гори → швидкий стік</text><text x="485" y="250" font-size="20">рівнини → меандри</text><rect x="840" y="130" width="290" height="140" rx="24" fill="#fff" stroke="#9bd4ed"/><text x="870" y="180" font-size="26" font-weight="700">Мерзлота</text><text x="870" y="220" font-size="20">слабке просочування</text><text x="870" y="250" font-size="20">льодостав • термокарст</text><path d="M215 290 C215 360 430 355 500 390" stroke="#1888c7" stroke-width="8" fill="none"/><path d="M600 290 L600 385" stroke="#1888c7" stroke-width="8"/><path d="M985 290 C985 360 770 355 700 390" stroke="#1888c7" stroke-width="8" fill="none"/><polygon points="495,382 520,397 493,408" fill="#1888c7"/><polygon points="588,380 612,380 600,408" fill="#1888c7"/><polygon points="705,382 680,397 707,408" fill="#1888c7"/><rect x="320" y="405" width="560" height="170" rx="30" fill="#dff4ff" stroke="#70bee3"/><text x="600" y="455" text-anchor="middle" font-size="30" font-weight="700">Річки • озера • заболочення</text><text x="600" y="500" text-anchor="middle" font-size="22">Атлантичний • Північний Льодовитий • Тихий • Індійський басейни</text><text x="600" y="535" text-anchor="middle" font-size="22">+ області внутрішнього стоку</text><path d="M600 585 L600 630" stroke="#16856e" stroke-width="8"/><polygon points="588,625 612,625 600,653" fill="#16856e"/><text x="600" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16856e">Режим води — це «відбиток» клімату й рельєфу</text></g></svg>
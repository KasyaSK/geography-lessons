<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Модель кліматотвірних чинників Північної Америки</title><desc id="d">Схема показує широтний розмах, меридіональне простягання Кордильєр, надходження арктичних і тропічних повітряних мас, вологу з Мексиканської затоки та дощову тінь за горами.</desc><defs><linearGradient id="sky" x1="0" x2="1"><stop offset="0" stop-color="#d8f2ff"/><stop offset=".5" stop-color="#f9fdff"/><stop offset="1" stop-color="#fff0d2"/></linearGradient><linearGradient id="land" x1="0" x2="1"><stop offset="0" stop-color="#86b7d6"/><stop offset=".35" stop-color="#a8c58d"/><stop offset=".7" stop-color="#d3c28e"/><stop offset="1" stop-color="#80b98e"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#245c7d"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d56a45"/></marker></defs><rect width="1200" height="560" rx="28" fill="url(#sky)"/><path d="M120 430 Q210 395 270 420 Q330 370 385 395 Q455 250 525 405 Q610 430 690 405 Q765 390 850 405 Q930 375 1080 420 L1080 500 L120 500Z" fill="url(#land)"/><path d="M405 420 L465 295 L505 390 L540 270 L590 420Z" fill="#6688a1" opacity=".9"/><path d="M447 332L465 295L479 340M520 315L540 270L558 329" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/><text x="470" y="455" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#17384e">Кордильєри</text><path d="M580 130 C700 150 770 190 825 265" fill="none" stroke="#245c7d" stroke-width="12" marker-end="url(#arr)"/><text x="635" y="115" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#245c7d">Арктичне повітря ↓</text><path d="M805 465 C805 410 795 360 760 310" fill="none" stroke="#d56a45" stroke-width="12" marker-end="url(#warm)"/><text x="805" y="492" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#b64f32">Тепле вологе повітря з Мексиканської затоки ↑</text><path d="M155 335 C240 330 315 330 400 335" fill="none" stroke="#2d7fb6" stroke-width="12" marker-end="url(#arr)"/><text x="135" y="305" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#246e9d">Волога з Тихого океану →</text><path d="M525 300 C595 300 635 320 665 345" fill="none" stroke="#c58b36" stroke-width="10" stroke-dasharray="14 12" marker-end="url(#warm)"/><text x="595" y="285" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#9b6d27">дощова тінь</text><text x="105" y="92" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#17384e">Чому клімат такий контрастний?</text><text x="105" y="135" font-family="system-ui,sans-serif" font-size="24" fill="#4d6d7f">Широта задає фон, а рельєф і циркуляція перерозподіляють тепло та вологу.</text><g font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#17384e"><rect x="90" y="175" width="235" height="62" rx="20" fill="#fff" opacity=".92"/><text x="112" y="214">1. Широтний розмах</text><rect x="340" y="175" width="255" height="62" rx="20" fill="#fff" opacity=".92"/><text x="360" y="214">2. Кордильєри</text><rect x="610" y="175" width="240" height="62" rx="20" fill="#fff" opacity=".92"/><text x="632" y="214">3. Повітряні маси</text><rect x="865" y="175" width="245" height="62" rx="20" fill="#fff" opacity=".92"/><text x="888" y="214">4. Океани й течії</text></g></svg>
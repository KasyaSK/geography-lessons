<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Назви історико-географічних областей Океанії</title><desc id="d">Мікронезія, Полінезія та Меланезія з грецькими коренями назв.</desc><rect width="1000" height="500" rx="34" fill="#f4fbfe"/><g font-family="system-ui"><text x="500" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#163f58">ОКЕАНІЯ: НАЗВИ ЯК ПІДКАЗКИ</text><g transform="translate(45 110)"><rect width="280" height="290" rx="28" fill="#dff4ff" stroke="#9acfe5" stroke-width="3"/><text x="140" y="60" text-anchor="middle" font-size="29" font-weight="900" fill="#12779d">МІКРОНЕЗІЯ</text><text x="140" y="115" text-anchor="middle" font-size="24" fill="#31556a">mikros + nesoi</text><circle cx="90" cy="180" r="13" fill="#29a0bd"/><circle cx="145" cy="210" r="9" fill="#29a0bd"/><circle cx="195" cy="166" r="11" fill="#29a0bd"/><text x="140" y="260" text-anchor="middle" font-size="21" font-weight="700" fill="#31556a">«малі острови»</text></g><g transform="translate(360 110)"><rect width="280" height="290" rx="28" fill="#e6f8ec" stroke="#9bd3ae" stroke-width="3"/><text x="140" y="60" text-anchor="middle" font-size="29" font-weight="900" fill="#277a50">ПОЛІНЕЗІЯ</text><text x="140" y="115" text-anchor="middle" font-size="24" fill="#31556a">polys + nesoi</text><g fill="#3aaa75"><circle cx="62" cy="175" r="8"/><circle cx="100" cy="205" r="10"/><circle cx="140" cy="166" r="8"/><circle cx="180" cy="204" r="9"/><circle cx="220" cy="173" r="10"/><circle cx="142" cy="225" r="7"/></g><text x="140" y="260" text-anchor="middle" font-size="21" font-weight="700" fill="#31556a">«багато островів»</text></g><g transform="translate(675 110)"><rect width="280" height="290" rx="28" fill="#fff0dc" stroke="#e4bd85" stroke-width="3"/><text x="140" y="60" text-anchor="middle" font-size="29" font-weight="900" fill="#9b6028">МЕЛАНЕЗІЯ</text><text x="140" y="115" text-anchor="middle" font-size="24" fill="#31556a">melas + nesoi</text><path d="M70 195c25-45 55-50 77-16 27-38 59-28 72 14-19 31-50 47-78 47-30 0-57-14-71-45z" fill="#bb7b3c"/><text x="140" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#31556a">історична назва</text></g><text x="500" y="465" text-anchor="middle" font-size="20" fill="#617989">Назви — історико-географічні; не використовуйте їх як біологічні категорії людей.</text></g></svg>
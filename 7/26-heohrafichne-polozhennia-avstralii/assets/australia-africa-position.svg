<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Порівняння положення Австралії та Африки</title><desc id="d">Схема показує екватор, Південний тропік та умовні силуети Африки й Австралії.</desc><rect width="1000" height="520" rx="34" fill="#eef9fd"/><path d="M0 165H1000" stroke="#2a9cc1" stroke-width="4" stroke-dasharray="14 12"/><text x="28" y="150" font-family="system-ui" font-size="26" font-weight="700" fill="#187a9b">Екватор 0°</text><path d="M0 300H1000" stroke="#e09a37" stroke-width="4" stroke-dasharray="14 12"/><text x="28" y="287" font-family="system-ui" font-size="26" font-weight="700" fill="#9f681c">Південний тропік 23,5° пд. ш.</text><path d="M310 70c-65 8-106 56-115 112-8 54 25 99 50 135 29 42 36 108 76 137 31-29 57-72 77-111 23-44 54-92 41-145-14-58-67-119-129-128z" fill="#f1c477" stroke="#b77a2c" stroke-width="4"/><text x="255" y="210" font-family="system-ui" font-size="30" font-weight="900" fill="#5b441f">АФРИКА</text><path d="M655 248c-53 7-103 44-106 89-3 39 45 68 84 72 30 3 51 32 84 26 34-5 76-39 93-74 16-34-11-65-46-83-32-17-72-35-109-30z" fill="#e7a95d" stroke="#aa6b24" stroke-width="4"/><path d="M781 430c20 4 28 23 16 40-10 14-33 13-40-2-8-17 4-41 24-38z" fill="#e7a95d" stroke="#aa6b24" stroke-width="4"/><text x="610" y="346" font-family="system-ui" font-size="30" font-weight="900" fill="#59411e">АВСТРАЛІЯ</text><g font-family="system-ui" font-size="22" fill="#24485a"><text x="515" y="45">Схема не в масштабі</text><text x="190" y="492">Африку перетинає екватор</text><text x="570" y="492">Австралія повністю південніше екватора</text></g></svg>
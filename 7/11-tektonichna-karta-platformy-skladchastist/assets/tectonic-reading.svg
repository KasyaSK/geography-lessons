<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="32" fill="#f7fcff"/><rect x="55" y="70" width="330" height="480" rx="28" fill="#e5f6ff" stroke="#9fd4ee"/><text x="220" y="125" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#17688f">ТЕКТОНІЧНА КАРТА</text><text x="95" y="190" font-size="27" font-family="Arial" fill="#17344c">• платформи</text><text x="95" y="240" font-size="27" font-family="Arial" fill="#17344c">• щити</text><text x="95" y="290" font-size="27" font-family="Arial" fill="#17344c">• плити платформ</text><text x="95" y="340" font-size="27" font-family="Arial" fill="#17344c">• складчасті області</text><text x="95" y="390" font-size="27" font-family="Arial" fill="#17344c">• розломи</text><text x="95" y="440" font-size="27" font-family="Arial" fill="#17344c">• вік структур</text><path d="M410 310 H525" stroke="#3b88ad" stroke-width="10" stroke-linecap="round"/><path d="M505 285 L540 310 L505 335" fill="none" stroke="#3b88ad" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="555" y="70" width="590" height="215" rx="28" fill="#effff8" stroke="#a8dec9"/><text x="850" y="125" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#177962">СТАБІЛЬНІ СТРУКТУРИ</text><text x="595" y="185" font-size="28" font-family="Arial" fill="#17344c">Давній фундамент → платформи</text><text x="595" y="235" font-size="28" font-family="Arial" fill="#17344c">Часто відповідають великим рівнинам</text><rect x="555" y="335" width="590" height="215" rx="28" fill="#fff4e8" stroke="#efc492"/><text x="850" y="390" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#b76b24">РУХОМІ СТРУКТУРИ</text><text x="595" y="450" font-size="28" font-family="Arial" fill="#17344c">Деформації → складчасті області</text><text x="595" y="500" font-size="28" font-family="Arial" fill="#17344c">Часто пов’язані з гірськими поясами</text></svg>
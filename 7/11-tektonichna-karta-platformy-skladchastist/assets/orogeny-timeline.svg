<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="30" fill="#fbfdff"/><text x="600" y="58" text-anchor="middle" font-size="36" font-family="Arial" font-weight="700" fill="#17344c">СПРОЩЕНА ШКАЛА ЕПОХ ГОРОТВОРЕННЯ</text><line x1="120" y1="260" x2="1080" y2="260" stroke="#7aa7bd" stroke-width="8" stroke-linecap="round"/><circle cx="250" cy="260" r="24" fill="#6d79c8"/><circle cx="510" cy="260" r="24" fill="#3ca58f"/><circle cx="770" cy="260" r="24" fill="#e5a347"/><circle cx="1000" cy="260" r="24" fill="#e46f5b"/><text x="250" y="205" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#4f5aa8">Байкальська</text><text x="510" y="205" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#2c7b6c">Каледонська</text><text x="770" y="205" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#b77723">Герцинська</text><text x="1000" y="205" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#b64f40">Альпійська</text><text x="120" y="330" font-size="25" font-family="Arial" fill="#60798a">давніше</text><text x="1000" y="330" font-size="25" font-family="Arial" fill="#60798a">молодше</text><text x="600" y="405" text-anchor="middle" font-size="24" font-family="Arial" fill="#60798a">Для шкільного читання тектонічної карти: кольори та підписи показують вік складчастих структур, а не сучасну висоту гір.</text></svg>
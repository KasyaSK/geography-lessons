<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Атлантика — Амазонія — Анди: механізм зволоження</title><desc id="d">Схема перенесення вологи пасатами з Атлантики через Амазонію до Анд, орографічного підняття та дощової тіні</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f8d76"/><stop offset="1" stop-color="#d7c39b"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#198cbb"/></marker></defs><rect width="1200" height="520" rx="28" fill="url(#sky)"/><path d="M0 345 Q120 320 260 350 L260 520 H0Z" fill="#6cc8e8"/><path d="M250 380 Q420 330 600 365 Q755 395 865 350 L905 520 H230Z" fill="#6fbf76"/><path d="M800 390 L905 190 L985 390 L1045 250 L1160 430 L1200 430 L1200 520 L790 520Z" fill="url(#mount)"/><path d="M75 220 C260 175 430 185 640 230 C760 255 840 240 895 205" fill="none" stroke="#198cbb" stroke-width="14" stroke-linecap="round" marker-end="url(#arr)"/><g fill="#fff" stroke="#aad9e6" stroke-width="3"><ellipse cx="655" cy="172" rx="70" ry="34"/><ellipse cx="710" cy="160" rx="62" ry="38"/><ellipse cx="760" cy="177" rx="72" ry="35"/></g><g stroke="#4baed3" stroke-width="6" stroke-linecap="round"><path d="M650 220 l-12 30"/><path d="M700 216 l-12 35"/><path d="M750 220 l-12 32"/><path d="M800 215 l-12 28"/></g><path d="M940 160 C1020 145 1080 160 1145 210" fill="none" stroke="#d28a3b" stroke-width="10" stroke-dasharray="16 12" marker-end="url(#arr)"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#17384d"><text x="55" y="420" font-size="34" font-weight="800">Атлантичний океан</text><text x="370" y="430" font-size="34" font-weight="800">Амазонія</text><text x="870" y="465" font-size="34" font-weight="800">Анди</text><text x="270" y="135" font-size="30" font-weight="800" fill="#0875b3">пасати несуть вологу із сходу</text><text x="605" y="105" font-size="26" font-weight="700">підйом повітря → охолодження → опади</text><text x="965" y="115" font-size="25" font-weight="800" fill="#b56b25">дощова тінь</text><text x="930" y="145" font-size="20">за гірським бар’єром</text></g></svg>
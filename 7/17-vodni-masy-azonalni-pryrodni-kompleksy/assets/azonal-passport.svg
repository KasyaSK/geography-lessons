<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Паспорт азонального природного комплексу</title><desc id="d">Схема для практичної характеристики місцевого природного комплексу</desc><rect width="1000" height="620" rx="28" fill="#f6fcff"/><circle cx="500" cy="300" r="118" fill="#dff5ec" stroke="#218a63" stroke-width="5"/><text x="500" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#17354d">АЗОНАЛЬНИЙ</text><text x="500" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#17354d">КОМПЛЕКС</text><text x="500" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#526f82">місцевий чинник сильніший</text><g font-family="system-ui,sans-serif" fill="#17354d"><g><rect x="70" y="75" width="270" height="110" rx="20" fill="#e8f7fd"/><text x="95" y="115" font-size="23" font-weight="900">1. Межі</text><text x="95" y="148" font-size="17">де комплекс починається</text><text x="95" y="172" font-size="17">і закінчується?</text></g><g><rect x="660" y="75" width="270" height="110" rx="20" fill="#fff4df"/><text x="685" y="115" font-size="23" font-weight="900">2. Рельєф</text><text x="685" y="148" font-size="17">долина • балка • схил</text><text x="685" y="172" font-size="17">тераса • улоговина</text></g><g><rect x="70" y="420" width="270" height="110" rx="20" fill="#e9f8ff"/><text x="95" y="460" font-size="23" font-weight="900">3. Вода</text><text x="95" y="493" font-size="17">русло • заплава • озеро</text><text x="95" y="517" font-size="17">ґрунтові води</text></g><g><rect x="660" y="420" width="270" height="110" rx="20" fill="#eef9ef"/><text x="685" y="460" font-size="23" font-weight="900">4. Рослинність</text><text x="685" y="493" font-size="17">чим відрізняється від</text><text x="685" y="517" font-size="17">сусідньої зони?</text></g><g><rect x="365" y="25" width="270" height="95" rx="20" fill="#fff8e9"/><text x="500" y="65" text-anchor="middle" font-size="23" font-weight="900">5. Дія людини</text><text x="500" y="96" text-anchor="middle" font-size="17">дороги • поля • дамби • забудова</text></g><g><rect x="365" y="500" width="270" height="95" rx="20" fill="#f3edff"/><text x="500" y="540" text-anchor="middle" font-size="23" font-weight="900">6. Головний чинник</text><text x="500" y="571" text-anchor="middle" font-size="17">доведіть причинний зв’язок</text></g></g><g stroke="#9bbfcf" stroke-width="3"><line x1="340" y1="155" x2="405" y2="220"/><line x1="660" y1="155" x2="595" y2="220"/><line x1="340" y1="450" x2="405" y2="382"/><line x1="660" y1="450" x2="595" y2="382"/><line x1="500" y1="120" x2="500" y2="182"/><line x1="500" y1="418" x2="500" y2="500"/></g></svg>
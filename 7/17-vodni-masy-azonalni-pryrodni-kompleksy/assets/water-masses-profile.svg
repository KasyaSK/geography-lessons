<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Водні маси за глибиною</title><desc id="d">Навчальна схема: поверхневі, проміжні, глибинні та донні водні маси</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79daf1"/><stop offset=".2" stop-color="#35a9d1"/><stop offset=".5" stop-color="#176992"/><stop offset="1" stop-color="#092c47"/></linearGradient></defs><rect width="1000" height="620" rx="28" fill="#f5fbfe"/><rect x="70" y="55" width="500" height="510" rx="24" fill="url(#sea)"/><path d="M70 55 Q150 38 230 55 T390 55 T570 55" fill="none" stroke="#fff" stroke-width="7" opacity=".8"/><g font-family="system-ui,sans-serif" font-weight="800"><text x="95" y="105" font-size="26" fill="#123c55">ПОВЕРХНЕВІ</text><text x="95" y="135" font-size="18" fill="#123c55">вітер • сезон • опади / випаровування</text><line x1="70" y1="165" x2="570" y2="165" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/><text x="95" y="225" font-size="26" fill="#fff">ПРОМІЖНІ</text><text x="95" y="255" font-size="18" fill="#fff">термоклін • сильні градієнти T / S</text><line x1="70" y1="300" x2="570" y2="300" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/><text x="95" y="370" font-size="26" fill="#fff">ГЛИБИННІ</text><text x="95" y="400" font-size="18" fill="#fff">холодні • стабільніші властивості</text><line x1="70" y1="485" x2="570" y2="485" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/><text x="95" y="535" font-size="26" fill="#fff">ДОННІ</text></g><g font-family="system-ui,sans-serif" fill="#17354d"><text x="635" y="95" font-size="28" font-weight="900">Що формує шари?</text><rect x="625" y="125" width="305" height="90" rx="18" fill="#e9f8fd"/><text x="650" y="160" font-size="21" font-weight="800">Температура</text><text x="650" y="190" font-size="17">охолодження → густина ↑</text><rect x="625" y="230" width="305" height="90" rx="18" fill="#eefaf4"/><text x="650" y="265" font-size="21" font-weight="800">Солоність</text><text x="650" y="295" font-size="17">солоність ↑ → густина ↑</text><rect x="625" y="335" width="305" height="125" rx="18" fill="#fff7e6"/><text x="650" y="370" font-size="21" font-weight="800">Циркуляція</text><text x="650" y="400" font-size="17">густі води занурюються</text><text x="650" y="425" font-size="17">і поширюються на великі</text><text x="650" y="450" font-size="17">відстані в океані</text><text x="625" y="520" font-size="16" fill="#60798a">Схема спрощена: реальні межі</text><text x="625" y="543" font-size="16" fill="#60798a">залежать від океану, широти й сезону.</text></g></svg>
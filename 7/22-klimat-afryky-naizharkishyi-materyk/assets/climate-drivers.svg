<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480"><rect width="900" height="480" rx="28" fill="#f7fbfd"/><g font-family="system-ui" fill="#17344c"><text x="450" y="54" text-anchor="middle" font-size="28" font-weight="900">Чому Африка така жарка?</text><g font-size="18" font-weight="800"><rect x="55" y="95" width="220" height="95" rx="22" fill="#fff0ca" stroke="#e4c76c"/><text x="165" y="130" text-anchor="middle">1. Географічна широта</text><text x="165" y="160" text-anchor="middle" font-size="15" font-weight="600">велика частина між тропіками</text><rect x="340" y="95" width="220" height="95" rx="22" fill="#e8f7ff" stroke="#9fd0e4"/><text x="450" y="130" text-anchor="middle">2. Сонячна радіація</text><text x="450" y="160" text-anchor="middle" font-size="15" font-weight="600">високе Сонце → сильне нагрівання</text><rect x="625" y="95" width="220" height="95" rx="22" fill="#eef9ef" stroke="#a9d6ad"/><text x="735" y="130" text-anchor="middle">3. Циркуляція повітря</text><text x="735" y="160" text-anchor="middle" font-size="15" font-weight="600">екваторіальні дощі, тропічна сухість</text><rect x="195" y="245" width="220" height="95" rx="22" fill="#f3efff" stroke="#c7b8e7"/><text x="305" y="280" text-anchor="middle">4. Океани й течії</text><text x="305" y="310" text-anchor="middle" font-size="15" font-weight="600">холодні течії підсилюють сухість</text><rect x="485" y="245" width="220" height="95" rx="22" fill="#fff0ed" stroke="#e9b8ae"/><text x="595" y="280" text-anchor="middle">5. Рельєф</text><text x="595" y="310" text-anchor="middle" font-size="15" font-weight="600">висота й навітряні схили змінюють клімат</text></g><path d="M450 205v30M165 190l95 55M735 190l-95 55" stroke="#6f8b9c" stroke-width="3" stroke-linecap="round"/><rect x="235" y="390" width="430" height="52" rx="20" fill="#17344c"/><text x="450" y="423" text-anchor="middle" fill="#fff" font-size="21" font-weight="900">Клімат = спільна дія кількох чинників</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Географічне положення Євразії</title><desc id="d">Схема океанів, морів, півостровів і географічних контрастів Євразії</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e7f6ff"/><stop offset="1" stop-color="#fff3dd"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="32" fill="url(#bg)"/><text x="54" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17354a">Євразія: положення створює контрасти</text><text x="54" y="108" font-family="Arial,sans-serif" font-size="19" fill="#5f7889">Схема для причинного аналізу, не заміна фізичної карти</text><g filter="url(#s)"><path d="M247 194 L337 148 442 151 507 120 612 136 701 116 795 150 858 139 963 184 1020 238 991 291 1025 340 941 391 852 401 794 445 706 426 638 474 532 450 456 474 377 428 303 440 271 382 208 343 229 289 180 245Z" fill="#d6ddb2" stroke="#8ba173" stroke-width="4"/></g><g fill="#2d7ea7" font-family="Arial,sans-serif" font-size="21" font-weight="700"><text x="440" y="146">Північний Льодовитий океан</text><text x="55" y="310">Атлантичний</text><text x="78" y="338">океан</text><text x="520" y="557">Індійський океан</text><text x="978" y="330">Тихий</text><text x="985" y="358">океан</text></g><g fill="#fff" stroke="#cbdce6" stroke-width="2"><rect x="72" y="442" width="276" height="104" rx="18"/><rect x="384" y="486" width="322" height="92" rx="18"/><rect x="745" y="470" width="358" height="104" rx="18"/></g><g font-family="Arial,sans-serif"><text x="92" y="475" font-size="20" font-weight="700" fill="#17354a">Берегова лінія</text><text x="92" y="503" font-size="17" fill="#5f7889">моря • затоки • півострови</text><text x="92" y="529" font-size="17" fill="#5f7889">→ сильніший контакт з океаном</text><text x="404" y="518" font-size="20" font-weight="700" fill="#17354a">Широтний розмах</text><text x="404" y="546" font-size="17" fill="#5f7889">Арктика → помірні → тропіки</text><text x="765" y="503" font-size="20" font-weight="700" fill="#17354a">Рекорди</text><text x="765" y="531" font-size="17" fill="#5f7889">Еверест ≈ 8849 м</text><text x="765" y="557" font-size="17" fill="#5f7889">Мертве море ≈ −430 м</text></g><g fill="#d99b32" stroke="#fff" stroke-width="3"><circle cx="535" cy="323" r="9"/><circle cx="710" cy="345" r="9"/><circle cx="356" cy="282" r="9"/></g><g font-family="Arial,sans-serif" font-size="15" fill="#17354a"><text x="548" y="318">Середземне море</text><text x="723" y="340">Гімалаї</text><text x="370" y="276">Європа</text></g></svg>
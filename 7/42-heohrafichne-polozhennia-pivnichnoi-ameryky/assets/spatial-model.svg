<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Північна Америка: просторова модель</title><desc id="d">Схематична модель положення Північної Америки від Арктики до тропіків між Тихим і Атлантичним океанами.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#b9e5f6"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf7c8"/><stop offset="1" stop-color="#ffdca8"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#sea)"/><g opacity=".5" stroke="#68a9c3" stroke-dasharray="10 10"><path d="M0 128H1200"/><path d="M0 530H1200"/></g><text x="30" y="115" font-family="sans-serif" font-size="27" font-weight="700" fill="#17617f">Північне полярне коло ≈ 66,5° пн. ш.</text><text x="30" y="520" font-family="sans-serif" font-size="27" font-weight="700" fill="#17617f">Тропік Рака ≈ 23,5° пн. ш.</text><path d="M535 70 C475 95 405 130 375 187 C345 245 320 300 350 345 C386 398 430 414 452 451 C480 498 457 542 498 585 C536 624 608 633 647 591 C682 552 670 506 711 479 C747 455 794 427 811 382 C830 330 798 283 767 251 C742 224 722 192 683 168 C641 142 614 100 573 80 Z" fill="url(#land)" stroke="#44784a" stroke-width="8"/><path d="M694 479 C733 484 770 512 787 543 C800 567 794 597 817 617" fill="none" stroke="#44784a" stroke-width="22" stroke-linecap="round"/><ellipse cx="525" cy="84" rx="128" ry="34" fill="#f8ffff" stroke="#72b5cd" stroke-width="5"/><text x="465" y="91" font-family="sans-serif" font-size="26" font-weight="800" fill="#246276">АРКТИКА</text><text x="92" y="345" font-family="sans-serif" font-size="42" font-weight="900" fill="#11749e">ТИХИЙ</text><text x="86" y="390" font-family="sans-serif" font-size="42" font-weight="900" fill="#11749e">ОКЕАН</text><text x="886" y="345" font-family="sans-serif" font-size="42" font-weight="900" fill="#11749e">АТЛАНТИЧНИЙ</text><text x="965" y="390" font-family="sans-serif" font-size="42" font-weight="900" fill="#11749e">ОКЕАН</text><circle cx="556" cy="155" r="12" fill="#e14b4b"/><text x="577" y="165" font-family="sans-serif" font-size="25" font-weight="800" fill="#743535">північ материка</text><circle cx="812" cy="618" r="12" fill="#e14b4b"/><text x="835" y="627" font-family="sans-serif" font-size="25" font-weight="800" fill="#743535">південь материка</text><path d="M283 584 C330 625 363 639 420 647" stroke="#775c37" stroke-width="6" fill="none" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#775c37"/></marker></defs><text x="57" y="624" font-family="sans-serif" font-size="24" font-weight="800" fill="#775c37">до Південної Америки</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="t d"><title id="t">Полярне положення Антарктиди</title><desc id="d">Схема положення Антарктиди навколо Південного полюса з підписами океану та напрямку до Південної Америки</desc><rect width="1000" height="1000" fill="#eef9ff"/><circle cx="500" cy="500" r="420" fill="#d8f1fb" stroke="#7bb8cf" stroke-width="3"/><circle cx="500" cy="500" r="315" fill="none" stroke="#8bbdd1" stroke-width="2" stroke-dasharray="10 12"/><circle cx="500" cy="500" r="210" fill="none" stroke="#8bbdd1" stroke-width="2" stroke-dasharray="10 12"/><g fill="none" stroke="#8bbdd1" stroke-width="2"><path d="M500 80V920"/><path d="M80 500H920"/><path d="M203 203L797 797"/><path d="M797 203L203 797"/></g><path d="M500 307 C540 300 566 330 590 350 C630 377 663 397 677 436 C692 477 671 511 648 546 C628 578 627 618 595 646 C568 670 535 659 507 683 C477 706 444 687 418 665 C390 641 347 641 332 603 C318 568 340 531 322 497 C304 459 330 428 359 406 C387 385 394 348 431 329 C453 317 477 308 500 307Z" fill="#fff" stroke="#294e62" stroke-width="6"/><path d="M360 405 C317 374 293 339 256 321" fill="none" stroke="#294e62" stroke-width="10" stroke-linecap="round"/><circle cx="500" cy="500" r="9" fill="#d74747"/><g font-family="Arial,sans-serif" fill="#17344c"><text x="500" y="54" text-anchor="middle" font-size="38" font-weight="700">Антарктида навколо Південного полюса</text><text x="518" y="492" font-size="24" font-weight="700">90° пд. ш.</text><text x="682" y="208" font-size="24">60° пд. ш.</text><text x="645" y="305" font-size="24">Антарктичне коло 66°33′ пд. ш.</text><text x="660" y="760" font-size="28" font-weight="700">Південний океан</text><text x="95" y="286" font-size="25" font-weight="700">Антарктичний півострів</text><text x="82" y="328" font-size="21">простягається у напрямку Південної Америки</text><text x="500" y="946" text-anchor="middle" font-size="19" fill="#5f7787">Схема для аналізу карти; не замінює атлас або реальні геодані.</text></g></svg>
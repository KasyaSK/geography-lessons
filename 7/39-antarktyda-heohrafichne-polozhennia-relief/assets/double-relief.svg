<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Подвійний рельєф Антарктиди</title><desc id="d">Навчальна схема: поверхня льодовикового щита, товща льоду і підльодовиковий кам'яний рельєф</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#f8fcff"/></linearGradient><linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#bfe7f5"/></linearGradient><linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7b789"/><stop offset="1" stop-color="#87664a"/></linearGradient></defs><rect width="1200" height="720" fill="url(#sky)"/><path d="M0 274 C170 220 292 250 430 202 C570 150 690 190 810 148 C955 96 1080 138 1200 110 L1200 395 C1040 410 935 372 805 407 C675 442 566 424 438 454 C300 486 160 461 0 498Z" fill="url(#ice)" stroke="#78bdd7" stroke-width="4"/><path d="M0 498 C140 458 260 542 372 500 C462 466 528 512 614 450 C696 390 742 500 838 446 C952 382 1060 482 1200 395 L1200 720 L0 720Z" fill="url(#rock)"/><path d="M0 498 C140 458 260 542 372 500 C462 466 528 512 614 450 C696 390 742 500 838 446 C952 382 1060 482 1200 395" fill="none" stroke="#6a4c36" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#17344c"><text x="58" y="76" font-size="40" font-weight="700">Антарктида має два рельєфи одночасно</text><text x="70" y="195" font-size="30" font-weight="700">1. Льодовикова поверхня</text><text x="70" y="235" font-size="23">Те, що бачимо з супутника: купол, плато, льодовики, шельфові льодовики</text><text x="710" y="308" font-size="30" font-weight="700">товща льоду</text><text x="710" y="342" font-size="22">середня ≈ 1,95 км; місцями &gt; 4,7 км (Bedmap3)</text><text x="70" y="584" font-size="30" font-weight="700">2. Підльодовиковий кам'яний рельєф</text><text x="70" y="624" font-size="23">Гори, улоговини, долини; частина ложа Західної Антарктиди лежить нижче рівня моря</text></g><g stroke="#0878b8" stroke-width="5" fill="none"><path d="M620 245 V438"/><path d="M604 266 L620 245 L636 266"/><path d="M604 418 L620 438 L636 418"/></g><text x="930" y="650" font-family="Arial,sans-serif" font-size="18" fill="#5a6f7f">Схема: Скринченко К.А.; дані BAS Bedmap3 (2025)</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Демографічна траєкторія субсахарської Африки</title><desc id="d">Схематичне відображення прогнозу ООН: населення країн субсахарської Африки зростатиме приблизно на 79 відсотків між 2024 і 2054 роками, до близько 2,2 мільярда.</desc><rect width="1200" height="520" rx="34" fill="#f8fcfe"/><g font-family="Arial, sans-serif" fill="#18384d"><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">Субсахарська Африка: не «цифра», а траєкторія</text><line x1="110" y1="420" x2="1110" y2="420" stroke="#8ba7b6" stroke-width="3"/><line x1="110" y1="95" x2="110" y2="420" stroke="#8ba7b6" stroke-width="3"/><path d="M150 360 C340 330 500 285 650 230 S930 130 1060 105" fill="none" stroke="#1483a3" stroke-width="12" stroke-linecap="round"/><circle cx="150" cy="360" r="16" fill="#f1ab38"/><circle cx="1060" cy="105" r="16" fill="#f1ab38"/><text x="150" y="397" text-anchor="middle" font-size="22" font-weight="700">2024</text><text x="1060" y="397" text-anchor="middle" font-size="22" font-weight="700">2054</text><text x="190" y="330" font-size="20">базовий рівень</text><text x="835" y="94" font-size="20" font-weight="700">≈ 2,2 млрд</text><rect x="360" y="115" width="360" height="100" rx="24" fill="#e7f7ed"/><text x="540" y="154" text-anchor="middle" font-size="28" font-weight="700">+79%</text><text x="540" y="188" text-anchor="middle" font-size="18">прогнозована зміна 2024→2054</text><text x="600" y="474" text-anchor="middle" font-size="16" fill="#637985">Схема не показує щорічні значення. Джерело орієнтира: UN World Population Prospects 2024.</text></g></svg>
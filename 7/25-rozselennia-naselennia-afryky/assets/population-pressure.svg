<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Система чинників розселення населення Африки</title><desc id="d">Навчальна схема: природні й суспільні чинники впливають на густоту населення, а швидке зростання населення разом із вразливістю інфраструктури може посилювати екологічний тиск.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e4f7ff"/><stop offset="1" stop-color="#fff2d6"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#2d7188"/></marker></defs><rect width="1200" height="520" rx="34" fill="#f8fcfe"/><g font-family="Arial, sans-serif" fill="#17384c"><text x="600" y="54" text-anchor="middle" font-size="30" font-weight="700">Розселення — результат системи, а не одного чинника</text><g font-size="22" font-weight="700"><rect x="70" y="112" width="250" height="88" rx="22" fill="#dff5ff"/><text x="195" y="148" text-anchor="middle">Вода і клімат</text><text x="195" y="177" text-anchor="middle" font-size="17" font-weight="400">доступність, сезонність</text><rect x="70" y="238" width="250" height="88" rx="22" fill="#e8f8e9"/><text x="195" y="274" text-anchor="middle">Рельєф і ґрунти</text><text x="195" y="303" text-anchor="middle" font-size="17" font-weight="400">землеробство, транспорт</text><rect x="880" y="112" width="250" height="88" rx="22" fill="#fff1d8"/><text x="1005" y="148" text-anchor="middle">Міста й економіка</text><text x="1005" y="177" text-anchor="middle" font-size="17" font-weight="400">робота, послуги, порти</text><rect x="880" y="238" width="250" height="88" rx="22" fill="#f5e8ff"/><text x="1005" y="274" text-anchor="middle">Історія і мережі</text><text x="1005" y="303" text-anchor="middle" font-size="17" font-weight="400">шляхи, кордони, міграції</text></g><rect x="420" y="165" width="360" height="125" rx="30" fill="url(#g)" stroke="#78aebf" stroke-width="3"/><text x="600" y="215" text-anchor="middle" font-size="29" font-weight="700">Густота населення</text><text x="600" y="252" text-anchor="middle" font-size="19">просторово дуже нерівномірна</text><g stroke="#2d7188" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M320 156C380 156 380 192 420 205"/><path d="M320 282C380 282 380 260 420 248"/><path d="M880 156C820 156 820 192 780 205"/><path d="M880 282C820 282 820 260 780 248"/></g><rect x="275" y="380" width="650" height="82" rx="25" fill="#fff7ec" stroke="#efbd73" stroke-width="2"/><text x="600" y="415" text-anchor="middle" font-size="22" font-weight="700">Екологічний тиск ≠ «забагато людей»</text><text x="600" y="445" text-anchor="middle" font-size="17">Важливі також споживання, технології, нерівність, управління та вразливість екосистем.</text><path d="M600 290V376" stroke="#b27a2a" stroke-width="4" marker-end="url(#a)"/></g></svg>
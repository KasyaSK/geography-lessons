<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">Лінійний масштаб для діагностичної роботи</title><desc id="d">Лінійний масштаб із відрізками по 100 кілометрів для обчислювального завдання.</desc><rect width="960" height="260" rx="28" fill="#fbfeff"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17344c">Лінійний масштаб</text><g transform="translate(110 110)"><rect width="140" height="44" fill="#17344c"/><rect x="140" width="140" height="44" fill="#fff" stroke="#17344c" stroke-width="2"/><rect x="280" width="140" height="44" fill="#17344c"/><rect x="420" width="140" height="44" fill="#fff" stroke="#17344c" stroke-width="2"/><rect x="560" width="140" height="44" fill="#17344c"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344c" text-anchor="middle"><text x="0" y="74">0</text><text x="140" y="74">100</text><text x="280" y="74">200</text><text x="420" y="74">300</text><text x="560" y="74">400</text><text x="700" y="74">500 км</text></g><path d="M0 102H490" stroke="#ef7d4b" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="102" r="8" fill="#ef7d4b"/><circle cx="490" cy="102" r="8" fill="#ef7d4b"/><text x="245" y="132" font-family="Arial,sans-serif" font-size="17" fill="#9b4c2f" text-anchor="middle">виміряний відрізок</text></g></svg>
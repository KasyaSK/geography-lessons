<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Субдукція плити Наска під Південноамериканську плиту</title><desc id="d">Навчальна схема: океанічна плита Наска рухається на схід і занурюється під континентальну Південноамериканську плиту; над зоною субдукції формуються Анди, вулканізм і землетруси.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#f8fdff"/></linearGradient><linearGradient id="mantle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd9aa"/><stop offset="1" stop-color="#ffc58f"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9edaf"/><stop offset="1" stop-color="#8fc77b"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#136f91"/></marker></defs><rect width="1200" height="520" fill="url(#sky)"/><rect y="330" width="1200" height="190" fill="url(#mantle)"/><path d="M0 180 L420 180 L485 210 L570 248 L760 326 L1200 326 L1200 370 L720 370 L530 300 L430 255 L0 255Z" fill="#8cb7d1"/><path d="M450 182 L1200 182 L1200 326 L760 326 L700 292 L650 252 L605 224 L555 206 L500 193Z" fill="url(#land)"/><path d="M745 326 L670 282 L600 235 L530 207 L430 180 L420 255 L520 300 L690 372Z" fill="#587b92" opacity=".95"/><path d="M620 210 Q690 140 755 205 Q815 80 875 198 Q930 120 990 205 L1040 215 L1040 326 L640 326Z" fill="#7cac68"/><path d="M690 203 Q730 128 770 205" fill="none" stroke="#795b4a" stroke-width="9"/><path d="M802 190 Q845 92 888 196" fill="none" stroke="#795b4a" stroke-width="10"/><circle cx="844" cy="152" r="15" fill="#e05a47"/><path d="M840 138 C820 115 835 96 856 80 C850 108 875 115 860 143Z" fill="#f0834d"/><path d="M140 145 H380" stroke="#136f91" stroke-width="7" marker-end="url(#arrow)"/><path d="M1070 145 H935" stroke="#136f91" stroke-width="7" marker-end="url(#arrow)"/><g font-family="system-ui,sans-serif" fill="#16384d"><text x="120" y="120" font-size="28" font-weight="800">Плита Наска</text><text x="885" y="118" font-size="28" font-weight="800">Південноамериканська плита</text><text x="795" y="62" font-size="28" font-weight="900">Анди</text><text x="502" y="402" font-size="27" font-weight="800">зона субдукції</text><text x="60" y="220" font-size="24">Тихий океан</text><text x="770" y="478" font-size="23">астеносфера / верхня мантія</text></g><g fill="#e96252"><circle cx="560" cy="284" r="8"/><circle cx="602" cy="304" r="8"/><circle cx="645" cy="326" r="8"/></g><text x="470" y="455" font-family="system-ui,sans-serif" font-size="20" fill="#6a4d3d">Схема не в масштабі • напрямки й процеси показані спрощено</text></svg>
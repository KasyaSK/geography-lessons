<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Розселення населення Австралії: узбережжя та внутрішні райони</title><desc id="d">Схематичний профіль від східного узбережжя через Великий Вододільний хребет до внутрішніх посушливих районів із чинниками густоти населення.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#fff9e8"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7ccaa4"/><stop offset=".35" stop-color="#a5ce87"/><stop offset=".66" stop-color="#efc06a"/><stop offset="1" stop-color="#d99a63"/></linearGradient></defs><rect width="1000" height="430" rx="28" fill="url(#sky)"/><path d="M0 330 L100 306 175 280 230 245 285 190 340 248 420 292 520 310 620 318 730 312 820 304 920 314 1000 324 1000 430 0 430Z" fill="url(#land)"/><path d="M0 330 C120 318 200 300 285 190 C340 255 430 298 520 310" fill="none" stroke="#31596d" stroke-width="5" opacity=".5"/><rect x="0" y="330" width="78" height="100" fill="#79cfe2"/><g fill="#17455c" font-family="Arial,sans-serif"><text x="25" y="45" font-size="27" font-weight="700">Східне узбережжя → Великий Вододільний хребет → внутрішні райони</text><text x="25" y="82" font-size="18">Схема для побудови причинного пояснення, а не карта густоти населення.</text></g><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(115 150)"><circle r="28" fill="#fff" stroke="#2a8f75" stroke-width="4"/><text y="7" font-size="20" font-weight="700" fill="#1d6958">+++</text><text y="55" font-size="18" font-weight="700">великі міста</text><text y="79" font-size="15">порти • робочі місця</text></g><g transform="translate(335 110)"><circle r="28" fill="#fff" stroke="#5d8eb7" stroke-width="4"/><text y="7" font-size="20" font-weight="700" fill="#3c6d96">↑</text><text y="55" font-size="18" font-weight="700">вологіші схили</text><text y="79" font-size="15">рельєф • опади</text></g><g transform="translate(660 150)"><circle r="28" fill="#fff" stroke="#d58c42" stroke-width="4"/><text y="7" font-size="20" font-weight="700" fill="#a26124">−−</text><text y="55" font-size="18" font-weight="700">посушливий центр</text><text y="79" font-size="15">дефіцит води • великі відстані</text></g><g transform="translate(860 235)"><circle r="28" fill="#fff" stroke="#7d6bc1" stroke-width="4"/><text y="7" font-size="20" font-weight="700" fill="#6452a7">●</text><text y="55" font-size="18" font-weight="700">локальні осередки</text><text y="79" font-size="15">гірництво • транспорт • туризм</text></g></g><g fill="#17394d" font-family="Arial,sans-serif" font-size="16"><text x="22" y="405">Ключ: природні чинники важливі, але вони НЕ визначають розселення самі по собі.</text></g></svg>
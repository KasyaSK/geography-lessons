<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Ланцюг екологічного тиску в Австралії</title><desc id="d">Причинна схема: населення та господарство взаємодіють з кліматом, водою і біорізноманіттям; наслідки залежать від управління.</desc><rect width="1000" height="500" rx="30" fill="#f8fcfb"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="48" font-size="30" font-weight="700" fill="#173b4c">Не «люди = проблема», а ланцюг тиску й рішень</text><g><rect x="50" y="105" width="190" height="95" rx="20" fill="#e4f6ff" stroke="#6aa7c6" stroke-width="3"/><text x="145" y="140" font-size="20" font-weight="700" fill="#285b78">Концентрація</text><text x="145" y="168" font-size="18" fill="#285b78">міст і населення</text></g><g><rect x="300" y="105" width="190" height="95" rx="20" fill="#fff2d9" stroke="#daa655" stroke-width="3"/><text x="395" y="140" font-size="20" font-weight="700" fill="#845b18">Попит</text><text x="395" y="168" font-size="18" fill="#845b18">на землю й воду</text></g><g><rect x="555" y="105" width="190" height="95" rx="20" fill="#ffe4df" stroke="#d97767" stroke-width="3"/><text x="650" y="140" font-size="20" font-weight="700" fill="#8c3e32">Тиск</text><text x="650" y="168" font-size="18" fill="#8c3e32">на екосистеми</text></g><g><rect x="810" y="105" width="140" height="95" rx="20" fill="#eee8ff" stroke="#8170c6" stroke-width="3"/><text x="880" y="140" font-size="20" font-weight="700" fill="#58479b">Наслідок</text><text x="880" y="168" font-size="17" fill="#58479b">залежить</text></g><path d="M240 152H292M490 152H547M745 152H802" stroke="#527080" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#527080"/></marker></defs><rect x="120" y="280" width="760" height="145" rx="28" fill="#e9f8ef" stroke="#69ad80" stroke-width="3"/><text x="500" y="320" font-size="22" font-weight="700" fill="#24663a">Модератори: управління, технології, планування, охорона природи</text><text x="500" y="357" font-size="18" fill="#315e40">• очищення води • компактна забудова • біокоридори • контроль інвазивних видів</text><text x="500" y="388" font-size="18" fill="#315e40">• відновлення рослинності • пожежне менеджмент-планування • участь Traditional Owners</text><text x="500" y="463" font-size="17" fill="#5b6f78">Висновок: однакова кількість людей може давати дуже різний екологічний результат.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff4da"/></linearGradient></defs><rect width="1200" height="650" rx="34" fill="url(#bg)"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#163a50">Чому клімат Євразії такий контрастний?</text><g font-family="Arial" fill="#17384d"><rect x="70" y="130" width="250" height="120" rx="22" fill="#dff4ff" stroke="#82c7e7"/><text x="195" y="175" text-anchor="middle" font-size="26" font-weight="700">Широта</text><text x="195" y="210" text-anchor="middle" font-size="20">Арктика → екватор</text><rect x="475" y="130" width="250" height="120" rx="22" fill="#eef7dd" stroke="#9cc66c"/><text x="600" y="175" text-anchor="middle" font-size="26" font-weight="700">Океани</text><text x="600" y="210" text-anchor="middle" font-size="20">Атлантика, Індійський,</text><text x="600" y="238" text-anchor="middle" font-size="20">Тихий, Північний Льодовитий</text><rect x="880" y="130" width="250" height="120" rx="22" fill="#fff0db" stroke="#e7b367"/><text x="1005" y="175" text-anchor="middle" font-size="26" font-weight="700">Рельєф</text><text x="1005" y="210" text-anchor="middle" font-size="20">Гори блокують</text><text x="1005" y="238" text-anchor="middle" font-size="20">повітряні маси</text><path d="M320 190H455M725 190H860" stroke="#507487" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#507487"/></marker></defs><rect x="260" y="335" width="680" height="180" rx="26" fill="#fff" stroke="#bfd8e3" stroke-width="3"/><text x="600" y="382" text-anchor="middle" font-size="31" font-weight="700">Контраст температур і опадів</text><text x="600" y="425" text-anchor="middle" font-size="23">захід ↔ центр ↔ схід</text><text x="600" y="463" text-anchor="middle" font-size="23">північ ↔ південь</text><text x="600" y="501" text-anchor="middle" font-size="23">навітряний схил ↔ дощова тінь</text><path d="M195 255C210 310 370 330 470 350M600 255V330M1005 255C990 310 830 330 730 350" fill="none" stroke="#507487" stroke-width="5" marker-end="url(#a)"/><text x="600" y="590" text-anchor="middle" font-size="24" font-weight="700">Кліматичний контраст = результат взаємодії чинників, а не одного «головного» фактору</text></g></svg>
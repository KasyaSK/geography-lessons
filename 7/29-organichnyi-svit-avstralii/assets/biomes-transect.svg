<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Природні зони Австралії</title><desc id="d">Навчальний профіль природних комплексів від вологих тропіків і саван через посушливий центр до лісів та чагарників південного сходу і південного заходу.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="1200" height="560" rx="32" fill="url(#sky)"/><g font-family="Inter,Arial,sans-serif" fill="#17384b"><text x="55" y="58" font-size="30" font-weight="900">Австралія: природні зони не утворюють простих «смуг»</text><text x="55" y="92" font-size="18" fill="#597687">На них одночасно впливають широта, опади, рельєф, океан і сезонність.</text><path d="M45 390 C155 335 210 320 295 340 C385 363 430 430 520 440 C625 453 690 420 765 355 C845 286 890 275 955 315 C1020 356 1060 365 1155 330 L1155 495 L45 495Z" fill="#e7c58a"/><path d="M45 390 C155 335 210 320 295 340 C385 363 430 430 520 440" fill="none" stroke="#b58b4c" stroke-width="4"/><path d="M765 355 C845 286 890 275 955 315 C1020 356 1060 365 1155 330" fill="none" stroke="#718f78" stroke-width="4"/><g><rect x="55" y="140" width="195" height="132" rx="20" fill="#d9f3df"/><text x="152" y="175" text-anchor="middle" font-size="21" font-weight="850">Північ / пн.-схід</text><text x="152" y="207" text-anchor="middle" font-size="18">вологі тропічні ліси</text><text x="152" y="235" text-anchor="middle" font-size="18">і тропічні савани</text><text x="152" y="258" text-anchor="middle" font-size="15" fill="#587468">тепло + сезонні/рясні опади</text><rect x="300" y="180" width="205" height="132" rx="20" fill="#f8e6ad"/><text x="402" y="215" text-anchor="middle" font-size="21" font-weight="850">Внутрішня частина</text><text x="402" y="247" text-anchor="middle" font-size="18">пустелі, напівпустелі</text><text x="402" y="275" text-anchor="middle" font-size="18">спініфексові угруповання</text><text x="402" y="298" text-anchor="middle" font-size="15" fill="#7c6942">дефіцит опадів</text><rect x="555" y="120" width="220" height="132" rx="20" fill="#dcefe3"/><text x="665" y="155" text-anchor="middle" font-size="21" font-weight="850">Схід / південний схід</text><text x="665" y="187" text-anchor="middle" font-size="18">евкаліптові ліси</text><text x="665" y="215" text-anchor="middle" font-size="18">і рідколісся</text><text x="665" y="238" text-anchor="middle" font-size="15" fill="#587468">океанічна волога + гори</text><rect x="825" y="155" width="320" height="132" rx="20" fill="#eee8d1"/><text x="985" y="190" text-anchor="middle" font-size="21" font-weight="850">Південний захід / Тасманія</text><text x="985" y="222" text-anchor="middle" font-size="18">середземноморські чагарники,</text><text x="985" y="250" text-anchor="middle" font-size="18">помірні ліси й локальні рефугіуми</text><text x="985" y="274" text-anchor="middle" font-size="15" fill="#6b6652">сезонність + прохолодніші умови</text></g><g fill="#278468"><circle cx="150" cy="366" r="18"/><circle cx="190" cy="350" r="14"/><circle cx="675" cy="370" r="22"/><circle cx="720" cy="350" r="18"/><circle cx="990" cy="348" r="22"/><circle cx="1040" cy="365" r="16"/></g><g stroke="#836b3f" stroke-width="8"><path d="M150 385v45"/><path d="M190 366v40"/><path d="M675 392v50"/><path d="M720 370v55"/><path d="M990 370v48"/><path d="M1040 382v45"/></g><text x="600" y="530" text-anchor="middle" font-size="17" fill="#597687">Завдання: поясніть щонайменше один виняток із правила «природні зони змінюються лише з широтою».</text></g></svg>
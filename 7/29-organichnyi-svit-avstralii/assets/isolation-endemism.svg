<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Як формується високий ендемізм Австралії</title><desc id="d">Причинна схема: тривала ізоляція, давні лінії, різноманітність середовищ і добір ведуть до самостійної еволюції та високого ендемізму.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eefaff"/><stop offset="1" stop-color="#fff8e8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="34" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" fill="#17384b"><text x="60" y="68" font-size="30" font-weight="800">Не одна причина, а система чинників</text><g filter="url(#s)"><rect x="55" y="115" width="245" height="120" rx="24" fill="#fff"/><rect x="335" y="115" width="245" height="120" rx="24" fill="#fff"/><rect x="615" y="115" width="245" height="120" rx="24" fill="#fff"/><rect x="895" y="115" width="245" height="120" rx="24" fill="#fff"/></g><text x="178" y="157" text-anchor="middle" font-size="23" font-weight="800">Тривала ізоляція</text><text x="178" y="190" text-anchor="middle" font-size="17">менше обміну видами</text><text x="178" y="215" text-anchor="middle" font-size="17">з іншими материками</text><text x="458" y="157" text-anchor="middle" font-size="23" font-weight="800">Давні лінії</text><text x="458" y="190" text-anchor="middle" font-size="17">частина груп зберегла</text><text x="458" y="215" text-anchor="middle" font-size="17">давню еволюційну історію</text><text x="738" y="157" text-anchor="middle" font-size="23" font-weight="800">Різні середовища</text><text x="738" y="190" text-anchor="middle" font-size="17">тропіки, пустелі, ліси,</text><text x="738" y="215" text-anchor="middle" font-size="17">гори та узбережжя</text><text x="1018" y="157" text-anchor="middle" font-size="23" font-weight="800">Добір і пристосування</text><text x="1018" y="190" text-anchor="middle" font-size="17">до вологи, спеки, пожеж,</text><text x="1018" y="215" text-anchor="middle" font-size="17">харчових ресурсів</text><g stroke="#3a8fa7" stroke-width="6" fill="none" stroke-linecap="round"><path d="M178 250 C178 300 390 300 540 335"/><path d="M458 250 C458 292 535 302 570 335"/><path d="M738 250 C738 292 665 302 630 335"/><path d="M1018 250 C1018 300 810 300 660 335"/></g><path d="M600 317 l18 30 h-36z" fill="#3a8fa7"/><rect x="335" y="355" width="530" height="110" rx="28" fill="#dff6ea" stroke="#7ac8a3" stroke-width="2"/><text x="600" y="397" text-anchor="middle" font-size="25" font-weight="900" fill="#17684e">Самостійна еволюція популяцій</text><text x="600" y="432" text-anchor="middle" font-size="20">→ багато видів, які природно не трапляються більше ніде</text><text x="600" y="458" text-anchor="middle" font-size="17" fill="#527184">Ендемізм — результат історії + географії + екології</text></g></svg>
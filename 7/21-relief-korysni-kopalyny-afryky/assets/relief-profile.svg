<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Схематичний профіль рельєфу Африки</title><desc id="d">Порівняння Атлаських гір, Сахари, Ефіопського нагір’я, Східноафриканського плоскогір’я, Кіліманджаро та Драконових гір.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff5ff"/><stop offset="1" stop-color="#fff9e7"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6b36a"/><stop offset=".5" stop-color="#8bbf7c"/><stop offset="1" stop-color="#6d9b6c"/></linearGradient></defs><rect width="1200" height="620" rx="28" fill="url(#sky)"/><g font-family="Inter,Segoe UI,sans-serif" fill="#17344c"><text x="60" y="64" font-size="30" font-weight="800">Рельєф Африки: материк високих рівнин і розломів</text><text x="60" y="98" font-size="17" fill="#60798a">Схема не є картою масштабу. Вона допомагає побачити відносні висоти та зв’язки.</text></g><path d="M0 500 L80 485 145 370 210 455 330 475 440 452 520 330 600 365 680 285 730 210 760 115 795 310 900 360 1000 280 1080 340 1140 430 1200 450 L1200 620 L0 620 Z" fill="url(#land)" stroke="#4a795a" stroke-width="5"/><line x1="0" y1="500" x2="1200" y2="500" stroke="#7394a6" stroke-width="2" stroke-dasharray="8 8"/><g font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#17344c"><text x="96" y="340">Атлас</text><text x="280" y="450">Сахара</text><text x="465" y="300">Ефіопське нагір’я</text><text x="630" y="260">Східноафриканське</text><text x="650" y="285">плоскогір’я</text><text x="745" y="93">Кіліманджаро</text><text x="980" y="250">Драконові гори</text></g><g fill="#d85f49"><circle cx="760" cy="115" r="8"/><circle cx="520" cy="330" r="6"/><circle cx="1000" cy="280" r="6"/></g><g font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#60798a"><text x="735" y="137">5895 м</text><text x="70" y="548">пн.-захід</text><text x="1080" y="548">пд.-схід</text></g></svg>
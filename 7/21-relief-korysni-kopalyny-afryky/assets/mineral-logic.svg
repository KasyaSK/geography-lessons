<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Як геологічна будова пов’язана з корисними копалинами Африки</title><desc id="d">Схема: давні платформи й щити пов’язані з рудами; осадові басейни — з нафтою та газом; рифтові й магматичні зони — з металами та коштовним камінням.</desc><rect width="1200" height="620" rx="28" fill="#f7fbfe"/><g font-family="Inter,Segoe UI,sans-serif"><text x="60" y="70" font-size="31" font-weight="850" fill="#17344c">Геологічний процес → породи → ресурси</text><text x="60" y="104" font-size="17" fill="#60798a">Не правило “одна структура = одна копалина”, а модель для перевірки картою.</text></g><g font-family="Inter,Segoe UI,sans-serif"><rect x="55" y="155" width="330" height="330" rx="26" fill="#fff5dc" stroke="#efcf8a" stroke-width="3"/><text x="82" y="205" font-size="24" font-weight="850" fill="#8a5a00">Давні платформи й щити</text><text x="82" y="248" font-size="18" fill="#17344c">• кристалічні породи</text><text x="82" y="282" font-size="18" fill="#17344c">• давні магматичні процеси</text><text x="82" y="326" font-size="21" font-weight="800" fill="#b05b27">→ мідні, залізні руди</text><text x="82" y="360" font-size="21" font-weight="800" fill="#b05b27">→ золото, алмази</text><text x="82" y="425" font-size="15" fill="#60798a">Перевірте: Центральна й Південна Африка</text><rect x="435" y="155" width="330" height="330" rx="26" fill="#eaf7ff" stroke="#a9d8ed" stroke-width="3"/><text x="462" y="205" font-size="24" font-weight="850" fill="#0d6f9e">Осадові басейни</text><text x="462" y="248" font-size="18" fill="#17344c">• накопичення органічної речовини</text><text x="462" y="282" font-size="18" fill="#17344c">• поховання, тиск і час</text><text x="462" y="326" font-size="21" font-weight="800" fill="#0d6f9e">→ нафта</text><text x="462" y="360" font-size="21" font-weight="800" fill="#0d6f9e">→ природний газ</text><text x="462" y="425" font-size="15" fill="#60798a">Перевірте: Північна Африка, шельф і узбережжя</text><rect x="815" y="155" width="330" height="330" rx="26" fill="#eef9f0" stroke="#afd8b9" stroke-width="3"/><text x="842" y="205" font-size="24" font-weight="850" fill="#267348">Рифти й магматизм</text><text x="842" y="248" font-size="18" fill="#17344c">• розломи та вулканізм</text><text x="842" y="282" font-size="18" fill="#17344c">• гідротермальні процеси</text><text x="842" y="326" font-size="21" font-weight="800" fill="#267348">→ металічні руди</text><text x="842" y="360" font-size="21" font-weight="800" fill="#267348">→ коштовне каміння</text><text x="842" y="425" font-size="15" fill="#60798a">Перевірте: Східноафриканський рифт</text></g><path d="M385 320 H435 M765 320 H815" stroke="#8ba7b6" stroke-width="5" stroke-dasharray="10 9"/><text x="60" y="560" font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#7a4d38">Доказ потрібен завжди: зіставте фізичну, тектонічну та карту корисних копалин.</text></svg>
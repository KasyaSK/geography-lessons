<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Материки та океани — карта причинних зв’язків</title><desc id="d">Схема зв’язків між тектонікою, рельєфом, кліматом, водами, природними зонами, населенням та діяльністю людини.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e8f8ff"/><stop offset="1" stop-color="#fff4dc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="650" rx="34" fill="url(#g)"/><g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)"><rect x="455" y="40" width="290" height="80" rx="22" fill="#fff"/><text x="600" y="73" font-size="24" font-weight="700" fill="#164d66">Географічна оболонка</text><text x="600" y="101" font-size="17" fill="#4c7180">взаємопов’язана система</text><rect x="80" y="185" width="250" height="92" rx="20" fill="#fff"/><text x="205" y="222" font-size="22" font-weight="700" fill="#1c6380">Тектоніка</text><text x="205" y="251" font-size="16" fill="#567582">плити • спрединг • субдукція</text><rect x="475" y="185" width="250" height="92" rx="20" fill="#fff"/><text x="600" y="222" font-size="22" font-weight="700" fill="#1c6380">Клімат</text><text x="600" y="251" font-size="16" fill="#567582">широта • циркуляція • течії</text><rect x="870" y="185" width="250" height="92" rx="20" fill="#fff"/><text x="995" y="222" font-size="22" font-weight="700" fill="#1c6380">Води</text><text x="995" y="251" font-size="16" fill="#567582">річки • льодовики • океани</text><rect x="150" y="375" width="250" height="92" rx="20" fill="#fff"/><text x="275" y="412" font-size="22" font-weight="700" fill="#1b775f">Рельєф</text><text x="275" y="441" font-size="16" fill="#567582">гори • рівнини • жолоби</text><rect x="475" y="375" width="250" height="92" rx="20" fill="#fff"/><text x="600" y="412" font-size="22" font-weight="700" fill="#1b775f">Природні зони</text><text x="600" y="441" font-size="16" fill="#567582">тепло + волога + ґрунти</text><rect x="800" y="375" width="250" height="92" rx="20" fill="#fff"/><text x="925" y="412" font-size="22" font-weight="700" fill="#1b775f">Розселення</text><text x="925" y="441" font-size="16" fill="#567582">ресурси • ризики • господарство</text><rect x="455" y="540" width="290" height="74" rx="22" fill="#173f54"/><text x="600" y="572" font-size="21" font-weight="700" fill="#fff">Людина ↔ природа</text><text x="600" y="598" font-size="15" fill="#d7f6ff">вибір • вплив • відповідальність</text></g><g stroke="#4b91a7" stroke-width="4" fill="none" marker-end="url(#a)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4b91a7"/></marker></defs><path d="M520 120C420 145 310 155 225 185"/><path d="M600 120V185"/><path d="M680 120C780 145 890 155 975 185"/><path d="M225 277C230 320 245 340 275 375"/><path d="M600 277V375"/><path d="M975 277C970 320 950 340 925 375"/><path d="M400 421H475"/><path d="M725 421H800"/><path d="M600 467V540"/><path d="M900 467C830 515 760 530 690 550"/></g></svg>
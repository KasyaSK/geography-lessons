<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Широтна зональність і вертикальна поясність у Північній Америці</title><desc id="d">Навчальна схема двох механізмів зміни природних комплексів: з півночі на південь на рівнинах і знизу вгору в Кордильєрах.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient><linearGradient id="m" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#d3a56d"/><stop offset=".45" stop-color="#4f9b63"/><stop offset=".72" stop-color="#27704f"/><stop offset="1" stop-color="#eef6ff"/></linearGradient></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16384d">ДВА МЕХАНІЗМИ ЗМІНИ ПРИРОДНИХ КОМПЛЕКСІВ</text><g transform="translate(55 95)"><rect width="510" height="455" rx="26" fill="#fff" stroke="#cfe4ee" stroke-width="3"/><text x="255" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0c7490">РІВНИНА: північ → південь</text><g font-family="Arial" font-size="21" fill="#17384e"><rect x="55" y="74" width="400" height="54" rx="12" fill="#eaf5ff"/><text x="75" y="108">Арктичні пустелі</text><rect x="55" y="138" width="400" height="54" rx="12" fill="#dbeef0"/><text x="75" y="172">Тундра</text><rect x="55" y="202" width="400" height="54" rx="12" fill="#b7dbba"/><text x="75" y="236">Тайга</text><rect x="55" y="266" width="400" height="54" rx="12" fill="#d7e9ad"/><text x="75" y="300">Мішані / широколисті ліси</text><rect x="55" y="330" width="400" height="54" rx="12" fill="#efd793"/><text x="75" y="364">Прерії</text><rect x="55" y="394" width="400" height="40" rx="12" fill="#f6c789"/><text x="75" y="422">Пустелі та субтропіки</text></g><text x="255" y="450" text-anchor="middle" font-family="Arial" font-size="16" fill="#587488">Головний градієнт: широта → тепло й зволоження</text></g><g transform="translate(635 95)"><rect width="510" height="455" rx="26" fill="#fff" stroke="#cfe4ee" stroke-width="3"/><text x="255" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#7a5a13">ГОРА: підніжжя → вершина</text><path d="M65 390 L255 82 L445 390 Z" fill="url(#m)" stroke="#6d7b70" stroke-width="3"/><g font-family="Arial" font-size="18" font-weight="700" fill="#17384e"><text x="82" y="365">тепліший / сухіший пояс</text><text x="130" y="286">гірські ліси</text><text x="173" y="207">субальпійський</text><text x="208" y="136">альпійська тундра</text></g><path d="M462 374 V110" stroke="#d36c4b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d36c4b"/></marker></defs><text x="472" y="252" font-family="Arial" font-size="16" fill="#8b4d36" transform="rotate(-90 472 252)">висота ↑ температура ↓</text><text x="255" y="450" text-anchor="middle" font-family="Arial" font-size="16" fill="#587488">Головний градієнт: висота → температура, волога, експозиція</text></g><text x="600" y="588" text-anchor="middle" font-family="Arial" font-size="18" fill="#466579">Схема для перевірки гіпотез: природна зона — результат поєднання клімату, рельєфу, ґрунтів і живих організмів.</text></svg>
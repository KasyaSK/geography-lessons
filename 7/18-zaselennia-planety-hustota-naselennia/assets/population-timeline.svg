<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Населення світу: орієнтири UN WPP 2024</title><desc id="d">Навчальна інфографіка з орієнтирами 2022 8.0 млрд, 2024 8.2 млрд, 2030 8.5 млрд, середина 2080-х 10.3 млрд.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#45a6da"/><stop offset="1" stop-color="#188b78"/></linearGradient></defs><rect width="1200" height="520" rx="36" fill="#f6fbfe"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17344c">Населення світу: як читати тренд, а не лише число</text><text x="70" y="110" font-family="Arial,sans-serif" font-size="19" fill="#60798a">Орієнтири за UN World Population Prospects 2024 • значення округлено</text><line x1="100" y1="350" x2="1090" y2="350" stroke="#c8dce7" stroke-width="8" stroke-linecap="round"/><path d="M150 325 C330 305 460 290 600 260 S850 170 1035 125" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(150 325)"><circle r="17" fill="#45a6da"/><text y="-38" font-size="26" font-weight="700" fill="#17344c">8,0 млрд</text><text y="66" font-size="20" fill="#60798a">2022</text></g><g transform="translate(390 300)"><circle r="17" fill="#399fc9"/><text y="-38" font-size="26" font-weight="700" fill="#17344c">8,2 млрд</text><text y="66" font-size="20" fill="#60798a">2024</text></g><g transform="translate(610 255)"><circle r="17" fill="#2e98ab"/><text y="-38" font-size="26" font-weight="700" fill="#17344c">8,5 млрд</text><text y="66" font-size="20" fill="#60798a">2030</text></g><g transform="translate(1035 125)"><circle r="19" fill="#188b78"/><text y="-40" font-size="26" font-weight="700" fill="#17344c">≈10,3 млрд</text><text y="66" font-size="20" fill="#60798a">середина 2080-х</text></g></g><rect x="70" y="410" width="1060" height="68" rx="18" fill="#eaf8f2"/><text x="600" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176c61">Висновок: чисельність ще зростає, але глобальний темп зростання сповільнюється.</text></svg>
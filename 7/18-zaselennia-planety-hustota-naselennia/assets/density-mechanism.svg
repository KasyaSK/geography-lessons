<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Чинники розселення населення</title><desc id="d">Схема взаємодії природних та суспільних чинників, які формують нерівномірність розселення.</desc><rect width="1200" height="600" rx="36" fill="#f7fbfe"/><text x="600" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17344c">Чому населення розміщується нерівномірно?</text><g font-family="Arial,sans-serif"><g transform="translate(70 130)"><rect width="300" height="150" rx="24" fill="#e5f7ff" stroke="#9ccfe7"/><text x="150" y="48" text-anchor="middle" font-size="25" font-weight="700" fill="#176f9e">Природні чинники</text><text x="28" y="84" font-size="19" fill="#36586d">• вода і клімат</text><text x="28" y="112" font-size="19" fill="#36586d">• рельєф і ґрунти</text><text x="28" y="140" font-size="19" fill="#36586d">• природні ризики</text></g><g transform="translate(830 130)"><rect width="300" height="150" rx="24" fill="#f0ecff" stroke="#c9baf0"/><text x="150" y="48" text-anchor="middle" font-size="25" font-weight="700" fill="#6754a5">Суспільні чинники</text><text x="28" y="84" font-size="19" fill="#4d4770">• історія і міграції</text><text x="28" y="112" font-size="19" fill="#4d4770">• економіка і міста</text><text x="28" y="140" font-size="19" fill="#4d4770">• транспорт і безпека</text></g><g transform="translate(450 330)"><rect width="300" height="150" rx="28" fill="#e7fbf4" stroke="#95d8c6" stroke-width="2"/><text x="150" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#197867">Карта розселення</text><text x="150" y="92" text-anchor="middle" font-size="20" fill="#365e57">осередки густого населення</text><text x="150" y="120" text-anchor="middle" font-size="20" fill="#365e57">+ малозаселені простори</text></g><path d="M370 205 C470 220 490 290 540 330" fill="none" stroke="#6aaacb" stroke-width="7" stroke-linecap="round"/><path d="M830 205 C730 220 710 290 660 330" fill="none" stroke="#8c76c7" stroke-width="7" stroke-linecap="round"/><polygon points="538,328 518,318 526,342" fill="#6aaacb"/><polygon points="662,328 682,318 674,342" fill="#8c76c7"/><rect x="140" y="505" width="920" height="60" rx="18" fill="#fff7df" stroke="#ecd799"/><text x="600" y="543" text-anchor="middle" font-size="21" font-weight="700" fill="#705a1e">Природа впливає, але не визначає розселення самостійно: потрібен причинний механізм і кілька джерел доказів.</text></g></svg>
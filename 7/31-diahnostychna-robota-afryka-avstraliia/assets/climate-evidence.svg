<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Кліматичні дані чотирьох пунктів</title><desc id="d">Стовпчикові схеми сезонності опадів для чотирьох пунктів без назв материків.</desc><rect width="1200" height="560" rx="32" fill="#f9fcff"/><g font-family="system-ui" fill="#17344c"><text x="600" y="48" text-anchor="middle" font-size="30" font-weight="800">Кліматичні докази: прочитай сезонність, а не вгадуй</text><text x="600" y="78" text-anchor="middle" font-size="17" fill="#637b8b">Висота стовпчика = відносна кількість опадів у місяці; місяці зліва направо: I → XII</text></g><g transform="translate(55,120)" font-family="system-ui"><g><rect width="260" height="330" rx="22" fill="#fff4e7" stroke="#efc28a"/><text x="130" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#17344c">Пункт 1</text><g fill="#2f9bd1"><rect x="25" y="140" width="12" height="140"/><rect x="43" y="130" width="12" height="150"/><rect x="61" y="120" width="12" height="160"/><rect x="79" y="112" width="12" height="168"/><rect x="97" y="105" width="12" height="175"/><rect x="115" y="95" width="12" height="185"/><rect x="133" y="90" width="12" height="190"/><rect x="151" y="100" width="12" height="180"/><rect x="169" y="108" width="12" height="172"/><rect x="187" y="118" width="12" height="162"/><rect x="205" y="128" width="12" height="152"/><rect x="223" y="138" width="12" height="142"/></g><text x="130" y="310" text-anchor="middle" font-size="16" fill="#637b8b">опади протягом року</text></g><g transform="translate(285)"><rect width="260" height="330" rx="22" fill="#fff" stroke="#d7e7ef"/><text x="130" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#17344c">Пункт 2</text><g fill="#2f9bd1"><rect x="25" y="245" width="12" height="35"/><rect x="43" y="250" width="12" height="30"/><rect x="61" y="248" width="12" height="32"/><rect x="79" y="252" width="12" height="28"/><rect x="97" y="255" width="12" heigh
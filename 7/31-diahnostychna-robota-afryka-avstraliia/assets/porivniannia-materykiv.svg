<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Порівняння Африки й Австралії</title><desc id="d">Схематичний доказовий профіль двох материків: положення, рельєф, клімат, води та органічний світ.</desc><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5b5"/><stop offset="1" stop-color="#ffd0a2"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f0ff"/><stop offset="1" stop-color="#d9f7df"/></linearGradient></defs><rect width="1200" height="520" rx="32" fill="#f8fcff"/><text x="600" y="50" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="800" fill="#17344c">Доказова шпаргалка НЕ дається: використай ознаки, а не назви</text><g font-family="system-ui" fill="#17344c"><rect x="60" y="90" width="510" height="365" rx="28" fill="url(#a)" stroke="#efb56e"/><rect x="630" y="90" width="510" height="365" rx="28" fill="url(#b)" stroke="#74b7d9"/><text x="315" y="132" text-anchor="middle" font-size="25" font-weight="800">Материк A</text><text x="885" y="132" text-anchor="middle" font-size="25" font-weight="800">Материк B</text><g font-size="20"><text x="95" y="180">• перетинається екватором</text><text x="95" y="218">• великі площі тропічних широт</text><text x="95" y="256">• дуже велика річкова система</text><text x="95" y="294">• на сході — активний рифт</text><text x="95" y="332">• найвища вершина — вулкан</text><text x="95" y="370">• є екваторіальні ліси й савани</text><text x="665" y="180">• повністю в Південній півкулі</text><text x="665" y="218">• переважають тропічні широти</text><text x="665" y="256">• внутрішній стік і кріки</text><text x="665" y="294">• давня платформа, низький материк</text><text x="665" y="332">• Великий Вододільний хребет на сході</text><text x="665" y="370">• дуже високий рівень ендемізму</text></g><text x="315" y="420" text-anchor="middle" font-size="18" fill="#7b4e2c">Визнач материк лише за сукупністю доказів.</text><text x="885" y="420" text-anchor="middle" font-size="18" fill="#315f78">Одна ознака майже ніколи не достатня.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Паспорт повітряної маси</title><desc id="d">Схема визначення властивостей повітряної маси за широтою і типом поверхні формування</desc><defs><style>.h{font:800 34px system-ui;fill:#17354d}.t{font:700 24px system-ui;fill:#17354d}.s{font:600 19px system-ui;fill:#49677c}.big{font:900 28px system-ui;fill:white}.box{stroke:#bdd8e6;stroke-width:2}</style></defs><rect width="1200" height="620" rx="30" fill="#f8fcff"/><text x="600" y="58" text-anchor="middle" class="h">Паспорт повітряної маси: звідки вона прийшла?</text><g transform="translate(70,105)"><rect width="500" height="190" rx="24" fill="#eaf7ff" class="box"/><text x="250" y="42" text-anchor="middle" class="t">1. ШИРОТНА ЗОНА</text><rect x="25" y="68" width="135" height="82" rx="18" fill="#587da8"/><text x="92" y="116" text-anchor="middle" class="big">А</text><text x="92" y="174" text-anchor="middle" class="s">арктична</text><rect x="183" y="68" width="135" height="82" rx="18" fill="#63a6c8"/><text x="250" y="116" text-anchor="middle" class="big">П</text><text x="250" y="174" text-anchor="middle" class="s">помірна</text><rect x="340" y="68" width="135" height="82" rx="18" fill="#df8f4f"/><text x="407" y="116" text-anchor="middle" class="big">Т</text><text x="407" y="174" text-anchor="middle" class="s">тропічна</text><rect x="630" width="500" height="190" rx="24" fill="#fff6e8" class="box"/><text x="880" y="42" text-anchor="middle" class="t">2. ПІДСТИЛЬНА ПОВЕРХНЯ</text><rect x="680" y="68" width="180" height="82" rx="18" fill="#2389b9"/><text x="770" y="116" text-anchor="middle" class="big">М</text><text x="770" y="174" text-anchor="middle" class="s">морська → вологіша</text><rect x="900" y="68" width="180" height="82" rx="18" fill="#bc8449"/><text x="990" y="116" text-anchor="middle" class="big">К</text><text x="990" y="174" text-anchor="middle" class="s">континентальна → сухіша</text></g><g transform="translate(70,335)"><rect width="1060" height="205" rx="24" fill="#eefaf5" class="box"/><text x="530" y="44" text-anchor="middle" class="t">3. ВЛАСТИВОСТІ ПЕРЕНОСЯТЬСЯ РАЗОМ ІЗ ПОВІТРЯМ</text><text x="60" y="90" class="s">• Температура залежить насамперед від широти району формування.</text><text x="60" y="128" class="s">• Вологість значною мірою залежить від того, формувалася маса над океаном чи суходолом.</text><text x="60" y="166" class="s">• Після переміщення повітряна маса змінюється, але певний час зберігає характерні властивості.</text></g></svg>
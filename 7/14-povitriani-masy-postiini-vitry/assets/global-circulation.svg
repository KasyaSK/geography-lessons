<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Схема загальної циркуляції атмосфери</title><desc id="d">Пояси тиску, клітини циркуляції та постійні вітри в обох півкулях</desc><defs><linearGradient id="sky" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff8e9"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1976a8"/></marker><style>.t{font:700 24px system-ui;fill:#17354d}.s{font:600 17px system-ui;fill:#45677d}.n{font:800 18px system-ui;fill:#fff}.belt{stroke:#17354d;stroke-width:2}.arrow{fill:none;stroke:#1976a8;stroke-width:6;marker-end:url(#arr)}.cell{fill:none;stroke:#7b5ca7;stroke-width:4;stroke-dasharray:10 8}</style></defs><rect width="1200" height="620" rx="28" fill="url(#sky)"/><text x="600" y="42" text-anchor="middle" class="t">Загальна циркуляція атмосфери: модель, а не миттєва погода</text><g transform="translate(70,80)"><rect x="0" y="0" width="1060" height="52" rx="18" fill="#5d83b2" class="belt"/><text x="530" y="34" text-anchor="middle" class="n">90° пн. ш. • полярний максимум тиску</text><rect x="0" y="78" width="1060" height="52" rx="18" fill="#76b6d4" class="belt"/><text x="530" y="112" text-anchor="middle" class="n">≈60° пн. ш. • субполярний мінімум</text><rect x="0" y="156" width="1060" height="52" rx="18" fill="#e6b55e" class="belt"/><text x="530" y="190" text-anchor="middle" class="n">≈30° пн. ш. • субтропічний максимум</text><rect x="0" y="234" width="1060" height="52" rx="18" fill="#df6e55" class="belt"/><text x="530" y="268" text-anchor="middle" class="n">0° • екваторіальний мінімум / ITCZ</text><rect x="0" y="312" width="1060" height="52" rx="18" fill="#e6b55e" class="belt"/><text x="530" y="346" text-anchor="middle" class="n">≈30° пд. ш. • субтропічний максимум</text><rect x="0" y="390" width="1060" height="52" rx="18" fill="#76b6d4" class="belt"/><text x="530" y="424" text-anchor="middle" class="n">≈60° пд. ш. • субполярний мінімум</text><rect x="0" y="468" width="1060" height="52" rx="18" fill="#5d83b2" class="belt"/><text x="530" y="502" text-anchor="middle" class="n">90° пд. ш. • полярний максимум тиску</text><path d="M180 156 C250 120 300 120 365 78" class="arrow"/><text x="210" y="145" class="s">західні</text><path d="M880 156 C810 190 760 210 700 234" class="arrow"/><text x="788" y="220" class="s">пн.-сх. пасати</text><path d="M880 364 C810 330 760 310 700 286" class="arrow"/><text x="755" y="332" class="s">пд.-сх. пасати</text><path d="M180 390 C250 425 300 430 365 468" class="arrow"/><text x="210" y="417" class="s">західні</text><path d="M840 0 C780 35 740 45 690 78" class="arrow"/><text x="745" y="42" class="s">полярні східні</text><path d="M840 520 C780 485 740 470 690 442" class="arrow"/><text x="735" y="490" class="s">полярні східні</text><path d="M130 234 C70 205 70 185 130 156 C190 127 190 107 130 78" class="cell"/><path d="M130 312 C70 340 70 360 130 390 C190 418 190 438 130 468" class="cell"/></g></svg>
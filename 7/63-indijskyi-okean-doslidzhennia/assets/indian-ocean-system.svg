<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Система природних чинників Індійського океану</title><desc id="d">Схема показує зв’язки між положенням океану, мусонами, течіями, рельєфом дна, ресурсами та екологічними ризиками.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e4f8ff"/><stop offset="1" stop-color="#fff3d9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="36" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#16384c">Індійський океан: не набір фактів, а система</text><g font-family="Arial,sans-serif" fill="#17384a" text-anchor="middle" filter="url(#s)"><rect x="410" y="105" width="380" height="90" rx="24" fill="#fff" stroke="#74c7df" stroke-width="3"/><text x="600" y="143" font-size="23" font-weight="700">Положення між Африкою, Азією,</text><text x="600" y="174" font-size="23" font-weight="700">Австралією та Південним океаном</text><rect x="70" y="270" width="280" height="105" rx="24" fill="#fff" stroke="#f2b84b" stroke-width="3"/><text x="210" y="311" font-size="24" font-weight="700">Мусони</text><text x="210" y="344" font-size="19">сезонна зміна вітрів</text><rect x="460" y="270" width="280" height="105" rx="24" fill="#fff" stroke="#37aa88" stroke-width="3"/><text x="600" y="311" font-size="24" font-weight="700">Рельєф дна</text><text x="600" y="344" font-size="19">хребти, жолоби, спрединг</text><rect x="850" y="270" width="280" height="105" rx="24" fill="#fff" stroke="#8f7ad8" stroke-width="3"/><text x="990" y="311" font-size="24" font-weight="700">Течії</text><text x="990" y="344" font-size="19">переносять тепло й поживні речовини</text><rect x="150" y="455" width="360" height="100" rx="24" fill="#fff" stroke="#5aaed6" stroke-width="3"/><text x="330" y="495" font-size="23" font-weight="700">Ресурси й життя</text><text x="330" y="528" font-size="18">риба • шельф • судноплавство • корали</text><rect x="690" y="455" width="360" height="100" rx="24" fill="#fff" stroke="#e27468" stroke-width="3"/><text x="870" y="495" font-size="23" font-weight="700">Екологічні ризики</text><text x="870" y="528" font-size="18">перелов • нафта • пластик • потепління</text></g><g stroke="#467b94" stroke-width="4" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#467b94"/></marker></defs><path d="M520 195 C430 225 330 235 250 270"/><path d="M600 195 V270"/><path d="M680 195 C770 225 870 235 950 270"/><path d="M250 375 C260 415 290 435 330 455"/><path d="M600 375 C560 420 470 445 430 455"/><path d="M950 375 C940 410 915 435 880 455"/><path d="M740 322 C825 355 840 410 850 455"/></g></svg>
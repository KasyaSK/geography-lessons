<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Кліматичний паспорт Євразії</title><desc id="d">Схема переходу від кліматичного поясу до типу клімату через температуру, опади, сезонність, континентальність і рельєф</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf9ff"/><stop offset="1" stop-color="#fff4dc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1200" height="560" rx="34" fill="url(#bg)"/><text x="60" y="78" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#15394f">Як читати «музей кліматів» Євразії</text><text x="60" y="116" font-family="system-ui,sans-serif" font-size="22" fill="#527083">Пояс задає широтну основу. Тип клімату уточнює, як її змінюють океан, циркуляція і рельєф.</text><g filter="url(#s)" font-family="system-ui,sans-serif"><rect x="58" y="170" width="220" height="260" rx="24" fill="#fff"/><text x="84" y="214" font-size="25" font-weight="800" fill="#0b79b7">1. ПОЯС</text><text x="84" y="260" font-size="20" fill="#274d63">• арктичний</text><text x="84" y="296" font-size="20" fill="#274d63">• субарктичний</text><text x="84" y="332" font-size="20" fill="#274d63">• помірний</text><text x="84" y="368" font-size="20" fill="#274d63">• субтропічний</text><text x="84" y="404" font-size="20" fill="#274d63">• тропічний → екват.</text><rect x="338" y="170" width="240" height="260" rx="24" fill="#fff"/><text x="364" y="214" font-size="25" font-weight="800" fill="#16826e">2. ТЕМПЕРАТУРА</text><text x="364" y="268" font-size="20" fill="#274d63">рівень тепла</text><text x="364" y="304" font-size="20" fill="#274d63">річна амплітуда</text><text x="364" y="340" font-size="20" fill="#274d63">зима ↔ літо</text><text x="364" y="376" font-size="20" fill="#274d63">роль висоти</text><rect x="638" y="170" width="240" height="260" rx="24" fill="#fff"/><text x="664" y="214" font-size="25" font-weight="800" fill="#c67b10">3. ОПАДИ</text><text x="664" y="268" font-size="20" fill="#274d63">скільки?</text><text x="664" y="304" font-size="20" fill="#274d63">коли?</text><text x="664" y="340" font-size="20" fill="#274d63">звідки волога?</text><text x="664" y="376" font-size="20" fill="#274d63">дощова тінь?</text><rect x="938" y="170" width="204" height="260" rx="24" fill="#fff"/><text x="964" y="214" font-size="25" font-weight="800" fill="#8a55b8">4. ТИП</text><text x="964" y="266" font-size="20" fill="#274d63">морський</text><text x="964" y="302" font-size="20" fill="#274d63">континентальний</text><text x="964" y="338" font-size="20" fill="#274d63">мусонний</text><text x="964" y="374" font-size="20" fill="#274d63">середземноморський</text></g><g stroke="#6f8d9e" stroke-width="5" fill="none" stroke-linecap="round"><path d="M278 300h45"/><path d="M578 300h45"/><path d="M878 300h45"/></g><g fill="#6f8d9e"><path d="M323 300l-16-10v20z"/><path d="M623 300l-16-10v20z"/><path d="M923 300l-16-10v20z"/></g><text x="60" y="500" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#15394f">Ключ: одна широта ≠ один клімат. Порівнюйте не назви, а набір доказів.</text></svg>
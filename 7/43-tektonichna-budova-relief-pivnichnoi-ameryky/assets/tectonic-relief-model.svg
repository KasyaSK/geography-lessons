<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Північна Америка: тектонічна будова і рельєф</title><desc id="d">Навчальна модель: західні Кордильєри, центральні рівнини, Канадський щит і Аппалачі.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#fffaf0"/></linearGradient><linearGradient id="cord" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#b98f61"/><stop offset="1" stop-color="#6c5540"/></linearGradient></defs><rect width="1200" height="650" fill="url(#sky)"/><path d="M0 430 L70 330 120 385 170 250 225 355 285 205 335 335 395 280 450 430Z" fill="url(#cord)"/><path d="M430 430 Q560 380 720 405 Q840 420 920 390 L920 505 L430 505Z" fill="#d8c77a"/><path d="M720 405 Q790 330 860 360 Q900 270 960 340 L980 470 L760 470Z" fill="#8fae9f"/><path d="M930 390 Q980 330 1020 370 Q1065 300 1105 355 Q1140 325 1200 390 L1200 500 L930 500Z" fill="#9d8b71"/><path d="M0 505 H1200" stroke="#32637d" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#17384e"><text x="35" y="90" font-size="34" font-weight="700">ЗАХІД</text><text x="930" y="90" font-size="34" font-weight="700">СХІД</text><text x="80" y="560" font-size="30" font-weight="700">Кордильєри</text><text x="470" y="560" font-size="30" font-weight="700">Великі й Центральні рівнини</text><text x="765" y="300" font-size="25" font-weight="700">Канадський щит</text><text x="980" y="560" font-size="30" font-weight="700">Аппалачі</text><text x="70" y="135" font-size="22">молоді складчасті області, активна окраїна</text><text x="735" y="135" font-size="22">давня платформа + старі складчасті споруди</text></g><g stroke="#d95f66" stroke-width="8" fill="none"><path d="M110 150 C130 190 150 205 175 230"/><path d="M255 135 C275 175 292 188 315 218"/></g><g fill="#d95f66"><circle cx="110" cy="150" r="8"/><circle cx="255" cy="135" r="8"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#8c3d42"><text x="32" y="185">землетруси</text><text x="235" y="120">вулканізм</text></g><g font-family="Arial,sans-serif" font-size="20" fill="#17384e"><text x="45" y="615">Модель спрощена: перевіряйте її фізичною й тектонічною картами.</text></g></svg>
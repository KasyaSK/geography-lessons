<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><defs><linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff7ff"/><stop offset="1" stop-color="#e8fff1"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="36" fill="url(#o)"/><text x="60" y="78" font-family="Arial" font-size="34" font-weight="700" fill="#123b55">Тихий океан: система причин і наслідків</text><g font-family="Arial" font-size="23" fill="#16384c" text-anchor="middle"><g filter="url(#s)"><rect x="55" y="145" width="250" height="125" rx="24" fill="#fff"/><text x="180" y="190" font-weight="700">Рух літосферних</text><text x="180" y="222">плит</text><text x="180" y="252" font-size="18" fill="#4a7188">субдукція • спрединг</text></g><path d="M305 208H430" stroke="#2993c4" stroke-width="6" marker-end="url(#a)"/><g filter="url(#s)"><rect x="430" y="145" width="300" height="125" rx="24" fill="#fff"/><text x="580" y="190" font-weight="700">Жолоби, дуги,</text><text x="580" y="222">вулкани, землетруси</text><text x="580" y="252" font-size="18" fill="#4a7188">«Вогняне кільце»</text></g><path d="M730 208H855" stroke="#2993c4" stroke-width="6"/><g filter="url(#s)"><rect x="855" y="145" width="290" height="125" rx="24" fill="#fff"/><text x="1000" y="190" font-weight="700">Острови й</text><text x="1000" y="222">унікальні екосистеми</text><text x="1000" y="252" font-size="18" fill="#4a7188">дуги • вулканічні острови</text></g><g filter="url(#s)"><rect x="125" y="365" width="285" height="140" rx="24" fill="#fff"/><text x="268" y="410" font-weight="700">Течії + широта</text><text x="268" y="444">+ глибина</text><text x="268" y="480" font-size="18" fill="#4a7188">температура • солоність</text></g><path d="M410 435H515" stroke="#2fae80" stroke-width="6"/><g filter="url(#s)"><rect x="515" y="365" width="290" height="140" rx="24" fill="#fff"/><text x="660" y="410" font-weight="700">Продуктивність</text><text x="660" y="444">океану</text><text x="660" y="480" font-size="18" fill="#4a7188">апвелінг • планктон • риба</text></g><path d="M805 435H910" stroke="#2fae80" stroke-width="6"/><g filter="url(#s)"><rect x="910" y="365" width="235" height="140" rx="24" fill="#fff"/><text x="1028" y="410" font-weight="700">Освоєння</text><text x="1028" y="444">ресурсів</text><text x="1028" y="480" font-size="18" fill="#4a7188">і екологічний тиск</text></g></g><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="18" fill="#557a8e">Думайте ланцюжками: процес → географічний об’єкт → ресурс → ризик → доказ</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Причинна модель природи Антарктиди</title><desc id="d">Схема зв’язків між полярним положенням, високим льодовиковим щитом, альбедо, сухістю, катабатичними вітрами, льодом, оазисами та життям.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f8ff"/><stop offset="1" stop-color="#fff7e6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2c779a"/></marker></defs><rect width="1200" height="650" rx="36" fill="url(#bg)"/><g font-family="Arial,sans-serif" fill="#17384e"><text x="60" y="68" font-size="34" font-weight="700">Антарктида як система: причина → процес → наслідок</text><g filter="url(#s)"><rect x="55" y="130" width="260" height="110" rx="24" fill="#fff"/><rect x="470" y="130" width="260" height="110" rx="24" fill="#fff"/><rect x="885" y="130" width="260" height="110" rx="24" fill="#fff"/><rect x="55" y="380" width="260" height="120" rx="24" fill="#fff"/><rect x="470" y="380" width="260" height="120" rx="24" fill="#fff"/><rect x="885" y="380" width="260" height="120" rx="24" fill="#fff"/></g><g font-size="24" font-weight="700" text-anchor="middle"><text x="185" y="174">Полярне положення</text><text x="185" y="207">+ полярна ніч</text><text x="600" y="174">Високий льодовиковий</text><text x="600" y="207">щит + високе альбедо</text><text x="1015" y="174">Дуже холодне</text><text x="1015" y="207">і сухе повітря</text><text x="185" y="425">Холодне щільне повітря</text><text x="185" y="458">стікає зі схилів</text><text x="600" y="425">Катабатичні вітри</text><text x="600" y="458">+ снігова ерозія</text><text x="1015" y="420">Крижана пустеля</text><text x="1015" y="454">але локально — оазиси</text><text x="1015" y="482">й осередки життя</text></g><g stroke="#2c779a" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M315 185 H450"/><path d="M730 185 H865"/><path d="M1015 240 V345"/><path d="M185 240 V345"/><path d="M315 440 H450"/><path d="M730 440 H865"/></g><text x="600" y="590" font-size="22" text-anchor="middle" fill="#56798e">Висновок: «холодна» ≠ «однорідна». Природа залежить від рельєфу, льоду, вітру, води та локальних умов.</text></g></svg>
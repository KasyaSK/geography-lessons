<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Схема порівняння океанів</title><desc id="d">Навчальна схема з чотирма океанами та ключовими процесами.</desc><rect width="900" height="620" rx="30" fill="#f4fbff"/><text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17384b">Природа океанів: карта доказів</text><g font-family="Arial,sans-serif"><rect x="70" y="105" width="340" height="175" rx="24" fill="#dff4ff" stroke="#91cfe5"/><text x="95" y="145" font-size="24" font-weight="700" fill="#0d6f98">Тихий океан</text><text x="95" y="183" font-size="18" fill="#17384b">• найбільший і найглибший</text><text x="95" y="215" font-size="18" fill="#17384b">• жолоби + субдукція</text><text x="95" y="247" font-size="18" fill="#17384b">• «Вогняне кільце»</text><rect x="490" y="105" width="340" height="175" rx="24" fill="#e8f8ef" stroke="#9ad1b5"/><text x="515" y="145" font-size="24" font-weight="700" fill="#237b5f">Атлантичний океан</text><text x="515" y="183" font-size="18" fill="#17384b">• серединний хребет</text><text x="515" y="215" font-size="18" fill="#17384b">• спрединг</text><text x="515" y="247" font-size="18" fill="#17384b">• Саргасове море, течії</text><rect x="70" y="330" width="340" height="175" rx="24" fill="#fff2d9" stroke="#e4c583"/><text x="95" y="370" font-size="24" font-weight="700" fill="#9b6b12">Індійський океан</text><text x="95" y="408" font-size="18" fill="#17384b">• мусонна циркуляція</text><text x="95" y="440" font-size="18" fill="#17384b">• хребти + субдукція</text><text x="95" y="472" font-size="18" fill="#17384b">• ресурси й ризики</text><rect x="490" y="330" width="340" height="175" rx="24" fill="#eeeaff" stroke="#b7abe7"/><text x="515" y="370" font-size="24" font-weight="700" fill="#6650b5">Південний океан</text><text x="515" y="408" font-size="18" fill="#17384b">• навколо Антарктиди</text><text x="515" y="440" font-size="18" fill="#17384b">• циркумполярна течія</text><text x="515" y="472" font-size="18" fill="#17384b">• морський лід + екосистеми</text><path d="M410 192h80M410 418h80" stroke="#6b8fa1" stroke-width="4" stroke-dasharray="8 8"/><text x="450" y="555" text-anchor="middle" font-size="20" font-weight="700" fill="#17384b">Положення + тектоніка + циркуляція + ресурси + людина → унікальність океану</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Водна система Північної Америки</title><desc id="d">Схема басейнів стоку, Міссісіпі, Великих озер та Ніагарського водоспаду</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#e7f7ff"/><stop offset="1" stop-color="#fff8dc"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1676a6"/></marker></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#12364d">Вода як система: рельєф → басейн → режим → використання</text><g font-family="Arial" fill="#12364d"><rect x="70" y="130" width="290" height="120" rx="24" fill="#fff" stroke="#a8d7ea" stroke-width="3"/><text x="105" y="180" font-size="28" font-weight="700">Кордильєри</text><text x="105" y="216" font-size="22">головний вододіл</text><rect x="455" y="130" width="290" height="120" rx="24" fill="#fff" stroke="#a8d7ea" stroke-width="3"/><text x="500" y="180" font-size="28" font-weight="700">Центр материка</text><text x="500" y="216" font-size="22">басейн Міссісіпі</text><rect x="840" y="130" width="290" height="120" rx="24" fill="#fff" stroke="#a8d7ea" stroke-width="3"/><text x="885" y="180" font-size="28" font-weight="700">Схід</text><text x="885" y="216" font-size="22">Великі озера</text><path d="M360 190 H445" stroke="#1676a6" stroke-width="6" marker-end="url(#a)"/><path d="M745 190 H830" stroke="#1676a6" stroke-width="6" marker-end="url(#a)"/><rect x="170" y="340" width="260" height="120" rx="24" fill="#eefaff" stroke="#8bc5dd" stroke-width="3"/><text x="210" y="390" font-size="27" font-weight="700">Тихий океан</text><text x="210" y="428" font-size="21">короткі гірські річки</text><rect x="470" y="340" width="260" height="120" rx="24" fill="#eefaff" stroke="#8bc5dd" stroke-width="3"/><text x="500" y="390" font-size="27" font-weight="700">Мексиканська затока</text><text x="510" y="428" font-size="21">Міссісіпі → дельта</text><rect x="770" y="340" width="260" height="120" rx="24" fill="#eefaff" stroke="#8bc5dd" stroke-width="3"/><text x="810" y="390" font-size="27" font-weight="700">Атлантика</text><text x="800" y="428" font-size="21">Св. Лаврентія</text><path d="M240 250 Q230 300 290 330" fill="none" stroke="#1676a6" stroke-width="5" marker-end="url(#a)"/><path d="M600 250 V330" stroke="#1676a6" stroke-width="5" marker-end="url(#a)"/><path d="M980 250 Q980 300 900 330" fill="none" stroke="#1676a6" stroke-width="5" marker-end="url(#a)"/><rect x="260" y="540" width="680" height="100" rx="24" fill="#fff" stroke="#f1c56b" stroke-width="3"/><text x="315" y="585" font-size="27" font-weight="700">Великі озера → Ніагара → Онтаріо → р. Св. Лаврентія</text><text x="390" y="620" font-size="21">єдина зв’язана водна система, а не п’ять ізольованих озер</text></g></svg>
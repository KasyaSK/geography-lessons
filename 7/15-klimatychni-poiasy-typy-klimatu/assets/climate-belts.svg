<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Кліматичні пояси Землі</title><desc id="d">Навчальна схема симетричного розміщення кліматичних поясів від екватора до полюсів.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#fff8e8"/></linearGradient></defs><rect width="1200" height="640" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17354d"><text x="600" y="46" font-size="28" font-weight="700">Кліматичні пояси: симетрія щодо екватора</text><text x="600" y="82" font-size="16">Межі на реальній карті хвилясті: їх змінюють океани, течії, рельєф і континентальність.</text></g><g transform="translate(110 110)"><rect x="0" y="0" width="980" height="420" rx="210" fill="#d9eef7" stroke="#7ba9bd" stroke-width="3"/><rect x="18" y="18" width="944" height="50" rx="24" fill="#c8e7f5"/><rect x="18" y="68" width="944" height="56" fill="#dfe9c8"/><rect x="18" y="124" width="944" height="58" fill="#f8e6a9"/><rect x="18" y="182" width="944" height="56" fill="#f7c77b"/><rect x="18" y="238" width="944" height="58" fill="#f8e6a9"/><rect x="18" y="296" width="944" height="56" fill="#dfe9c8"/><rect x="18" y="352" width="944" height="50" rx="24" fill="#c8e7f5"/><line x1="18" y1="210" x2="962" y2="210" stroke="#d04444" stroke-width="3" stroke-dasharray="10 8"/><g font-family="Arial,sans-serif" font-size="18" fill="#17354d" font-weight="700"><text x="490" y="50">Арктичний / антарктичний</text><text x="490" y="104">Субарктичний / субантарктичний</text><text x="490" y="160">Помірний</text><text x="490" y="205">Тропічний / субекваторіальний перехід</text><text x="490" y="230" fill="#a22">ЕКВАТОР</text><text x="490" y="274">Тропічний / субекваторіальний перехід</text><text x="490" y="330">Помірний</text><text x="490" y="384">Субарктичний / субантарктичний</text></g></g><g font-family="Arial,sans-serif" fill="#60798a" font-size="15"><text x="88" y="138">90° пн.</text><text x="88" y="325">0°</text><text x="88" y="520">90° пд.</text><text x="600" y="595" text-anchor="middle">Схема для аналізу закономірності, а не точна картографічна межа.</text></g></svg>
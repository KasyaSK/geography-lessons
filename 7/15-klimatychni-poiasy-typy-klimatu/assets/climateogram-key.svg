<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Як читати кліматограму</title><desc id="d">Навчальна схема: температура, опади, амплітуда, сезонність і висновок про тип клімату.</desc><rect width="1200" height="620" rx="28" fill="#f8fcff"/><g font-family="Arial,sans-serif" fill="#17354d"><text x="70" y="70" font-size="32" font-weight="700">Кліматограма = температура + опади + сезонність</text><text x="70" y="105" font-size="17" fill="#60798a">Не вгадуйте пояс за однією ознакою — збирайте пакет доказів.</text></g><g transform="translate(70 150)"><rect width="1060" height="360" rx="24" fill="#fff" stroke="#d5e8f2" stroke-width="2"/><line x1="85" y1="290" x2="980" y2="290" stroke="#8aa8b8" stroke-width="2"/><line x1="85" y1="50" x2="85" y2="290" stroke="#8aa8b8" stroke-width="2"/><g fill="#72b5da"><rect x="120" y="185" width="42" height="105" rx="5"/><rect x="190" y="170" width="42" height="120" rx="5"/><rect x="260" y="150" width="42" height="140" rx="5"/><rect x="330" y="115" width="42" height="175" rx="5"/><rect x="400" y="95" width="42" height="195" rx="5"/><rect x="470" y="70" width="42" height="220" rx="5"/><rect x="540" y="75" width="42" height="215" rx="5"/><rect x="610" y="90" width="42" height="200" rx="5"/><rect x="680" y="120" width="42" height="170" rx="5"/><rect x="750" y="145" width="42" height="145" rx="5"/><rect x="820" y="165" width="42" height="125" rx="5"/><rect x="890" y="180" width="42" height="110" rx="5"/></g><polyline points="141,220 211,210 281,190 351,160 421,130 491,110 561,105 631,115 701,145 771,175 841,205 911,220" fill="none" stroke="#ec6b4e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif" font-size="15" fill="#60798a"><text x="120" y="320">С</text><text x="190" y="320">Л</text><text x="260" y="320">Б</text><text x="330" y="320">К</text><text x="400" y="320">Т</text><text x="470" y="320">Ч</text><text x="540" y="320">Л</text><text x="610" y="320">С</text><text x="680" y="320">В</text><text x="750" y="320">Ж</text><text x="820" y="320">Л</text><text x="890" y="320">Г</text></g><g font-family="Arial,sans-serif" font-size="17" font-weight="700"><text x="110" y="35" fill="#ec6b4e">Лінія — температура, °C</text><text x="720" y="35" fill="#368ab8">Стовпчики — опади, мм</text></g></g><g font-family="Arial,sans-serif" font-size="18" fill="#17354d"><text x="75" y="555"><tspan font-weight="700">1.</tspan> Знайдіть найтепліший і найхолодніший місяць → амплітуда.</text><text x="75" y="585"><tspan font-weight="700">2.</tspan> Оцініть річну суму та сезонність опадів → сухий/вологий сезон.</text><text x="635" y="555"><tspan font-weight="700">3.</tspan> Визначте півкулю за сезоном максимуму температур.</text><text x="635" y="585"><tspan font-weight="700">4.</tspan> Лише тоді формулюйте висновок про пояс і тип клімату.</text></g></svg>
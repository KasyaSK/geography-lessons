<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Південна Америка: карта доказів</title><desc id="d">Узагальнювальна схема рельєфу, вод, клімату й розселення</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#fff3df"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".15"/></filter></defs><rect width="900" height="520" rx="30" fill="url(#bg)"/><g filter="url(#s)"><path d="M431 61C384 75 348 105 331 148c-17 43-45 66-66 102-18 31-17 71 7 98 24 28 50 47 68 80 13 24 31 40 55 31 22-8 38-31 52-52 17-25 37-43 54-68 18-28 27-63 35-97 8-38 12-80-8-114-20-35-57-57-97-67z" fill="#f2dfab" stroke="#2f6577" stroke-width="4"/><path d="M352 107c-24 59-38 110-44 166-4 39 2 83 28 123" fill="none" stroke="#925f47" stroke-width="18" stroke-linecap="round"/><path d="M388 135c48 26 70 58 82 100 9 31 2 60-11 91" fill="none" stroke="#50a977" stroke-width="42" stroke-linecap="round" opacity=".72"/><path d="M387 152c42 18 70 35 104 63" fill="none" stroke="#2d8bc4" stroke-width="8" stroke-linecap="round"/><circle cx="387" cy="152" r="8" fill="#1e6e9d"/><circle cx="493" cy="215" r="8" fill="#1e6e9d"/></g><g font-family="Inter,Arial,sans-serif" fill="#17344c"><text x="58" y="70" font-size="28" font-weight="800">КАРТА ДОКАЗІВ</text><text x="58" y="102" font-size="17">Не шукайте одну «правильну картинку» — зіставляйте шари.</text><g font-size="18" font-weight="700"><text x="580" y="130">Анди → молоді гори, вулканізм</text><text x="580" y="185">Амазонія → низовина + вологість</text><text x="580" y="240">Амазонка → стік до Атлантики</text><text x="580" y="295">Захід → бар’єр Анд, Атакама</text><text x="580" y="350">Узбережжя й міста → густіше</text></g><g font-size="15"><rect x="548" y="112" width="20" height="20" rx="6" fill="#925f47"/><rect x="548" y="167" width="20" height="20" rx="6" fill="#50a977"/><rect x="548" y="222" width="20" height="20" rx="6" fill="#2d8bc4"/><rect x="548" y="277" width="20" height="20" rx="6" fill="#e5b064"/><rect x="548" y="332" width="20" height="20" rx="6" fill="#7f72c9"/></g><text x="58" y="480" font-size="15">Схема не замінює атлас: використовуйте її як підказку для причинно-наслідкових зв’язків.</text></g></svg>
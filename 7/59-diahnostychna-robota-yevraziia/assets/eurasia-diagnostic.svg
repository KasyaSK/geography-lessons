<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Карта-схема доказів Євразії</title><desc id="d">Схематичні зони для діагностичної роботи: Європа, Сибір, Центральна, Південна та Східна Азія, Гімалаї.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f8ff"/><stop offset="1" stop-color="#fff3dc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".13"/></filter></defs><rect width="1200" height="650" rx="36" fill="url(#bg)"/><g filter="url(#s)" stroke="#1d627e" stroke-width="3"><path fill="#bfe3a5" d="M115 245l70-95 160-45 120 35 95 75-25 85-110 45-55 95-150-10-85-85z"/><path fill="#dfeab1" d="M455 150l230-60 225 35 120 80-35 95-180 5-145 85-145-55 20-90z"/><path fill="#f1cf86" d="M480 330l175-35 135 70-45 95-170 35-115-75z"/><path fill="#efb997" d="M650 430l120-65 105 50 10 100-130 55-105-65z"/><path fill="#95d1b4" d="M820 310l155-50 100 55-40 115-145 20-95-60z"/><path fill="#c9bddf" d="M640 390l170-25 40 35-75 55-130 5z"/></g><g font-family="system-ui,sans-serif" fill="#17384b" font-weight="800"><text x="220" y="235" font-size="30">Європа</text><text x="690" y="190" font-size="30">Сибір</text><text x="535" y="385" font-size="25">Центральна Азія</text><text x="700" y="500" font-size="25">Південна Азія</text><text x="880" y="355" font-size="25">Східна Азія</text><text x="690" y="425" font-size="20">Гімалаї</text></g><g font-family="system-ui,sans-serif" font-size="18" fill="#375f70"><text x="65" y="605">Схема не замінює карту. Для відповідей використовуйте OpenStreetMap та власні знання.</text></g></svg>
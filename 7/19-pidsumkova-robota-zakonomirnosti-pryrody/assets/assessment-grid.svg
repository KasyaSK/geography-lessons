<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Матриця доказів до підсумкової роботи</title><desc id="d">Схема зв'язків: літосфера, рельєф, клімат, води, природні комплекси, населення.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#e9fff4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".10"/></filter></defs><rect width="1200" height="560" rx="34" fill="#f7fcff"/><text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#17344c">Підсумкова робота №19 • матриця доказів</text><text x="60" y="110" font-family="Inter,Arial,sans-serif" font-size="18" fill="#60798a">Не підказка до відповідей: це карта тем, які потрібно пов’язувати причинно.</text><g filter="url(#s)" font-family="Inter,Arial,sans-serif"><rect x="55" y="165" width="230" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="170" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Літосфера</text><text x="170" y="240" text-anchor="middle" font-size="16" fill="#526f80">плити • структури</text><rect x="355" y="165" width="230" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="470" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Рельєф</text><text x="470" y="240" text-anchor="middle" font-size="16" fill="#526f80">гори • рівнини</text><rect x="655" y="165" width="230" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="770" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Клімат</text><text x="770" y="240" text-anchor="middle" font-size="16" fill="#526f80">радіація • циркуляція</text><rect x="955" y="165" width="190" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="1050" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Води</text><text x="1050" y="240" text-anchor="middle" font-size="16" fill="#526f80">океан • маси</text><rect x="250" y="365" width="290" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="395" y="408" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Природні комплекси</text><text x="395" y="440" text-anchor="middle" font-size="16" fill="#526f80">зональні • азональні</text><rect x="660" y="365" width="290" height="110" rx="22" fill="url(#g)" stroke="#b9dce9"/><text x="805" y="408" text-anchor="middle" font-size="22" font-weight="800" fill="#0d6f9c">Населення</text><text x="805" y="440" text-anchor="middle" font-size="16" fill="#526f80">густота • розселення</text></g><g stroke="#66a8c0" stroke-width="5" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#66a8c0"/></marker></defs><path d="M285 220H345"/><path d="M585 220H645"/><path d="M885 220H945"/><path d="M470 280L420 355"/><path d="M770 280L810 355"/><path d="M1000 280L900 355"/></g></svg>
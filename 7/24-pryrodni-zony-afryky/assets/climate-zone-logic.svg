<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Клімат і природні зони Африки</title><desc id="d">Навчальна схема зв’язку між опадами, сезонністю та природними зонами</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eefcff"/><stop offset="1" stop-color="#fff8e8"/></linearGradient></defs><rect width="1200" height="520" rx="36" fill="url(#bg)"/><text x="60" y="70" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#17364c">Клімат → вода → рослинність → природна зона</text><g font-family="system-ui,sans-serif"><g transform="translate(55 125)"><rect width="250" height="300" rx="28" fill="#e6f8ee" stroke="#90c9a4"/><text x="24" y="48" font-size="27" font-weight="800" fill="#176b46">Вологий екватор</text><text x="24" y="91" font-size="20" fill="#315d4c">Опади весь рік</text><text x="24" y="125" font-size="20" fill="#315d4c">Мала сезонність</text><path d="M35 245 Q80 135 125 245 Q165 125 210 245" fill="#46a76d" opacity=".9"/><text x="24" y="282" font-size="21" font-weight="700" fill="#176b46">Вічнозелені ліси</text></g><g transform="translate(330 125)"><rect width="250" height="300" rx="28" fill="#fff6d9" stroke="#e2c46a"/><text x="24" y="48" font-size="27" font-weight="800" fill="#795e10">Субекватор</text><text x="24" y="91" font-size="20" fill="#685b34">Вологий + сухий сезон</text><text x="24" y="125" font-size="20" fill="#685b34">Трави, рідколісся</text><path d="M38 238 L65 170 L92 238 M100 238 L130 155 L160 238 M168 238 L200 178 L226 238" stroke="#c3a12f" stroke-width="8" fill="none"/><text x="24" y="282" font-size="21" font-weight="700" fill="#795e10">Савани</text></g><g transform="translate(605 125)"><rect width="250" height="300" rx="28" fill="#fff0dd" stroke="#e4ae71"/><text x="24" y="48" font-size="27" font-weight="800" fill="#92591e">Тропіки</text><text x="24" y="91" font-size="20" fill="#76573a">Опадів дуже мало</text><text x="24" y="125" font-size="20" fill="#76573a">Високе випаровування</text><path d="M28 230 Q75 190 125 230 Q180 180 225 230" stroke="#d38a3b" stroke-width="10" fill="none"/><text x="24" y="282" font-size="21" font-weight="700" fill="#92591e">Пустелі й напівпустелі</text></g><g transform="translate(880 125)"><rect width="265" height="300" rx="28" fill="#edf2ff" stroke="#99addd"/><text x="24" y="48" font-size="27" font-weight="800" fill="#405da0">Субтропіки</text><text x="24" y="91" font-size="20" fill="#52627f">Зимові дощі на краях</text><text x="24" y="125" font-size="20" fill="#52627f">Літня посуха</text><circle cx="90" cy="210" r="45" fill="#6e9b65"/><circle cx="155" cy="205" r="52" fill="#4d855a"/><text x="24" y="282" font-size="21" font-weight="700" fill="#405da0">Твердолисті чагарники</text></g></g><text x="60" y="480" font-family="system-ui,sans-serif" font-size="20" fill="#5d7280">Схема спрощена: межі зон змінюють рельєф, океанічні течії, ґрунти та діяльність людей.</text></svg>
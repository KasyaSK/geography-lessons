<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Ланцюг живлення савани</title><desc id="d">Порожній шаблон для побудови ланцюга живлення савани</desc><rect width="1200" height="360" rx="34" fill="#fbfff4"/><text x="60" y="66" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#264c31">Ланцюг живлення савани: побудуйте доказово</text><g font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle"><g transform="translate(70 120)"><rect width="230" height="125" rx="24" fill="#e5f4cf" stroke="#92ba60"/><text x="115" y="55" font-size="23" fill="#416421">Виробник</text><text x="115" y="87" font-size="18" fill="#64784c">рослина</text></g><path d="M320 182 H395" stroke="#58716a" stroke-width="8"/><path d="M380 166 l24 16 -24 16" fill="none" stroke="#58716a" stroke-width="8"/><g transform="translate(415 120)"><rect width="230" height="125" rx="24" fill="#fff3cb" stroke="#d5ae45"/><text x="115" y="55" font-size="23" fill="#775b14">Консумент I</text><text x="115" y="87" font-size="18" fill="#806f44">травоїдна тварина</text></g><path d="M665 182 H740" stroke="#58716a" stroke-width="8"/><path d="M725 166 l24 16 -24 16" fill="none" stroke="#58716a" stroke-width="8"/><g transform="translate(760 120)"><rect width="230" height="125" rx="24" fill="#ffe0d8" stroke="#d98b78"/><text x="115" y="55" font-size="23" fill="#8a3d2d">Консумент II</text><text x="115" y="87" font-size="18" fill="#865f55">хижак</text></g><path d="M1010 182 H1085" stroke="#58716a" stroke-width="8"/><path d="M1070 166 l24 16 -24 16" fill="none" stroke="#58716a" stroke-width="8"/></g><text x="60" y="310" font-family="system-ui,sans-serif" font-size="20" fill="#617568">Стрілка показує перенесення речовини й енергії від їжі до того, хто її споживає. Додайте редуцентів у власній відповіді.</text></svg>
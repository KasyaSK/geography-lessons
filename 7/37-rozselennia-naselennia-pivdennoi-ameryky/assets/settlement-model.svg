<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Модель чинників розселення населення Південної Америки</title><desc id="d">Схема показує, як природні умови, транспорт, історія та економічні можливості впливають на концентрацію населення.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff5df"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="34" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17384d">Чому населення розміщене нерівномірно?</text><g font-family="Arial,sans-serif" fill="#17384d" filter="url(#s)"><g transform="translate(55 110)"><rect width="250" height="115" rx="22" fill="#fff" stroke="#9ed8ef"/><text x="125" y="40" text-anchor="middle" font-size="22" font-weight="700">Природні умови</text><text x="125" y="70" text-anchor="middle" font-size="16">клімат • вода • рельєф</text><text x="125" y="94" text-anchor="middle" font-size="16">ґрунти • узбережжя</text></g><g transform="translate(340 110)"><rect width="250" height="115" rx="22" fill="#fff" stroke="#f1c76b"/><text x="125" y="40" text-anchor="middle" font-size="22" font-weight="700">Історія</text><text x="125" y="70" text-anchor="middle" font-size="16">порти • колонізація</text><text x="125" y="94" text-anchor="middle" font-size="16">міграції • столиці</text></g><g transform="translate(625 110)"><rect width="250" height="115" rx="22" fill="#fff" stroke="#83d7b7"/><text x="125" y="40" text-anchor="middle" font-size="22" font-weight="700">Економіка</text><text x="125" y="70" text-anchor="middle" font-size="16">робочі місця • промисловість</text><text x="125" y="94" text-anchor="middle" font-size="16">послуги • ресурси</text></g><g transform="translate(910 110)"><rect width="235" height="115" rx="22" fill="#fff" stroke="#e79d9d"/><text x="118" y="40" text-anchor="middle" font-size="22" font-weight="700">Транспорт</text><text x="118" y="70" text-anchor="middle" font-size="16">порти • дороги</text><text x="118" y="94" text-anchor="middle" font-size="16">коридори • доступність</text></g></g><g stroke="#4f8196" stroke-width="4" fill="none" marker-end="url(#a)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f8196"/></marker></defs><path d="M180 235 C230 295 350 300 465 330"/><path d="M465 235 C480 280 520 300 555 330"/><path d="M750 235 C730 285 680 305 645 330"/><path d="M1028 235 C965 295 810 305 735 330"/></g><rect x="400" y="330" width="400" height="125" rx="28" fill="#1679ae"/><text x="600" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Концентрація населення</text><text x="600" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">узбережжя • великі міста • долини • плато</text><text x="600" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">і значно слабше — внутрішня Амазонія та крайні райони</text></svg>
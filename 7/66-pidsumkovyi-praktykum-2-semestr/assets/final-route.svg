<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Маршрут підсумкового географічного практикуму</title><desc id="d">Схема від карти світу через природні закономірності і материки до океанів, людини та аргументованого висновку.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#dff7ff"/><stop offset=".52" stop-color="#fff0c9"/><stop offset="1" stop-color="#e7f8e9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter></defs><rect width="1200" height="520" rx="34" fill="url(#g)"/><g font-family="Arial, sans-serif" fill="#17384b" text-anchor="middle"><text x="600" y="62" font-size="34" font-weight="700">Підсумковий маршрут: не «згадай», а доведи</text><text x="600" y="97" font-size="19">Карта → закономірність → доказ → висновок → корекція</text></g><g filter="url(#s)" font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(55 155)"><rect width="190" height="125" rx="24" fill="#fff"/><text x="95" y="43" font-size="24" font-weight="700" fill="#147aa0">1. КАРТА</text><text x="95" y="77" font-size="17" fill="#315265">координати</text><text x="95" y="101" font-size="17" fill="#315265">масштаб • положення</text></g><g transform="translate(282 155)"><rect width="190" height="125" rx="24" fill="#fff"/><text x="95" y="43" font-size="24" font-weight="700" fill="#7a6b14">2. ПРИРОДА</text><text x="95" y="77" font-size="17" fill="#315265">тектоніка • клімат</text><text x="95" y="101" font-size="17" fill="#315265">води • зональність</text></g><g transform="translate(509 155)"><rect width="190" height="125" rx="24" fill="#fff"/><text x="95" y="43" font-size="24" font-weight="700" fill="#17805e">3. МАТЕРИКИ</text><text x="95" y="77" font-size="17" fill="#315265">порівняння</text><text x="95" y="101" font-size="17" fill="#315265">причини контрастів</text></g><g transform="translate(736 155)"><rect width="190" height="125" rx="24" fill="#fff"/><text x="95" y="43" font-size="24" font-weight="700" fill="#2468b3">4. ОКЕАНИ</text><text x="95" y="77" font-size="17" fill="#315265">течії • рельєф дна</text><text x="95" y="101" font-size="17" fill="#315265">ресурси • ризики</text></g><g transform="translate(963 155)"><rect width="190" height="125" rx="24" fill="#fff"/><text x="95" y="43" font-size="24" font-weight="700" fill="#9b4d63">5. ЛЮДИНА</text><text x="95" y="77" font-size="17" fill="#315265">розселення</text><text x="95" y="101" font-size="17" fill="#315265">екологічний тиск</text></g></g><g stroke="#315265" stroke-width="4" fill="none" stroke-linecap="round"><path d="M245 218h37"/><path d="M472 218h37"/><path d="M699 218h37"/><path d="M926 218h37"/></g><g fill="#315265"><path d="M278 210l14 8-14 8z"/><path d="M505 210l14 8-14 8z"/><path d="M732 210l14 8-14 8z"/><path d="M959 210l14 8-14 8z"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="245" y="350" width="710" height="105" rx="28" fill="#17384b"/><text x="600" y="392" font-size="27" font-weight="700" fill="#fff">CER: ТЕЗА → ДОКАЗИ → ПОЯСНЕННЯ</text><text x="600" y="426" font-size="18" fill="#dff7ff">Сильна відповідь пояснює механізм, а не просто називає факт</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" rx="32" fill="#fffaf1"/><g font-family="Arial,sans-serif" fill="#17344c"><text x="70" y="72" font-size="34" font-weight="700">Практичний протокол</text><g font-size="24" font-weight="700"><rect x="70" y="120" width="210" height="190" rx="22" fill="#e5f6ff"/><text x="105" y="175">1. Знайди</text><text x="105" y="212">координати</text><rect x="350" y="120" width="210" height="190" rx="22" fill="#ebfbf5"/><text x="382" y="175">2. Обчисли</text><text x="382" y="212">різницю</text><rect x="630" y="120" width="210" height="190" rx="22" fill="#fff1de"/><text x="662" y="175">3. Переведи</text><text x="662" y="212">градуси в км</text><rect x="910" y="120" width="210" height="190" rx="22" fill="#f1edff"/><text x="944" y="175">4. Перевір</text><text x="944" y="212">і поясни</text></g><g font-size="42" fill="#7290a4"><text x="300" y="225">→</text><text x="580" y="225">→</text><text x="860" y="225">→</text></g><text x="80" y="365" font-size="23">На меридіані: 1° ≈ 111 км. На паралелі: 1° довготи ≈ 111 × cos φ км.</text></g></svg>
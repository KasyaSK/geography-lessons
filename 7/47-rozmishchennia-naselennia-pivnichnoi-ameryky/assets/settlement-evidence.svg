<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Схема чинників розселення населення Північної Америки</title><desc id="d">Доказова схема: природні умови, транспорт, історія заселення та великі міські коридори.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#fff3d8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="1100" height="620" rx="34" fill="url(#g)"/><text x="52" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#153e57">Чому населення розміщене нерівномірно?</text><g font-family="Arial,sans-serif" filter="url(#s)"><rect x="55" y="105" width="300" height="180" rx="24" fill="#fff"/><text x="80" y="145" font-size="21" font-weight="700" fill="#167b62">1. Природні умови</text><text x="80" y="183" font-size="17" fill="#284b5e">• м’якший клімат</text><text x="80" y="213" font-size="17" fill="#284b5e">• доступ до прісної води</text><text x="80" y="243" font-size="17" fill="#284b5e">• рівнини й родючі ґрунти</text><rect x="400" y="105" width="300" height="180" rx="24" fill="#fff"/><text x="425" y="145" font-size="21" font-weight="700" fill="#0c74a4">2. Положення і транспорт</text><text x="425" y="183" font-size="17" fill="#284b5e">• узбережжя Атлантики</text><text x="425" y="213" font-size="17" fill="#284b5e">• Великі озера — Св. Лаврентія</text><text x="425" y="243" font-size="17" fill="#284b5e">• порти, річки, коридори</text><rect x="745" y="105" width="300" height="180" rx="24" fill="#fff"/><text x="770" y="145" font-size="21" font-weight="700" fill="#b46d18">3. Історія й економіка</text><text x="770" y="183" font-size="17" fill="#284b5e">• колонізація східного узбережжя</text><text x="770" y="213" font-size="17" fill="#284b5e">• індустріалізація й міста</text><text x="770" y="243" font-size="17" fill="#284b5e">• міграція та робочі місця</text><path d="M205 306 C280 350 330 370 510 408" fill="none" stroke="#7aaec4" stroke-width="5"/><path d="M550 306 C550 345 550 365 550 405" fill="none" stroke="#7aaec4" stroke-width="5"/><path d="M895 306 C820 350 760 370 590 408" fill="none" stroke="#7aaec4" stroke-width="5"/><rect x="250" y="410" width="600" height="145" rx="28" fill="#173f57"/><text x="550" y="452" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Найгустіші вузли й коридори</text><text x="550" y="492" font-size="18" fill="#dff6ff" text-anchor="middle">пн.-сх. США — Великі озера — пд.-сх. Канада</text><text x="550" y="525" font-size="18" fill="#dff6ff" text-anchor="middle">Каліфорнія • Мексиканське нагір’я • окремі прибережні мегаполіси</text></g><text x="550" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#587180">Схема для аналізу причин; перевіряйте її за реальними картами GHSL, WorldPop, OSM та NASA.</text></svg>
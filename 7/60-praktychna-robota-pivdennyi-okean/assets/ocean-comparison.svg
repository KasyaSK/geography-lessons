<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff6ff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eafcff"/><stop offset="1" stop-color="#f4f0ff"/></linearGradient></defs><rect width="1200" height="650" rx="36" fill="#f7fbff"/><text x="600" y="56" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#123a56">Два полярні океани — дві різні системи</text><g transform="translate(70 100)"><rect width="480" height="470" rx="28" fill="url(#a)" stroke="#8dd6ef" stroke-width="3"/><text x="240" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#12698e">Північний Льодовитий</text><circle cx="240" cy="190" r="108" fill="#d8f3ff" stroke="#5bbbd9" stroke-width="6"/><path d="M170 145c40-33 94-20 130 7 34 26 50 57 42 89-8 31-40 60-82 63-51 4-101-24-117-63-13-31-2-69 27-96z" fill="#fff"/><text x="240" y="342" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#174a63">океан, майже оточений суходолом</text><text x="240" y="381" text-anchor="middle" font-family="Arial" font-size="18" fill="#365f73">великий вплив материків • багаторічний морський лід</text><text x="240" y="418" text-anchor="middle" font-family="Arial" font-size="18" fill="#365f73">зв'язок з Атлантикою та Тихим океаном через протоки</text></g><g transform="translate(650 100)"><rect width="480" height="470" rx="28" fill="url(#b)" stroke="#9fb6ec" stroke-width="3"/><text x="240" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#394c9a">Південний океан</text><circle cx="240" cy="190" r="108" fill="#bfe9fb" stroke="#607fdb" stroke-width="6"/><ellipse cx="240" cy="190" rx="66" ry="88" fill="#fff"/><path d="M150 188c25-61 73-91 90-96 24 10 69 43 90 96-31 34-62 46-90 49-32-3-63-18-90-49z" fill="#f7fbff" stroke="#c8d7e6" stroke-width="2"/><path d="M95 190c70-70 215-70 290 0" fill="none" stroke="#4a74d8" stroke-width="10" stroke-linecap="round"/><path d="M385 190l-28-16 5 31z" fill="#4a74d8"/><text x="240" y="342" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#2f447d">океан, що кільцем оточує материк</text><text x="240" y="381" text-anchor="middle" font-family="Arial" font-size="18" fill="#4a5872">Антарктична циркумполярна течія • сезонний морський лід</text><text x="240" y="418" text-anchor="middle" font-family="Arial" font-size="18" fill="#4a5872">межа навчального опису: приблизно 60° пд. ш.</text></g><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#537083">Ключ до практичної роботи: порівнюємо положення → циркуляцію → лід → живі організми → освоєння</text></svg>
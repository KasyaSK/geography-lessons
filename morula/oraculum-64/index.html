/* Практична книга 64 архетипів */
.guide-section{margin:36px 0 34px;padding:25px 26px 29px;border:1px solid #e1b98165;border-radius:20px;background:linear-gradient(140deg,#191b35,#101a2d 55%,#1b1a30)}
.guide-section .guide-title{font:500 clamp(1.9rem,4vw,3rem)/1.1 Georgia,serif;color:#f4d29e;margin:8px 0 12px}
.guide-portrait{font-size:15px;line-height:1.75;color:#e2cfcd;max-width:900px}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:24px 0}
.guide-card{padding:23px;border-radius:15px;background:#0b1428bd;border:1px solid #d7b98b40;min-width:0}
.guide-card h3{font:500 25px Georgia,serif;color:#ebcc9f;margin:0 0 15px}
.guide-card ul{list-style:none;padding:0;margin:0;display:grid;gap:13px}
.guide-card li{position:relative;color:#cecbd6;padding-left:22px;font-size:14px;line-height:1.68}
.guide-card li:before{content:"✧";position:absolute;left:0;top:0;color:#d6b78b}
.guide-card:nth-child(2) li:before{content:"◇";color:#e5a5b5}
.guide-card:nth-child(3){border-color:#82d7cf57}
.guide-card:nth-child(4){border-color:#a7a5db57}
.guide-ritual{display:flex;align-items:flex-start;gap:15px;padding:20px 22px;background:#283048;border:1px dashed #b6a1ce91;border-radius:14px}
.guide-ritual .sigil{display:grid;place-items:center;flex:none;width:42px;height:42px;border:1px solid #ddbf9273;border-radius:50%;color:#eed19e;font:27px Georgia,serif}
.guide-ritual strong{color:#f2d9b1;display:block;margin-bottom:5px}
.guide-ritual p{margin:0;font-size:14px;line-height:1.7}
.guide-disclaimer{font-size:12px!important;color:#a9a5b6!important;margin:17px 0 0}
.modal-card{max-width:860px}
.modal-card .guide-section{padding:19px;border:0;background:#151b31;margin:20px 0}
.modal-card .guide-card{padding:16px}
.modal-card .guide-card h3{font-size:21px}
.modal-card .guide-card li{font-size:13px}
.mini-guides{display:flex;flex-direction:column;gap:6px;margin-top:9px;border-top:1px solid #bc9b7445;padding-top:10px}
.mini-guides span{font-size:11px;line-height:1.45;color:#bdb1b1}

и красивішу картину, ніж дозволяють обставини.","Іноді підлаштовує власний голос під очікування інших.","Може довго сперечатися про чесність правил, не вирішуючи поточної задачі.","Однакова історія може по-різному впливати на людей."],"business":["Після кожної презентації перевіряйте історію трьома фактами: ціна, строк, перевірюваний результат.","Визначте прозорі критерії для нестандартних винятків, щоб гнучкість не перетворилася на фаворитизм.","Якщо вводите нову політику, пояснюйте прикладами різних ситуацій."],"home":["На сімейних обговореннях відокремлюйте почуття від конкретних домовленостей: що робимо, хто робить, коли.","Домовляйтеся не про ідеальну рівність хвилин, а про справедливе навантаження.","У побуті домовтеся, що означає «порівну» саме у вашій сім’ї."],"ritual":"Попросіть двох людей переказати Ваше правило; знайдіть різницю між тим, що сказали, і тим, що почули.","portrait":"Оповідач на шляху Ламких Правил: сильний там, де історія має об'єднати людей; випробування — не дозволити дискусії замінити дію."},{"id":56,"strengths":["Допомагає людям зрозуміти значення спільної справи.","Створює зв’язок між різними поглядами через історії й пояснення.","Не губиться, коли потрібно ризикнути заради нового правила гри."],"weaknesses":["Може обіцяти красивішу картину, ніж дозволяють обставини.","Іноді підлаштовує власний голос під очікування інших.","Може зруйнувати стару опору швидше, ніж створить нову.","Драматургія перемоги не повинна випереджати реальність."],"business":["Після кожної презентації перевіряйте історію трьома фактами: ціна, строк, перевірюваний результат.","Для сміливих змін установіть фінансовий ліміт, ознаки успіху й резервний маршрут.","Переосмислюючи бренд, не обіцяйте миттєвого перетворення продукту."],"home":["На сімейних обговореннях відокремлюйте почуття від конкретних домовленостей: що робимо, хто робить, коли.","Залишайте стабільними базові речі: сон, гроші на потреби, важливі домовленості; експериментуйте з рештою.","Зміни в родині спочатку обговоріть як пробний сценарій."],"ritual":"Оберіть одну гучну мрію й поясніть її близькій людині без перебільшень і гарантій.","portrait":"Оповідач на шляху Невідомих Орбіт: сильний там, де історія має об'єднати людей; випробування — не дозволити сміливості спалити запасний міст."},{"id":57,"strengths":["Вчасно помічає можливості для нових контактів і партнерств.","Уміє надихнути інших на рух, коли ідея ще не стала планом.","Уміє зберегти людяність і стабільність у напружений момент."],"weaknesses":["Може захопити людей можливістю до перевірки її реальності.","Іноді бере на себе більше зобов’язань, ніж підтримує ресурсами.","Може відкладати зміни, чекаючи цілковитої певності.","Кожен новий контакт потребує часу на підтримку."],"business":["Перш ніж анонсувати новий проєкт, перевіряйте три речі: хто виконує, звідки ресурси, яка перша вимірна подія.","Установіть резерв часу й грошей перед запуском; не підміняйте обережність безстроковою підготовкою.","Будуйте партнерства навколо довгострокових повторюваних цінностей."],"home":["Вносьте спільні плани в календар одразу після домовленості й залишайте вільні вечори без нових обіцянок.","Підтримуйте спокійні регулярні ритуали, але раз на місяць міняйте одну незручну звичку.","Зробіть спільний календар із часом для тиші між зустрічами."],"ritual":"Напишіть трьом давнім знайомим, але запропонуйте конкретну коротку зустріч тільки одному.","portrait":"Вісник на шляху Тихих Садів: сильний там, де потрібно відчинити двері новим партнерствам; випробування — не дозволити обережності зупинити зміни."},{"id":58,"strengths":["Вчасно помічає можливості для нових контактів і партнерств.","Уміє надихнути інших на рух, коли ідея ще не стала планом.","Рішуче підтримує важливих людей, коли діяти треба вже зараз."],"weaknesses":["Може захопити людей можливістю до перевірки її реальності.","Іноді бере на себе більше зобов’язань, ніж підтримує ресурсами.","Може погодитися на ризик заради людини, не спитавши про її бажання.","Щедрість, function drawSky(){const cv=document.getElementById('space'),ctx=cv.getContext('2d');if(!ctx)return;const ratio=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;cv.width=w*ratio;cv.height=h*ratio;cv.style.width=w+'px';cv.style.height=h+'px';ctx.scale(ratio,ratio);const r=Math.random;let random=123;function rand(){random=(random*1664525+1013904223)>>>0;return random/4294967296;}const n=Math.min(175,Math.floor(w*h/6500));for(let i=0;i<n;i++){const x=rand()*w,y=rand()*h,rad=.4+rand()*1.5;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=`rgba(255,238,222,${.2+rand()*.6})`;ctx.fill();}}
window.addEventListener('resize',()=>drawSky(),{passive:true});drawSky();
function astrolabe(){

const a=i*2.399963229728653;const r=27+Math.sqrt((i+.4)/64)*147;

}).join('');

const chapterGlow=['#71549a66','#4579b066','#368d8a66','#a1764166','#a4638466','#4c9baf66'];
function quiz(){if(complete())return result();const q=D.questions[state.index];const ch=D.chapters[q.chapter],sel=state.answers[q.id];const ans=q.options.map((o,i)=>`<button class="answer ${sel===i?'chosen':''}" data-answer="${i}" aria-label="Варіант ${i+1}: ${esc(o.label)}"><span class="ans-symbol">${['✦','◇','✧','☽'][i]}</span><span>${esc(o.label)}</span></button>`).join('');return `<section class="quiz-wrap"><div class="qtop"><span class="eyebrow">${esc(ch.kicker)} / ORACULUM</span><span class="counter"><b>${count()}</b> / 36 відповідей</span></div><div class="progress"><span style="width:${Math.round(count()/36*100)}%"></span></div><div class="quiz-layout"><div class="scene" style="--tone-glow:${chapterGlow[q.chapter]}"><div class="scene-illumination"></div>${sceneSVG(ch.scene)}<div class="scene-head"><div class="chapter">${esc(ch.kicker)}</div><h2>${esc(ch.title)}</h2></div><div class="scene-bottom"><p>${esc(ch.line)}</p></div></div><section class="question" aria-live="polite"><div class="qnumber">Випробування ${String(state.index+1).padStart(2,'0')} з 36</div><h2>${esc(q.prompt)}</h2><div class="options">${ans}</div><div class="quiz-bottom"><button class="btn text" data-back>← Назад</button><span class="tip">Оберіть те, що Ви дійсно зробили б</span></div><div class="micro">Натисніть 1–4 для швидкого вибору. Попередні рішення можна змінити.</div></section></div></section>`}
function introChapter(c){const ch=D.chapters[c];return `<section class="chapter-intro"><div class="halo"></div><div><span class="eyebrow">${esc(ch.kicker)} / 6 глав</span><h1>${esc(ch.title)}</h1><p>${esc(ch.desc)}</p><button class="btn primary" data-enter>Увійти до глави →</button><div class="tiny" style="margin-top:20px">${count()} / 36 рішень</div></div></section>`;}
function bitsScore(){const sums=[0,0,0,0,0,0],prim=[0,0,0,0,0,0];for(const q of D.questions){const v=state.answers[q.id];if(typeof v!=='number')continue;const o=q.options[v];sums[q.axis]+=2*o.m;sums[q.secondary]+=o.s;prim[q.axis]+=o.m;}const bits=sums.map((v,i)=>v>0?1:v<0?0:prim[i]>0?1:0);return {sums,prim,bits};}
function typeData(bits){const r=(bits[0]<<2)|(bits[1]<<1)|bits[2],p=(bits[3]<<2)|(bits[4]<<1)|bits[5],role=D.roles[r],path=D.paths[p];return {id:r*8+p+1,role,path,bits,name:role.name+' '+path.name};}
function altTypes(bits,sums){return sums.map((s,i)=>({i,abs:Math.abs(s)})).sort((a,b)=>a.abs-b.abs).slice(0,3).map(({i,abs})=>{const b=bits.slice();b[i]=1-b[i];return {...typeData(b),reason:D.axes[i].name,abs};});}
function resultCore(){if(!complete()){go('quiz');return '';}const {sums,bits}=bitsScore(),t=typeData(bits),alt=altTypes(bits,sums),z=sign();let label=state.name?'Доля для '+esc(state.name):'Ваш запис в Архіві';return `<section class="result-hero"><div class="pre">✦ Печатку відкрито · ${label}</div><h1>${esc(t.name)}</h1><p style="max-width:790px;font-size:17px">Ваші вибори створили сузір'я № ${String(t.id).padStart(2,'0')} із 64. Воно не пророкує долю — це символічний портрет тих рішень, які Ви приймали під час подорожі.</p></section><div class="result-grid"><article class="result-card"><div class="overline">Архетип / ${String(t.id).padStart(2,'0')} із 64</div><div class="result-sigil"><span class="medallion">${esc(z[1])}&#65038;</span><div><div class="serif" style="font-size:25px;color:#f2cf9f">${esc(t.role.name)}</div><div class="tiny">Шлях: ${esc(t.path.name)}</div></div></div><p>${esc(t.role.text)} ${esc(t.path.text)}</p><div class="divider"></div><h3>Ваш дар</h3><p>${esc(t.role.gift)}</p><h3>Тінь, про яку варто пам’ятати</h3><p>${esc(t.role.shadow)} ${esc(t.path.trial)}</p><h3>Предмет із Архіву</h3><p>${esc(t.path.amulet)}</p><p class="quote">Під знаком ${esc(state.sign)} — «${esc(z[2])}». Це астрологічний мотив історії, а не частина підрахунку.</p></article><article class="result-card"><div class="overline">Шість сторін вашого сузір'я</div><h3 style="font-size:25px;margin:10px 0">Не тільки назва</h3><p style="font-size:13px;color:#aea9be">Кожен повзунок показує, як саме розподілилися ваші відповіді. Середина означає неоднозначність, а не «слабкість».</p><div class="axislist">${D.axes.map((a,i)=>{const pct=Math.max(0,Math.min(100,Math.round(50+sums[i]*100/36))),near=Math.abs(sums[i])<=3,lean=near?'між двома полюсами':sums[i]<0?a.lo:a.hi;return `<div class="ax"><div class="ax-head"><span>${esc(a.name)}</span><span class="ax-value">${esc(lean)}</span></div><div class="ax-track"><span class="ax-dot" style="left:${pct}%"></span></div><div class="ax-labels"><span>${esc(a.lo)}</span><span>${esc(a.hi)}</span></div></div>`}).join('')}</div><p class="tiny" style="margin-top:17px">Тип утворено зі знаків шести шкал (2⁶ = 64). Поблизу центру тип може легко змінитися після кількох інших відповідей.</p></article></div><section style="margin-top:42px"><div class="eyebrow">Двері поруч</div><h2 style="font-size:clamp(2rem,4vw,2.8rem);margin:11px 0 18px">Три найближчі альтернативи</h2><div class="alternatives">${alt.map((a,i)=>`<button class="alt" data-type="${a.id}" style="text-align:left;color:inherit;cursor:pointer"><div class="overline">${i+1} · інший вибір у шкалі</div><h3>${esc(a.name)}</h3><p>${esc(a.reason)}</p></button>`).join('')}</div></section><div class="result-notes"><div><strong>Чому випав саме цей результат?</strong><p>Кожне рішення додає бали до двох із шести осей. Перевага на кожній осі дає один біт коду; шість бітів утворюють одну з 64 комбінацій. Усі назви та описи заготовлено до проходження. Знак зодіаку й ім'я на підрахунок не впливають.</p></div><div><strong>Наскільки серйозно це сприймати?</strong><p>Це художня типологія для розваги, не психологічний тест і не астрологічне передбачення. Найкорисніше в ній — порівняти свої рішення та поміркувати, які з них були несподіваними.</p></div></div><div class="result-actions"><button class="btn primary" data-share>Скопіювати свою долю</button><button class="btn ghost" data-print>Зберегти як PDF</button><button class="btn ghost" data-go="catalog">Усі 64 типи</button><button class="btn text" data-reset>Пройти інакше ↻</button></div>`;}
function getAllTypes(){let types=[];for(let i=0;i<64;i++){const bits=Array.from({length:6},(_,j)=>(i>>(5-j))&1);types.push(typeData(bits));}return types;}
let catalogSearch='',catalogRole='all';
function catalogCards(){const types=getAllTypes().filter(t=>(catalogRole==='all'||t.role.name===catalogRole)&&(`${t.name} ${t.role.text} ${t.path.text}`).toLocaleLowerCase('uk').includes(catalogSearch.toLocaleLowerCase('uk')));return `<div class="count">Знайдено ${types.length} із 64</div><div class="catalog-grid">${types.map(t=>`<button class="type-tile" data-type="${t.id}"><span class="idx">СУЗІР’Я № ${String(t.id).padStart(2,'0')}</span><span class="tile-sigil">${['✶','☽','✧','✦','◇','✺','✵','✴'][Math.floor((t.id-1)/8)]}</span><h3>${esc(t.name)}</h3><p>${esc(t.role.gift)}</p><div class="mini-guides"><span>⚒ ${esc(D.profiles[t.id-1].business[2])}</span><span>⌂ ${esc(D.profiles[t.id-1].home[2])}</span></div></button>`).join('')}</div>`;}
function catalog(){return `<section class="catalog-intro"><div class="eyebrow">Архів усіх можливих доль</div><h1>64 сузір’я</h1><p style="max-width:800px">Шість полюсів характеру дають 64 можливі комбінації. Жодна не вважається «найкращою». Кожен запис має дар, тінь, практичні поради для справи та побуту. Відкрийте будь-яке сузір’я, щоб прочитати повний портрет. Можете відкрити всі записи ще до проходження.</p><div class="filters"><input id="search-types" class="search-field" type="search" placeholder="Шукати назву, рису або образ…" value="${esc(catalogSearch)}" aria-label="Пошук типів"><select id="role-filter" class="filter-select" aria-label="Фільтрувати за архетипом"><option value="all">Усі архетипи</option>${D.roles.map(x=>`<option value="${esc(x.name)}" ${catalogRole===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn primary small" data-start>Почати тест →</button></div><div id="catalog-results">${catalogCards()}</div></section>`;}
function openTypeCore(id){const t=getAllTypes().find(x=>x.id===Number(id));if(!t)return;state.modal=t;modal.classList.remove('hidden');modal.innerHTML=`<div class="modal" data-dismiss><article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div class="overline">Сузір’я № ${String(t.id).padStart(2,'0')} / 64</div><button class="modal-close" data-dismiss aria-label="Закрити">×</button></div><h2 id="modal-title">${esc(t.name)}</h2><p>${esc(t.role.text)} ${esc(t.path.text)}</p><div class="divider"></div><p><strong>Дар:</strong> ${esc(t.role.gift)}</p><p><strong>Тінь:</strong> ${esc(t.role.shadow)} ${esc(t.path.trial)}</p><p><strong>Предмет:</strong> ${esc(t.path.amulet)}</p><button class="btn primary small" data-dismiss>Закрити запис</button></article></div>`;modal.querySelector('[aria-label="Закрити"]').focus();}

function guideList(arr){return '<ul>'+arr.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';}

const personalAxisMissions=[
 ["Обирайте одну важливу розмову й спершу сформулюйте власну позицію наодинці.","Оберіть рішення, яке звикли ухвалювати самостійно, та попросіть людину з іншою думкою навести один аргумент."],
 ["Візьміть власну здогадку і запишіть два незалежні способи її перевірити.","Опишіть одну подію спочатку лише фактами, а потім — як символічну історію. Порівняйте, що це дало."],
 ["Назвіть одну звичну річ, яку готові захистити, і дайте новій можливості пробний шанс без остаточного вибору.","Оберіть одну нову ідею й визначте, що цінне зі старого Ви не хочете втратити."],
 ["Залиште одну дрібну справу відкритою для імпровізації і перевірте, чи це покращило день.","Заплануйте для спонтанної ідеї лише кінцевий строк і межу витрат; усе інше залиште вільним."],
 ["Уявіть одну складну ситуацію очима конкретної людини й перевірте, чи загальне правило їй допомагає.","Спробуйте сформулювати правило для всіх на основі своєї реакції на один особистий випадок."],
 ["Знайдіть один маленький ризик, який можна безпечно спробувати до кінця тижня.","Для одного сміливого задуму визначте максимальну втрату часу чи грошей, яку готові прийняти."]
];
function personalCompass(t){
 if(!complete())return '';
 const {sums,bits}=bitsScore();
 const sorted=sums.map((v,i)=>({i,a:Math.abs(v),v})).sort((a,b)=>a.a-b.a);
 const weak=sorted[0],strong=sorted[5],lowHigh=bits[weak.i];
 const who=state.name?esc(state.name)+' — ':'';
 return '<div class="personal-compass"><h3>✦ '+who+'Ваш особистий компас</h3><p>За Вашими відповідями найвиразніше проявилася шкала <b>'+esc(D.axes[strong.i].name)+'</b>. Найменш визначена — <b>'+esc(D.axes[weak.i].name)+'</b>. Це не недолік, а можливість перевірити себе в житті.</p><p><strong>Ваш експеримент:</strong> '+esc(personalAxisMissions[weak.i][lowHigh])+'</p></div>';
}

function guideBook(t){
const g=D.profiles[t.id-1];if(!g)return '';
const block=(title,arr)=>'<article class="guide-card"><h3>'+title+'</h3>'+guideList(arr)+'</article>';
return '<section class="guide-section" aria-label="Практичний портрет '+esc(t.name)+'"><div class="overline">Практична книга / Сузір’я № '+String(t.id).padStart(2,'0')+'</div><h2 class="guide-title">Світло, тінь і щоденні рішення</h2><p class="guide-portrait">'+esc(g.portrait)+'</p><div class="guide-grid">'+
block('✦ Сильні сторони',g.strengths)+block('☾ Слабкі сторони й ризики',g.weaknesses)+
block('⚒ Бізнес і власна справа',g.business)+block('⌂ Побут і стосунки',g.home)+
'</div><div class="guide-ritual"><span class="sigil">✧</span><div><strong>Малий ритуал: випробування на тиждень</strong><p>'+esc(g.ritual)+'</p></div></div><p class="guide-disclaimer">Це сценарні поради для саморефлексії, а не прогноз фінансового успіху. Вибирайте те, що відповідає Вашим реальним обставинам.</p></section>';
}
function result(){const page=resultCore();if(!complete())return page;const {bits}=bitsScore(),t=typeData(bits);return page.replace('<section style="margin-top:42px">',personalCompass(t)+guideBook(t)+'<section style="margin-top:42px">');}
function openType(id){openTypeCore(id);const t=getAllTypes().find(x=>x.id===Number(id));if(!t)return;const c=modal.querySelector('.modal-card');if(c)c.insertAdjacentHTML('beforeend',guideBook(t));}

function closeType(){state.modal=null;modal.classList.add('hidden');modal.innerHTML='';}
function render(){if(state.view==='quiz'&&!complete()&&state.index%6===0&&state.index>0&&state.interlude){state.view='interlude';}root.innerHTML=state.view==='home'?home():state.view==='quiz'?quiz():state.view==='interlude'?introChapter(Math.floor(state.index/6)):state.view==='result'?result():catalog();document.title=(state.view==='result'?'Ваша доля':state.view==='catalog'?'64 сузір’я':state.view==='quiz'?'Випробування '+(state.index+1):'Оракул 64')+' · Архів невибраних доль';document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===state.view)));}
function start(){const nm=document.getElementById('player'),zn=document.getElementById('zodiac');if(nm)state.name=nm.value.trim().slice(0,50);if(zn)state.sign=zn.value;persist();if(complete())go('result');else if(count()>0){state.view='quiz';state.interlude=false;render();window.scrollTo(0,0);}else{state.view='interlude';state.index=0;render();window.scrollTo(0,0);}}
let transitioning=false;
function choose(n){if(transitioning||state.view!=='quiz'||n<0||n>3)return;const q=D.questions[state.index];state.answers[q.id]=n;persist();transitioning=true;const chosen=document.querySelector(`[data-answer="${n}"]`);if(chosen)chosen.classList.add('chosen');setTimeout(()=>{transitioning=false;state.index++;if(state.index>=36){state.index=35;persist();go('result');return;}state.interlude=state.index%6===0;state.view=state.interlude?'interlude':'quiz';persist();render();window.scrollTo(0,0);},260);}
function back(){if(state.view==='quiz'){if(state.index===0){go('home');return;}state.index--;state.interlude=false;persist();render();window.scrollTo(0,0);}}
function reset(){if(!window.confirm('Почати нову історію? Усі 36 попередніх відповідей буде стерто.'))return;state.answers={};state.index=0;state.interlude=false;persist();go('home');}
function shareCore(){const {sums,bits}=bitsScore(),t=typeData(bits);const text=`ORACULUM 64 — ${state.name||'Мій результат'}\n${t.name} (№ ${t.id} із 64)\n${t.role.text} ${t.path.text}\nДар: ${t.role.gift}\nТінь: ${t.role.shadow}\nЗнак у цій історії: ${state.sign}\nАвторська розважальна типологія.`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('Запис скопійовано ✦')).catch(()=>fallback(text));}else fallback(text);}

async function share(){
 if(!complete())return;
 const {bits}=bitsScore(),t=typeData(bits),g=D.profiles[t.id-1];
 const lines=['ORACULUM 64 — '+(state.name||'Мій результат'),t.name+' (№ '+t.id+' із 64)',g.portrait,
 'СИЛЬНІ СТОРОНИ',...g.strengths.map(x=>'• '+x),
 'СЛАБКІ СТОРОНИ',...g.weaknesses.map(x=>'• '+x),
 'БІЗНЕС',...g.business.map(x=>'• '+x),
 'ПОБУТ',...g.home.map(x=>'• '+x),'РИТУАЛ: '+g.ritual,
 'Розважальний портрет, не діагноз і не фінансова рекомендація.'];
 const s=lines.join('\n');
 try{await navigator.clipboard.writeText(s);showToast('Портрет і поради скопійовано ✦')}catch(e){fallback(s)}
}

function fallback(s){const area=document.createElement('textarea');area.value=s;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');showToast('Запис скопійовано ✦')}catch(e){showToast('Скопіювати не вдалося')}area.remove();}
root.addEventListener('click',e=>{const b=e.target.closest('button,a[data-go]');if(!b)return;if(b.dataset.go){e.preventDefault();go(b.dataset.go);return;}if(b.hasAttribute('data-start')){start();return;}if(b.hasAttribute('data-enter')){state.view='quiz';state.interlude=false;render();window.scrollTo(0,0);return;}if(b.dataset.answer!==undefined){choose(Number(b.dataset.answer));return;}if(b.hasAttribute('data-back')){back();return;}if(b.dataset.type){openType(b.dataset.type);return;}if(b.hasAttribute('data-share')){share();return;}if(b.hasAttribute('data-print')){window.print();return;}if(b.hasAttribute('data-reset')){reset();return;}});
root.addEventListener('input',e=>{if(e.target.id==='search-types'){catalogSearch=e.target.value;const slot=document.getElementById('catalog-results');if(slot)slot.innerHTML=catalogCards();}if(e.target.id==='player'){state.name=e.target.value.slice(0,50);persist();}});
root.addEventListener('change',e=>{if(e.target.id==='role-filter'){catalogRole=e.target.value;const slot=document.getElementById('catalog-results');if(slot)slot.innerHTML=catalogCards();}if(e.target.id==='zodiac'){state.sign=e.target.value;persist();const cap=document.getElementById('zcaption');if(cap)cap.textContent=sign()[2];const orb=document.querySelector('.orbis .glyph');if(orb)orb.textContent=sign()[1]+'\uFE0E';}});
document.querySelector('.topbar').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);}});
modal.addEventListener('click',e=>{if(e.target.closest('[data-dismiss]'))closeType();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeType();return;}if(state.view==='quiz'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.repeat&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){if(['1','2','3','4'].includes(e.key))choose(Number(e.key)-1);if(e.key==='ArrowLeft')back();}});
render();

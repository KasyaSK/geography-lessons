name: Quiz runtime audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - 'scripts/audit_quiz_runtime.py'
      - '.github/workflows/quiz-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-runtime-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Audit lesson quizzes in Chrome
        run: python scripts/audit_quiz_runtime.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-audit-report-${{ matrix.shard }}
          path: quiz-audit-${{ matrix.shard }}.json
          if-no-files-found: warn

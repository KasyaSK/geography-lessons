name: Fetch lesson 6 visual assets v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-lesson6-assets-v2.yml'

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified lesson images
        shell: bash
        run: |
          set -euo pipefail
          DIR='6/02-metody-geografichnyh-doslidzhen/assets'
          mkdir -p "$DIR"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Earth_seen_from_Apollo_17.jpg' -o "$DIR/earth-from-space.jpg"
          curl -L --fail --retry 3 'https://d9-wret.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/thumbnails/image/Field%20Survey.jpg' -o "$DIR/field-survey.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Topographic_map_example.png' -o "$DIR/topographic-map.png"
          curl -L --fail --retry 3 'https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/imagerecords/147000/147146/cafires_tmo_2020232_lrg.jpg' -o "$DIR/wildfire-satellite.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Physical_maps_of_Ukraine.jpg' -o "$DIR/physical-ukraine.jpg"
          test -s "$DIR/earth-from-space.jpg"
          test -s "$DIR/field-survey.jpg"
          test -s "$DIR/topographic-map.png"
          test -s "$DIR/wildfire-satellite.jpg"
          test -s "$DIR/physical-ukraine.jpg"
          file "$DIR"/*
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/02-metody-geografichnyh-doslidzhen/assets
          git diff --cached --quiet && exit 0
          git commit -m 'Add verified visual assets for grade 6 lesson 2'
          git pull --rebase origin main
          git push

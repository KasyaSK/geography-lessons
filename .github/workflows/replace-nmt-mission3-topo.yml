name: Repair NMT lesson images

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore first map and Mission 3 from known-good PNGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, base64, struct

          repo = Path('.')
          nested = repo / 'nmt/01-geography-nmt-atlas/index.html'
          short = repo / 'nmt-geography.html'
          assets = repo / 'nmt/01-geography-nmt-atlas/assets'
          assets.mkdir(parents=True, exist_ok=True)

          # This historical version is the last all-PNG copy of the same lesson.
          good_commit = '043ded95972cd0ceab35f439f66c1755569f22ab'
          old = subprocess.check_output(
              ['git', 'show', f'{good_commit}:nmt-geography.html']
          ).decode('utf-8')

          old_srcs = re.findall(r'<img\b[^>]*?\bsrc="([^"]+)"[^>]*>', old, flags=re.I)
          if len(old_srcs) < 5:
              raise SystemExit(f'Known-good page has only {len(old_srcs)} images')

          def decode_png(src, label):
              prefix = 'data:image/png;base64,'
              if not src.startswith(prefix):
                  raise SystemExit(f'{label} is not an embedded PNG')
              raw = base64.b64decode(src[len(prefix):])
              sig = b'\x89PNG\r\n\x1a\n'
              if not raw.startswith(sig):
                  raise SystemExit(f'{label} has invalid PNG signature')
              if len(raw) < 24:
                  raise SystemExit(f'{label} PNG is truncated')
              w, h = struct.unpack('>II', raw[16:24])
              if w < 500 or h < 300:
                  raise SystemExit(f'{label} PNG dimensions are suspicious: {w}x{h}')
              print(f'{label}: {w}x{h}, {len(raw)} bytes')
              return raw

          # Image 1 = Ukraine coordinate map; image 5 = Mission 3 topographic map.
          first_png = decode_png(old_srcs[0], 'Ukraine map')
          topo_png = decode_png(old_srcs[4], 'Mission 3 topo')

          first_file = assets / 'ukraine_nmt_correct.png'
          topo_file = assets / 'topo_nmt_v8.png'
          first_file.write_bytes(first_png)
          topo_file.write_bytes(topo_png)

          first_src = '/geography-lessons/nmt/01-geography-nmt-atlas/assets/ukraine_nmt_correct.png'
          topo_src = '/geography-lessons/nmt/01-geography-nmt-atlas/assets/topo_nmt_v8.png'

          def replace_attr(tag, attr, value):
              pat = rf'\b{attr}="[^"]*"'
              if re.search(pat, tag, flags=re.I):
                  return re.sub(pat, f'{attr}="{value}"', tag, count=1, flags=re.I)
              return tag[:-1] + f' {attr}="{value}">' if tag.endswith('>') else tag

          def patch_page(path):
              s = path.read_text(encoding='utf-8')
              imgs = list(re.finditer(r'<img\b[^>]*>', s, flags=re.I))
              if len(imgs) < 5:
                  raise SystemExit(f'{path}: expected at least 5 images, found {len(imgs)}')

              edits = [
                  (imgs[0].start(), imgs[0].end(), replace_attr(imgs[0].group(0), 'src', first_src)),
                  (imgs[4].start(), imgs[4].end(), replace_attr(imgs[4].group(0), 'src', topo_src)),
              ]
              for a, b, repl in sorted(edits, reverse=True):
                  s = s[:a] + repl + s[b:]

              # Fix map zoom links if present, based on the nearest image block order.
              links = list(re.finditer(r'<a\b[^>]*>\s*🔎\s*Відкрити карту окремо</a>', s, flags=re.I))
              link_edits = []
              if len(links) >= 1:
                  m = links[0]
                  link_edits.append((m.start(), m.end(), replace_attr(m.group(0), 'href', first_src)))
              if len(links) >= 2:
                  m = links[1]
                  link_edits.append((m.start(), m.end(), replace_attr(m.group(0), 'href', topo_src)))
              for a, b, repl in sorted(link_edits, reverse=True):
                  s = s[:a] + repl + s[b:]

              # Remove stale repair markers and leave one clear marker.
              s = re.sub(r'<!--\s*(?:exact-map-repair|fixed-png-maps|fixed-webp-maps):.*?-->', '', s, flags=re.I|re.S)
              marker = '<!-- repaired-maps: first=ukraine_nmt_correct.png; mission3=topo_nmt_v8.png -->'
              s = s.replace('</body>', marker + '\n</body>')
              path.write_text(s, encoding='utf-8')
              return s

          patched = patch_page(nested)
          short.write_text(patched, encoding='utf-8')

          # Verify exact public references and files before committing anything.
          for page in (nested, short):
              text = page.read_text(encoding='utf-8')
              imgs = list(re.finditer(r'<img\b[^>]*>', text, flags=re.I))
              assert len(imgs) >= 5
              assert first_src in imgs[0].group(0), f'{page}: first map reference incorrect'
              assert topo_src in imgs[4].group(0), f'{page}: Mission 3 reference incorrect'

          assert first_file.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert topo_file.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('VERIFIED: first and Mission 3 images are real PNG files and both public pages point to them.')
          PY

      - name: Commit repaired lesson
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nmt-geography.html \
            nmt/01-geography-nmt-atlas/index.html \
            nmt/01-geography-nmt-atlas/assets/ukraine_nmt_correct.png \
            nmt/01-geography-nmt-atlas/assets/topo_nmt_v8.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore working PNG maps in NMT lesson"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Find NMT target image assets

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find matching image blobs across repo history
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,hashlib,os
          targets={
            'img1':'730bb490b64c3eccb37b657d85b27f54618f270ab39e48b1db5a19fd9cf8a54d',
            'img2':'c8ebc974c64e8603cd9a8bc076d82673e63e0dad0203b4b467863efb5655b496',
            'img3':'519d6d8b6abb80d88a801ec232c6320b38b867922ad2d6051f3d6878c15802c6',
            'img4':'9233885cd807c3b9fa40c5abed45c4c3e35a38daab3ea90794f64a2466238d09',
            'img5':'3dba0f4095fb62af10cad3af41180e4d1901f2f8fa31f1eb9a5abc7161403f33',
            'img6':'083e00e3453d9387e9a5f138d8afa33d544d3a9cc67a5728059afca757c3fb1b',
            'img7':'b51757a4097c43f15167013d6c43a6548b51649dd1b10ef540309a599cc64061',
          }
          rev=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='ignore').splitlines()
          seen=set(); found={}
          for line in rev:
              parts=line.split(' ',1); sha=parts[0]; path=parts[1] if len(parts)>1 else ''
              if sha in seen: continue
              seen.add(sha)
              if path and os.path.splitext(path.lower())[1] not in {'.png','.jpg','.jpeg','.webp','.svg'}:
                  continue
              try:
                  typ=subprocess.check_output(['git','cat-file','-t',sha],text=True).strip()
                  if typ!='blob': continue
                  data=subprocess.check_output(['git','cat-file','blob',sha])
              except Exception:
                  continue
              h=hashlib.sha256(data).hexdigest()
              for name,t in targets.items():
                  if h==t:
                      print('MATCH',name,'gitblob',sha,'path',path,'bytes',len(data))
                      found[name]=(sha,path,len(data))
          print('FOUND_NAMES',sorted(found))
          PY

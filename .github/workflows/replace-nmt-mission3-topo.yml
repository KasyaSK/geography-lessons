name: Find exact NMT source

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare historical lesson versions
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re,hashlib
          target='fdc1a28ebf4fd4f0b849165a8996c1b95a2a1103603a3cc5635dfb11d93e3b84'
          commits=subprocess.check_output(['git','log','--all','--format=%H','--','nmt-geography.html'],text=True).split()
          print('commits',len(commits))
          for c in commits:
              try:
                  s=subprocess.check_output(['git','show',f'{c}:nmt-geography.html']).decode('utf-8')
              except Exception:
                  continue
              norm=re.sub(r'(<img[^>]*src=")[^"]*(")',r'\1__IMG__\2',s,flags=re.I)
              norm=re.sub(r'(<a[^>]*href=")[^"]*("[^>]*>\s*🔎\s*Відкрити карту окремо</a>)',r'\1__HREF__\2',norm,flags=re.I)
              nh=hashlib.sha256(norm.encode()).hexdigest()
              imgs=re.findall(r'<img[^>]*src="([^"]+)"[^>]*>',s,re.I)
              print(c[:12],'size',len(s.encode()),'norm',nh,'imgs',len(imgs),'lens',[len(x) for x in imgs])
              if nh==target:
                  print('MATCH',c)
                  for i,x in enumerate(imgs,1):
                      print(' IMG',i,len(x),hashlib.sha256(x.encode()).hexdigest(),x[:80])
          PY

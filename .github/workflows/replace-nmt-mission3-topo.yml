name: Find target images in historical NMT HTML

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode historical embedded images and compare
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re,hashlib,base64
          targets={
            'img1':'730bb490b64c3eccb37b657d85b27f54618f270ab39e48b1db5a19fd9cf8a54d',
            'img2':'c8ebc974c64e8603cd9a8bc076d82673e63e0dad0203b4b467863efb5655b496',
            'img3':'519d6d8b6abb80d88a801ec232c6320b38b867922ad2d6051f3d6878c15802c6',
            'img4':'9233885cd807c3b9fa40c5abed45c4c3e35a38daab3ea90794f64a2466238d09',
            'img5':'3dba0f4095fb62af10cad3af41180e4d1901f2f8fa31f1eb9a5abc7161403f33',
            'img6':'083e00e3453d9387e9a5f138d8afa33d544d3a9cc67a5728059afca757c3fb1b',
            'img7':'b51757a4097c43f15167013d6c43a6548b51649dd1b10ef540309a599cc64061',
          }
          rev=subprocess.check_output(['git','log','--all','--format=%H','--','nmt-geography.html'],text=True).split()
          found={}
          for c in rev:
              try: s=subprocess.check_output(['git','show',f'{c}:nmt-geography.html']).decode('utf-8')
              except Exception: continue
              srcs=re.findall(r'<img[^>]*src="([^"]+)"[^>]*>',s,re.I)
              print('COMMIT',c,'IMAGES',len(srcs))
              for i,src in enumerate(srcs,1):
                  raw=None; mime=''
                  if src.startswith('data:') and ';base64,' in src:
                      head,b64=src.split(';base64,',1); mime=head[5:]
                      try: raw=base64.b64decode(b64)
                      except Exception: pass
                  if raw is not None:
                      h=hashlib.sha256(raw).hexdigest()
                      print(' ',i,mime,len(raw),h)
                      for name,t in targets.items():
                          if h==t:
                              print('  TARGET_MATCH',name,'commit',c,'index',i)
                              found[name]=(c,i)
                  else:
                      print(' ',i,'non-data',src[:120])
          print('FOUND',found)
          PY

name: Fix NMT first and Mission 3 images

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract browser-safe WebP images and patch both public lesson pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          repo = Path('.')
          assets = repo / 'nmt/01-geography-nmt-atlas/assets'
          ukr_svg = assets / 'ukraine_nmt_correct.svg'
          topo_svg = assets / 'topo_nmt_v8.svg'
          ukr_webp = assets / 'ukraine_nmt_correct.webp'
          topo_webp = assets / 'topo_nmt_v8.webp'

          def extract_webp(svg_path, out_path):
              text = svg_path.read_text(encoding='utf-8')
              m = re.search(r'data:image/webp;base64,([^"\']+)', text)
              if not m:
                  raise SystemExit(f'No embedded WebP found in {svg_path}')
              payload = re.sub(r'\s+', '', m.group(1))
              payload += '=' * (-len(payload) % 4)
              raw = base64.b64decode(payload)
              if len(raw) < 1000 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  raise SystemExit(f'Bad WebP payload in {svg_path}: {len(raw)} bytes')
              out_path.write_bytes(raw)
              print(out_path, len(raw))

          extract_webp(ukr_svg, ukr_webp)
          extract_webp(topo_svg, topo_webp)

          first_src = '/geography-lessons/nmt/01-geography-nmt-atlas/assets/ukraine_nmt_correct.webp'
          topo_src = '/geography-lessons/nmt/01-geography-nmt-atlas/assets/topo_nmt_v8.webp'

          def patch_page(path):
              s = path.read_text(encoding='utf-8')
              imgs = list(re.finditer(r'<img\b[^>]*>', s, flags=re.I))
              if len(imgs) < 5:
                  raise SystemExit(f'{path}: expected at least 5 images, found {len(imgs)}')

              for m, src in sorted([(imgs[0], first_src), (imgs[4], topo_src)], key=lambda x: x[0].start(), reverse=True):
                  tag = m.group(0)
                  if re.search(r'\bsrc="[^"]*"', tag, flags=re.I):
                      new = re.sub(r'\bsrc="[^"]*"', f'src="{src}"', tag, count=1, flags=re.I)
                  else:
                      new = tag[:-1] + f' src="{src}">'
                  s = s[:m.start()] + new + s[m.end():]

              links = list(re.finditer(r'<a\b[^>]*>\s*🔎\s*Відкрити карту окремо</a>', s, flags=re.I))
              pairs = []
              if len(links) > 0: pairs.append((links[0], first_src))
              if len(links) > 1: pairs.append((links[1], topo_src))
              for m, src in sorted(pairs, key=lambda x: x[0].start(), reverse=True):
                  tag = m.group(0)
                  new = re.sub(r'\bhref="[^"]*"', f'href="{src}"', tag, count=1, flags=re.I)
                  s = s[:m.start()] + new + s[m.end():]

              marker = '<!-- fixed-webp-maps: first=ukraine_nmt_correct.webp; mission3=topo_nmt_v8.webp -->'
              if marker not in s:
                  s = s.replace('</body>', marker + '\n</body>')
              path.write_text(s, encoding='utf-8')

          nested = repo / 'nmt/01-geography-nmt-atlas/index.html'
          short = repo / 'nmt-geography.html'
          patch_page(nested)
          short.write_text(nested.read_text(encoding='utf-8'), encoding='utf-8')

          for page in (nested, short):
              out = page.read_text(encoding='utf-8')
              imgs = list(re.finditer(r'<img\b[^>]*>', out, flags=re.I))
              assert first_src in imgs[0].group(0), f'{page}: first map not WebP'
              assert topo_src in imgs[4].group(0), f'{page}: Mission 3 not WebP'
          print('Both public pages now use real WebP files for image 1 and Mission 3.')
          PY

      - name: Commit repaired images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nmt-geography.html nmt/01-geography-nmt-atlas/index.html \
                  nmt/01-geography-nmt-atlas/assets/ukraine_nmt_correct.webp \
                  nmt/01-geography-nmt-atlas/assets/topo_nmt_v8.webp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix first map and Mission 3 with browser-safe WebP files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

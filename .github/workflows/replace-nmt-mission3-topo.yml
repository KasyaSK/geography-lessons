name: Replace NMT Mission 3 topo image

on:
  push:
    paths:
      - '.github/workflows/replace-nmt-mission3-topo.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the Mission 3 topographic image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          repo = Path('.')
          asset = repo / 'nmt/01-geography-nmt-atlas/assets/topo_nmt_v8.svg'
          page = repo / 'nmt/01-geography-nmt-atlas/index.html'

          if not asset.exists():
              raise SystemExit(f'Missing source asset: {asset}')
          if not page.exists():
              raise SystemExit(f'Missing lesson page: {page}')

          # This is the original topographic visual requested for Mission 3.
          # Embed it directly so the public page does not depend on a fragile relative image path.
          uri = 'data:image/svg+xml;base64,' + base64.b64encode(asset.read_bytes()).decode('ascii')
          s = page.read_text(encoding='utf-8')
          low = s.lower()

          # Find the topographic block robustly, regardless of the exact section id used by the page.
          anchors = []
          for needle in ('топографічна карта', 'топографічний фрагмент', 'топограф'):
              start = 0
              while True:
                  pos = low.find(needle, start)
                  if pos < 0:
                      break
                  img = s.find('<img', pos)
                  if img >= 0 and img - pos < 12000:
                      anchors.append((img, pos, needle))
                  start = pos + 1

          if not anchors:
              raise SystemExit('Could not locate the Mission 3 topographic image block')

          img_pos, text_pos, needle = sorted(anchors)[0]
          tag_end = s.find('>', img_pos)
          if tag_end < 0:
              raise SystemExit('Could not parse Mission 3 image tag')
          tag = s[img_pos:tag_end+1]
          new_tag, n_img = re.subn(r'src="[^"]*"', 'src="' + uri + '"', tag, count=1)
          if n_img != 1:
              raise SystemExit('Mission 3 image tag did not contain a replaceable src')
          s = s[:img_pos] + new_tag + s[tag_end+1:]

          # Update the nearby “open separately” link if present.
          link_text = 'Відкрити карту окремо'
          link_pos = s.find(link_text, img_pos)
          n_link = 0
          if link_pos >= 0 and link_pos - img_pos < 200000:
              a_start = s.rfind('<a', img_pos, link_pos)
              a_end = s.find('>', a_start) if a_start >= 0 else -1
              if a_start >= 0 and a_end >= 0:
                  a_tag = s[a_start:a_end+1]
                  new_a, n_link = re.subn(r'href="[^"]*"', 'href="' + uri + '"', a_tag, count=1)
                  if n_link:
                      s = s[:a_start] + new_a + s[a_end+1:]

          marker = '<!-- mission3-topo: requested topo_nmt_v8 visual -->'
          if marker not in s:
              insert_at = s.rfind('<', 0, text_pos)
              if insert_at < 0:
                  insert_at = text_pos
              s = s[:insert_at] + marker + '\n' + s[insert_at:]

          page.write_text(s, encoding='utf-8')
          (repo / 'nmt-geography.html').write_text(s, encoding='utf-8')

          print('Found topographic block using:', needle)
          print('Mission 3 image replaced:', n_img)
          print('Mission 3 zoom link replaced:', n_link)
          print('Synced public nmt-geography.html')
          PY

      - name: Commit corrected lesson
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nmt-geography.html nmt/01-geography-nmt-atlas/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use requested topographic map in NMT Mission 3"
            git push origin HEAD:main
          fi

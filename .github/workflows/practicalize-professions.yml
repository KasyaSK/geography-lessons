name: Practicalize professions lessons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/practicalize-professions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite practical sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_section(text, sid, new_html):
              pat = rf'<section id="{re.escape(sid)}">.*?</section>'
              new_text, n = re.subn(pat, new_html.strip(), text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace section {sid}: {n}')
              return new_text

          # ---------- 8 CLASS ----------
          p8 = Path('profesii-8/03-portfolio-osobysti-tsili/index.html')
          h8 = p8.read_text(encoding='utf-8')
          h8 = h8.replace('<a href="#bossfight">Бос-файт</a><a href="#theory">Як це працює</a>', '<a href="#microprojects">Мікропроєкт</a><a href="#privacy">Безпека</a><a href="#theory">Шпаргалка</a>')
          h8 = h8.replace('Сьогодні не робимо «папку красивостей». Збираємо докази того, що Ви вже вмієте, а потім перетворюємо туманне «хочу стати кращим/кращою» на нормальну ціль із першим кроком.', 'Сьогодні збираємо не «досягнення для галочки», а речі, які реально можна показати майбутньому викладачеві, роботодавцю чи замовнику. Навіть якщо Вам 13–14 і медалей немає: зробимо доказ навички з нуля й складемо план, що додати в портфоліо вже цього тижня.')

          new8 = r'''
<section id="microprojects"><div class="wrap"><div class="sectionHead"><span class="step">4</span><div><h2>Немає «досягнень»? Створіть доказ за 30–60 хв</h2><p>19–26 хв • Портфоліо не вимагає кубка світу. Оберіть одну маленьку задачу, яку реально виконати цього тижня, і отримайте готовий артефакт.</p></div></div>
<div class="microGrid" id="microGrid">
<button class="microProject" data-key="poster"><span>🎨</span><b>Переробити погане оголошення</b><p>Візьміть заплутане шкільне/побутове оголошення й зробіть зрозумілу версію на 1 сторінку.</p></button>
<button class="microProject" data-key="video"><span>🎬</span><b>30-секундна відеоінструкція</b><p>Поясніть одну дію: як зібрати рюкзак, налаштувати програму, доглядати рослину тощо.</p></button>
<button class="microProject" data-key="budget"><span>📊</span><b>Мінібюджет події</b><p>У таблиці порахуйте витрати для умовної поїздки, класної події або покупки техніки.</p></button>
<button class="microProject" data-key="interview"><span>🎙️</span><b>Інтерв’ю про реальну роботу</b><p>Поставте дорослому 7 запитань про його професію й зробіть стислий висновок «що я не знав/ла».</p></button>
<button class="microProject" data-key="explain"><span>🧠</span><b>Пояснити складне просто</b><p>Зробіть 1 слайд або інфографіку на тему, яку знаєте краще за інших.</p></button>
<button class="microProject" data-key="organize"><span>🧩</span><b>Було → стало</b><p>Поліпшіть реальний процес: порядок файлів, робоче місце, список справ. Зафіксуйте до/після і поясніть рішення.</p></button>
</div>
<div class="projectBrief" id="projectBrief"><b>Оберіть картку вище.</b><p>Тут з’явиться точне ТЗ, критерій «готово» і фраза, яку можна покласти в портфоліо.</p></div>
<div class="callout teal" style="margin-top:14px"><b>Формула доказу:</b> задача → що саме зробив/ла → результат → що це показує про мою навичку. Наприклад: «Переробив/ла афішу шкільного заходу: скоротив/ла текст, вибудував/ла ієрархію й отримав/ла читабельний макет. Це показує роботу з інформацією та візуальну комунікацію».</div></div></section>
<section id="privacy"><div class="wrap"><div class="sectionHead"><span class="step">5</span><div><h2>Що не треба класти у відкрите портфоліо</h2><p>26–29 хв • Корисна річ: портфоліо має показувати роботу, а не роздавати Ваші особисті дані всьому інтернету.</p></div></div><div class="privacyGrid" id="privacyGrid">
<button class="privacyCard" data-safe="1">✅ <b>Ім’я або творчий нік</b><span>Достатньо для підпису роботи.</span></button>
<button class="privacyCard" data-safe="0">🚫 <b>Домашня адреса й точний маршрут</b><span>Це не доводить жодної навички.</span></button>
<button class="privacyCard" data-safe="1">✅ <b>Фото/скрин роботи без приватних даних</b><span>Показує результат.</span></button>
<button class="privacyCard" data-safe="0">🚫 <b>Телефон, документи, паролі, розклад пересувань</b><span>У відкритому портфоліо цьому не місце.</span></button>
</div><div class="feedback" id="privacyFb">Натисніть на картки й перевірте себе.</div></div></section>'''
          h8 = replace_section(h8, 'bossfight', new8)

          theory8 = r'''
<section id="theory"><div class="wrap"><div class="sectionHead"><span class="step">6</span><div><h2>Шпаргалка: як зробити портфоліо корисним</h2><p>29–31 хв • Чотири правила, які працюють краще за «я відповідальний/а й комунікабельний/а».</p></div></div><div class="theoryGrid">
<div class="theoryBlock"><b>1. Один артефакт = одна зрозуміла історія</b><p>Що було завданням? Що зробили саме Ви? Який результат?</p></div>
<div class="theoryBlock"><b>2. Навичку підтверджує дія</b><p>Не «я креативний/а», а «зробив/ла 3 варіанти, отримав/ла правки, переробив/ла».</p></div>
<div class="theoryBlock"><b>3. Можна створити доказ самому</b><p>Немає замовника — придумайте мікропроєкт і виконайте його за власним ТЗ.</p></div>
<div class="theoryBlock"><b>4. Зберігайте прогрес</b><p>Чернетка + фінал часто цікавіші за один ідеальний файл: видно, як Ви думаєте й виправляєте помилки.</p></div>
</div></div></section>'''
          h8 = replace_section(h8, 'theory', theory8)
          p8.write_text(h8, encoding='utf-8')

          s8 = Path('profesii-8/03-portfolio-osobysti-tsili/style.css')
          css8 = s8.read_text(encoding='utf-8')
          if 'practical-portfolio-2026-09-17' not in css8:
              css8 += r'''
/* practical-portfolio-2026-09-17 */
.microGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.microProject,.privacyCard{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:15px;text-align:left;min-height:150px;box-shadow:none}.microProject span{display:block;font-size:2rem}.microProject b,.privacyCard b{display:block;margin:.3rem 0}.microProject p,.privacyCard span{color:var(--muted);font-weight:600}.microProject.active{border-color:var(--teal);background:#effaf7;box-shadow:0 0 0 3px rgba(21,157,141,.12)}.projectBrief{margin-top:14px;border:2px solid #9fd5c7;background:#f0fbf7;border-radius:20px;padding:17px}.projectBrief ul{margin:.55rem 0}.privacyGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.privacyCard.right{border-color:#79c8ab;background:#effaf5}.privacyCard.wrongpick{border-color:#e5a0b0;background:#fff1f4}@media(max-width:800px){.microGrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.microGrid,.privacyGrid{grid-template-columns:1fr}}
'''
          s8.write_text(css8, encoding='utf-8')

          js8 = Path('profesii-8/03-portfolio-osobysti-tsili/script.js')
          j8 = js8.read_text(encoding='utf-8')
          j8 = re.sub(r'const questions=\[.*?\];\nfunction validName', r'''const questions=[
['Що найкраще працює як доказ навички?',['Фраза «я відповідальний/а»','Конкретна задача, Ваша дія і результат','Улюблений колір','Кількість підписок'],1],
['У Вас ще немає робіт для портфоліо. Що робити?',['Чекати конкурсу','Створити маленький власний проєкт за чітким ТЗ','Вигадати досвід','Скопіювати чужу роботу'],1],
['Який опис сильніший?',['Я вмію дизайн','Переробив/ла афішу: скоротив/ла текст, побудував/ла ієрархію й зробив/ла 2 версії після відгуку','Я творчий/а','Мені подобається Canva'],1],
['Що варто показати для прогресу?',['Тільки фінал','Чернетку й фінальну версію з коротким поясненням змін','Лише оцінку','Тільки сертифікат'],1],
['Що НЕ слід публікувати у відкритому портфоліо?',['Фото власної роботи','Короткий опис своєї ролі','Домашню адресу, телефон і документи','Посилання на публічний проєкт'],2],
['Який мікропроєкт може бути портфоліо?',['Переробити незрозуміле оголошення й пояснити рішення','Просто подивитися 20 відео','Написати «я креативний»','Завантажити чужий макет'],0],
['Що треба вказати в командному проєкті?',['Лише назву команди','Що саме зробили Ви','Всі приватні контакти команди','Тільки оцінку'],1],
['Добра ціль на тиждень звучить так:',['Розвиватися','Зробити один 30-секундний відеогайд і попросити 2 конкретні відгуки','Стати професіоналом','Колись почати'],1],
['Навіщо додавати критерій «готово»?',['Щоб знати, коли задача справді завершена','Для красивого тексту','Щоб зробити план довшим','Не потрібно'],0],
['Що краще зробити після уроку?',['Обрати 1 мікропроєкт і завершити його цього тижня','Шукати ідеальну професію в тесті','Відкласти до 11 класу','Зібрати випадкові сертифікати'],0]];
function validName''', j8, count=1, flags=re.S)
          if 'practical-portfolio-2026-09-17' not in j8:
              j8 += r'''
// practical-portfolio-2026-09-17
(()=>{const data={poster:{title:'Переробити погане оголошення',todo:['Знайдіть оголошення з надлишком тексту або поганою структурою.','Залиште головне: що, де, коли, для кого.','Зробіть нову версію на 1 сторінку.','Порівняйте «до/після».'],done:'Готово, коли людина за 5–7 секунд розуміє головну інформацію.',proof:'«Переробив/ла інформаційний макет: скоротив/ла текст, побудував/ла ієрархію та перевірив/ла читабельність на іншій людині». Навички: робота з інформацією, дизайн, зворотний зв’язок.'},video:{title:'30-секундна відеоінструкція',todo:['Оберіть одну просту дію.','Напишіть сценарій із 3–5 кроків.','Зніміть/змонтуйте до 30–45 секунд.','Дайте людині повторити дію лише за відео.'],done:'Готово, коли інструкцію можна виконати без додаткового пояснення.',proof:'«Створив/ла коротку відеоінструкцію: сценарій, зйомка, монтаж і тест на користувачі». Навички: комунікація, монтаж, структура.'},budget:{title:'Мінібюджет у таблиці',todo:['Оберіть подію або покупку.','Знайдіть 6–10 статей витрат.','Порахуйте суму й 10% резерв.','Позначте, де можна зекономити.'],done:'Готово, коли всі числа мають джерело або логічне припущення, а сума рахується формулою.',proof:'«Склав/ла бюджет у таблиці, використав/ла формули й порівняв/ла два сценарії витрат». Навички: таблиці, планування, числа.'},interview:{title:'Інтерв’ю про професію',todo:['Оберіть дорослого з реальною професією.','Запитайте про 3 типові задачі, 2 складні сторони, шлях навчання й одну пораду.','Запишіть 5 фактів, які Вас здивували.','Сформулюйте: що хочу перевірити сам/сама.'],done:'Готово, коли є короткий конспект і Ваш висновок, а не просто аудіо на 17 хвилин.',proof:'«Провів/ла структуроване інтерв’ю, виділив/ла ключові факти й сформулював/ла висновок». Навички: питання, слухання, аналіз.'},explain:{title:'Пояснити складне просто',todo:['Оберіть тему, яку добре розумієте.','Залиште 3 головні думки.','Додайте 1 схему/приклад.','Попросіть людину переказати зміст після перегляду.'],done:'Готово, коли інша людина може правильно переказати головну ідею.',proof:'«Створив/ла односторінкове пояснення складної теми й перевірив/ла зрозумілість на читачеві». Навички: пояснення, структура, візуалізація.'},organize:{title:'Було → стало',todo:['Оберіть процес, який реально дратує.','Зафіксуйте «до».','Змініть 2–3 речі.','Через день перевірте, що стало швидше/зручніше.'],done:'Готово, коли є конкретна зміна й коротке пояснення, чому вона працює.',proof:'«Проаналізував/ла побутовий процес, змінив/ла структуру й порівняв/ла результат до/після». Навички: організація, аналіз, покращення процесу.'}};const brief=document.getElementById('projectBrief');document.querySelectorAll('.microProject').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.microProject').forEach(x=>x.classList.remove('active'));b.classList.add('active');const d=data[b.dataset.key];brief.innerHTML=`<span class="tag">ВАШЕ ТЗ</span><h3>${d.title}</h3><ul>${d.todo.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Критерій «готово»:</b> ${d.done}</p><p><b>Фраза для портфоліо:</b> ${d.proof}</p>`}));document.querySelectorAll('.privacyCard').forEach(b=>b.addEventListener('click',()=>{const safe=b.dataset.safe==='1';b.classList.toggle(safe?'right':'wrongpick');document.getElementById('privacyFb').textContent=safe?'Так: це можна показувати, якщо в матеріалі немає чужих приватних даних.':'Краще не публікувати: це персональні або чутливі дані, які не додають портфоліо професійної цінності.'}))})();
'''
          js8.write_text(j8, encoding='utf-8')

          # ---------- 9 CLASS ----------
          p9 = Path('profesii-9/03-interesy-tsinnosti-priorytety/index.html')
          h9 = p9.read_text(encoding='utf-8')
          h9 = h9.replace('<a href="#offerbattle">Офер-батл</a><a href="#theory">Теорія</a>', '<a href="#workday">Реальна робота</a><a href="#tryout">Профпроба</a><a href="#routes9">Після 9 класу</a><a href="#theory">Перевірка</a>')
          h9 = h9.replace('Мета уроку — не вгадати одну «правильну» професію. Ми розділимо три речі, які часто злипаються в одну кашу: <b>що мені цікаво</b>, <b>що для мене важливо</b> і <b>які умови роботи я готовий/готова обирати</b>.', 'Мета уроку — не вибрати красиву назву професії. Ми розберемо, <b>які конкретні задачі</b> Ви готові робити щодня, яку рутину можете терпіти, що можна протестувати вже цього тижня і які освітні маршрути реально існують після 9 класу.')

          workday = r'''
<section id="workday"><div class="wrap"><div class="head"><span class="step">6</span><div><h2>Професія без реклами: що Ви робитимете о 10:40 у звичайний вівторок?</h2><p>27–31 хв • Натискайте не на назву професії, а на її щоденні задачі. У кожній картці є й нормальна «нудна частина» — бо вона є всюди.</p></div></div>
<div class="workdayGrid" id="workdayGrid">
<div class="workCard" data-domain="дані й аналітика"><b>📊 Дані / аналітика</b><ul><li>чистити таблицю від помилок;</li><li>порівнювати цифри;</li><li>будувати графік;</li><li>пояснювати висновок.</li></ul><p><strong>Рутина:</strong> багато часу йде не на «вау-графіки», а на перевірку даних.</p><div><button data-v="yes">Можу це тестувати</button><button data-v="no" class="secondary">Скоріше ні</button></div></div>
<div class="workCard" data-domain="дизайн і медіа"><b>🎨 Дизайн / медіа</b><ul><li>отримати нечітке ТЗ;</li><li>зробити кілька варіантів;</li><li>внести правки;</li><li>підготувати файл правильно.</li></ul><p><strong>Рутина:</strong> правки й обмеження трапляються частіше, ніж «чисте натхнення».</p><div><button data-v="yes">Можу це тестувати</button><button data-v="no" class="secondary">Скоріше ні</button></div></div>
<div class="workCard" data-domain="люди й навчання"><b>🗣 Люди / навчання</b><ul><li>пояснювати одне й те саме різним людям;</li><li>готувати матеріали;</li><li>слухати питання;</li><li>давати зворотний зв’язок.</li></ul><p><strong>Рутина:</strong> підготовка й документація не зникають тільки тому, що Ви любите людей.</p><div><button data-v="yes">Можу це тестувати</button><button data-v="no" class="secondary">Скоріше ні</button></div></div>
<div class="workCard" data-domain="техніка й інженерія"><b>🛠 Техніка / інженерія</b><ul><li>шукати причину несправності;</li><li>читати схему/інструкцію;</li><li>перевіряти вимірювання;</li><li>дотримуватися правил безпеки.</li></ul><p><strong>Рутина:</strong> точність і правила важливіші за «зараз якось полагоджу».</p><div><button data-v="yes">Можу це тестувати</button><button data-v="no" class="secondary">Скоріше ні</button></div></div>

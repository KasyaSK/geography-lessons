name: Practicalize professions lessons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/practicalize-professions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply practical lesson rewrite
        run: python scripts/run_practicalize_professions.py
      - name: Commit rewritten lessons
        run: |
          git config user.name "KasyaSK"
          git config user.email "149479602+KasyaSK@users.noreply.github.com"
          git rm .github/workflows/practicalize-professions.yml scripts/run_practicalize_professions.py
          git add profesii-8/03-portfolio-osobysti-tsili profesii-9/03-interesy-tsinnosti-priorytety
          git commit -m "Make professions lessons concrete and useful"
          git push

name: Update lesson 10 catalogs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-grade6-lesson10-indexes.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('6/index.html'); s=p.read_text(); s=s.replace('Опубліковано: 8 уроків','Опубліковано: 9 уроків')
          c='<a class="card" href="10-masshtab-ta-ioho-vydy/"><span class="num">10</span><div><span class="tag">§9 • ГР1 + ГР2 • Практична робота</span><h2>Масштаб та його види</h2><p>Три види масштабу, обчислення відстаней, карти різних масштабів, CER і тест /10.</p></div><span class="go">Відкрити →</span></a>'
          if '10-masshtab-ta-ioho-vydy/' not in s: s=s.replace('</div></main><footer>',c+'</div></main><footer>')
          p.write_text(s)
          p=Path('index.html'); s=p.read_text(); c='<a class="card" href="6/10-masshtab-ta-ioho-vydy/"><span class="tag">6 клас • географія • урок 10</span><h2>Масштаб та його види</h2><p>Обчислення, карти різних масштабів, практична робота, CER і тест /10.</p><span class="go">Відкрити урок →</span></a>'
          if '6/10-masshtab-ta-ioho-vydy/' not in s: s=s.replace('<a class="card" href="7/"',c+'<a class="card" href="7/"')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/index.html index.html
          git commit -m 'Add grade 6 lesson 10 to catalogs' || exit 0
          git pull --rebase origin main
          git push

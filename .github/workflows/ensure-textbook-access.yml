name: Ensure textbook access

on:
  push:
    branches: [main]
    paths:
      - '5/**'
      - '6/**'
      - '7/**'
      - '8/**'
      - '9/**'
      - '10/**'
      - '11/**'
      - 'assets/textbook-access.js'
      - '.github/workflows/ensure-textbook-access.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: ensure-textbook-access-main
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject reliable textbook access into every lesson page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          grades = ('5','6','7','8','9','10','11')
          script_url = 'https://kasyask.github.io/geography-lessons/assets/textbook-access.js?v=20260911'
          tag = f'<script src="{script_url}" data-textbook-access="global"></script>'
          runtime_code = (
              "const textbookTag='<scr'+'ipt src=\"" + script_url +
              "\" data-textbook-access=\"global\" data-textbook-rehydrate=\"1\"></scr'+'ipt>';"
              "const hydrated=/<\\/body\\s*>/i.test(html)"
              "?html.replace(/<\\/body\\s*>/i,textbookTag+'</body>')"
              ":html+textbookTag;"
              "document.write(hydrated)"
          )

          changed = []
          checked = []
          rewritten = []
          unsupported_rewriters = []
          malformed = []

          for grade in grades:
              root = Path(grade)
              if not root.exists():
                  continue
              for page in sorted(root.rglob('index.html')):
                  # Skip only the class catalogue itself (e.g. 6/index.html).
                  if page == root / 'index.html':
                      continue
                  checked.append(page)
                  text = page.read_text(encoding='utf-8')
                  original = text

                  # Normal pages: add the shared fallback before </body>.
                  if 'textbook-access.js' not in text:
                      if re.search(r'</body\s*>', text, flags=re.I):
                          text = re.sub(r'</body\s*>', tag + '\n</body>', text, count=1, flags=re.I)
                      else:
                          text = text.rstrip() + '\n' + tag + '\n'

                  # Some loader pages use document.open()/document.write() after an async
                  # payload fetch. That replaces the complete DOM and would erase the fallback.
                  # Re-inject the shared module into the payload itself before it is written.
                  if re.search(r'document\.write\s*\(', text) and 'data-textbook-rehydrate' not in text:
                      pattern = r'document\.write\(\s*html\s*\)'
                      text2, n = re.subn(pattern, lambda m: runtime_code, text, count=1)
                      if n:
                          text = text2
                          rewritten.append(page)
                      else:
                          unsupported_rewriters.append(page)

                  if 'data-textbook-access="global" +\'data-textbook-rehydrate' in text:
                      malformed.append(page)

                  if text != original:
                      page.write_text(text, encoding='utf-8')
                      changed.append(page)

          print(f'Checked lesson pages: {len(checked)}')
          print(f'Pages patched this run: {len(changed)}')
          print(f'Document-rewriting loaders hardened: {len(rewritten)}')
          for page in rewritten:
              print(' rehydrate +', page)

          if unsupported_rewriters:
              raise SystemExit(
                  'Found document.write() loader(s) that need an explicit rehydration pattern: ' +
                  ', '.join(map(str, unsupported_rewriters))
              )
          if malformed:
              raise SystemExit('Malformed textbook rehydration code on: ' + ', '.join(map(str, malformed)))

          # Hard validation: every lesson index must contain the fallback, and every
          # document-rewriting loader must also contain the post-write rehydration marker.
          missing = []
          missing_rehydrate = []
          for page in checked:
              text = page.read_text(encoding='utf-8')
              if 'textbook-access.js' not in text:
                  missing.append(str(page))
              if re.search(r'document\.write\s*\(', text) and 'data-textbook-rehydrate' not in text:
                  missing_rehydrate.append(str(page))

          if missing:
              raise SystemExit('Missing textbook access on: ' + ', '.join(missing))
          if missing_rehydrate:
              raise SystemExit('Textbook access could be erased by document.write() on: ' + ', '.join(missing_rehydrate))
          PY

      - name: Validate the shared access module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('assets/textbook-access.js').read_text(encoding='utf-8')
          required = ["'5'", "'6'", "'7'", "'8'", "'9'", "'10'", "'11'",
                      'global-textbook-access', 'Відкрити електронний підручник']
          missing = [item for item in required if item not in src]
          if missing:
              raise SystemExit('textbook-access.js is incomplete: ' + ', '.join(missing))
          print('Shared textbook access module: OK')
          PY

      - name: Commit automatic fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'All lesson pages already have runtime-safe textbook access.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 5 6 7 8 9 10 11
          git commit -m 'Ensure runtime-safe textbook access'
          git push origin HEAD:main

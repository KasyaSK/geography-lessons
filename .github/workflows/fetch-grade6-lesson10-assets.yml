name: Fetch grade 6 lesson 10 assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-grade6-lesson10-assets.yml'
permissions:
  contents: write
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified map-scale visuals
        shell: bash
        run: |
          set -euo pipefail
          DIR='6/10-masshtab-ta-ioho-vydy/assets'
          mkdir -p "$DIR"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Downtown_Seattle%2C_Washington%2C_OpenStreetMap%2C_14000_scale_%282025%29.png?width=1200' -o "$DIR/osm-scale-14000.png"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Scale_from_Ukrainian_educational_topographic_map_N-34-37-%D0%92.png?width=1200' -o "$DIR/ukraine-topomap-scale.png"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Scale_kilometres_miles.svg' -o "$DIR/scale-bar.svg"
          test -s "$DIR/osm-scale-14000.png"
          test -s "$DIR/ukraine-topomap-scale.png"
          test -s "$DIR/scale-bar.svg"
      - name: Rewrite lesson image paths to local assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('6/10-masshtab-ta-ioho-vydy/index.html')
          s=p.read_text()
          s=s.replace('https://commons.wikimedia.org/wiki/Special:Redirect/file/Downtown_Seattle%2C_Washington%2C_OpenStreetMap%2C_14000_scale_%282025%29.png?width=1200','assets/osm-scale-14000.png')
          s=s.replace('https://commons.wikimedia.org/wiki/Special:Redirect/file/Scale_from_Ukrainian_educational_topographic_map_N-34-37-%D0%92.png?width=1200','assets/ukraine-topomap-scale.png')
          p.write_text(s)
          PY
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/10-masshtab-ta-ioho-vydy
          git diff --cached --quiet && exit 0
          git commit -m 'Add local assets for grade 6 lesson 10'
          git pull --rebase origin main
          git push

name: Build self-contained NMT geography lesson

on:
  push:
    paths:
      - '.github/workflows/selfcontain-nmt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install raster tools
        run: python3 -m pip install --quiet cairosvg pillow

      - name: Rebuild lesson with PNG images only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, urllib.request, re
          from PIL import Image, ImageDraw, ImageFont
          import cairosvg

          REPO='https://raw.githubusercontent.com/KasyaSK/geography-lessons/f38ee43892b73d5caac1fd07b0ced9538006b7f3/nmt/01-geography-nmt-atlas/index.html'
          req=urllib.request.Request(REPO,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(req,timeout=60).read().decode('utf-8')
          root=Path('nmt/01-geography-nmt-atlas')

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NMT-geography-lesson/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read()

          def png_uri(data):
              return 'data:image/png;base64,'+base64.b64encode(data).decode('ascii')

          def to_png(data, width=None, height=None):
              # Many older assets in this repo are SVG wrappers around embedded WEBP.
              # Decode that image directly instead of asking the browser to render nested SVG/data URIs.
              m=re.search(br'data:image/(?:webp|png|jpeg);base64,([A-Za-z0-9+/=]+)',data)
              if m:
                  raw=base64.b64decode(m.group(1))
                  im=Image.open(io.BytesIO(raw)).convert('RGB')
                  if width:
                      nh=round(im.height*width/im.width)
                      im=im.resize((width,nh),Image.Resampling.LANCZOS)
                  elif height:
                      nw=round(im.width*height/im.height)
                      im=im.resize((nw,height),Image.Resampling.LANCZOS)
                  b=io.BytesIO(); im.save(b,'PNG',optimize=True)
                  return b.getvalue()
              kw={}
              if width: kw['output_width']=width
              if height: kw['output_height']=height
              return cairosvg.svg2png(bytestring=data, **kw)

          def font(size,bold=False):
              p='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              return ImageFont.truetype(p,size)

          def coord(lon,lat,x0,y0,w,h):
              W,E,S,N=21.5,40.7,44.1,52.7
              return x0+(lon-W)/(E-W)*w, y0+(N-lat)/(N-S)*h

          # 1) Real Ukraine map from Wikimedia, rasterized first, then coordinate grid drawn onto PNG.
          uk_url='https://commons.wikimedia.org/wiki/Special:Redirect/file/Ukraine_%281991-2014%29_location_map.svg'
          uk_svg=fetch(uk_url)
          x0,y0,w,h=70,72,1060,610
          base_png=to_png(uk_svg,width=w)
          base_img=Image.open(io.BytesIO(base_png)).convert('RGBA').resize((w,h),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(1200,760),(248,251,248,255))
          canvas.alpha_composite(base_img,(x0,y0))
          d=ImageDraw.Draw(canvas)
          d.text((70,24),'Україна • координатна сітка',font=font(26,True),fill='#284a54')
          for lon in [24,28,32,36,40]:
              x,_=coord(lon,48,x0,y0,w,h)
              d.line((x,y0,x,y0+h),fill='#2f6f78',width=2)
              d.text((x-34,y0+h+10),f'{lon}° сх.д.',font=font(16),fill='#244f59')
          for lat in [46,48,50,52]:
              _,y=coord(30,lat,x0,y0,w,h)
              d.line((x0,y,x0+w,y),fill='#2f6f78',width=2)
              d.text((5,y-10),f'{lat}° пн.ш.',font=font(16),fill='#244f59')
          d.rounded_rectangle((70,708,1130,746),radius=12,fill='#fff4d6',outline='#d8b65a',width=2)
          d.text((600,727),'Україна в міжнародно визнаних кордонах • АР Крим і м. Севастополь — Україна',font=font(16,True),fill='#5b4a18',anchor='mm')
          b=io.BytesIO(); canvas.convert('RGB').save(b,'PNG',optimize=True)
          s=s.replace('assets/ukraine_nmt_correct.svg',png_uri(b.getvalue()))

          # 2) Climate stations map on the same geographic base.
          st=Image.new('RGBA',(1200,760),(248,251,248,255)); st.alpha_composite(base_img,(x0,y0))
          ds=ImageDraw.Draw(st)
          ds.text((70,24),'Положення кліматичних станцій A і B',font=font(26,True),fill='#284a54')
          ax,ay=coord(24.03,49.84,x0,y0,w,h); bx,by=coord(35.14,47.84,x0,y0,w,h)
          for x,y,label,fill,txt in [(ax,ay,'A','#c86f57','#7e3e30'),(bx,by,'B','#2f6f78','#244f59')]:
              ds.ellipse((x-14,y-14,x+14,y+14),fill=fill,outline='white',width=4)
              ds.text((x+18,y-34),label,font=font(24,True),fill=txt)
          ds.rounded_rectangle((70,708,1130,746),radius=12,fill='#edf7f8',outline='#a8cbd2',width=2)
          ds.text((600,727),'A — захід України • B — південний схід України',font=font(16),fill='#244f59',anchor='mm')
          b=io.BytesIO(); st.convert('RGB').save(b,'PNG',optimize=True)
          s=s.replace('assets/ukraine_climate_stations.svg',png_uri(b.getvalue()))

          # 3) Climate charts and topo: decode nested WEBP if present, then embed plain PNG.
          for name in ['climate_A_v8.svg','climate_B_v8.svg','topo_nmt_v8.svg']:
              data=(root/'assets'/name).read_bytes()
              s=s.replace('assets/'+name,png_uri(to_png(data,width=1400)))

          # 4) World thematic maps: rasterize remote SVGs to PNG and embed them too.
          for url in [
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Population_density%2C_World%2C_2026.svg',
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/GDP_per_capita_nominal_world_map_2026.svg'
          ]:
              s=s.replace(url,png_uri(to_png(fetch(url),width=1600)))

          assert 'assets/' not in s, 'Local image path remained in HTML'
          assert '<img src="http' not in s, 'Remote image URL remained in HTML'
          assert s.count('data:image/png;base64,') >= 7, 'Not all seven visuals were embedded as PNG'
          (root/'index.html').write_text(s,encoding='utf-8')
          Path('nmt-geography.html').write_text(s,encoding='utf-8')
          print('PNG-only lesson built:',s.count('data:image/png;base64,'),'embedded visuals;',len(s),'characters')
          PY

      - name: Commit fixed lesson
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nmt/01-geography-nmt-atlas/index.html nmt-geography.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix all NMT lesson images as embedded PNG"
            git push origin HEAD:main
          fi

name: Fetch grade 6 lesson 11 assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-grade6-lesson11-assets.yml'
permissions:
  contents: write
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download lesson images
        shell: bash
        run: |
          set -euo pipefail
          DIR='6/11-vyznachennia-vidstanei/assets'
          mkdir -p "$DIR"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/An%20opisometer.jpg?width=1200' -o "$DIR/opisometer.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Curvimetre.jpg?width=1200' -o "$DIR/curvimeter.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Mechanical%20opisometer%20KU-A.jpg?width=1200' -o "$DIR/mechanical-opisometer.jpg"
          test -s "$DIR/opisometer.jpg"
          test -s "$DIR/curvimeter.jpg"
          test -s "$DIR/mechanical-opisometer.jpg"
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/11-vyznachennia-vidstanei/assets
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual assets for grade 6 lesson 11'
          git pull --rebase origin main
          git push

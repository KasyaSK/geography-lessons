name: Finalize practical professions lessons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-professions-practical.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final practical pass
        run: python scripts/finalize_professions_practical.py
      - name: Commit and clean one-time files
        run: |
          git config user.name "KasyaSK"
          git config user.email "149479602+KasyaSK@users.noreply.github.com"
          git rm .github/workflows/finalize-professions-practical.yml scripts/finalize_professions_practical.py
          git add profesii-8/03-portfolio-osobysti-tsili profesii-9/03-interesy-tsinnosti-priorytety
          git commit -m "Focus professions lessons on real career experiments"
          git push

name: Rebuild grade 10 lesson 11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-grade10-lesson11.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write rebuilt lesson
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          payload = """"""
          target = Path("10/11-sfera-posluh-transport-mizhnarodni-korydory-yevropy/index.html")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          print(target, target.stat().st_size)

      - name: Static integrity
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("10/11-sfera-posluh-transport-mizhnarodni-korydory-yevropy/index.html")
          s=p.read_text(encoding="utf-8")
          assert s.startswith("<!doctype html>")
          assert "<title>10 клас" in s
          assert s.count('<fieldset class="q">') == 10
          for needle in [
              'id="startQuiz"', 'id="studentName"', 'id="studentClass"',
              'TEN_T_Schematic_map', '14,2 млн TEU', 'Eurostat',
              'youtube-nocookie.com/embed/sNZeHyoVbXA',
              'youtube-nocookie.com/embed/GQbpQGdpThk',
              'Автор: Скринченко К.А.'
          ]:
              assert needle in s, needle
          ids=re.findall(r'\\bid=["\\\']([^"\\\']+)["\\\']',s)
          assert len(ids)==len(set(ids)), "duplicate IDs"
          print("STATIC_OK", len(s), len(ids))

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Runtime-test quiz in Chrome
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/lesson-server.log 2>&1 &
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select
          from selenium.webdriver.support.ui import WebDriverWait

          opts=webdriver.ChromeOptions()
          opts.page_load_strategy='eager'
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1600')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=opts)
          try:
              u='http://127.0.0.1:8765/10/11-sfera-posluh-transport-mizhnarodni-korydory-yevropy/index.html'
              d.get(u)
              quiz=d.find_element(By.ID,'quiz')
              assert not quiz.is_displayed(), 'quiz must start hidden'

              d.find_element(By.ID,'studentName').send_keys('Тест')
              d.find_element(By.ID,'studentClass').send_keys('10-А')
              d.find_element(By.ID,'startQuiz').click()
              time.sleep(.3)
              assert not quiz.is_displayed(), 'single-word name must not pass'

              name=d.find_element(By.ID,'studentName')
              name.clear()
              name.send_keys('Тест Учень')
              d.find_element(By.ID,'startQuiz').click()
              WebDriverWait(d,5).until(lambda x: x.find_element(By.ID,'quiz').is_displayed())

              for n,v in [('q1','b'),('q2','a'),('q3','b'),('q4','b'),('q9','a'),('q10','b')]:
                  d.find_element(By.CSS_SELECTOR, f'input[name="{n}"][value="{v}"]').click()
              for n,vals in [('q5',['cost','time','cargo']),('q6',['port','rail','road'])]:
                  for v in vals:
                      d.find_element(By.CSS_SELECTOR, f'input[name="{n}"][value="{v}"]').click()

              Select(d.find_element(By.ID,'mRotterdam')).select_by_value('port')
              Select(d.find_element(By.ID,'mDanube')).select_by_value('river')
              Select(d.find_element(By.ID,'mTent')).select_by_value('network')

              for id_,v in [('sCargo','1'),('sModes','2'),('sBottleneck','3'),('sDecision','4')]:
                  Select(d.find_element(By.ID,id_)).select_by_visible_text(v)

              d.find_element(By.CSS_SELECTOR,'#quiz button[type="submit"]').click()
              WebDriverWait(d,5).until(lambda x: x.find_element(By.ID,'result').is_displayed())
              txt=d.find_element(By.ID,'result').text
              assert '10/10' in txt and '100%' in txt, txt

              severe=[
                  x['message'] for x in d.get_log('browser')
                  if x.get('level')=='SEVERE' and any(k in x.get('message','') for k in ('Uncaught','SyntaxError','ReferenceError','TypeError'))
              ]
              assert not severe, severe
              print('QUIZ_OK')
              print(txt[:500])
          finally:
              d.quit()
          PY

      - name: Commit rebuilt lesson
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '10/11-sfera-posluh-transport-mizhnarodni-korydory-yevropy/index.html'
          if git diff --cached --quiet; then
            echo "No lesson changes to commit"
            exit 0
          fi
          git commit -m "Rebuild grade 10 lesson 11 with maps data and tested quiz"
          git push

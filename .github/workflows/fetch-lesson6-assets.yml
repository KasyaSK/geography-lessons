name: Fetch lesson 6 visual assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-lesson6-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download lesson images
        shell: bash
        run: |
          set -euo pipefail
          DIR='6/02-metody-geografichnyh-doslidzhen/assets'
          mkdir -p "$DIR"
          curl -L --fail --retry 3 'https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57723/land_ocean_ice_2048.jpg' -o "$DIR/earth-from-space.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Survey_level_and_field_technician.jpg' -o "$DIR/field-survey.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Topographic_map_example.png' -o "$DIR/topographic-map.png"
          curl -L --fail --retry 3 'https://eoimages.gsfc.nasa.gov/images/imagerecords/147000/147146/cafires_tmo_2020232_lrg.jpg' -o "$DIR/wildfire-satellite.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Physical_maps_of_Ukraine.jpg' -o "$DIR/physical-ukraine.jpg"
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/02-metody-geografichnyh-doslidzhen/assets
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual assets for grade 6 lesson 2'
          git push

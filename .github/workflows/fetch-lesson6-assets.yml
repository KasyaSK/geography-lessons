name: Fetch lesson 6 assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-lesson6-assets.yml'
permissions:
  contents: write
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified lesson images
        shell: bash
        run: |
          set -euo pipefail
          DIR='6/06-globus-vydy-umovni-znaky-napriamy/assets'
          mkdir -p "$DIR"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/%D0%93%D0%BB%D0%BE%D0%B1%D1%83%D1%81.jpg?width=1080' -o "$DIR/school-globe.jpg"
          curl -L --fail --retry 3 'https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74218/world.200412.3x5400x2700.jpg' -o "$DIR/blue-marble.jpg"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Globe%2C_terrestrial_%28AM_1991.234-1%29.jpg?width=1280' -o "$DIR/historic-globe.jpg"
          test -s "$DIR/school-globe.jpg"
          test -s "$DIR/blue-marble.jpg"
          test -s "$DIR/historic-globe.jpg"
          file "$DIR"/*
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 6/06-globus-vydy-umovni-znaky-napriamy/assets
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual assets for grade 6 lesson 6'
          git pull --rebase origin main
          git push

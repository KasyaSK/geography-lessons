<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Скринченко К.А. — Василівський ліцей «Сузір’я»"><meta name="description" content="11 клас. Урок 3. Географічні та прямокутні координати на топографічній карті. Інтерактивний урок географії."><title>11 клас • Урок 3 • Географічні та прямокутні координати на топографічній карті</title><link rel="stylesheet" href="style.css"></head><body><div id="lesson-app"><div class="wrap" style="padding:4rem 0"><h1>Завантаження уроку…</h1><p>Якщо сторінка не відкрилася автоматично, оновіть її.</p></div></div><script>(async()=>{try{const files=['part-1.html','part-2.html','part-3.html','part-4.html'];const texts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.getElementById('lesson-app').outerHTML=texts.join('');const s=document.createElement('script');s.src='script.js';document.body.appendChild(s)}catch(e){document.getElementById('lesson-app').innerHTML='<div class="wrap" style="padding:4rem 0"><h1>Не вдалося завантажити урок</h1><p>Оновіть сторінку або повідомте вчителя.</p></div>'}})();</script></body></html>
